name: Build & deploy docs (mdBook → GitHub Pages)

on:
  push:
    # NO `tags:` ARM, and that is a fix rather than an omission.
    #
    # A tag arm was added here on 2026-10-13 on the premise that this repo's
    # `main` is "parked by design and never merged". That premise was
    # obsolete the same day: `291bf3b8` restored the main push. Worse, the
    # arm made the release UNSHIPPABLE. docs.yml and release.yml's
    # "Build & deploy docs (tagged revision)" job both hold the SAME
    # `pages` concurrency lock with `cancel-in-progress: true`, so on a tag
    # push the release job CANCELLED this workflow — and the release's own
    # fail-closed gate then read that cancellation as a red publication
    # workflow and refused to publish. Every tag would have failed the same
    # way. Observed live on v1.29.14.
    #
    # The tag arm was also redundant: release.yml already builds and deploys
    # the docs for the tagged revision, and it did so successfully while this
    # workflow sat cancelled. Removing the arm leaves exactly ONE docs deploy
    # per event — docs.yml for main pushes, release.yml for tags — so the
    # shared `pages` lock still prevents a main deploy racing a tag deploy,
    # and there is nothing left to cancel. The gate treats "no docs.yml run
    # for this SHA" the way it already treats shell.yml and fuzz.yml.
    branches: [main]
    paths:
      - "book.toml"
      - "docs/**"
      - "theme/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Single job: build + deploy. The old build→deploy split spun up a second
# runner whose only step was calling deploy-pages.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cache mdbook binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4
      - name: Install mdBook (skipped on cache hit)
        run: command -v mdbook >/dev/null 2>&1 || cargo install mdbook --version 0.5.4 --locked
      - name: Build
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
