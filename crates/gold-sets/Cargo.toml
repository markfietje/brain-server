[package]
name = "gold-sets"
version = "1.28.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Versioned frozen gold packs for scorer calibration: agreed human truth the scorer is measured against, never auto-published."
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
