[package]
name = "channel-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "WhatsApp governed-edge bridge for brain-server Switchboard (Caravel)"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "signal", "fs"], default-features = false }

axum = { version = "0.8.9", features = ["macros", "json"] }

# TLS is REQUIRED here: the bridge dials graph.facebook.com directly (the
# only edge in the fleet with an outbound HTTPS platform dependency).
reqwest = { version = "0.13.4", features = ["json", "rustls"], default-features = false }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4" }
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
tempfile = "3"

# ── Hardening policy (house style, mirrors signal-gateway) ────────────────
# Deny every runtime-panic vector we own; unsafe stays compile-forbidden.
[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.release.package."*"]
opt-level = "z"
