# Nightly fuzz schedule (Attestation v1.28.62): the committed corpus replays
# every night against the SDK's pure surfaces, and the libFuzzer targets are
# compile-checked so a drift never lands silently. The corpus-replay tests
# ALSO run in the main CI (engine-crates job) on every push — this schedule
# is the recurring rehearsal, not the only gate.
name: fuzz-nightly

on:
  schedule:
    # 03:20 UTC daily — off the top of the hour so the shared-runner queue
    # (and the main CI's own scheduled neighbors) don't pile up at :00.
    - cron: '20 3 * * *'
  workflow_dispatch:

# Least privilege: read-only; this workflow publishes nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  corpus-replay:
    name: fuzz corpus replay + target compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: crates
      - name: corpus replay (every committed byte, nightly)
        run: cargo test --manifest-path crates/Cargo.toml -p brain-fuzz --all-targets
      - name: harness-kernel feature surface
        run: cargo test --manifest-path crates/Cargo.toml -p brain-engine-sdk --features harness-kernel --all-targets
      - name: libFuzzer targets still compile
        run: cargo check --manifest-path crates/Cargo.toml -p brain-fuzz --features libfuzzer
