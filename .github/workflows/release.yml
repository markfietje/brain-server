name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.20.26). Leave empty to use the pushed tag'
        required: false
        type: string

# Least privilege: builds and docs deploy read; ONLY the release job writes
# (it creates the GitHub release). The workflow-level write that every job
# inherited is gone (S7-11): a compromised build step could have minted a
# token that writes to the repo.
permissions:
  contents: read

jobs:
  # Four PARALLEL per-target build jobs (was: two jobs building two targets
  # each SEQUENTIALLY — the release wall-clock was the SUM of both targets'
  # builds; it is now the MAX). Same binaries, same staging, same
  # continue-on-error discipline: a failed optional target stages what it
  # has and the verify-required-assets gate in the release job refuses to
  # publish if a PRIMARY binary is missing.
  build-linux-x86_64:
    name: Build Linux x86_64 binaries
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cache cargo-cyclonedx binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-cyclonedx
          key: release-tools-cyclonedx

      - name: Build (linux x86_64)
        # Full binary set: `bench`/`brain-migrate-rehearse` need `--features
        # bench,migrate`, `brain-connector-gh` needs `--features
        # connector-github` (both empty features that gate compilation).
        # brain-connector-crm likewise via `connector-crm`.
        #
        # `--locked` ON EVERY BUILD, and it is the reason the shipped binary
        # can be audited at all. Without it cargo may RE-RESOLVE the lockfile
        # mid-build, and the release would ship bytes from a dependency set
        # that no audit ever saw — the dependency audit runs over the
        # COMMITTED lockfile, so a silent re-resolution would put a different
        # artifact behind that audit. With `--locked` cargo REFUSES to
        # re-resolve, so the tree that passed the audit is provably the tree
        # that was compiled. The shell lane already builds this way
        # (`--locked --offline`); the release did not, and that gap is what
        # this closes. The lockfile satisfies every feature set below
        # (checked with `cargo metadata --locked` for `bench,migrate`,
        # `connector-github` and `connector-crm`), so this refuses a release
        # whose lockfile has drifted — which is the fail-closed direction.
        run: |
          cargo build --release --locked --features bench,migrate
          cargo build --release --locked --features connector-github --bin brain-connector-gh
          cargo build --release --locked --features connector-crm --bin brain-connector-crm
        continue-on-error: true

      - name: Generate CycloneDX SBOM
        # Reuses the local operator path (scripts/sbom.sh): a CycloneDX SBOM
        # from Cargo.lock, shipped alongside the release binaries (EU CRA /
        # OWASP A03:2025). cargo-cyclonedx is a release-time tool, cached in
        # ~/.cargo/bin (version-keyed) — compiling it from source on the
        # tag's critical path used to add minutes to EVERY release.
        run: |
          command -v cargo-cyclonedx >/dev/null 2>&1 || cargo install cargo-cyclonedx --version 0.5.9 --locked
          ./scripts/sbom.sh
        continue-on-error: true

      - name: Stage artifacts
        # brain-server (the main binary) plus every operator CLI, one pairing
        # per target. Feature-gated bins present only if their feature built.
        # The SBOM stages EXACTLY the release-matched manifest (fail-closed):
        # historical sbom/*.cdx.json files must never ride a release.
        run: |
          set -e
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh brain-connector-crm; do
            cp -f "target/release/$b" "dist/${b}-linux-x86_64" 2>/dev/null || true
          done
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+'; then
            version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          ./scripts/stage-sbom.sh "$version"
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-x86_64
          path: dist/

  build-linux-aarch64:
    name: Build Linux aarch64 binaries (cross)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cache cross binary
        # cross is cached in ~/.cargo/bin (version-keyed): compiling it from
        # source on the tag's critical path used to add minutes to EVERY
        # release.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cross
          key: release-tools-cross-0.2.5

      - name: Build (linux aarch64 via cross)
        run: |
          command -v cross >/dev/null 2>&1 || cargo install cross --version 0.2.5 --locked
          cross build --release --locked --features bench,migrate --target aarch64-unknown-linux-gnu
          cross build --release --locked --features connector-github --bin brain-connector-gh --target aarch64-unknown-linux-gnu
          cross build --release --locked --features connector-crm --bin brain-connector-crm --target aarch64-unknown-linux-gnu
        continue-on-error: true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh brain-connector-crm; do
            cp -f "target/aarch64-unknown-linux-gnu/release/$b" "dist/${b}-linux-aarch64" 2>/dev/null || true
          done
          ls -la dist

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-linux-aarch64
          path: dist/

  build-darwin-arm64:
    name: Build macOS arm64 binaries
    # The operator's native build target (the dev box is macOS arm64) — ships
    # the same full binary set. Without this the release is Linux-only and
    # the local build is never published.
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build (macOS arm64, native)
        run: |
          cargo build --release --locked --features bench,migrate
          cargo build --release --locked --features connector-github --bin brain-connector-gh
          cargo build --release --locked --features connector-crm --bin brain-connector-crm
        continue-on-error: true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh brain-connector-crm; do
            cp -f "target/release/$b" "dist/${b}-darwin-arm64" 2>/dev/null || true
          done
          ls -la dist

      - name: Codesign (macOS, ad-hoc)
        # Ad-hoc signing (`codesign -s -`): a valid signature that detects
        # tampering, with NO identity, NO cert, NO Apple account, and NO private
        # key to protect — so no secrets enter the release pipeline at all. This
        # is the effectively-best option for a self-hosted, no-developer-account
        # build: a self-signed cert is untrusted by everyone anyway (Gatekeeper
        # on other Macs needs Developer ID + notarization), so the only thing it
        # bought was a key to keep secret. The toolchain also ad-hoc signs native
        # macOS binaries by default, so this is the honest baseline. (The Mac
        # will still warn on a *downloaded* file until the quarantine/provenance
        # xattr is cleared — install-service.sh already strips com.apple.provenance.)
        run: |
          set -e
          for f in dist/*; do
            echo "codesign (ad-hoc) -> $f"
            codesign --sign - --force "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-darwin-arm64
          path: dist/

  build-darwin-x86_64:
    name: Build macOS x86_64 binaries
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build (macOS x86_64)
        run: |
          cargo build --release --locked --features bench,migrate --target x86_64-apple-darwin
          cargo build --release --locked --features connector-github --bin brain-connector-gh --target x86_64-apple-darwin
          cargo build --release --locked --features connector-crm --bin brain-connector-crm --target x86_64-apple-darwin
        continue-on-error: true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh brain-connector-crm; do
            cp -f "target/x86_64-apple-darwin/release/$b" "dist/${b}-darwin-x86_64" 2>/dev/null || true
          done
          ls -la dist

      - name: Codesign (macOS, ad-hoc)
        # Same ad-hoc discipline as the arm64 job — see that job's comment.
        run: |
          set -e
          for f in dist/*; do
            echo "codesign (ad-hoc) -> $f"
            codesign --sign - --force "$f"
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-darwin-x86_64
          path: dist/

  docs-deploy:
    # Rebuild + redeploy the mdBook site from the TAGGED revision. docs.yml
    # only triggers on `main` path-pushes (docs/**, book.toml, theme/**), so a
    # release tag push would otherwise leave the published docs pointing at an
    # older commit — the docs must reflect the shipped binary's revision. Same
    # build+deploy shape as docs.yml, same `pages` concurrency lock, so a doc
    # deploy from a main push and from a tag cannot race.
    name: Build & deploy docs (tagged revision)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: "pages"
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      # Shared with docs.yml — one definition, so the two cannot drift again.
      # The `pages` concurrency lock stays HERE (workflow policy, and GitHub
      # only honours concurrency at job/workflow level), and it is why
      # docs.yml's tag arm had to go: two deploys on one tag cancel each
      # other, and the fail-closed gate reads that cancellation as red.
      - name: Build + deploy docs
        id: deployment
        uses: ./.github/actions/deploy-docs

  release:
    name: Assemble release + notes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: [build-linux-x86_64, build-linux-aarch64, build-darwin-arm64, build-darwin-x86_64]
    permissions:
      contents: write
      actions: read   # the green-CI verification step queries the Actions API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify CI green on the tagged commit (fail-closed)
        # The green-CI gate belongs to the SYSTEM, not the helper. Since the
        # 2026-10-06 billing law (private-repo Actions disabled), the tag push
        # itself is the public ci.yml trigger — there is no pre-tag run to
        # wait for, so THIS step is the wait (S7-10): `git tag && git push
        # --tags` bypassing release.sh entirely still cannot publish, because
        # the ci.yml run for the tagged SHA must exist AND conclude `success`
        # before anything publishes. Red OR absent ⇒ refuse. Wait windows:
        # ≤10 min for the run to register, ≤60 min for the matrix (the builds
        # below run in parallel; the normal path waits out the matrix here).
        # scripts/release.sh watches the same runs in parallel as the
        # operator's terminal witness; this step's refusal is the enforcement.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -e
          SHA="${{ github.sha }}"
          # F4-14: EVERY publication workflow is gated, not ci.yml alone —
          # shell/codeql/fuzz/docs runs can be red without blocking publish
          # only when they do not exist for the SHA (paths-filtered workflows
          # legitimately skip); a run that EXISTS and did not conclude
          # success refuses the publish.
          echo ">> verifying CI green on ${SHA:0:10} (every publication workflow)…"
          for WF in ci.yml shell.yml codeql.yml fuzz.yml docs.yml; do
            RUN_ID=""
            for _ in $(seq 1 20); do
              # Filter on the TAG as well as the SHA. Since `main` is also
              # pushed to the mirror, the tagged SHA normally carries a run per
              # workflow from the BRANCH push too, and `[0]` returned whichever
              # the API listed first. On 2026-10-15 that was a branch CodeQL
              # run the mirror's own next commit had CANCELLED via concurrency
              # — a superseded run about a different trigger, read as this
              # tag's verdict. The release was correct; the gate refused it.
              RUN_ID="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&branch=${TAG}&per_page=100" \
                --jq "[.workflow_runs[] | select(.path == \".github/workflows/$WF\")][0].id" \
                2>/dev/null || true)"
              [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]] && break
              # A paths-filtered workflow may legitimately have NO run for
              # this SHA — give the trigger a moment, then accept absence.
              sleep 15
              [[ $_ -ge 4 ]] && break
            done
            [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]] && { echo ">> $WF: no run for $SHA (paths-filtered skip) — ok"; continue; }
            STATUS=""; CONCLUSION=""
            for _ in $(seq 1 120); do
              LINE="$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
                --jq '[.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
              if [[ -n "$LINE" ]]; then
                STATUS="${LINE%%$'\t'*}"
                CONCLUSION="${LINE##*$'\t'}"
              fi
              [[ "$STATUS" == "completed" ]] && break
              sleep 30
            done
            if [[ "$STATUS" != "completed" || "$CONCLUSION" != "success" ]]; then
              echo "::error::$WF run #$RUN_ID on $SHA is '${STATUS:-unreachable}/${CONCLUSION:-none}' — a red publication workflow must never ship. Refusing to publish (fail-closed)."
              exit 1
            fi
            echo ">> $WF green on ${SHA:0:10} (run #$RUN_ID)."
          done
          RUN_ID=""
          for _ in $(seq 1 20); do
            RUN_ID="$(gh api "repos/${{ github.repository }}/actions/runs?head_sha=${SHA}&branch=${TAG}&per_page=100" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0].id' \
              2>/dev/null || true)"
            [[ -n "$RUN_ID" && "$RUN_ID" != "null" ]] && break
            sleep 30
          done
          if [[ -z "$RUN_ID" || "$RUN_ID" == "null" ]]; then
            echo "::error::no ci.yml run found for $SHA — the tagged commit never passed the matrix. Refusing to publish (fail-closed)."
            exit 1
          fi
          STATUS=""; CONCLUSION=""
          for _ in $(seq 1 120); do
            LINE="$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}" \
              --jq '[.status, (.conclusion // "")] | @tsv' 2>/dev/null || true)"
            if [[ -n "$LINE" ]]; then
              STATUS="${LINE%%$'\t'*}"
              CONCLUSION="${LINE##*$'\t'}"
            fi
            [[ "$STATUS" == "completed" ]] && break
            sleep 30
          done
          if [[ "$STATUS" != "completed" ]]; then
            echo "::error::ci.yml run #$RUN_ID still '${STATUS:-unreachable}' — refusing to publish a tag whose matrix has not finished (fail-closed)."
            exit 1
          fi
          if [[ "$CONCLUSION" != "success" ]]; then
            echo "::error::ci.yml on $SHA concluded '${CONCLUSION:-none}' — a red matrix must never ship. Refusing to publish (fail-closed)."
            exit 1
          fi
          echo ">> ci.yml green on ${SHA:0:10} (run #$RUN_ID)."

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-x86_64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-linux-aarch64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-darwin-arm64
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-darwin-x86_64
          path: dist
          merge-multiple: true

      - name: Publish SHA256SUMS for every staged artifact
        # F4-13: the release-artifact integrity manifest — a downloader
        # verifies WHAT they fetched against a manifest shipped beside it
        # (the install path's `verify_signature` was handed only
        # locally-built binaries; a published release carried no checksums
        # at all). Signature/attestation stays an open row; this is the
        # integrity floor.
        run: |
          set -euo pipefail
          cd dist
          sha256sum --binary * > SHA256SUMS
          # fail-closed: the manifest names EVERY staged file (itself excluded)
          count="$(ls | grep -vc '^SHA256SUMS$')"
          lines="$(wc -l < SHA256SUMS)"
          [[ "$count" == "$lines" ]] || { echo "::error::SHA256SUMS covers $lines of $count staged files"; exit 1; }
          cat SHA256SUMS

      - name: Generate release notes from CHANGELOG
        # The published body is USER-FACING, not the engineering log. The
        # contract lives in CHANGELOG.md's preamble: each section carries a
        # `### Release notes` block written for users and restricted to the
        # categorized bullets (**Improvements / New / Changed / Bug fixes /
        # Security fixes**); validation counts and milestone detail live
        # BELOW that heading (`### Engineering record`) and never publish.
        #
        # Body shape follows Keep a Changelog 2.0 + common GitHub practice:
        #   1. a short prose summary (the section intro),
        #   2. the categorized bullets,
        #   3. the Full Changelog compare link.
        # The release TITLE comes from the section heading
        # (`## [x.y.z] — DATE — Title`) so releases render human-readable
        # ("v1.28.28 — Channel: …"), not as bare tag names.
        #
        # Enforcement fails LOUDLY rather than degrading silently:
        #   - missing section or missing `### Release notes` → error;
        #   - a bullet OUTSIDE the user-facing category set → error naming
        #     the offending line (it must move below the block);
        #   - zero bullets → error;
        #   - NO prose summary between the heading and the block → error
        #     (the published body OPENS with that summary — the v1.28.84
        #     shape; v1.28.85/.86 shipped without it);
        #   - audit/finding IDs in the published surface → error (user-facing
        #     bullets name PROOF COMMITS; IDs live in the Engineering record —
        #     v1.28.85/.86 shipped `(G6-02)`/`(F7-01, HIGH)` markers);
        #   - primary per-platform binaries absent from dist/ → error (the
        #     guard against publishing an empty release; see next step).
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_ENV"

          # 0a. The publishability gate runs FIRST, and it is the SAME script
          #     the local test pin runs (`tests/release_notes_gate.rs`), so
          #     the two cannot drift. It lives in one place because these
          #     checks used to live only here — which meant the only place
          #     they could fail was a full matrix plus four cross-builds.
          #     v1.29.13 was refused twice at this step for two different
          #     reasons, both `grep`-shaped and both visible locally in
          #     under a second. The inline checks below remain as the
          #     workflow's own copy; this call is the early, cheap refusal.
          ./scripts/release-notes-check.sh "${version}"

          # 0. The section must exist.
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' section."
            exit 1
          fi

          # 1. Release title from the heading; fallback = bare tag so the
          #    `name:` input below always resolves.
          title=$(awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" {
              n = split($0, parts, /—/)
              if (n >= 3) {
                t = parts[3]
                gsub(/^[ \t]+|[ \t]+$/, "", t)
                # Codenames are heading-quoted ("Channel": tagline) — strip
                # ALL quotes from the rendered title.
                gsub(/"/, "", t)
                print t
              }
              exit
            }' CHANGELOG.md)
          if [ -n "$title" ]; then
            printf 'RELEASE_TITLE=v%s — %s\n' "$version" "$title" >> "$GITHUB_ENV"
          else
            printf 'RELEASE_TITLE=v%s\n' "$version" >> "$GITHUB_ENV"
          fi

          # Internal plan/doc references never belong in the published notes
          # (IMPLEMENTATION_*, IMPLEMENTATION_ROADMAP_*, USE_CASES.md, agent
          # history). Defense-in-depth behind the category gate below.
          sanitize() { awk '!/IMPLEMENTATION_|USE_CASES\.md|docs\/AGENTS/ { sub(/[ \t]*See[ \t]*$/, ""); print }'; }

          # 2. The prose summary: everything after the heading until the
          #    first milestone block (`**M1`) or subsection heading.
          awk -v ver="$version" '
            /^## \[/ { insec = ($0 ~ "^## \\[" ver "\\]"); next }
            !insec { next }
            /^### / { exit }
            /^\*\*M[0-9]/ { exit }
            { print }
          ' CHANGELOG.md > RELEASE_INTRO.md
          if ! grep -q '[^[:space:]]' RELEASE_INTRO.md; then
            echo "::error::CHANGELOG.md section '## [$version]' carries no prose summary between the heading and '### Release notes'. The published body opens with that summary — write it (the v1.28.84 shape), then re-tag."
            exit 1
          fi

          # 3. The `### Release notes` block is MANDATORY: a release without
          #    it FAILS here (no release is created) rather than shipping a
          #    degraded body — forgetting the notes is a blocking error.
          if ! awk -v ver="$version" '
                /^## \[/ { if (insec) exit; insec = ($0 ~ "^## \\[" ver "\\]"); next }
                insec && /^### Release notes/ { found=1; exit }
                END { exit found ? 0 : 1 }
              ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md section '## [$version]' is missing a '### Release notes' block — refusing to publish a release without user-facing notes. Add the block, then re-tag."
            exit 1
          fi

          # 4. ONLY categorized content leaves the block, in EITHER shipped
          #    shape: a bullet leading with its own category
          #    (`- **Improvements:** …`) or grouped under a bold category
          #    sub-heading (`**Bug fixes**` followed by `- ` bullets).
          #    A bullet's hard-wrapped CONTINUATION lines (indented) travel
          #    WITH their bullet — v1.28.31–.33 published truncated because
          #    this extractor once dropped them; that loss was silent, which
          #    is forbidden here.
          #    Validation counts / milestone detail placed INSIDE the block
          #    violate the changelog contract — refuse naming the offending
          #    lines instead of stripping them silently.
          awk -v ver="$version" '
            /^## \[/ { insec = ($0 ~ "^## \\[" ver "\\]"); next }
            !insec { next }
            /^### Release notes/ { notes=1; next }
            notes && /^### / { exit }
            notes && /^\*\*(Improvements|New|Changed|Bug fixes|Security fixes)\*\*/ {
              # blank line BEFORE each grouped heading: without it the raw
              # column-0 heading lazy-continues the previous bullet and
              # GitHub renders it glued inside that bullet.
              if (printed) print ""
              print; cat = 1; printed = 1; next
            }
            notes && /^- \*\*(Improvements|New|Changed|Bug fixes|Security fixes):/ {
              print; cat = 1; printed = 1; next
            }
            notes && cat && /^[ \t]+[^ \t]/ { print; printed = 1; next }
            notes && NF && !/^- / && !/^ / { cat = 0 }
            notes && /^- / { if (cat) print; else print "UNCATEGORIZED " $0 }
          ' CHANGELOG.md > NOTES_BULLETS.raw

          bad=$(grep -c '^UNCATEGORIZED ' NOTES_BULLETS.raw || true)
          if [ "$bad" -gt 0 ]; then
            echo "::error::CHANGELOG.md '### Release notes' for $version carries uncategorized bullets. Put them under a **Improvements**/**Bug fixes**/**Security fixes** sub-heading or lead each bullet with its category. Offending bullet count: $bad"
            grep '^UNCATEGORIZED ' NOTES_BULLETS.raw | sed 's/^UNCATEGORIZED //' | head -5 | sed 's/^/::error::  /'
            exit 1
          fi
          grep -v '^UNCATEGORIZED ' NOTES_BULLETS.raw > NOTES_BULLETS.tmp && mv NOTES_BULLETS.tmp NOTES_BULLETS.raw

          # Audit/finding IDs never publish (v1.28.85/.86 regression): the
          # user-facing bullets name PROOF COMMITS; IDs live in the
          # Engineering record below the block. Checked on the intro too.
          ids=$(grep -nE '\b([A-Z]{1,2}[0-9]+-[0-9]+|[A-Z]-[0-9]+)\b' RELEASE_INTRO.md NOTES_BULLETS.raw || true)
          if [ -n "$ids" ]; then
            echo "::error::audit/finding IDs must not appear in the published notes — put them in the Engineering record and name proof commits in the bullets. Offending lines:"
            printf '%s\n' "$ids" | head -5 | sed 's/^/::error::  /'
            exit 1
          fi

          if [ "$(grep -c '^- ' NOTES_BULLETS.raw)" -lt 1 ]; then
            echo "::error::CHANGELOG.md '### Release notes' block for $version produced no bullets. Add real notes, then re-tag."
            exit 1
          fi

          # 5. Assemble: summary → bullets → compare link (blank-trimmed).
          #    Both prose and bullets are UNWRAPPED first: each paragraph /
          #    bullet becomes ONE physical line. Hard-wrapped CHANGELOG
          #    sources otherwise leak their 76-col breaks into the published
          #    body (v1.28.31–.33 shipped that way; older releases didn't —
          #    visibly inconsistent on the releases page and in API output).
          #    Previous release = the largest CHANGELOG version numerically
          #    below this one (heading order not strictly sorted;
          #    [Unreleased] skipped by the numeric filter).
          #    unwrap: pass 1 joins indented continuation lines; pass 2 merges
          #    column-0 hard-wrapped prose into one line per paragraph
          #    (markdown renders both identically; one physical line per
          #    paragraph/bullet keeps every release's body uniform).
          unwrap() { awk '
              function flush() { if (pending) { print buf; pending = 0 } }
              /^[ \t]+[^ \t]/ {
                s = $0; sub(/^[ \t]+/, "", s)
                if (pending) buf = buf " " s
                else { buf = s; pending = 1 }
                next
              }
              $0 == "" { flush(); print ""; next }
              {
                flush()
                buf = $0; pending = 1
              }
              END { flush() }
            ' | awk '
              function plain(s) {
                return s !~ /^[ \t]*$/ && s !~ /^[ \t]/ && \
                       s !~ /^([-*][ \t]|[0-9]+\.[ \t]|>|#{1,6} )/ && s !~ /^\*\*.*\*\*[ \t]*$/
              }
              plain($0) { blk = (blk == "") ? $0 : blk " " $0; next }
              { if (blk != "") { print blk; blk = "" } print }
              END { if (blk != "") print blk }
            '; }
          prev=""
          while IFS= read -r v; do
            if [ "$v" = "$version" ]; then break; fi
            prev="$v"
          done < <(sed -nE 's/^## \[([0-9][0-9.]*)\].*/\1/p' CHANGELOG.md | sort -V)

          {
            # strip the intro's trailing blanks so exactly ONE blank line
            # separates prose from bullets (double-gap shipped on every
            # release before this trim).
            awk 'NF { last = NR } { line[NR] = $0 } END { for (i = 1; i <= last; i++) print line[i] }' RELEASE_INTRO.md | unwrap
            printf '\n'
            sanitize < NOTES_BULLETS.raw | unwrap
            printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...v%s\n' \
              "$GITHUB_REPOSITORY" "$prev" "$version"
          } | awk '
            { line[NR] = $0 }
            END {
              first = 1; while (first <= NR && line[first] == "") first++
              last = NR; while (last >= 1 && line[last] == "") last--
              for (i = first; i <= last; i++) print line[i]
            }' > RELEASE_BODY.md
          echo "notes lines: $(wc -l <RELEASE_BODY.md)"

      - name: Platform manifest
        # Spell out which platform+arch each binary asset targets, so the
        # attachments are unambiguous. Reflects the files actually staged (a
        # feature-gated binary that failed to build is simply absent here).
        run: |
          set -e
          : > dist/PLATFORMS.txt
          printf '%s\n' "Each asset's platform (by name suffix):" "---" >> dist/PLATFORMS.txt
          for f in dist/*; do
            case "${f##*/}" in
              *-linux-x86_64)  p="Linux x86_64 (amd64)";;
              *-linux-aarch64) p="Linux arm64 (aarch64, e.g. Jetson)";;
              *-darwin-arm64)  p="macOS arm64 (Apple Silicon)";;
              *-darwin-x86_64) p="macOS x86_64 (Intel)";;
              *.cdx.json)      p="CycloneDX SBOM (package manifest, any platform)";;
              *) continue;;
            esac
            printf '  %-34s %s\n' "${f##*/}" "$p" >> dist/PLATFORMS.txt
          done
          echo "manifest:"; cat dist/PLATFORMS.txt

      - name: Verify required assets
        # The build jobs are continue-on-error by design (one optional
        # feature binary failing must not sink a whole release), so THIS is
        # the release-integrity gate: the four primary brain-server binaries
        # must be present or publishing is refused — never shipped
        # half-empty with only source archives.
        run: |
          set -e
          # EVERY binary the build loops claim to produce, per platform — not
          # just the four primaries. v1.29.15 shipped without
          # brain-migrate-rehearse-linux-x86_64 (v1.29.14 had it) and every gate
          # was green: the copy loop is `cp ... 2>/dev/null || true`, so a
          # binary that did not build is silently not shipped, and the old
          # required-list did not name it. A partial release reported success.
          for f in \
            brain-server brain mcp bench brain-migrate-rehearse \
            brain-connector-stub brain-connector-gh brain-connector-crm; do
            for plat in linux-x86_64 linux-aarch64 darwin-arm64 darwin-x86_64; do
              [ -f "dist/$f-$plat" ] || {
                echo "::error::required asset missing: dist/$f-$plat"; exit 1; }
            done
          done
          # The SBOM integrity gate: the merged multi-platform dist carries
          # EXACTLY the release-matched manifest — a missing, mismatched, or
          # historical SBOM refuses to publish (fail-closed). Implemented in
          # a script file, not inline: run-block quoting layers do not
          # survive the transport intact.
          ./scripts/check-dist-sbom.sh "$version" dist --against-lockfile

      # BEST-EFFORT, AND THE JOB SAYS SO (2026-10-13). Observed on v1.29.15:
      # all 34 assets uploaded, then the job died with `##[error]other side
      # closed` on the action's FINAL call — the draft->published flip. The
      # action holds one keep-alive socket across ~165MB of sequential uploads
      # and the publish request lands on a socket the server has already
      # closed. Every byte of work was done; one dead socket threw it away and
      # left a fully-populated DRAFT plus a red run and no automatic recovery.
      #
      # So the create step is continue-on-error, and the VERDICT moves to the
      # explicit gate below. A transport drop is not a verdict; a release that
      # is missing, still draft, or short an asset still refuses to publish.
      - name: Create release (best-effort; a dropped socket is not a verdict)
        id: create
        continue-on-error: true
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ env.version }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: RELEASE_BODY.md
          files: dist/*
          fail_on_unmatched_files: false
          # Makes a re-run idempotent: without it, re-running after a partial
          # upload fails on assets that already exist.
          overwrite_files: true

      # Recovery for exactly the observed failure: the upload survived, the
      # publish did not. Publishes the draft ourselves when every required
      # asset is already present, and stays quiet when the create step
      # succeeded and there is nothing to recover.
      - name: Recover a draft whose upload completed but whose publish did not
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          rel="$(gh api "repos/${{ github.repository }}/releases" --jq \
                 "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")"
          if [ -z "$rel" ]; then
            echo "::error::no release exists for $TAG — the create step produced nothing"
            exit 1
          fi
          draft="$(gh api "repos/${{ github.repository }}/releases/$rel" --jq .draft)"
          if [ "$draft" != "true" ]; then
            echo "release $TAG is already published — nothing to recover"
            exit 0
          fi
          # Only publish a draft that is actually COMPLETE. A partial draft is
          # a real failure and must stay red.
          for f in brain-server-linux-x86_64 brain-server-linux-aarch64 \
                   brain-server-darwin-arm64 brain-server-darwin-x86_64; do
            gh api "repos/${{ github.repository }}/releases/$rel/assets" --paginate \
              --jq '.[].name' | grep -qx "$f" \
              || { echo "::error::draft $TAG is missing $f — refusing to publish a partial release"; exit 1; }
          done
          echo "draft $TAG carries every required asset; publishing it"
          gh api -X PATCH "repos/${{ github.repository }}/releases/$rel" -f draft=false >/dev/null
          echo "published $TAG"

      # The real gate. Replaces the create step's own exit status as the
      # verdict: the release must EXIST, must NOT be a draft, and must carry
      # every required asset. A green here means the release is genuinely
      # shippable, however it got there.
      - name: The published release carries every required asset (fail-closed)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
        run: |
          set -euo pipefail
          rel="$(gh api "repos/${{ github.repository }}/releases" --jq \
                 "[.[] | select(.tag_name == \"$TAG\")][0].id // empty")"
          [ -n "$rel" ] || { echo "::error::no release for $TAG"; exit 1; }
          draft="$(gh api "repos/${{ github.repository }}/releases/$rel" --jq .draft)"
          [ "$draft" = "false" ] || { echo "::error::release $TAG is still a DRAFT"; exit 1; }
          names="$(gh api "repos/${{ github.repository }}/releases/$rel/assets" --paginate --jq '.[].name')"
          for f in brain-server-linux-x86_64 brain-server-linux-aarch64 \
                   brain-server-darwin-arm64 brain-server-darwin-x86_64; do
            grep -qx "$f" <<<"$names" || { echo "::error::published $TAG is missing $f"; exit 1; }
          done
          echo "OK  $TAG is published and carries every required asset"