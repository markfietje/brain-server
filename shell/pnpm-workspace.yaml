overrides:
  # cookie 0.7.2 -> 1.1.1 (SvelteKit 3 / adapter-static 4, 2026-10-13).
  #
  # @sveltejs/adapter-static@4.0.0 calls `parseCookie`, which only exists in
  # the 1.x API, but declares NO `cookie` dependency of its own — so it
  # inherited whatever the graph resolved. That was 0.7.2 (via kit 3), whose
  # exports are only `parse`/`serialize`, and the adapter died with
  # `TypeError: (0, import_cookie.parseCookie) is not a function` during
  # prerender. An upstream version skew, not a local mistake.
  #
  # 1.1.1 is the one version that satisfies BOTH sides: it keeps `parse` and
  # `serialize` (what kit 3's own cookie usage needs) AND adds `parseCookie`,
  # `parseSetCookie`, `stringifyCookie`, `stringifySetCookie`. cookie 2.x is
  # NOT usable here — it drops `parse`/`serialize` entirely.
  cookie: 1.1.1
  esbuild: 0.25.12

# pnpm 12's build-script policy (scaffolded by pnpm itself at first
# install). The enumerated allowlist IS the supply-chain posture: nothing
# runs a postinstall except what is explicitly allowed, with the reason
# recorded.
allowBuilds:
  # The platform-binary installer (`node install.js`, the
  # @esbuild/darwin-arm64 fallback wiring) — esbuild's chosen binary is
  # wired by this script.
  esbuild: true
  # Deliberately denied: es5-ext's postinstall is a try/catch-wrapped
  # funding notice (`node -e "try{require('./_postinstall')}catch(e){}"`)
  # pulled in transitively via svelte-i18n's messageformat chain. Nothing
  # functional depends on it.
  es5-ext: false
minimumReleaseAgeExclude:
  - bits-ui@2.19.3 || 2.19.5
  - cn@0.4.0
  - '@tauri-apps/api@2.12.4'
  - '@tauri-apps/cli-darwin-arm64@2.12.3'
  - '@tauri-apps/cli-darwin-x64@2.12.3'
  - '@tauri-apps/cli-linux-arm-gnueabihf@2.12.3'
  - '@tauri-apps/cli-linux-arm64-gnu@2.12.3'
  - '@tauri-apps/cli-linux-arm64-musl@2.12.3'
  - '@tauri-apps/cli-linux-riscv64-gnu@2.12.3'
  - '@tauri-apps/cli-linux-x64-gnu@2.12.3'
  - '@tauri-apps/cli-linux-x64-musl@2.12.3'
  - '@tauri-apps/cli-win32-arm64-msvc@2.12.3'
  - '@tauri-apps/cli-win32-ia32-msvc@2.12.3'
  - '@tauri-apps/cli-win32-x64-msvc@2.12.3'
  - '@tauri-apps/cli@2.12.3'
