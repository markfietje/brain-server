[package]
name = "signal-gateway"
# Version tracks the libsignal stack this build is pinned against
# (Cargo.lock: libsignal tag v0.99.0 via the pinned presage rev — see the
# stack-policy note near the bottom of this file) — bump both together.
version = "0.99.0"
edition = "2024"
rust-version = "1.98"
description = "Lightweight Signal daemon edge for brain-server Switchboard"
# AGPL-3.0-only, not the workspace's Apache-2.0: the presage →
# libsignal-service → libsignal stack this binary links is AGPL-3.0-only
# end to end (verified in the pinned checkouts, 2026-10-27), so the only
# buildable artifact of this crate is a combined AGPL work — the crate
# declares that rather than a label no redistributor could honour.
# First-party code stays the author's to relicense. The gateway ships in
# neither the release workflow nor the signed shell, so the AGPL's duties
# bind whoever redistributes it, not the operator's own builds.
license = "AGPL-3.0-only"

[dependencies]
# Pinned by rev, never by branch: a branch pointer re-resolves to whatever
# upstream merged the moment ANY re-lock occurs (a manifest bump elsewhere in
# this file, a CI runner without --locked), shipping unreviewed movement of
# the whole libsignal stack under a green build. The rev below is the commit
# the stack-policy note describes — moving it is a deliberate, reviewed act:
# change the rev, re-lock, and bump this package's version together.
# MOVED 2026-10-23 (operator-ordered refresh): f74b96e0 (2026-06-era) →
# 6f630791 (presage main, 2026-10-19) → libsignal-service fae0679d
# (2026-10-15). The libsignal tag stays v0.99.0 (upstream's own pin), so the
# package version stays 0.99.0. Two call-site shims came with it:
# Metadata.timestamp → client_timestamp (chrono), and SyncMessage's optional
# fields → the `content` oneof (SyncContent::Sent). 60 tests green.
# MEASURED and NOT cleared by the bump: bincode 1.3.3 (libsignal's workspace
# itself pins bincode 1.3.2 at v0.105.4 — same major), atomic-polyfill
# (postcard 1.1.3, latest, still requires heapless ^0.7), proc-macro-error2
# (libcrux 0.0.10, which libsignal v0.105.4 also still pins). All three
# clear only with upstream libsignal/libsignal-service releases.
presage = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", rev = "6f630791b2c7bf3d5b00c75f5a6c94131bf79c8c" }

tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"], default-features = false }

axum = { version = "0.8.9", features = ["macros", "json"] }
async-stream = "0.3.6"

reqwest = { version = "0.13.5", features = ["json"], default-features = false }

serde = "1.0.229"
serde_json = "1.0.151"
# serde_yaml is DEPRECATED upstream (archived by dtolnay, 2024) and its
# `unsafe-libyaml` backend is itself unmaintained (RUSTSEC-2024-0449). This
# manifest HELD at serde_yaml 0.9 because the successor was a BEHAVIOURAL
# rename of the same crate — the fork still shipped unsafe-libyaml, so the
# switch bought nothing. That premise moved: serde_norway 0.9.41+ REPLACED
# unsafe-libyaml (measured on the index 2026-10-23), so the fork now carries
# the maintained parser the hold was waiting for. One call site
# (config/mod.rs from_str); API-compatible for it.
serde_norway = "0.9.42"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

anyhow = "1.0.104"
uuid = { version = "1.27.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
base64 = "0.23.1"
hmac = "0.13.0"
sha2 = "0.11.0"
clap = { version = "4.6.7", features = ["derive"] }
parking_lot = "0.12.5"

futures = "0.3.34"
futures-util = "0.3.34"

[dev-dependencies]
tempfile = "3"

# ── Switchboard stack policy (libsignal v0.99.0 → v0.101.0) ─────────────────
# STATUS: blocked by cargo's rule that a [patch] must point to a DIFFERENT
# source URL than the manifest being patched. presage pins libsignal crates
# with `git = .../signalapp/libsignal, tag = "v0.99.0"` and libsignal-service
# with `rev = bb43e81` — re-pointing those to newer tags of the SAME URL via
# our manifest is rejected ("patches must point to different sources").
#
# Consequence: the newest MUTUALLY-COMPATIBLE stack is whatever the PINNED
# presage rev resolves: libsignal v0.99.0 + libsignal-service-rs bb43e81
# (both confirmed the latest upstream publishes whisperfish ships against,
# as of the pin). Upstream presage main has moved past this rev; riding it
# forward is a DELIBERATE act, not an automatic one — pick the new rev,
# read what libsignal/libsignal-service revs it resolves, re-lock, and bump
# this package's version (it tracks the libsignal tag) in the same commit.
# CI runs clippy/test with --locked so a runner can never re-resolve this
# stack on its own.
#
# Options if vendoring is ever wanted: fork signalapp/libsignal under a new
# URL (e.g. github.com/markfietje/libsignal) at tag v0.101.0 and patch toward
# THAT URL; or wait for upstream. Kept out of the tree for now — dead config
# is worse than an honest ceiling.

# NOTE: the historic [patch.crates-io] curve25519-dalek → signalapp fork
# (tag signal-curve25519-4.1.3) was REMOVED with the presage/libsignal refresh:
# x25519-dalek 3.x requires curve25519-dalek ^5, which the fork does not
# provide, so the graph resolves the crates.io release like upstream intends.

# ── Hardening policy ───────────────────────────────────────────────────────
# Deny every runtime-panic vector we own (unwrap/expect/panic outside
# tests), keep the broad lint groups loud, and let unsafe_code = forbid stay
# compile-enforced from src/main.rs. Release builds KEEP arithmetic overflow
# checks ON (opt-z stays; correctness over the last percent of size).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.release.package."*"]
opt-level = "z"
