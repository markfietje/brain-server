# Advanced CodeQL setup (replaces the repository "default setup").
#
# Why this exists: the default-setup autobuild runs a bare `cargo build` that
# never compiles the feature-gated binaries (`bench`, `brain-migrate-rehearse`,
# `brain-connector-gh`) or the `crates/` engine workspace, and the extractor
# sees only macro-expanded code from what actually compiles. That produced a
# low-quality database warning ("calls with call target 43% < 50%"). This
# workflow drives a FULL build — all targets, all default binaries, both
# workspaces — under the CodeQL build tracer so every crate is extracted.
#
# Pinned to the v3 tag commit (same supply-chain posture as release.yml).
name: CodeQL

on:
  push:
    branches: [main]
    # Markdown/docs-only pushes can't change the Rust database CodeQL
    # extracts; skipping them saves a full traced build of every workspace
    # on changelog/README bumps. The weekly schedule ignores paths and
    # always runs, so advisory coverage is unchanged.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'theme/**'
      - 'book.toml'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'theme/**'
      - 'book.toml'
      - 'LICENSE'
      - '.gitignore'
  schedule:
    # Weekly Monday 06:23 UTC — off-peak, catches new advisory-backed queries.
    - cron: '23 6 * * 1'

# Supersede stale analyses the same way CI supersedes stale matrices: a new
# push/PR for the same ref cancels the previous in-flight analysis.
concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Rust)
    runs-on: ubuntu-latest
    permissions:
      # required for all workflows
      security-events: write
      # required to fetch internal or private CodeQL packs
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4
        with:
          languages: rust
          # Explicit query pack: the default suite plus security-extended for
          # deeper coverage of the auth/audit surfaces.
          queries: security-extended
          # The cargo-fuzz harness is a separate nightly-only workspace (its
          # `fuzz_target!` macro cannot expand under the tracer's stable
          # toolchain), so extracting it only produces macro-failure
          # diagnostics. Shipped code is fully covered without it. Inline
          # config (the v4 replacement for the removed `paths-ignore` input).
          config: |
            paths-ignore:
              - fuzz

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Full-build under the tracer — explicitly, because autobuild's bare
      # `cargo build --all-targets` SKIPS every required-features binary
      # (bench, migrate-rehearse, the three connectors): their source sits in
      # the tree but never reaches rustc, and uncompiled-but-extracted source
      # is exactly what dragged the database below the 50% call-target
      # quality threshold. Build every shipped surface: root workspace with
      # all gated features + tests, then each satellite workspace node.
      - name: Trace root workspace (all targets + gated bins)
        run: cargo build --all-targets --features bench,migrate,connector-github,connector-crm
      - name: Trace engine-crates workspace
        run: cargo build --manifest-path crates/Cargo.toml --all-targets
      - name: Trace steward-harness workspace
        run: cargo build --manifest-path tools/steward-harness/Cargo.toml --all-targets
      # The client is its own workspace node INSIDE the repo; leaving it
      # unbuilt puts a large extracted-but-uncompiled Rust tree into the
      # database — the main drag on the call-target quality metric.
      - name: Install client keyring headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - name: Trace client workspace
        run: cargo build --manifest-path client/Cargo.toml --all-targets

      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:rust"
