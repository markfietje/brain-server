name: shell

# The SvelteTauri shell's own gates (Phase A): lint → typecheck → tests
# (the drift gate + axe included) → build → audits → the Tauri core's
# rust gates → a no-bundle tauri build (no signing, no secrets in CI).
# The kernel's own workflows are untouched; this file gates shell/** only.

on:
  push:
    branches: [main]
    paths: ['shell/**', '.github/workflows/shell.yml']
  pull_request:
    paths: ['shell/**', '.github/workflows/shell.yml']

jobs:
  shell:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shell
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shell/pnpm-lock.yaml

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Svelte check (strict)
        run: pnpm check

      - name: Unit tests (vitest — drift gate + axe included)
        run: pnpm test

      - name: Build (adapter-static; strict CSP meta in app.html)
        run: pnpm build

      - name: pnpm audit (prod deps, high+)
        run: pnpm audit --prod --audit-level high

      - name: Rust cache (src-tauri)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: shell/src-tauri

      - name: src-tauri fmt
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: src-tauri clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: cargo audit (src-tauri)
        run: |
          cargo install cargo-audit --locked || true
          cargo audit --file src-tauri/Cargo.lock

      - name: Tauri build (no bundle — no signing, no secrets)
        run: pnpm tauri build --no-bundle
