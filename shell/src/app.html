<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- The production Content-Security-Policy (D6) is INJECTED AT BUILD
			TIME by scripts/inject-csp.mjs, with the sha256 of every inline script
			SvelteKit emitted (a static 'self' alone would block them). Dev serves
			NO CSP: the inline bootstrap + the HMR websocket are dev-only. -->
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
