name: Build & deploy docs (mdBook → GitHub Pages)

on:
  push:
    branches: [main]
    # THE DOCS LANE'S ONLY REAL TRIGGER (2026-10-13).
    #
    # This repo is the release mirror: `main` here is parked by design
    # (scripts/release.sh — "public/main therefore LAGS origin/main by
    # design, and it must not be treated as drift to be corrected"), and
    # releases reach this repo as TAGS. A `branches: [main]` filter alone
    # therefore means this workflow fires essentially never: the live
    # Pages build was frozen at 2026-10-07 while nine releases shipped.
    # It was not "broken" — it was wired to a ref that stops moving.
    #
    # Tags are the sync mechanism for this repo, so they are the trigger.
    # GitHub does NOT evaluate `paths` filters for tag pushes, so the tag
    # arm below deploys unconditionally; the `paths` list stays to keep
    # the branch arm from rebuilding on every unrelated push.
    tags: ['v*']
    paths:
      - "book.toml"
      - "docs/**"
      - "theme/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

# Single job: build + deploy. The old build→deploy split spun up a second
# runner whose only step was calling deploy-pages.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cache mdbook binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4
      - name: Install mdBook (skipped on cache hit)
        run: command -v mdbook >/dev/null 2>&1 || cargo install mdbook --version 0.5.4 --locked
      - name: Build
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
