[package]
name = "brain-client"
version = "1.16.6"
edition = "2021"
description = "brain-server control surface — web + desktop + iOS + Android (Dioxus)"
publish = false

[dependencies]
# Dioxus 0.7: one codebase → four targets. The `router` feature gives the
# Routable enum + Link/Outlet. Web builds compile to WASM (DOM renderer, which
# is screen-reader accessible — do NOT enable the experimental wgpu web renderer).
dioxus = { version = "0.7", features = ["router"] }
# reqwest works on all targets incl. WASM (Dioxus integrates the browser fetch).
# JSON feature for typed (de)serialization of brain-server's responses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# v1.16.6 M2: the secure-token storage seam. Non-web only (keyring has no wasm
# build) — the web build compiles the in-memory no-op path in src/storage.rs.
# `apple-native` → macOS/iOS Keychain; `windows-native` → Credential Manager;
# `sync-secret-service` → Linux Secret Service. Android uses the separate
# `android-native-keyring-store` crate (Keystore-encrypted prefs) — documented
# ceiling, wired by `dx` at bundle time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
