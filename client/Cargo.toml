[package]
name = "brain-client"
version = "1.28.23"
edition = "2024"
rust-version = "1.98"
description = "brain-server control surface — web + desktop + iOS + Android (Dioxus)"
publish = false

[dependencies]
# Dioxus 0.8: one codebase → four targets. The `router` feature gives the
# Routable enum + Link/Outlet. Web builds compile to WASM (DOM renderer, which
# is screen-reader accessible — do NOT enable the experimental wgpu web renderer).
#
# 2026-10-21: alpha.1 → alpha.3, the newest release of the pinned 0.8 alpha
# line (the 0.8 stable is not out; 3.0.0-alpha.x is a different major and is
# NOT what this pin means). The bump carries ONE upstream breaking change into
# this tree: `keyboard-types` 0.7.0 → 0.8.3, where `Key`'s named variants moved
# into `NamedKey` — so `Key::Escape` is now `Key::Named(NamedKey::Escape)`, and
# the port touched every key comparison in the client (the AppShell shortcuts,
# the CommandPalette's cursor keys, the Modal and Drawer focus traps, the
# conversation composer, the UMP recall box, and one review-panel test).
#
# The port also FIXED a dead modifier check. `Modifiers::SUPER` (0x2000) is
# deprecated upstream as "marked as legacy in the spec, use META instead", and
# dioxus-web never sets it: its `events/keyboard.rs` maps the browser's
# `meta_key()` to `Modifiers::META` (0x40) and inserts nothing else. So the
# old `contains(Modifiers::SUPER)` was always false and Cmd+K / Cmd+B never
# fired on macOS; the check is now `META`, which is the spelling the spec and
# the browser agree on.
#
# Verified: `cargo fmt`/`clippy --all-targets -D warnings`/`test` (245 tests)
# all green, the wasm32 build compiles, the desktop feature compiles, and the
# release wasm measures 4,312,599 bytes against the 5,734,400-byte budget.
dioxus = { version = "=0.8.0-alpha.3", features = ["router"] }
# reqwest works on all targets incl. WASM (Dioxus integrates the browser fetch).
# JSON feature for typed (de)serialization of brain-server's responses.
# 0.13 → 0.13.5 (2026-10-04). MSRV 1.85, under this workspace's 1.98 floor.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v1.28.1 M4: the SHA-256 subject digest for the offline DSAR queue payload —
# the raw subject never persists, only its one-way hash (re-prompted at
# replay). Pure Rust, wasm-compatible; hex formatting is hand-rolled (no `hex`
# dep — a dozen bytes of `format!` beats 30KB of wasm).
sha2 = "0.11"
# v1.20.8 M3: the `/events` SSE feed is read as a bounded `bytes_stream` (one
# chunk = handshake + buffered alerts, then close + reconnect). Already a
# transitive dep of reqwest; declared directly for the `StreamExt` trait.
futures-util = { version = "0.3", default-features = false }
# v1.16.7 M7.2: the single-refresh mutex. `sync` only (Mutex — no runtime),
# so it stays tiny and wasm-compatible; reqwest already pulls tokio on native.
tokio = { version = "1.53.2", default-features = false, features = ["sync"] }

# v1.16.6 M2: the secure-token storage seam. Non-web only (keyring has no wasm
# build) — the web build compiles the in-memory no-op path in src/storage.rs.
# `apple-native` → macOS/iOS Keychain; `windows-native` → Credential Manager;
# `sync-secret-service` → Linux Secret Service. Android uses the separate
# `android-native-keyring-store` crate (Keystore-encrypted prefs) — documented
# ceiling, wired by `dx` at bundle time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# keyring 4 split platform backends into `*-keyring-store` crates; `v1` keeps
# the Entry API this code uses.
keyring = { version = "4", default-features = false, features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }

# v1.27.20 "Console" (F-36): `client_times_out_on_hung_connection` needs an
# async runtime; the shipped `sync`-only tokio dep gets rt+macros here. Dev-only
# → zero wasm impact (dev-deps never compile into the bundle).
[dev-dependencies]
fluent-pseudo = "0.3.3"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread"] }

# v1.28.20 Cockpit M1: platform targets are cargo features — one codebase,
# three renderers. Default stays `web` so every existing gate (wasm build,
# bundle budget) is untouched; desktop/mobile are additive opt-ins.
[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
