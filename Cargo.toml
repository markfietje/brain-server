[package]
name = "brain-server"
version = "1.28.57"
edition = "2024"
rust-version = "1.98"
description = "Local-first agent memory server: UMP 1.0 L3, zero-token embeddings, human-in-the-loop write gate, tamper-evident audit chain, DSAR/GDPR tooling."
license = "MIT"
readme = "README.md"
repository = "https://github.com/markfietje/brain-server"
keywords = ["memory", "agent", "ump", "llm", "rag", "embeddings", "local-first", "semantic-search"]
categories = ["artificial-intelligence", "database", "command-line-utilities"]

[features]
# Benchmark harness (M0.1). Adds no dependencies — the `bench` binary reuses
# the shared dependency-free HTTP client. Off by default so the default build
# is unchanged. Enable with `cargo run --release --features bench --bin bench`.
bench = []
# Migration rehearsal tool (v0.9.9 "Qualify" M2). Off by default so the default
# build is unchanged. Enable with
# `cargo run --release --features migrate --bin brain-migrate-rehearse`.
migrate = []
# v1.28.5 "Compliance Pack": Art.12/14 decision-evidence pipeline (decision
# records, oversight evidence, RoPA register). Off by default so the default
# build is unchanged and the new tables are simply not migrated.
compliance-pack = []
# GitHub App connector auth (M2.1). `jsonwebtoken` is now a required dep
# on the server (v1.2.0 AuthN) with `use_pem` + `rust_crypto` always on, and
# `reqwest` is required since v1.15.0 (the DSAR Art 19 webhook needs outbound
# HTTP), so this feature gates only the brain-connector-gh binary (M2.2).
# Enable when building that binary.
connector-github = []
# v1.28.22 "Bridges": the CRM case connectors (Zendesk / Salesforce / Genesys
# Cloud) + the brain-connector-crm binary. Gates only the networked transport
# adapters and the binary; the pure contract, mappers, linkage, and sync-loop
# tests ship in the default build so CI runs them ungated.
connector-crm = []
# v1.4.0 "Calibrate" M4: multi-vector retrieval (embedding ensemble). RESERVED
# but currently a no-op — deferred per the plan's lazy-dev escape hatch ("if
# the feature isn't worth the watts, defer it"). Cannot be measured until M5's
# harness provides a baseline; lands in v1.4.1+ with measured Δ-recall vs Δ-RSS.
# Kept as a named feature so callers/docs/CI can reference the upgrade path.
multivec = []
# v1.20.3 "Classify" M2 (G5): optional local ONNX prompt-injection classifier as
# layer 2 of the injection screen. OFF by default — the repo's Jetson envelope
# treats memory as the scarcest resource, and the deterministic blocklist +
# `untrusted` segregation remain the always-on defense. When enabled, loads a
# BERT-tiny INT8 (~4.3 MB) model at `BRAIN_INJECTION_CLASSIFIER` + tokenizer at
# `BRAIN_INJECTION_TOKENIZER`; scoring stays off the request path. Desktop is
# the verified target; Jetson-fit is a measured gate (repo precedent: the rerank
# tier was removed for the same reason).
injection-classifier = ["dep:ort", "dep:tokenizers"]
# v1.28 "Caliber" M2: the neural embedding tier (BGE-M3 via FastEmbed-rs) + the
# cross-encoder rerank tier (bge-reranker-v2-m3). Both OFF by default — the
# default build (edge/Jetson) stays on the static potion model with no rerank,
# honoring the ROADMAP "no new heavy runtime" doctrine. The `enterprise` profile
# activates them at boot via `embed::embedder_for_profile`. FastEmbed-rs pulls its
# own `ort` — re-verify no version conflict with the `injection-classifier` ort at impl time.
neural-embed = ["dep:fastembed", "fastembed/hf-hub-native-tls", "fastembed/ort-download-binaries-native-tls"]
rerank-tier = ["dep:fastembed", "fastembed/hf-hub-native-tls", "fastembed/ort-download-binaries-native-tls"]
# v1.20.7 "Telemetry" (M1): optional OTLP/HTTP OpenTelemetry trace export. OFF by
# default so the default build stays byte-for-byte unchanged (zero new deps, no
# network export on the Jetson envelope). When enabled, the four decision-critical
# spans (`screen`, `recall`, `gate.propose`, `gate.approve`, `gate.reject`) are
# emitted as OTel spans to `BRAIN_OTEL_ENDPOINT` (default
# `http://127.0.0.1:4318/v1/traces`). Enable with `--features otel`.
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "tracing-subscriber/registry",
]

[dependencies]
# v1.28.0 "Keel SDK cut": the stable engine ABI (pure cores, policy vocabulary,
# the storage-agnostic WorkflowHost seam). The server is the first host adapter;
# engines compile against this crate, never against brain-server.
brain-engine-sdk = { path = "crates/brain-engine-sdk", features = ["harness-kernel"] }
# Core Embedding
model2vec-rs = "0.2"
# v1.28 "Caliber": the neural-tier runtime (BGE-M3 dense+sparse+colbert +
# bge-reranker-v2-m3). Optional — only pulled by `neural-embed`/`rerank-tier`.
# Pinned to 5.x; it exact-pins `ort = =2.0.0-rc.13`, so brain-server's `ort`
# was bumped to rc.13 to unify the graph (above).
fastembed = { version = "6.0.2", optional = true, default-features = false }

# Database Stack. 2026-08-04 audit bump (v1.12.x "Harden"): rusqlite 0.38.0 →
# 0.40.1 raises the bundled SQLite from 3.51.1 → 3.53.2 (security fixes:
# fts3_tokenizer hardening, CVE-2022-35737-related fixes). The savepoint API
# change flagged in the v1.11.0 comment (`savepoint_with_name(&mut self)`) is
# unused — the codebase uses raw-SQL SAVEPOINT (verified v1.1.2). r2d2_sqlite
# 0.35.0 tracks rusqlite 0.40. sqlite-vec 0.1.9 (bug fixes; `sqlite3_vec_init`
# FFI symbol unchanged).
rusqlite = { version = "0.40.1", features = ["bundled"] }
sqlite-vec = "0.1.9"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"

# Async Stack - Axum 0.8.x Standard
# `sse` feature: v1.17.3 "UMP" M2 `GET /ump/subscribe` (§3.8 change feed).
axum = "0.8.9"
tower-http = { version = "0.7", features = ["cors", "limit", "trace", "timeout", "catch-panic", "compression-full", "sensitive-headers", "request-id", "add-extension", "set-header", "fs" ] }
tokio = { version = "1.53.0", features = ["full"] }

# Serialization - Latest Releases
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"

# Performance Utilities
anyhow = "1.0.104"
xxhash-rust = { version = "0.8.17", features = ["xxh3"] }
# Webhook HMAC-SHA256 verification (v0.9.7 "Guard"). Pure-Rust, no native deps.
hmac = "0.13"
sha2 = "0.11"
# Constant-time comparison for bearer-token auth + audit hash-chain checks.
# Already a transitive dep via sha2/hmac/aes-gcm; declaring it directly is free.
# Prevents LLVM from short-circuiting a hand-rolled fold (the prior `ct_eq`).
subtle = "2.6"
# Encrypted backup/restore (v0.9.7 "Guard"). Pure-Rust AES-256-GCM, no native deps.
aes-gcm = "0.11"
# v1.27.17 "Strongbox" (M1/F-08): memory-hard KDF for backup passphrases
# (Argon2id, 64 MiB / t=3, p=1). Pure-Rust, no new transitive surface beyond
# blake2/password-hash — both pass the cargo audit gate. 0.6 keeps
# `Argon2::new`/`hash_password_into` (the KDF path) intact; the 0.5 PHC
# string API this crate never used is what moved under it.
argon2 = "0.6"
# Hex encoding for HMAC signature roundtrips in webhook verification + tests.
hex = "0.4"
chrono = "0.4.45"
dirs = "6.0.0"
sysinfo = "0.39"
zerocopy = { version = "0.8", features = ["derive"] }
uuid = { version = "1.26", features = ["v4", "serde"] }

# Markdown parsing for structure-aware chunking (v0.9.4: closes the gap on
# setext headings, indented code blocks, blockquotes, lists, tables, and other
# CommonMark constructs the previous hand-rolled line-scanner mis-handled).
# Context7-verified 2026-07-17: 0.13 is current. default-features = false
# drops the `html` + `getopts` deps we don't need (we only use the parser).
pulldown-cmark = { version = "0.13.4", default-features = false }

# Multi-pattern string matching for deterministic entity linking (v1.4.0+).
# Aho-Corasick with LeftmostFirst semantics enables O(n) entity mention
# detection with case-insensitive, longest-match resolution. Already a
# transitive dep via regex; declared directly for the linker module.
aho-corasick = "1"

# Observability
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# OpenTelemetry export (v1.20.7 "Telemetry" M1). ALL optional + feature-gated
# behind the `otel` feature so the default build adds nothing. The `registry`
# feature on tracing-subscriber is enabled only under `otel` (the OTLP layer
# needs a `Registry` subscriber to attach spans). Versions: opentelemetry 0.32 /
# opentelemetry_sdk 0.32.1 / opentelemetry-otlp 0.32 (the `SdkTracerProvider`
# rename + `with_batch_exporter` builder) / tracing-opentelemetry 0.33
# (context7-verified 2026-08-12). `reqwest-blocking-client` = the batch exporter
# runs on its own thread, no tokio-runtime coupling (good for the Jetson core).
opentelemetry = { version = "0.32.0", default-features = false, features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.32.1", default-features = false, features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"], optional = true }
tracing-opentelemetry = { version = "0.33.0", default-features = false, optional = true }


# JWT/JWS verification + signing (v1.2.0 "AuthN"). Required on the server
# for the `/auth/*`, `/.well-known/*` surfaces, the auth middleware's JWT
# path, and `brain key generate`/`sign`. `use_pem` enables PEM parsing for
# `DecodingKey::from_rsa_pem` etc.; `rust_crypto` brings in the RSA/EC/Ed
# primitives used both to verify and to sign. Context7-verified 2026-07-29:
# v10 is current; API is `Validation::new(alg)` + `set_required_spec_claims`
# + `validate_exp`/`validate_nbf` + `leeway`.
jsonwebtoken = { version = "11", default-features = false, features = ["use_pem", "rust_crypto"] }
# RSA key loading for JWT signing key rotation (v1.2.0 "AuthN" M5). Pure-Rust,
# no system OpenSSL dep — consistent with the bundled philosophy. Already a
# transitive dep of `jsonwebtoken` when `rust_crypto` is on; declared directly
# so the key-management code doesn't silently break if jsonwebtoken swaps backends.
# RSA backend for RS256 verification. 0.10 is still an RC upstream — pinned
# deliberately so the keygen path uses the same rand_core as our `rand` 0.10
# direct dep (the rand08 bridge alias is deleted with this bump).
rsa = { version = "=0.10.0-rc.18" }
# Random key generation (`brain key generate`) + UUIDv4 `jti` minting (v1.2.0;
# `Uuid::new_v4()` — the comment previously said UUIDv7, the code never used
# it. Corrected in audit G5, v1.11.0).
# `getrandom` feature is the only one needed; `serde`/`v4` already on `uuid`.
rand = "0.10"
# Base64 URL-safe encoding for JWK fields (v1.2.0 "AuthN" M4: `/.well-known/jwks.json`).
# Tiny, stable, already a transitive dep; declared directly so the JWKS emitter
# doesn't silently break if a transitive consumer swaps backends.
base64 = "0.23"

# Outbound HTTP (v1.15.0 "Observe" M3): the DSAR Art 19 onward-notification
# webhook + the brain-connector-gh binary (M2.2). REQUIRED since v1.15.0 — the
# compliance webhook is an always-on server surface, so breaking the historic
# "no outbound HTTP dep on the server" constraint (#1) is the deliberate,
# documented trade. `rustls-tls` (no system OpenSSL dep, consistent with
# `rusqlite`'s bundled philosophy) + `blocking` (sync client for the webhook).
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "blocking"] }

# UMP 1.0 integrity + identity (v1.17.3 "UMP Rollout", spec §2.8/§6.1/§6.2):
# blake3 is the spec-MANDATED content hash; bs58 is did:key base58btc
# (multicodec 0xed prefix, §5.1); tokio-stream adapts the broadcast receiver
# to the SSE stream for `subscribe` (§3.8); ed25519-dalek 2.2.0 signs/verifies
# record integrity + capability tokens (§5.2) — already in Cargo.lock as a
# transitive dep of jsonwebtoken, declared directly here.
blake3 = "1"
bs58 = "0.5"
tokio-stream = { version = "0.1", features = ["sync"] }
ed25519-dalek = "3"
# v1.27.17 "Strongbox" (M3/F-30): URL host parsing for the GitHub pagination
# `Link` host pin. Already a transitive dep of reqwest; declared directly so
# the pin doesn't silently break if a transitive consumer swaps backends.
url = "2"

# v1.20.3 "Classify" M2 (G5): ONNX inference + BERT tokenizer for the optional
# layer-2 prompt-injection classifier. OPTIONAL — gated behind the
# `injection-classifier` feature (off by default) so the default build is
# unchanged. `ort` loads ONNX via `Session::builder` (Context7-verified API);
# `tokenizers` provides the BERT tokenizer (`Tokenizer::from_file` +
# `encode_batch`, matching the ort sentence-transformer example shape).
# v1.28: bumped rc.12 → rc.13 to unify with `fastembed` 5.x's exact-pinned
# `ort = =2.0.0-rc.13` (the neural/rerank tiers pull fastembed). The injection-
# classifier's `Session` API is stable across rc.12/rc.13; re-verify on bump.
ort = { version = "2.0.0-rc.13", optional = true, default-features = true }
tokenizers = { version = "0.23", optional = true, default-features = true }

[dev-dependencies]
tempfile = "3.27"
# Router-level middleware tests (`Router::oneshot`). Already in the lock as an
# axum dependency — declared here so tests can import the trait.
tower = { version = "0.5", features = ["util"] }
# Property-based testing (v1.3.0 Bedrock M6). Generates random inputs to test
# invariants across input spaces. Used for chunker byte-range, RRF merge, and
# validator idempotency properties. Benchmark score 91.11 (Context7-verified).
proptest = "1.6"

[[bin]]
name = "brain"
path = "src/bin/brain.rs"

[[bin]]
name = "mcp"
path = "src/bin/mcp.rs"

[[bin]]
name = "bench"
path = "src/bin/bench.rs"
required-features = ["bench"]

# v0.9.9 "Qualify" M2: copy-and-verify migration rehearsal tool. Runs against
# a *copy* of the live DB (server must be stopped). Feature-gated so the
# default build stays minimal — same pattern as `bench`.
[[bin]]
name = "brain-migrate-rehearse"
path = "src/bin/brain_migrate_rehearse.rs"
required-features = ["migrate"]

[[bin]]
name = "brain-connector-stub"
path = "src/bin/brain-connector-stub.rs"

[[bin]]
name = "brain-connector-gh"
path = "src/bin/brain-connector-gh.rs"
required-features = ["connector-github"]

# v1.28.22 "Bridges": one binary, three CRM sources (--source selected).
[[bin]]
name = "brain-connector-crm"
path = "src/bin/brain-connector-crm.rs"
required-features = ["connector-crm"]

[profile.release]
# v1.28.5 "Groundwork" (M6): opt-level "z" (size-minimal) → 2 (speed) — the
# release binary is now an in-process vector store; the bench binary measures
# the sha we ship. Client wasm budget is unaffected (separate workspace node).
opt-level = 2
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
# F-50a: arithmetic near the i64 edge (paginated listings, DSAR/purge
# offsets) must abort, never wrap silently — with panic=abort an overflow is
# fail-stop. Measured cost on the synthetic bench: < 1% (see CHANGELOG 1.28.5).
overflow-checks = true

[lints.rust]
# F-50b: no `unsafe fn` is defined in this crate today; keeping the lint at
# deny means the first one that appears inherits block-scoped safety.
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
missing_safety_doc = "deny"



[profile.release.package."*"]
opt-level = 2
