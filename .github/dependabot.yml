# Dependabot configuration.
#
# The recurring red "cargo in /client for glib|rand - Update" runs are
# Dependabot SECURITY updates that can never resolve:
#
# - rand 0.7.3 arrives transitively via phf_generator 0.8.0 (proc-macro
#   build chain). The client never calls rand directly; no lockfile edit
#   resolves the advisory without upstream releasing a phf_generator that
#   uses rand >= 0.8.6.
# - glib 0.18.x is pinned by the gtk4-rs stack under dioxus-desktop. The
#   advisory requires >= 0.20.0, which does not exist in this dependency
#   graph until gtk4-rs/dioxus ship it.
#
# Both are ignored here so Dependabot stops attempting (and failing) the
# impossible update each run. Revisit when dioxus-desktop or phf_generator
# bumps land — remove the matching ignore entry then.
#
# ── QUEUE DISCIPLINE (2026-10-13) ──────────────────────────────────────────
# The 2026-10-12 run opened FOURTEEN PRs at once. Each one fires ci.yml's
# 20-job Rust matrix, so the queue reached ~400 jobs; nothing drained for
# nine hours and runs sat `queued` (and, after a cancel, `in_progress` with
# every step finished) until they were killed. Two changes here bound that,
# and both are deliberate rather than incidental:
#
#   1. `open-pull-requests-limit` per entry — a hard ceiling on how many
#      Dependabot PRs may be open at once, so a backlog cannot compound
#      week over week. Dependabot's own default is 5 per ecosystem/directory.
#   2. A catch-all group per entry — everything not already claimed by a
#      named group lands in ONE PR instead of one-PR-per-crate. The named
#      groups below stay first, because Dependabot matches a dependency to
#      the FIRST group whose pattern it hits.
#
# Net effect: a weekly run now proposes ~8 reviewable PRs (one per entry)
# instead of an unbounded pile, and every one of them is a batch that a
# reviewer can reason about as a unit. This matters more here than in a
# normal repo because the matrix is expensive AND the updates are coupled:
# `rsa` cannot move without `pkcs1`, so isolated per-crate PRs are not
# independently mergeable anyway.
version: 2
updates:
  # Automate the GitHub Actions bumps themselves (checkout/rust-cache/…)
  # — the Node-runtime deprecation class gets fixed by PR, not by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      # The codeql-action steps are a PAIR by contract: the analyze
      # post-action loads the database the init step wrote and refuses a
      # version mismatch (`Loaded a configuration file for version
      # '4.38.0', but running version '4.38.1'`). Separate init/analyze
      # PRs are structurally red — each alone can never pass. One grouped
      # PR bumps both together; demonstrated red on #42/#43, fixed on
      # main by the same commit.
      codeql-action-pair:
        patterns:
          - "github/codeql-action/*"
      # Every remaining action bump rides together. A SHA-pin refresh is
      # one reviewable diff; split across five PRs it is five merge
      # decisions and five copies of the same 20-job matrix.
      all-other-actions:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # The opentelemetry family moves as ONE unit: otlp 0.33 requires
      # opentelemetry 0.33 + sdk 0.33, so separate per-crate PRs conflict
      # with each other and with cargo resolution — same structural
      # hazard as the codeql-action pair, on the cargo side.
      opentelemetry-family:
        patterns:
          - "opentelemetry"
          - "opentelemetry_sdk"
          - "opentelemetry_otlp"
      # Everything else, together. The kernel's lock is one resolver
      # graph; reviewing it as one re-lock is both faster and safer than
      # reviewing 30 independent lockfile hunks that can never each be
      # merged alone.
      rest-of-kernel:
        patterns:
          - "*"
    ignore:
      - dependency-name: opentelemetry
        versions: [">=0.33"]
        # no tracing bridge exists yet: tracing-opentelemetry 0.33 (the
        # latest) pairs with opentelemetry 0.32, so the otel feature
        # cannot compile against 0.33 (two opentelemetry versions in one
        # graph — tracer trait mismatch, demonstrated on the grouped PR).
        # Remove when tracing-opentelemetry ships the 0.33 pairing.
      - dependency-name: opentelemetry_sdk
        versions: [">=0.33"]
      - dependency-name: opentelemetry_otlp
        versions: [">=0.33"]
      - dependency-name: fastembed
        versions: [">=7"]
        # 7.x is BREAKING where it hurts this deployment: the model cache
        # relocates (existing weights re-download unless HF_HOME is set —
        # a local-first regression), the sparse-model API changes shape,
        # and the neural-embed / rerank-tier paths it compiles into are
        # feature-gated OUT of the default CI matrix. Take the major
        # deliberately, with the tier smokes pointed at the gated
        # features; remove this ignore when that lands.
  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-engine-crates:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /tools/steward-harness
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-harness:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-client:
        patterns:
          - "*"
    ignore:
      - dependency-name: rand
        versions: [">=0.7, <0.8.6"]
        # transitive via phf_generator 0.8 — no resolvable fix
      - dependency-name: glib
        versions: ["<0.20"]
        # pinned by gtk4-rs under dioxus-desktop — no resolvable fix
  # The SvelteTauri shell (Phase A, R23): the shell's own supply chain,
  # covered like the kernel's — pnpm for the SvelteKit app, cargo for the
  # Tauri core (committed lockfiles on both; the shell README records the
  # audit gates).
  #
  # The shell's npm bumps are the single worst queue contributor: five of
  # the fourteen stuck PRs came from here, each a patch-level dev-dependency
  # move. One grouped PR, capped at 5 open.
  - package-ecosystem: npm
    directory: /shell
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      all-shell-npm:
        patterns:
          - "*"
  - package-ecosystem: cargo
    directory: /shell/src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      all-tauri-core:
        patterns:
          - "*"

  # The Docker bases are the trust chain's last unpinned third-party inputs
  # (the register's F4-19): oauth2-proxy holds the IdP client secret,
  # rust:1-bookworm compiles the shipped binary. Digest pins ride the
  # manifests; Dependabot opens the bump PRs.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      all-docker-bases:
        patterns:
          - "*"