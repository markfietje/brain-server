name: shell

# The SvelteTauri shell's fail-closed contract-integrity gates. The shell is
# checked whenever its source, the kernel OpenAPI contract, or the canonical
# invisible-class fixture changes.

on:
  push:
    branches: [main]
    paths:
      - 'shell/**'
      - 'openapi.yaml'
      - 'plugin/fixtures/invisible-classes.json'
      - '.github/workflows/shell.yml'
  pull_request:
    paths:
      - 'shell/**'
      - 'openapi.yaml'
      - 'plugin/fixtures/invisible-classes.json'
      - '.github/workflows/shell.yml'
  # Manually runnable, and this is not a convenience (2026-10-13). Every other
  # trigger here is paths-filtered, so this lane is UNRUNNABLE on a commit that
  # touches none of those paths — which is exactly how the 1.29.15 release
  # shipped with the `--offline` fix to this very file never having been
  # executed by a runner: the fix was reasoned and verified locally, and
  # nothing said so. `gh workflow run shell.yml --ref main` closes that, and
  # keeps a lanes-only change from waiting on an unrelated shell edit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: shell
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
        with:
          version: 12.3.4

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: shell/pnpm-lock.yaml

      - name: Install Linux Tauri prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file pkg-config \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install pinned stable Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, signed 2026-09-03
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Rust cache (kernel root)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: .

      - name: Rust cache (shell Tauri)
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: shell/src-tauri

      - name: Hugging Face model prefetch
        uses: ./.github/actions/huggingface-prefetch

      - name: Install shell dependencies (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Unit tests (non-mutating vitest)
        run: pnpm test

      - name: Verify generated client is byte-stable
        shell: bash
        run: |
          set -euo pipefail
          generated="$(mktemp)"
          trap 'rm -f "$generated"' EXIT
          pnpm exec openapi-typescript ../openapi.yaml -o "$generated"
          cmp src/lib/api/schema.d.ts "$generated"

      - name: Build shell and inject/verify strict CSP
        run: |
          pnpm build
          grep -q 'Content-Security-Policy' build/index.html
          ! grep -q "'unsafe-inline'" build/index.html

      - name: pnpm audit (production dependencies, high+)
        run: pnpm audit --prod --audit-level high

      # The type-check gate runs AFTER the supply-chain gates (the register's
      # F4-16 reorder): a typing error used to skip 13 steps including both
      # audits — one red check starving the whole tail.
      - name: Svelte check (strict)
        run: pnpm check

      # `--offline` STAYS, and the cache-miss is fixed where it actually is.
      #
      # First attempt removed the flag, on the reasoning that `--locked` is the
      # reproducibility property and `--offline` "only adds a way to fail".
      # shell/tests/ci-gates.test.ts refused the workflow in one line, which
      # was the correct answer: the flag is a CONTRACT. This lane must build
      # the kernel binary on a clean runner without reaching for the network,
      # and the pin says so in the test's own name — fail_closed_clean_runner.
      # My reasoning was wrong about what the flag is FOR.
      #
      # What was true is why it failed: `--offline` resolves only from a
      # populated cargo registry, and Swatinem/rust-cache keys on the lockfile
      # — so any lock change, new runner image, or evicted cache left it with
      # nothing and produced `no matching package named 'aes-gcm' found`. That
      # is a CACHE-MISS problem, not a flag problem, so it is answered with a
      # fetch: the registry is populated explicitly, `--locked` throughout, and
      # the BUILD itself stays offline exactly as the contract requires.
      - name: Fetch the kernel registry (populates it for the offline build)
        working-directory: .
        run: cargo fetch --locked

      - name: Build root brain-server for dedicated-port e2e (offline, locked)
        working-directory: .
        run: cargo build --offline --locked --bin brain-server

      - name: Tauri fmt
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Tauri clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install pinned cargo-audit and audit Tauri lockfile
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit --file src-tauri/Cargo.lock

      - name: Tauri build (no bundle — no signing, no secrets)
        run: pnpm tauri build --no-bundle

      - name: Install Playwright browsers and OS dependencies
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: E2E (real loopback kernel, Chromium + WebKit, one worker)
        env:
          E2E_KERNEL_PORT: 8799
        run: pnpm test:e2e --workers=1
