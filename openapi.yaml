openapi: 3.0.3
info:
  title: brain-server API
  description: >
    HTTP API for the brain-server local agent memory / semantic search server
    (Axum + rusqlite + sqlite-vec + model2vec). This spec is hand-written from
    the source in src/main.rs and src/handlers/*. Endpoints whose contract could
    not be fully verified from source are marked with `x-status: unverified`.
    Every response carries `X-Api-Version: <semver>`; legacy routes carry a
    `Deprecation` header per the deprecation policy in API_CONTRACT.md.
    UMP capability tokens (v1.17.3 M5, spec §5.2) are accepted as
    `Authorization: Bearer` on `/ump/*` + `/export` (signature/expiry at the
    middleware, verbs × scope per handler; `audit` surfaces deny tokens).
  version: 1.21.0
  x-api-version: "1.21.0"
servers:
  - url: http://127.0.0.1:8765
    description: Default local server (override BIND_HOST/BIND_PORT)
paths:
  /health:
    get:
      summary: Liveness / system health
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  model: { type: string }
                  system:
                    type: object
                    properties:
                      memory_used_mb: { type: integer }
                      memory_total_mb: { type: integer }
                      memory_percent: { type: number }
                  pool:
                    type: object
                    properties:
                      connections: { type: integer }
                      idle_connections: { type: integer }
                      busy_connections: { type: integer }
                  # v0.9.9 "Qualify": capacity envelope status. Present when the
                  # pool had a connection to measure against; omitted (not null)
                  # when the pool was momentarily exhausted. `status` is one of
                  # ok|warning|exceeded. Writes are rejected with HTTP 507 when
                  # exceeded; reads always return 200.
                  capacity:
                    type: object
                    properties:
                      target: { type: string, example: jetson }
                      docs: { type: integer }
                      max_docs: { type: integer }
                      db_mib: { type: integer }
                      max_db_mib: { type: integer }
                      rss_mib: { type: integer }
                      max_rss_mib: { type: integer }
                      status: { type: string, example: ok }
                  # v1.3.0 "Bedrock" M7: memory-safety posture. `unsafe_blocks`
                  # is the audited count (each carries a SAFETY comment);
                  # `panics_caught` increments when CatchPanicLayer catches a
                  # handler panic; `memory_leaks_detected` is reserved for a
                  # future LSAN integration (always 0 today).
                  hardening:
                    type: object
                    properties:
                      unsafe_blocks: { type: integer, example: 2 }
                      panics_caught: { type: integer, example: 0 }
                      memory_leaks_detected: { type: integer, example: 0 }
                  # v1.20.10 "Proof": cached audit-chain integrity posture from
                  # the integrity watcher. `chain_ok` reflects the watcher's last
                  # full `/audit/verify` scan (default 60s cadence); `chain_head`
                  # pins the state to a verifiable hash. Never content/PII.
                  integrity:
                    type: object
                    properties:
                      chain_ok: { type: boolean, example: true }
                      last_checked_at: { type: integer, example: 1755100000 }
                      chain_head: { type: string, example: abc123 }
  /health/db:
    get:
      summary: Database health
      operationId: getHealthDb
      responses:
        "200":
          description: Database health
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  database_size_bytes: { type: integer }
                  database_size_mb: { type: number }
                  last_write: { type: string, nullable: true }
                  connection_pool:
                    type: object
                    properties:
                      active: { type: integer }
                      idle: { type: integer }
                      max: { type: integer }
  /ready:
    get:
      summary: Readiness probe
      operationId: getReady
      responses:
        "200":
          description: "OK when ready, NOT_READY otherwise"
          content:
            text/plain:
              schema: { type: string, example: OK }
  /openapi.yaml:
    get:
      summary: This OpenAPI document (machine-readable route discovery)
      operationId: getOpenapi
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema: { type: string }
  /reindex:
    post:
      summary: Re-embed every chunk (vec0 rebuild)
      operationId: reindex
      responses:
        "200":
          description: Reindex result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  reembedded: { type: integer }
                  skipped: { type: integer }
  /version:
    get:
      summary: Server version
      operationId: getVersion
      responses:
        "200":
          description: Version string (text/plain)
          content:
            text/plain:
              schema: { type: string, example: "0.9.1" }
  /stats:
    get:
      summary: Corpus statistics
      operationId: getStats
      responses:
        "200":
          description: Counts and model info
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  embeddings: { type: integer }
                  entities: { type: integer }
                  relationships: { type: integer }
                  model: { type: string }
                  version: { type: string }
  /add:
    post:
      summary: Add a single text chunk
      operationId: addChunk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                title: { type: string }
                source: { type: string, default: manual }
      responses:
        "200":
          description: Add result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status: { type: string }
                  chunk_id: { type: integer, nullable: true }
                  error: { type: string, nullable: true }
  /ingest/memory:
    post:
      summary: Ingest free-form memory text (raw body)
      operationId: ingestMemory
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: "success | unchanged | error" }
                  chunk_id:
                    type: integer
                    nullable: true
                    description: First inserted rowid (null when nothing was added). v1.13.3.
                  chunk_ids:
                    type: array
                    items: { type: integer }
                    description: All inserted rowids this request. v1.13.3.
                  entries_added: { type: integer, description: Chunks actually inserted. v1.13.3. }
                  duplicates_skipped: { type: integer, description: Dedup-skipped entries. v1.13.3. }
                  entry_id:
                    type: integer
                    nullable: true
                    deprecated: true
                    description: Deprecated alias of chunk_id (was previously the count added).
                  similarity_score: { type: number }
  /search:
    get:
      summary: Hybrid semantic + lexical search (legacy GET contract)
      operationId: search
      description: >
        Legacy flat-query search. The structured v0.9.5 `QueryDoc` is available
        on `POST /recall`. Here `lex` maps to a single `LexSpec.terms` entry
        (FTS5-quoted, injection-safe); `sources` is a comma-separated OR scope.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: k
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: source
          in: query
          schema:
            type: string
            enum: [memory, markdown, structured, manual, vault, vector, fts, graph, both]
            description: "v1.13.3: ingest kind (SQL filter), retrieval leg (post-fusion filter), or both. Unknown values return 422."
        - name: sources
          in: query
          schema: { type: string, description: "comma-separated OR filter over ingest kind: memory,markdown,structured,manual,vault" }
        - name: since
          in: query
          schema: { type: string, description: ISO-8601 or YYYY-MM-DD HH:MM:SS }
        - name: lex
          in: query
          schema: { type: string, description: single lexical term (quoted) }
        - name: intent
          in: query
          schema: { type: string, description: recorded for provenance only }
        - name: profile
          in: query
          schema: { type: string, description: retrieval profile hint (passthrough) }
        - name: explain
          in: query
          schema: { type: boolean, description: return query_plan + telemetry (redacts content) }
        - name: graph
          in: query
          schema: { type: boolean, description: "v1.11.0 Associate: enable the graph-PPR retriever as a third RRF leg (opt-in)." }
      responses:
        "200":
          description: Ranked results (or explain block when explain=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
                  query_plan:
                    $ref: "#/components/schemas/QueryPlan"
                  telemetry:
                    $ref: "#/components/schemas/SearchTelemetry"
        "422":
          description: Unknown `source` value (v1.13.3). Body lists valid values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, default: false }
                  error: { type: string }
  /v1/embeddings:
    post:
      summary: OpenAI-style embeddings
      operationId: embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  oneOf:
                    - { type: string }
                    - type: array
                      items: { type: string }
                model: { type: string }
      responses:
        "200":
          description: Embeddings
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object: { type: string }
                        embedding: { type: array, items: { type: number } }
                        index: { type: integer }
                  model: { type: string }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      total_tokens: { type: integer }
  /ingest/markdown:
    post:
      summary: Ingest a markdown document (requires title)
      operationId: ingestMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                title: { type: string, nullable: true }
                source_path: { type: string, nullable: true, description: "Absolute file path for vault dedup/replace" }
                domain: { type: string, nullable: true, description: "Target domain (defaults to 'global' or YAML frontmatter domain:)" }
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: integer }
  /graph/entity/{name}:
    get:
      summary: Get an entity and its relations
      operationId: getEntity
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: >-
            v1.20.18: max edges to return (default 500, clamped 1..=500). Bounded
            output keeps the operator-facing Graph surface finite on mega-hubs.
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Entity graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  type: { type: string }
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        to_entity: { type: string }
                        relation_type: { type: string }
                        direction: { type: string }
                  error: { type: string }
  /graph/relations:
    get:
      summary: Relations for an entity (from or to)
      operationId: getRelations
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: >-
            v1.20.18: max relations to return (default 500, clamped 1..=500).
            Bounded output keeps the Graph surface finite on mega-hubs.
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Relations
          content:
            application/json:
              schema:
                type: object
                properties:
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        entity: { type: string }
                        relation: { type: string }
                        direction: { type: string }
  /graph/traverse:
    get:
      summary: Traverse the knowledge graph from an entity
      operationId: traverseGraph
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string }
          description: "Start entity. Aliases: name, entity (mirrors the response field)."
        - name: max_depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 4 }
          description: "Max traversal hops (v1.4.0: hard-capped at 4 per the bounded-walk rule)"
        - name: cross_domain
          in: query
          schema: { type: boolean, default: false }
          description: "v1.0.0 M3: walk edges across every known domain pool"
        - name: at
          in: query
          schema: { type: string }
          description: "v1.4.0 Calibrate M1: bi-temporal point-in-time traversal (RFC3339 or YYYY-MM-DD). Edges whose valid-interval [valid_at, invalid_at) does not contain this instant are skipped (Graphiti semantics)."
        - name: kind
          in: query
          schema: { type: string }
          description: >
            v1.7.0 Explain: restrict the walk to edges whose relation_type
            matches. Exact match (e.g. `kind=works_at`) or prefix match when
            ending with `:` (e.g. `kind=causes:` for the causal subgraph).
            Opt-in filter — does not claim causality. Empty/absent walks all.
        - name: explain
          in: query
          schema: { type: boolean, default: false }
          description: >
            v1.7.0 Explain: when true, response includes a `paths` array with
            structured per-hop explanations ({from, relation, to}) suitable
            for rendering as "A --works_at--> B --ceo_of--> C". The flat
            `traversal` array stays for back-compat.
      responses:
        "200":
          description: Traversal
          content:
            application/json:
              schema:
                type: object
                properties:
                  traversal:
                    type: array
                    items:
                      type: object
                      properties:
                        entity: { type: string }
                        depth: { type: integer }
                        path: { type: string }
                        edge_path: { type: string, description: "v1.7.0: pipe-separated relation_types parallel to `path`" }
                        from_entity: { type: string, nullable: true, description: "v1.7.0: seed entity name" }
                        domain: { type: string }
                  paths:
                    type: array
                    description: "v1.7.0: present only when `explain=true`. Structured hop chains."
                    items:
                      type: object
                      properties:
                        hops:
                          type: array
                          items:
                            type: object
                            properties:
                              from:
                                type: object
                                properties:
                                  id: { type: string }
                                  name: { type: string }
                              relation: { type: string }
                              to:
                                type: object
                                properties:
                                  id: { type: string }
                                  name: { type: string }
                        depth: { type: integer }
                        domain: { type: string }
                  visited: { type: integer }
  /get/{id}:
    get:
      summary: Fetch a single chunk by id (stable reference)
      operationId: getChunk
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The chunk with provenance span + source link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chunk"
        "404":
          description: Chunk not found
  /multi-get:
    post:
      summary: Fetch multiple chunks by id (bounded)
      operationId: multiGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  maxItems: 1000
      responses:
        "200":
          description: Array of chunks (missing ids omitted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chunk"
  /sources/reconcile:
    post:
      summary: Retire active sources whose live URI is no longer present
      operationId: reconcileSources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, live_uris]
              properties:
                kind: { type: string, description: e.g. "vault" }
                live_uris:
                  type: array
                  items: { type: string }
                  maxItems: 50000
      responses:
        "200":
          description: Reconcile result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_sources: { type: integer }
                  deleted_chunks: { type: integer }
                  orphan_uris:
                    type: array
                    items: { type: string }
  /sources/{id}:
    delete:
      summary: Retire a single source by id
      operationId: deleteSource
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Source retired
        "404":
          description: No such source
  /connectors:
    get:
      summary: List registered connector instances
      operationId: listConnectors
      responses:
        "200":
          description: Connector list (ordered by kind, then instance)
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectorRow'
  /webhooks/{kind}:
    post:
      summary: Verified webhook receiver (v0.9.7 Guard)
      operationId: receiveWebhook
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Connector kind, e.g. 'github'.
      responses:
        "200":
          description: Webhook accepted/enqueued (or duplicate)
        "401":
          description: Signature verification failed
  /consolidate/propose:
    post:
      summary: Propose consolidation candidates (v0.9.8 Evidence; v1.6.0 unresolved-contradictions)
      operationId: proposeConsolidate
      description: >-
        Pure detection — finds exact-duplicate chunks, subject conflicts, and
        (v1.6.0) unresolved `contradicts` links. Never mutates rows. Review
        the returned candidates, then apply chosen links via
        POST /consolidate/apply. v1.6.0: `apply` with kind=`supersedes` now
        atomically expires the prior chunk (sets valid_to=now).
      responses:
        "200":
          description: Consolidation proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateProposal'
  /consolidate/apply:
    post:
      summary: Record operator-chosen evidence links (v0.9.8; v1.6.0 supersedes expires)
      operationId: applyConsolidate
      description: >-
        Records typed links. v1.6.0: a link with kind=`supersedes` now expires
        the prior (to_chunk) fact atomically — sets valid_to=now so default
        /recall excludes it while ?at=<past> still returns it. Other kinds
        (contradicts/supports/references/derived_from) just record the link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        "200":
          description: Links recorded (rejected links reported, non-fatal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
  /consolidate/undo:
    post:
      summary: Reverse prior supersession resolutions (v1.8.0 Maintain)
      operationId: undoConsolidate
      description: >-
        v1.8.0 roadmap exit criterion: "reject or undo them without retrieval
        regression." For each `old_chunk`, clears `valid_to` back to NULL +
        removes the `supersedes` evidence_link, restoring the chunk to current
        recall. Audited. Idempotent (no-op if nothing to undo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_chunks]
              properties:
                old_chunks:
                  type: array
                  items: { type: integer }
                  description: Chunk ids previously expired via supersedes.
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                type: object
                properties:
                  undone: { type: integer, description: "State changes applied (0 if nothing to undo)" }
                  rejected:
                    type: array
                    items: { type: string }
  /audit:
    get:
      summary: Operator audit-log diagnostics (v0.9.7 Guard; v1.1.0 tenant filter)
      operationId: listAudit
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: Filter by audit kind (auth|ingest|webhook|reconcile|backup|connector)
        - name: tenant
          in: query
          required: false
          schema:
            type: string
          description: v1.1.0 — scope rows to a tenant at the SQL layer (default returns all tenants)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max events to return (default 100, capped at MAX_MULTI_GET)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: v1.16.7 — pagination cursor (rows are newest-first; offset past the last row returns []). Pair with limit for Load-more paging.
      responses:
        "200":
          description: Recent audit events (hashes only; no raw secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRow'
  /audit/verify:
    get:
      summary: Verify the audit hash chain (v1.1.0 Harden)
      operationId: verifyAuditChain
      responses:
        "200":
          description: Chain integrity result
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    description: true when every row's recomputed link matches its stored prev_hash
  /metrics:
    get:
      summary: Prometheus text-format exporter (v1.1.0 Harden M5)
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
  /quarantine:
    get:
      summary: List quarantined (flagged) chunks (v0.9.7 Guard)
      operationId: listQuarantine
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max rows to return (default 100, capped at MAX_MULTI_GET)
      responses:
        "200":
          description: Flagged chunks awaiting operator review (hashes only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  quarantined:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                          nullable: true
                        source:
                          type: string
                          nullable: true
                        content_hash:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          nullable: true
                  count:
                    type: integer
  /quarantine/{id}/release:
    post:
      summary: Release a quarantined chunk back into retrieval (v0.9.7 Guard)
      operationId: releaseQuarantine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Quarantined chunk id
      responses:
        "200":
          description: Chunk released (flag cleared)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  released:
                    type: integer
        "404":
          description: No quarantined chunk with that id
  /quarantine/{id}/delete:
    post:
      summary: Delete a quarantined chunk (v0.9.7 Guard)
      operationId: deleteQuarantine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Quarantined chunk id
      responses:
        "200":
          description: Chunk purged (knowledge row + vec0 entry removed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: integer
        "404":
          description: No quarantined chunk with that id
  /recall:
    post:
      summary: Deterministic end-to-end recall (v0.9.5 structured QueryDoc)
      operationId: recall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryDoc"
      responses:
        "200":
          description: Recall hits + unified telemetry/provenance envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecallHit"
                  decision:
                    type: string
                    enum: [ok, low_confidence]
                    default: ok
                    description: >
                      v1.5.0 "Epistemic" — calibrated abstention. `low_confidence`
                      is returned (with empty `hits`) when the quality estimator
                      classifies the query as ClarifyQuery: too weak to support a
                      claim. NOT a single-score cutoff; driven by overlap + gap +
                      lexical density signals.
                  domain: { type: string, nullable: true }
                  domains_searched:
                    type: array
                    items: { type: string }
                    description: "Domains of the returned hits. Always present (empty array when no hits); v1.13.3."
                  telemetry:
                    $ref: "#/components/schemas/SearchTelemetry"
                  trace_id:
                    type: integer
                    nullable: true
                    description: >
                      v1.15.0 "Observe" — id of the recorded read-event audit
                      row when read-event auditing is on and the trace was
                      captured (see `trace` param). Replayable via
                      `GET /recall/{trace_id}/trace`. Null when auditing is
                      off/sampled-out or `trace` was not requested.
        "422":
          description: Unknown `source` value (v1.13.3). Body lists valid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /verify:
    post:
      summary: Verify a claim against a chunk's actual text (v1.5.0)
      operationId: verifyClaim
      description: >
        Deterministic span verification (arXiv:2607.00895 baseline). Given a
        `claim` and a `chunk_id`, returns whether the claim is supported by
        the chunk's text via case-insensitive substring match. No embeddings,
        no LLM, no model load — the hallucination-resistance primitive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunk_id, claim]
              properties:
                chunk_id: { type: integer }
                claim:
                  type: string
                  description: Claim to verify. Whitespace-trimmed; max 2000 chars.
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Empty or oversized claim
        "404":
          description: No chunk with that id
  /procedure:
    post:
      summary: Ingest a procedure with ordered steps (v1.10.0 "Procedural")
      operationId: createProcedure
      description: >
        Ingests a procedure root chunk (node_kind='procedure') + each ordered
        step as its own chunk in ONE transaction. Steps are linked to the root
        via `next_step` edges carrying an explicit `step_index`. A step may
        carry a decision rule (JSON in content, node_kind='decision'). Up to
        100 steps. Embeddings are written best-effort after the commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, description: Non-empty, max 200 chars. }
                content:
                  type: string
                  description: Procedure root body (overview / when-to-use).
                steps:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [title, content]
                    properties:
                      title: { type: string }
                      content: { type: string }
                      is_decision:
                        type: boolean
                        default: false
                        description: Store this step as a decision rule (JSON in content).
                domain:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Procedure created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: Root chunk id. }
                  status: { type: string, example: created }
                  step_ids: { type: array, items: { type: integer } }
        "400": { description: Empty/oversized title, content, step, or too many steps }
        "413": { description: Content exceeds MAX_CONTENT bytes }
  /procedure/{id}/steps:
    get:
      summary: Ordered step chain for a procedure (v1.10.0)
      operationId: procedureSteps
      description: >
        Returns the root + its `next_step` children ordered by `step_index`.
        Each step exposes its `memory_kind` (step/decision, normalized via
        the forward-compat parse: unknown values fall back to fact).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ordered steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  procedure_id: { type: integer }
                  title: { type: string, nullable: true }
                  content: { type: string, nullable: true }
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/StepView"
        "404": { description: No procedure with that id }
  /classify:
    post:
      summary: Deterministic categorization (v1.10.0, Mem0's premium free)
      operationId: classify
      description: >
        Keyword-router categorization — no LLM, no cloud, fully auditable.
        Returns the winning category, confidence, the matched keywords, and
        the full taxonomy. `general` (confidence 0.0) when no keyword clears
        the threshold.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: Max MAX_CONTENT bytes. }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/CategoryResult" }
                  categories: { type: array, items: { type: string } }
        "400": { description: Empty text }
        "413": { description: Text exceeds MAX_CONTENT bytes }
  /decision/{id}/evaluate:
    post:
      summary: Evaluate a stored decision rule (v1.10.0)
      operationId: evaluateDecision
      description: >
        Loads the decision rule stored as JSON content on the `decision`-kind
        chunk `id` and evaluates it against numeric input variables. First
        matching branch wins; otherwise the rule's default_branch. Pure rule
        engine — no LLM.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: { type: number }
                  description: 'Numeric inputs, e.g. {"employee_count": 25}.'
      responses:
        "200":
          description: Evaluation outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionOutcome"
        "404": { description: No decision rule with that id }
        "400": { description: Stored content is not valid decision JSON }
  /suggest:
    post:
      summary: Opt-in anticipation pull (v1.9.0 "Suggest")
      operationId: suggest
      description: >
        Explicit, opt-in pull for related-but-not-surfaced chunks. The caller
        supplies the working `context`; the server embeds it and returns chunks
        that did not come up in a direct `/recall` (excluded via `exclude`).
        Every hit is tagged `provenance.reason = "anticipated"` so the
        consuming agent may ignore it. NOT proactive push — the agent asks.
        Gated by `BRAIN_SUGGEST_ENABLED` (returns 501 when disabled).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                context:
                  type: string
                  description: What the caller is working on right now. Max 2000 chars.
                exclude:
                  type: array
                  maxItems: 100
                  items: { type: integer }
                  description: Chunk ids already surfaced (e.g. this turn's /recall hits).
                k:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                domain:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
                session:
                  type: string
                  description: Caller-supplied opaque session label (Mem0 run_id pattern).
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/SuggestionHit" }
                  telemetry: { $ref: "#/components/schemas/SuggestTelemetry" }
        "400":
          description: Invalid context / k / exclude
        "501":
          description: BRAIN_SUGGEST_ENABLED=false — surface disabled
  /suggest/feedback:
    post:
      summary: Record accept/dismiss for a surfaced suggestion (v1.9.0)
      operationId: suggestFeedback
      description: >
        Mem0-style feedback (POSITIVE/NEGATIVE collapsed to accept/dismiss).
        Drives the false-positive metric surfaced by `GET /suggest/metrics`.
        `reason` is hashed server-side, never stored raw. The feedback table
        is the audit surface for this mutation (append-only, tenant-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunk_id, feedback]
              properties:
                chunk_id: { type: integer }
                feedback:
                  type: string
                  enum: [accept, dismiss]
                reason:
                  type: string
                  description: Optional free-text reason (hashed before storage).
                session:
                  type: string
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: recorded }
        "400":
          description: feedback must be 'accept' or 'dismiss'
        "404":
          description: No chunk with that id (refuses feedback on typos)
        "501":
          description: BRAIN_SUGGEST_ENABLED=false — surface disabled
  /suggest/metrics:
    get:
      summary: False-positive rate over the feedback ledger (v1.9.0)
      operationId: suggestMetrics
      description: >
        The v1.9 roadmap exit criterion, made queryable. Returns accept /
        dismiss counts and the false-positive rate (dismisses / total) over the
        feedback table. Optional `session` / `since` filter the window.
        Tenant-scoped: a principal sees only their own feedback rows.
      parameters:
        - in: query
          name: session
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string }
          description: ISO-8601 timestamp (RFC3339 or YYYY-MM-DD).
      responses:
        "200":
          description: Metric totals + rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestMetrics" }
        "501":
          description: BRAIN_SUGGEST_ENABLED=false — surface disabled
  /ingest/proposal:
    post:
      summary: Write-back gate — propose a candidate memory (v1.14.0 M1)
      operationId: ingestProposal
      description: >
        Human-in-the-loop write-back. A proposal stores a *candidate* memory
        scored deterministically (novelty via vec0 KNN, conflict via the
        consolidate machinery, salience via a length/entity heuristic) but
        creates NO `knowledge` row — the candidate becomes memory only when a
        human approves it (`POST /proposals/{id}/approve`). No auto-promote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 2000 }
                kind: { type: string, enum: [fact, procedure, step, decision, episodic], default: fact }
                source: { type: string }
                authority: { type: number }
                observed_at: { type: integer }
                domain: { type: string }
      responses:
        "200":
          description: Proposal queued with deterministic scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [pending] }
                  novelty: { type: number }
                  conflict_with: { type: integer }
                  salience: { type: number }
  /proposals:
    get:
      summary: List the review queue (v1.14.0 M1)
      operationId: listProposals
      description: >
        The human review queue. v1.20.23 adds `decided_at` (the decision
        timestamp, `null` while pending — the reviewer calibration signal) and
        an optional `since` window so a client can fetch a bounded 7/30-day
        decision set in one request.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: since
          schema: { type: integer }
          description: >-
            v1.20.23: unix ts lower bound on `created_at`; rows created before
            it are excluded. Absent → every row (the legacy query).
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
          description: >-
            Max rows (clamped to 200). A `since` window still stops at
            `limit`, so a stats fetch must pass `limit=200` to read a full window.
      responses:
        "200":
          description: Proposals in the queue
  /proposals/{id}/approve:
    post:
      summary: Approve a proposal — promote to memory in one tx (v1.14.0 M1)
      operationId: approveProposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: supersedes
          schema: { type: integer }
          description: Expire an existing chunk via resolve_supersession in the same tx.
      responses:
        "200":
          description: Proposal approved and promoted to a knowledge row
  /proposals/{id}/reject:
    post:
      summary: Reject a proposal — creates nothing (v1.14.0 M1)
      operationId: rejectProposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Proposal rejected
  /proposals/{id}/edit:
    post:
      summary: Edit a pending proposal's content and re-score it (v1.20.14 M1)
      operationId: editProposal
      description: >
        Rewrites a pending proposal's content, recomputes the deterministic
        novelty / conflict / salience scores, and stamps `edited_at`. The
        injection screen still runs (Reject → 400 `input_rejected`). The audit
        detail records only the SHA-256 of the before + after content. Only
        `pending` proposals may be edited (already-decided → 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The replacement content (non-empty, <= MAX_QUERY chars).
      responses:
        "200":
          description: The re-scored proposal with `edited_at` set
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  kind: { type: string }
                  content: { type: string }
                  source: { type: string, nullable: true }
                  source_prompt: { type: string, nullable: true }
                  authority: { type: number, nullable: true }
                  novelty: { type: number }
                  conflict_with: { type: integer, nullable: true }
                  salience: { type: number }
                  created_at: { type: integer }
                  screen_verdict: { type: string, enum: [clean, quarantine] }
                  edited_at: { type: integer, nullable: true }
                  decided_at:
                    type: integer
                    nullable: true
                    description: >-
                      v1.20.23: unix ts of the decision (approve/reject/expire);
                      `null` while pending. The reviewer calibration latency
                      input (`decided_at - created_at`).
                  expires_at:
                    type: integer
                    description: Unix deadline when this proposal ages out of the review window (created_at + TTL); the client ticks its countdown against this.
                  warn_secs:
                    type: integer
                    description: SLA warn band (secs of remaining life), mirroring ALERT_WARN_SECS.
                  critical_secs:
                    type: integer
                    description: SLA critical band (secs of remaining life), mirroring ALERT_CRITICAL_SECS.
        "400":
          description: Empty/too-long content, injection reject, or expired proposal
        "409":
          description: Proposal already decided by a concurrent action
  /decayed:
    get:
      summary: List decayed chunks for operator review (v1.14.0 M2)
      operationId: listDecayed
      description: >
        Chunks whose effective expiry (own `expires_at`, else the kind-level
        retention default derived from `created_at`) is in the past. Each row
        carries a `reason` (`per_chunk` or `kind_policy`) so the operator sees
        *why* a chunk is decayed. Nothing is deleted autonomously; the operator
        reviews and purges explicitly. v1.20.18: bounded by `limit`/`offset`.
      parameters:
        - name: limit
          in: query
          description: >-
            v1.20.18: max decayed rows per page (default 500, clamped 1..=500);
            `?offset=` pages the rest. Applied after the Rust-side expiry filter.
          schema: { type: integer, default: 500 }
        - name: offset
          in: query
          description: >-
            v1.20.18: rows to skip for paging (default 0).
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Decayed chunks
  /retention:
    get:
      summary: Current per-kind retention policy (v1.17.1 M2)
      operationId: retentionGet
      description: >
        The effective per-kind retention policy (code defaults merged with
        persisted overrides), the `BRAIN_RETENTION_ENABLED` kill-switch state,
        and the current per-kind chunk counts. Read-only.
      responses:
        "200":
          description: Retention policy
    post:
      summary: Override the per-kind retention policy (v1.17.1 M2)
      operationId: retentionPost
      description: >
        Upserts a persisted per-kind retention override (survives restart).
        Accepts a single `{kind, days}` pair or a `{policy: {kind: days}}` map.
        Admin + audited. Retention is applied at query time, never by a
        background sweeper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                days: { type: integer, minimum: 1, maximum: 36500 }
                policy:
                  type: object
                  additionalProperties: { type: integer }
      responses:
        "200":
          description: Policy updated
  /art30:
    get:
      summary: Art 30 records-of-processing register (v1.17.1 M5)
      operationId: art30
      description: >
        A projection of existing tables into the EU GDPR Art 30 register the
        controller must maintain: categories of data, purpose, retention,
        recipients, transfer legal bases, DSAR exercise history, and chunk
        lifecycle summary. Admin, read-only.
      responses:
        "200":
          description: The Art 30 register
  /snapshot/status:
    get:
      summary: Snapshot self-check panel (v1.17.1 M7)
      operationId: snapshotStatus
      description: >
        Inspects every `VACUUM INTO` `.bak` snapshot in the DB directory:
        exists, size, 0600 mode, `PRAGMA integrity_check`, and audit-chain
        verification of its log. Read-only — never creates or mutates a
        snapshot.
      responses:
        "200":
          description: Per-snapshot status
  /ump/capabilities:
    get:
      summary: UMP 1.0 negotiation handshake (v1.17.3 M2)
      operationId: umpCapabilities
      description: >
        Universal Memory Protocol 1.0 handshake (public — no auth). Reports
        conformance (L3 with an operator signing key configured, L2 otherwise),
        kinds, bindings, retrieval signals, max_recall, writable, audit.
      responses:
        "200":
          description: Capabilities document
  /ump/remember:
    post:
      summary: Store a memory record (v1.17.3 M2, UMP §3.3)
      operationId: umpRemember
      description: >
        Accepts a partial UMP record (`{record: …}` or a bare record). Lowered
        through the structured-ingest path. Consent: a declared `scope.owner`
        must match the authenticated principal. L3: signed records verify
        against the operator key. Returns `{id, result: created|merged|rejected}`.
      responses:
        "200":
          description: "{id, result}"
        "400":
          description: invalid_record / signature_invalid / forbidden_scope
  /ump/memory/{id}:
    get:
      summary: Read one record by id (v1.17.3 M2)
      operationId: umpGetMemory
      description: >
        Returns `{record}` with integrity re-verified on read (§5.3); rows
        whose stored integrity fails verification are treated as absent. Other
        owners' rows are §2.7-redacted for authenticated principals.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "{record}"
        "404":
          description: not_found
  /ump/recall:
    post:
      summary: Ranked recall with per-result signals (v1.17.3 M2, UMP §3.2)
      operationId: umpRecall
      description: >
        Runs the shared deterministic recall core (`run_recall` — the same
        pipeline as `/recall`) and renders §3.2 `{results:[{record, signals,
        score}]}` with the five standard signals (similarity, recency,
        salience, scope_match, provenance_depth). `filter.kind` maps UMP kinds
        to brain memory_kinds; `filter.valid_at` maps to the bi-temporal
        `at` filter. `ranking_hints` is accepted but ignored (no rank
        steering). Clamped to `max_recall`.
      responses:
        "200":
          description: "{results: [...]}"
  /ump/revise:
    post:
      summary: Patch a record (v1.17.3 M2, UMP §3.5)
      operationId: umpRevise
      description: >
        `{id, patch}` — the patch is deep-merged over the stored record
        (`id`/`integrity` are server-authoritative and never patched), lowered
        through the ingest path as a new chunk, and the old chunk is expired
        via `resolve_supersession` (default recall returns the new revision;
        `?at=<past>` still finds the old). Returns `{id, supersedes}`.
      responses:
        "200":
          description: "{id, supersedes: [old_id]}"
  /ump/forget:
    post:
      summary: Delete or soft-delete a record (v1.17.3 M2, UMP §3.4)
      operationId: umpForget
      description: >
        `{id, reason?, hard?}` — `hard:false` (default) flags the row
        (quarantine-style, still retrievable with `include_flagged`) + tombstone
        + audit; `hard:true` runs the v1.14 `purge_chunk_ids` erase path.
        Returns `{result: "tombstoned"}`.
      responses:
        "200":
          description: "{result: tombstoned}"
        "404":
          description: not_found
  /ump/feedback:
    post:
      summary: Record outcome feedback (v1.17.3 M2, UMP §3.6)
      operationId: umpFeedback
      description: >
        `{id, outcome, reason?}` with outcome in followed|overridden|ignored|
        contradicted. Mapped to the suggest-feedback last-wins upsert
        (followed → accept, rest → dismiss) with the granular outcome
        persisted in `ump_outcome`.
      responses:
        "200":
          description: "{result: recorded}"
        "400":
          description: feedback_invalid
  /ump/subscribe:
    get:
      summary: SSE change signal (v1.17.3 M2, UMP §3.8)
      operationId: umpSubscribe
      description: >
        Server-sent events over a bounded broadcast channel: a `pending`
        handshake event, then `{kind, id}` events on remember/revise/forget.
        Never record bodies — the stream is a change signal, not a data
        channel. Lagged subscribers drop missed events.
      responses:
        "200":
          description: "text/event-stream"
  /ump/audit:
    post:
      summary: Reference audit facility (v1.17.3 M2, UMP §9)
      operationId: umpAudit
      description: >
        Recent hash-chained audit rows (`{kind?, limit?, offset?}`). Admin +
        tenant-scoped (same semantics as `/audit`).
      responses:
        "200":
          description: "{rows: [...], count: n}"
  /ump/audit/verify:
    get:
      summary: Fresh full-chain verification (v1.17.3 M2, UMP §9)
      operationId: umpAuditVerify
      description: >
        Authoritative full scan of the audit hash chain (unlike the TTL-cached
        `/metrics` signal). Admin.
      responses:
        "200":
          description: "{ok: bool}"
  /.well-known/ump.json:
    get:
      summary: UMP discovery document (v1.17.3 M2)
      operationId: umpDiscovery
      description: >
        Public discovery document — same payload as `/ump/capabilities`,
        mounted with the other well-known public routes.
      responses:
        "200":
          description: Capabilities document
  /events:
    get:
      summary: Operator alert feed (v1.20.8 M1, SSE)
      operationId: alertEvents
      description: >
        Server-sent events for the operator console's live regions. A `pending`
        handshake event, then `{kind, ts, seq, payload}` signals over a bounded
        broadcast channel. Kinds are a fixed, hand-curated set — `pending` /
        `expiry` / `screen` / `chain` — and the envelope never carries content
        or PII (payloads are small signal objects; the client fetches detail
        from existing endpoints on demand). Optional `?kinds=pending,expiry`
        filters the stream. Read-gated; lagged subscribers drop missed events.
      parameters:
        - name: kinds
          in: query
          required: false
          schema: { type: string, description: "comma-separated kind filter; absent = all" }
      responses:
        "200":
          description: "text/event-stream"
  /export:
    get:
      summary: Portable JSON export for data portability (v1.14.0 M2)
      operationId: exportData
      description: >
        Live `knowledge` rows + graph + proposals ledger. v1.17.1 "Govern" M4:
        `?format=ump` re-renders the payload as UMP wire records (Universal
        Memory Protocol 1.0, github.com/edihasaj/universal-memory-protocol).
        v1.18.2 "Transparency" M1: each `knowledge` row carries `source` (ingest
        kind) + `origin` (human|model|imported), and the envelope adds
        `export_format_version: 2` + a `provenance_summary` (total / by_origin /
        by_source) for the Art 50 model-vs-human transparency bridge. v1.20.17
        "Scrub" M2: with a `redact_owner` query param that doesn't match a row's
        `owner`, that row's `content` is redacted (`[redacted]`) — a cross-owner
        export never leaks another subject's chunk body. v1.20.19 "Vault": there
        is no `pii_map` vault to resolve — PII control is deterministic output
        redaction, so raw PII is never exported.
      parameters:
        - in: query
          name: format
          description: "`ump` re-renders the payload as UMP records (one per chunk, name-based graph)"
          schema: { type: string, enum: [ump] }
        - in: query
          name: redact_owner
          description: "v1.20.17: owner label to keep; rows owned by another owner export with `content` redacted to `[redacted]`."
          schema: { type: string }
      responses:
        "200":
          description: Portable JSON export
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_format_version: { type: integer, description: "additive; 2 since v1.18.2 adds provenance_summary + per-row origin" }
                  exported_at: { type: string, format: date-time }
                  knowledge:
                    type: array
                    items:
                      type: object
                      description: "A knowledge row; v1 fields unchanged. Adds `origin` (human|model|imported)."
                  provenance_summary:
                    type: object
                    description: "Art 50 model-vs-human origin counts across all exported rows"
                    properties:
                      total: { type: integer }
                      by_origin:
                        type: object
                        description: "counts keyed by human|model|imported"
                      by_source:
                        type: object
                        description: "counts keyed by ingest kind"
                  entities: { type: array }
                  relationships: { type: array }
                  proposals: { type: array }
  /purge:
    post:
      summary: Hard, explicit, audited deletion across all tables (v1.14.0 M2)
      operationId: purge
      description: >
        Removes a chunk from knowledge + vec_knowledge + relationships +
        proposals references in one transaction and leaves a tombstone. Accepts
        `ids` or an `owner` (principal subject) anchor. Nothing is deleted
        autonomously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer } }
                owner: { type: string }
      responses:
        "200":
          description: Number of chunks purged
  /recall/{trace_id}/trace:
    get:
      summary: Replay a recorded recall decision path (v1.15.0 M2)
      operationId: getRecallTrace
      description: >
        Replays the stored trace JSON captured when a recall read event was
        recorded with `trace: true`: the exact query, abstention decision,
        domains searched, applied access-scope filter, actor, and per-hit
        injection details. v1.20.17 "Scrub" M3: the stored `query_hash` field
        holds the structured-query fingerprint (xxh3) — never raw query text.
        Pure read; no audit row of its own. 404 when the id has no
        trace (event recorded without trace, or none at all).
      parameters:
        - in: path
          name: trace_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The stored trace JSON
        "404":
          description: No trace for this id
  /dsar:
    post:
      summary: GDPR Art 15/17 DSAR workflow (v1.15.0 M3)
      operationId: postDsar
      description: >
        Locate every record for a subject (content rows by `owner` plus
        transitive `derived_from` descendants), export the bundle (portable
        JSON), purge (hard, one transaction, reaching vec0 + graph +
        pointers), and return a chain-verifiable deletion certificate. One
        atomic workflow; `action` = export | purge | both. Admin-only:
        erasure is irreversible. Nothing runs autonomously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: Owner/principal being actioned (max 2000 chars).
                action:
                  type: string
                  enum: [export, purge, both]
                  default: both
                dry_run:
                  type: boolean
                  default: false
                  description: >
                    v1.20.21 — set true to preview the would-be deletion
                    footprint (locate + bundle build) without executing any
                    write: no purge, no sweep, no ledger row, no certificate.
                    The 200 carries `footprint` instead of `certificate`.
      responses:
        "200":
          description: Workflow row id + deletion certificate (or footprint when dry-run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  subject: { type: string }
                  status: { type: string, enum: [completed, preview] }
                  created_at:
                    type: integer
                    description: >
                      v1.20.22 — ledger `created_at` (unix ts). 0 on a dry-run
                      preview (no ledger row). The client clock's origin.
                  deadline:
                    type: integer
                    description: >
                      v1.20.22 — computed Art 17 erasure deadline
                      (`created_at + window`, unix ts); 0 on a dry-run. The
                      subject-countdown source of truth.
                  certificate:
                    type: object
                    description: >
                      subject, action, found_count, purged_ids,
                      tombstone_root, certified_at, chain_head. Absent for a
                      dry-run (nothing was deleted).
                  footprint:
                    $ref: "#/components/schemas/Footprint"
                    description: >
                      v1.20.21 — present only on a dry-run. The would-be
                      deletion footprint.
        "422":
          description: Empty/overlong subject or invalid action
    get:
      summary: DSAR ledger list (v1.20.22 M1.2)
      operationId: listDsar
      description: >
        Bounded, newest-first page of `dsar_requests` rows for the operator:
        `{requests: [{id, subject, action, status, created_at, completed_at}],
        total}`. Admin-only — the subject is the operator's operand. The client
        derives each open row's Art 17 deadline from `created_at`.
      parameters:
        - in: query
          name: limit
          description: Max rows (default 100, clamped 1..1000).
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: DsarLedger — the requests page + total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsarLedger"
  /tombstones:
    get:
      summary: Queryable deletion registry (v1.15.0 M3)
      operationId: listTombstones
      description: >
        Hash-only, append-only tombstone rows (the EDPB Coordinated
        Enforcement Framework ask). `?subject=` filters by the
        `owner:<subject>` purge reason; `?since=` filters by purged_at.
        Admin-only.
      parameters:
        - in: query
          name: subject
          schema: { type: string }
        - in: query
          name: since
          schema: { type: integer }
      responses:
        "200":
          description: Tombstone rows (bounded at 1000)
  /dsar/{id}/certificate:
    get:
      summary: Re-fetch a deletion certificate (v1.15.0 M3)
      operationId: getDsarCertificate
      description: >
        Returns the stored certificate plus a live `chain_verifies` flag
        computed by re-running the audit hash-chain verification, so the
        caller sees whether the chain the certificate anchored to still
        holds. 404 when the id has no DSAR row.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Certificate + live chain verification
        "404":
          description: No DSAR request with this id
  /ingest:
    post:
      summary: Structured ingest (v1.0 primary path)
      operationId: ingest
      description: >
        Ingest a memory with optional entities/relations into the resolved
        domain's knowledge graph. Server trusts the caller's graph data after
        validation; entities/relations are upserted idempotently. Centroid is
        recomputed after each successful ingest. v1.17.1 "Govern" M4:
        `?format=ump` accepts a UMP envelope (`{"ump":"1.0","records":[…]}`,
        one record per call) lowered into this same path.
      parameters:
        - in: query
          name: format
          description: "`ump` accepts a UMP envelope body (one record per call)"
          schema: { type: string, enum: [ump] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 500 }
                content: { type: string, maxLength: 1000000 }
                domain:
                  type: string
                  description: Target domain (defaults to 'global').
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
                entities:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      name: { type: string, maxLength: 100 }
                      type: { type: string, maxLength: 64 }
                    required: [name]
                relations:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      from: { type: string, maxLength: 100 }
                      to: { type: string, maxLength: 100 }
                      type:
                        type: string
                        maxLength: 64
                        pattern: "^[a-z0-9_]{1,64}$"
                    required: [from, to, type]
              required: [title, content]
      responses:
        "200":
          description: Ingest result (created or duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [created, duplicate] }
                  domain: { type: string }
                  entities_added: { type: integer }
                  relations_added: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "507": { $ref: "#/components/responses/CapacityExceeded" }
  /memory/{id}:
    delete:
      summary: Forget / delete a memory (contract stub)
      operationId: forget
      x-status: unverified
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Unverified response shape
  /domains:
    get:
      summary: List domains with per-domain counts
      operationId: listDomains
      responses:
        "200":
          description: Domains and their stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        entries: { type: integer }
                        entities: { type: integer }
                        relations: { type: integer }
                        multi_db: { type: boolean }
    post:
      summary: Create or warm a domain
      operationId: createDomain
      description: >
        Idempotent. Returns 201 if the domain was newly created (file opened +
        migration run), 200 if it already existed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
              required: [name]
      responses:
        "200":
          description: Domain already existed
        "201":
          description: Domain created
        "400": { $ref: "#/components/responses/BadRequest" }
  /domains/{name}:
    delete:
      summary: Delete a domain and all its data
      operationId: deleteDomain
      description: >
        The `global` domain is protected. The caller MUST echo the domain name
        as `?confirm=<name>` so a typoed URL or replay cannot destroy data.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: confirm
          in: query
          required: true
          schema: { type: string }
          description: Must equal `{name}`.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
  /domains/{name}/vacuum:
    post:
      summary: Reclaim free pages in the domain's DB
      operationId: vacuumDomain
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vacuumed
  /domains/{name}/export:
    get:
      summary: Stream a consistent snapshot of the domain's .db file
      operationId: exportDomain
      description: >
        Uses SQLite `VACUUM INTO` for a consistent snapshot — safe under
        concurrent writes. Returns `application/octet-stream` with a
        `Content-Disposition: attachment` header.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The .db snapshot
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /domains/{name}/import:
    post:
      summary: Restore a previously-exported .db snapshot into a NEW domain
      operationId: importDomain
      description: >
        Body is the raw bytes of a brain-<domain>.db. Target domain must NOT
        already exist on disk (no overwrite of live data). `global` is
        protected. Bytes are written via temp file + atomic rename.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  imported: { type: boolean }
                  bytes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /profiles:
    get:
      summary: List profiles (v1.21.0 Profiles)
      operationId: listProfiles
      description: >
        Every profile: the 12 ship-with presets (seeded at migration, editable)
        plus operator-created clones. Read-gated. Consumed by the onboarding
        wizard and `brain setup`.
      responses:
        "200":
          description: The profile list, name-ordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
  /profiles/{name}:
    get:
      summary: Get one profile
      operationId: getProfile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create or edit a profile (Admin, audited)
      operationId: upsertProfile
      description: >
        The path is the name (a body `name` field is ignored). Absent fields
        mean "don't set that knob". Editing a seeded preset overwrites it;
        operator edits survive re-migrations (INSERT OR IGNORE seeding).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpsert" }
      responses:
        "200":
          description: The stored profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /domains/{name}/profile:
    get:
      summary: The domain's bound profile + effective knobs
      operationId: getDomainProfile
      description: >
        The Health-panel transparency view. `profile`/`knobs` are null when
        unbound (server defaults — the pre-v1.21 posture).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The binding + knobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  profile: { type: string, nullable: true }
                  knobs:
                    type: object
                    nullable: true
                    description: The profile's knob block; null when unbound.
                  effective:
                    type: object
                    properties:
                      retention_days:
                        type: object
                        nullable: true
                        additionalProperties: { type: integer }
                        description: What recall will apply for this domain (null = the server-wide policy governs).
    post:
      summary: Bind (or unbind) a domain's profile (Admin, audited)
      operationId: bindDomainProfile
      description: >
        `{"profile": "health-hipaa"}` binds; `{"profile": null}` unbinds
        (the back-compat escape hatch). Takes effect at the next request — no
        restart, no re-ingest; the profile sets defaults, existing rows are
        untouched (the row always wins).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: { type: string, nullable: true }
      responses:
        "200":
          description: The new binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  profile: { type: string, nullable: true }
                  status: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /domains/move:
    post:
      summary: Bulk-relabel chunks into a target domain (v1.13.0 Route)
      operationId: moveDomains
      description: >
        The non-re-ingest fix for the 99%-in-`global` corpus. Relabels
        `knowledge.domain` for the given ids in ONE transaction (provenance
        fields `source`/`authority`/`observed_at` are untouched), then
        recomputes the centroids of every domain touched so routing sees the
        move. `to` may not be `global` (the fallback bucket); moving rows OUT
        of `global` requires `?confirm=global` (typo-replay guard). Admin-only.
      parameters:
        - name: confirm
          in: query
          required: false
          schema: { type: string }
          description: Must equal `global` to move rows out of the fallback bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, to]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: Chunk ids to relabel (max 1000 per call).
                to: { type: string, description: Target domain (never `global`). }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  to: { type: string }
                  moved: { type: integer }
                  from_domains:
                    type: array
                    items: { type: string }
                  recomputed:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domains/recompute:
    post:
      summary: One-shot recompute of every domain's routing centroid (v1.13.0 Route)
      operationId: recomputeDomains
      description: >
        The post-migration catch-up sweep that makes auto-routing meaningful:
        recomputes every known domain's centroid from the live `vec_knowledge`
        index and deletes stale centroids for domains that emptied out. Run
        right after deploying v1.13.0 (before auto-routed ingests accumulate)
        and again after `POST /domains/move` passes. Admin-only.
      responses:
        "200":
          description: Recomputed
          content:
            application/json:
              schema:
                type: object
                properties:
                  recomputed:
                    type: array
                    description: (domain, vector count) per domain.
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items: {}
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access + refresh token pair (v1.2 AuthN)
      description: >
        Verifies the presented refresh token cryptographically, detects reuse
        (revoke_chain burns the family on reuse — OWASP pattern), rotates the
        chain, returns a fresh access (≤15 min) + refresh (≤24h) token pair.
        PUBLIC route — the refresh token is the credential. Returns 404
        `jwt_unavailable` when the server is in opaque-token mode.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Fresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Refresh token invalid / expired / wrong type
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: invalid_claim }
                  error: { type: string }
        "403":
          description: Refresh-chain reuse detected; the chain has been revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: refresh_reuse_detected }
                  error: { type: string }
  /auth/logout:
    post:
      summary: Revoke the request's access token (v1.2 AuthN)
      description: >
        Adds the request's access-token `jti` to the `(jti, iss)` denylist with
        `reason='logout'`. Reads the `Principal` injected by the JWT middleware
        on the original access-token request. Returns 204 regardless of whether
        a principal was present (no information leakage on unauthenticated calls).
      operationId: authLogout
      responses:
        "204":
          description: Logged out (or no principal present — same response)
  /auth/revoke:
    post:
      summary: Operator/admin revoke a specific token by jti (v1.2 AuthN)
      description: >
        Revokes a specific `jti` without the holder presenting it. Requires
        admin auth. Body: `{ jti, iss, reason, expires_at? }`. Used for
        incident response (suspected compromise) without waiting for natural
        expiry. Invalidates the negative-lookup cache for the revoked `(jti, iss)`.
      operationId: authRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "204":
          description: Revoked
        "401":
          description: Not authenticated
        "403":
          description: Not admin-scoped
  /.well-known/openid-configuration:
    get:
      summary: OIDC Discovery metadata (RFC 8414) (v1.2 AuthN)
      description: >
        PUBLIC route. Returns the OIDC Discovery metadata. `issuer` + `jwks_uri`
        are derived from `BRAIN_PUBLIC_BASE_URL` (never from the Host header —
        OWASP A02:2025). When JWT is not configured, returns an empty placeholder
        so probing clients get a clear "not configured" signal instead of a 404.
      operationId: getOidcConfig
      responses:
        "200":
          description: OIDC Discovery metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcConfig"
  /.well-known/jwks.json:
    get:
      summary: JWK Set (RFC 7517) for key distribution (v1.2 AuthN)
      description: >
        PUBLIC route. Returns the current signing key set as a JWK Set.
        Served with `Cache-Control: public, max-age=3600`; rotation keeps the
        old key live > cache TTL so a stale client cache can't break
        verification. Returns 500 `jwks_unavailable` when no RSA signing keys
        are configured (EC/Ed JWK emission is a v1.3 follow-up).
      operationId: getJwks
      responses:
        "200":
          description: JWK Set
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/jwk-set+json:
              schema:
                $ref: "#/components/schemas/JwkSet"
        "500":
          description: No RSA signing keys configured for JWKS emission
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: jwks_unavailable }
                  error: { type: string }
  /.well-known/security.txt:
    get:
      summary: security.txt (RFC 9116) disclosure endpoint (v1.13.6 Hygiene)
      description: >
        PUBLIC route. Machine-readable vulnerability disclosure: Contact,
        Expires, Preferred-Languages, and Canonical (when BRAIN_PUBLIC_BASE_URL
        is set). Contact is set via BRAIN_SECURITY_CONTACT and omitted when
        unset. Expires is now + 1 year (never stale).
      operationId: getSecurityTxt
      responses:
        "200":
          description: RFC 9116 security.txt
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            text/plain:
              schema:
                type: string
                example: |
                  Expires: 2027-08-07T00:00:00+00:00
                  Preferred-Languages: en
  /.well-known/ai-notice:
    get:
      summary: AI Act Art 50 transparency notice
      description: >
        PUBLIC route. Machine-readable disclosure that this service stores,
        retrieves, and may return AI-generated or AI-processed content, so
        consumers can mark output accordingly (EU AI Act Article 50, effective
        2026-08-02).
      operationId: getAiNotice
      responses:
        "200":
          description: Art 50 transparency notice (JSON)
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/json:
              schema:
                type: object
                example:
                  schema_version: "1.0"
                  service: brain-server
                  art_50: true
  /.well-known/ai-literacy:
    get:
      summary: AI Act Art 4 AI-literacy disclosure
      description: >
        PUBLIC route. Machine-readable pointer to the operator's AI-literacy
        playbook (docs/AI_LITERACY.md) and the inspectable controls that make
        the component's decisions reviewable — the operational substance of
        the deployer's Art 4 literacy obligation (EU AI Act Article 4).
      operationId: getAiLiteracy
      responses:
        "200":
          description: Art 4 AI-literacy disclosure (JSON)
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/json:
              schema:
                type: object
                example:
                  schema_version: "1.0"
                  service: brain-server
                  art_4: true
  /.well-known/cop-notice:
    get:
      summary: EU AI Act Code of Practice conformity marker (v1.17.1 M6)
      description: >
        PUBLIC route. Machine-readable self-attested conformity state the
        client's CoP icon lane renders: covered commitments, self-assessment
        link, last-review timestamp. Declarative only — asserts posture, not
        certification (a certification badge is the v2.x external gate).
      operationId: getCopNotice
      responses:
        "200":
          description: CoP conformity marker (JSON)
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/json:
              schema:
                type: object
                example:
                  schema_version: "1.0"
                  service: brain-server
                  cop: true
                  status: self_attested
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token authentication. Accepted credentials: a JWT signed by a
        `BRAIN_JWT_KEY_DIR` key, or the static bearer token from
        `BRAIN_TOKEN_FILE`/`BRAIN_TOKEN`. Authz is scope-based
        (`<action>:<team>/<domain>`; see the `Scope` schema); the per-route role
        matrix (public / read / write / admin) lives in src/main.rs
        (the authz-guard table) and API_CONTRACT.md. Most routes require auth;
        the exempt public set is /health, /ready, /version, /openapi.yaml,
        /.well-known/*, /ump/capabilities and the /auth refresh/logout surface.
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    CapacityExceeded:
      description: Capacity envelope exceeded; new writes refused (HTTP 507)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PayloadTooLarge:
      description: Body exceeded the size cap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: The named resource (profile, domain, chunk…) does not exist
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    Profile:
      type: object
      description: >
        v1.21.0 — a typed bundle of existing knob defaults bound to a domain.
        Absent fields mean "this profile does not touch that knob". The
        profile sets defaults; an explicit row value always wins.
      properties:
        name: { type: string }
        description: { type: string, description: Display-only one-liner for the wizard/Health panel. }
        default_access_scope:
          type: string
          enum: [private, domain, team]
        pii_mode:
          type: string
          enum: [off, standard, strict]
          description: strict = write-time one-way masking (email/phone/card placeholders stored; no vault, no recovery).
        retention:
          type: object
          description: Per-memory_kind days; JSON null for a kind = no decay. The map REPLACES the server-wide policy for the bound domain; absent = server-wide policy applies.
          additionalProperties:
            type: integer
            nullable: true
        audit_level:
          type: string
          enum: [minimal, standard, verbose]
          description: Drives /recall read-event auditing when BRAIN_AUDIT_READ_EVENTS is unset.
        kinds: { type: array, items: { type: string }, description: Allowed memory_kind vocabulary; an out-of-vocabulary ingest is 422. }
        connectors_allowed: { type: array, items: { type: string }, description: Stored + surfaced only in v1.21 (enforcement lands with the v1.24 connector work). }
        legal_hold_default: { type: boolean, description: Stored flag; enforcement is v1.22.0 "Regulated". }
    ProfileUpsert:
      type: object
      description: POST /profiles/{name} body — a Profile minus the name (the path is the name).
      properties:
        description: { type: string }
        default_access_scope: { type: string, enum: [private, domain, team] }
        pii_mode: { type: string, enum: [off, standard, strict] }
        retention:
          type: object
          additionalProperties:
            type: integer
            nullable: true
        audit_level: { type: string, enum: [minimal, standard, verbose] }
        kinds: { type: array, items: { type: string } }
        connectors_allowed: { type: array, items: { type: string } }
        legal_hold_default: { type: boolean }
    Footprint:
      type: object
      description: >
        v1.20.21 — the would-be DSAR deletion footprint. A `POST /dsar` with
        `dry_run: true` returns this instead of a certificate: what a live
        purge would locate + export + delete, without executing any write.
      properties:
        roots: { type: integer, description: owner rows located }
        derived: { type: integer, description: transitive derived_from descendants }
        export_rows: { type: integer, description: knowledge rows in the export bundle }
        tombstones: { type: integer, description: prior deletions for this subject (ledger trace) }
        dsar_rows: { type: integer, description: prior DSAR ledger rows for this subject }
        dry_run: { type: boolean, default: true }
    DsarLedger:
      type: object
      description: >
        v1.20.22 — the `GET /dsar` ledger page: the bounded, newest-first
        request rows + the total count.
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/DsarLedgerRow" }
        total: { type: integer, description: total dsar_requests rows }
    DsarLedgerRow:
      type: object
      description: >
        v1.20.22 — one DSAR request. `created_at` keys the computed Art 17
        deadline (the client countdown source of truth).
      properties:
        id: { type: integer }
        subject: { type: string }
        action: { type: string }
        status: { type: string }
        created_at:
          type: integer
          nullable: true
          description: unix ts when the request was created.
        deadline:
          type: integer
          nullable: true
          description: >
            server-computed Art 17 erasure deadline (created_at + window) —
            the client countdown's source of truth; the same number the POST
            response carries.
        completed_at:
          type: integer
          nullable: true
          description: unix ts when the workflow completed; null while open.
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, nullable: true }
    LexSpec:
      type: object
      description: >
        Structured lexical controls, compiled server-side into a single
        FTS5-quoted MATCH expression (injection-safe). All fields optional;
        empty = fall back to the bare query.
      properties:
        terms:
          type: array
          items: { type: string }
          description: Implicit-AND terms.
        phrases:
          type: array
          items: { type: string }
          description: Quoted phrase matches (ordered token runs).
        exclude:
          type: array
          items: { type: string }
          description: Exclusions, prefixed with FTS5 NOT (-).
        code:
          type: array
          items: { type: string }
          description: Exact identifier / code path, matched verbatim.
    QueryDoc:
      type: object
      description: v0.9.5 structured query document. `v` must be 1 (unknown versions are rejected).
      properties:
        v: { type: integer, default: 1, description: schema version }
        q: { type: string, description: plain-text fallback query }
        query: { type: string, description: recall query (POST /recall) }
        lex: { $ref: "#/components/schemas/LexSpec" }
        vec: { type: string, description: explicit embedding query (overrides q) }
        hyde: { type: string, description: hypothetical answer (overrides vec) }
        intent: { type: string, description: recorded for provenance/telemetry only }
        sources:
          type: array
          items: { type: string }
          description: "OR filter over ingest kind: memory | markdown | structured | manual | vault (filters the source column, NOT source URIs)."
        source:
          type: string
          enum: [memory, markdown, structured, manual, vault, vector, fts, graph, both]
          description: "v1.13.3: ingest kind (SQL filter), retrieval leg (post-fusion filter), or both (unrestricted). Unknown values are rejected with 422."
        since: { type: string, description: ISO-8601 / YYYY-MM-DD HH:MM:SS lower bound }
        domain: { type: string, description: domain isolation label }
        k: { type: integer, description: result count (GET /search) }
        limit: { type: integer, description: result count (POST /recall) }
        profile: { type: string, description: retrieval profile hint (passthrough) }
        explain: { type: boolean, description: "GET /search query_plan toggle" }
        provenance: { type: boolean, description: "POST /recall telemetry/provenance toggle (alias: explain)" }
        include_flagged: { type: boolean, description: "v0.9.7 Guard: include quarantined chunks" }
        as_of: { type: string, nullable: true, description: "v0.9.8 Evidence: point-in-time recall (RFC3339)" }
        evidence: { type: boolean, description: "v0.9.8 Evidence: include structured Evidence on every hit" }
        at: { type: string, nullable: true, description: "v1.4.0 Calibrate M1: bi-temporal valid-time filter (RFC3339 or YYYY-MM-DD). Only chunks whose valid-interval contains this instant are returned. Distinct from as_of (transaction-time recall)." }
        max_context_tokens: { type: integer, nullable: true, description: "v1.4.0 Calibrate M2: submodular evidence packing token budget. When set, results are re-ranked by budgeted monotone submodular maximization (relevance+coverage+representativeness+diversity) and truncated to fit." }
        gold_answer: { type: string, nullable: true, description: "v1.4.0 Calibrate M2: optional gold-answer substring for the answer_in_context diagnostic (did the gold survive packing?)." }
        graph: { type: boolean, description: "v1.11.0 Associate: enable the graph-PPR retriever as a third RRF leg behind vector+FTS. Opt-in; default false keeps the two-retriever path unchanged. Deterministic, zero-token, no embeddings." }
    Evidence:
      type: object
      description: >-
        Faithful, bounded evidence for a hit (verbatim snippet + span + source
        link). v0.9.8 adds time semantics, lifecycle, and typed links.
      properties:
        text: { type: string, description: verbatim substring of content }
        line_start: { type: integer, nullable: true }
        line_end: { type: integer, nullable: true }
        heading_path: { type: string, nullable: true }
        source_uri: { type: string, nullable: true }
        revision_id: { type: integer, nullable: true }
        valid_from: { type: string, nullable: true, description: when the fact became true (RFC3339) }
        valid_to: { type: string, nullable: true, description: when the fact ceased to be true; null = current }
        observed_at: { type: string, nullable: true, description: when brain-server learned the fact (RFC3339) }
        authority: { type: number, nullable: true, description: "source-authority tie-breaker (0..1)" }
        lifecycle:
          type: string
          nullable: true
          enum: [current, historical, superseded]
          description: current vs historical vs superseded; omitted when current
        links:
          type: array
          items:
            type: object
            properties:
              to_chunk: { type: integer }
              kind: { type: string, enum: [supports, supersedes, contradicts, references, derived_from] }
        highlights:
          type: array
          items:
            type: array
            items: { type: integer }
            description: "[start,end) byte offsets within `text`"
    SearchResult:
      type: object
      properties:
        id: { type: integer }
        similarity: { type: number, description: cosine similarity score }
        title: { type: string, nullable: true }
        content: { type: string }
        source:
          type: string
          enum: [vector, fts, both]
          nullable: true
        snippet: { type: string, description: bounded verbatim preview }
        source_uri: { type: string, nullable: true }
        revision_id: { type: integer, nullable: true }
        evidence:
          $ref: "#/components/schemas/Evidence"
        provenance:
          type: object
          nullable: true
          properties:
            vector_rank: { type: integer, nullable: true }
            fts_rank: { type: integer, nullable: true }
            graph_rank: { type: integer, nullable: true, description: "v1.11.0 Associate: rank assigned by the graph-PPR retriever (0 = best); null when the graph leg didn't retrieve the document." }
            fused_score: { type: number, nullable: true }
            rerank_score: { type: number, nullable: true }
            rerank_truncated: { type: boolean }
            prf_expanded: { type: boolean }
    RecallHit:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        snippet: { type: string, description: bounded verbatim preview }
        score: { type: number }
        domain: { type: string, nullable: true }
        source:
          type: string
          enum: [vector, fts, both, graph]
          nullable: true
        evidence:
          $ref: "#/components/schemas/Evidence"
        conflict:
          type: boolean
          nullable: true
          description: "v0.9.8: true when this chunk has a contradicts/supersedes link to a current chunk"
        provenance:
          type: object
          nullable: true
          properties:
            vector_rank: { type: integer, nullable: true }
            fts_rank: { type: integer, nullable: true }
            graph_rank: { type: integer, nullable: true, description: "v1.11.0 Associate: rank assigned by the graph-PPR retriever (0 = best); null when the graph leg didn't retrieve the document." }
            fused_score: { type: number, nullable: true }
            rerank_score: { type: number, nullable: true }
            rerank_truncated: { type: boolean }
            prf_expanded: { type: boolean }
    Chunk:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        source: { type: string, nullable: true }
        document_id: { type: string, nullable: true }
        chunk_index: { type: integer, nullable: true }
        heading_path: { type: string, nullable: true }
        line_start: { type: integer, nullable: true }
        line_end: { type: integer, nullable: true }
        created_at: { type: string, nullable: true }
        source_uri: { type: string, nullable: true }
        revision_id: { type: integer, nullable: true }
    VerifyResponse:
      type: object
      description: >
        Result of `/verify` (v1.5.0). `supported` is true when at least one
        case-insensitive occurrence of the claim was found in the chunk text.
      properties:
        chunk_id: { type: integer }
        supported: { type: boolean }
        decision:
          type: string
          enum: [supported, unsupported_claim]
        match_ranges:
          type: array
          description: >
            `[start, end)` byte offsets within chunk `content`. Capped at 100;
            further matches are not reported but do not change `supported`.
            items:
              type: array
              items: { type: integer }
              minItems: 2
              maxItems: 2
    StepView:
      type: object
      description: One ordered step of a procedure (`GET /procedure/{id}/steps`).
      properties:
        step_index: { type: integer }
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        memory_kind:
          type: string
          enum: [fact, procedure, step, decision]
          description: >
            Normalized node_kind of the step chunk. Unknown stored values fall
            back to `fact` (forward-compat parse).
    CategoryResult:
      type: object
      description: Deterministic classification result from `POST /classify`.
      properties:
        category:
          type: string
          enum: [technology, business_process, compliance, finance, vendor, assessment, infrastructure, general]
        confidence: { type: number, format: float, description: "In [0.0, 1.0]." }
        matched_keywords: { type: array, items: { type: string } }
    DecisionOutcome:
      type: object
      description: Result of evaluating a decision rule (`POST /decision/{id}/evaluate`).
      properties:
        result: { type: string }
        matched_condition: { type: string, nullable: true }
        citation: { type: integer, nullable: true, description: Chunk id justifying this branch. }
        used_default: { type: boolean }
    SuggestionHit:
      type: object
      description: >
        One anticipated chunk from `POST /suggest` (v1.9.0). The
        `provenance.reason = "anticipated"` marker tells the consuming agent
        this was NOT directly retrieved — the agent may ignore it.
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        score:
          type: number
          format: float
          description: Cosine-derived similarity in [0.0, 1.0].
        domain: { type: string, nullable: true }
        provenance:
          type: object
          properties:
            reason:
              type: string
              enum: [anticipated]
            session: { type: string, nullable: true }
    SuggestTelemetry:
      type: object
      properties:
        k: { type: integer }
        excluded: { type: integer }
        retrieved: { type: integer }
        domain: { type: string, nullable: true }
    SuggestMetrics:
      type: object
      description: >
        The false-positive rate over the `/suggest/feedback` ledger — the
        v1.9 roadmap exit criterion, made queryable.
      properties:
        total: { type: integer }
        accepts: { type: integer }
        dismisses: { type: integer }
        accept_rate:
          type: number
          format: float
          description: accepts / total (0.0 when total == 0).
        false_positive_rate:
          type: number
          format: float
          description: dismisses / total (0.0 when total == 0).
        window:
          type: object
          nullable: true
          properties:
            since: { type: string, nullable: true }
            session: { type: string, nullable: true }
    QueryPlan:
      type: object
      description: Reproducible effective query (GET /search?explain=true).
      properties:
        k: { type: integer }
        lex: { type: string, nullable: true }
        vec: { type: string, nullable: true }
        hyde: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        sources: { type: array, items: { type: string } }
        source: { type: string, nullable: true }
        domain: { type: string, nullable: true }
        since: { type: string, nullable: true }
        profile: { type: string, nullable: true }
        embedding_query: { type: string, nullable: true }
    SearchTelemetry:
      type: object
      description: Unified retrieval telemetry (POST /recall provenance=true).
      properties:
        embed_ms: { type: number }
        vector_ms: { type: number }
        fts_ms: { type: number }
        graph_ms: { type: number, description: "v1.11.0 Associate: graph-PPR retrieval latency (ms); 0 when the graph leg was disabled." }
        fusion_ms: { type: number }
        prf_ms: { type: number }
        rerank_ms: { type: number }
        vec_candidates: { type: integer }
        fts_candidates: { type: integer }
        graph_candidates: { type: integer, description: "v1.11.0 Associate: graph-PPR candidates before RRF." }
        graph_rescued: { type: boolean, description: "v1.12.0 Discern: the graph leg was auto-engaged as a complexity-gated rescue pass (estimator said ClarifyQuery, caller had not enabled graph)." }
        fused_count: { type: integer }
        rrf_k: { type: integer }
        embedding_query: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        retrieval_ms_vec: { type: number }
        retrieval_ms_fts: { type: number }
        confidence: { type: number }
        recommendation: { type: string, nullable: true }
    ConnectorRow:
      type: object
      description: A registered connector instance (v0.9.6 Bridge).
      properties:
        id: { type: integer }
        kind:
          type: string
          description: Connector kind, e.g. 'github', 'stub'. Matches the manifest `kind`.
        instance:
          type: string
          description: Disambiguator within a kind, e.g. 'markfietje/brain-server' for github.
        state:
          type: string
          enum: [registered, running, stopped, failed]
        last_sync_at: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
      required: [id, kind, instance, state]
    AuditRow:
      type: object
      description: A single audit event (v0.9.7 Guard). Contains only hashes — no raw content or secrets.
      properties:
        id: { type: integer }
        ts: { type: string }
        kind:
          type: string
          enum: [auth, ingest, webhook, reconcile, backup, connector]
        actor: { type: string }
        target_hash: { type: string, description: xxh3 of the affected uri/id }
        status:
          type: string
          enum: [ok, denied, error]
        detail_hash: { type: string, description: xxh3 of a short detail string }
        tenant_id:
          type: string
          description: v1.1.0 — tenant this row belongs to ('global' for pre-v1.1 rows)
          default: global
      required: [id, ts, kind, actor, target_hash, status, detail_hash, tenant_id]
    ConsolidateProposal:
      type: object
      description: v0.9.8 Evidence — reviewable consolidation candidates (no mutation).
      properties:
        exact_duplicates:
          type: array
          items:
            type: array
            items: { type: integer }
          description: groups of chunk ids sharing a content_hash
        conflicts:
          type: array
          items:
            type: object
            properties:
              from_chunk: { type: integer }
              to_chunk: { type: integer }
              subject: { type: string }
              age_gap_secs: { type: integer }
              authority_delta: { type: number }
              proposed: { type: string, enum: [supersedes], description: suggested resolution }
        unresolved_contradictions:
          type: array
          description: >
            v1.6.0: `contradicts` links with no paired `supersedes` resolution.
            Each entry is [from_chunk, to_chunk]. Operator-actionable: resolve
            via POST /consolidate/apply with kind=supersedes, or `brain resolve`.
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
        stale_sources:
          type: array
          description: >
            v1.8.0: vault sources whose backing file no longer exists on disk.
            Operator reviews: re-ingest if moved, or DELETE /sources/{id} to retire.
          items:
            type: object
            properties:
              source_id: { type: integer }
              uri: { type: string }
              kind: { type: string }
              chunk_count: { type: integer }
        near_duplicates:
          type: array
          description: >
            v1.8.0: near-duplicate chunk pairs (cosine > 0.95, different content
            hash). Propose supersedes; operator picks the winner via brain resolve.
          items:
            type: object
            properties:
              chunk_a: { type: integer }
              chunk_b: { type: integer }
              similarity: { type: number, description: cosine similarity }
              proposed: { type: string, enum: [supersedes] }
    ApplyRequest:
      type: object
      description: v0.9.8 Evidence — operator-chosen typed links to record.
      properties:
        links:
          type: array
          items:
            type: object
            properties:
              from_chunk: { type: integer }
              to_chunk: { type: integer }
              kind: { type: string, enum: [supports, supersedes, contradicts, references, derived_from] }
      required: [links]
    ApplyResponse:
      type: object
      properties:
        recorded: { type: integer }
        rejected: { type: array, items: { type: string } }
    RefreshRequest:
      type: object
      description: v1.2 AuthN — `POST /auth/refresh` body. The refresh token is the credential.
      properties:
        refresh_token: { type: string, description: "JWS refresh token (typ: refresh)" }
      required: [refresh_token]
    TokenPair:
      type: object
      description: v1.2 AuthN — `/auth/refresh` response. Both tokens are opaque bearer strings to the client.
      properties:
        access_token: { type: string, description: JWS access token (≤15 min exp) }
        refresh_token: { type: string, description: JWS refresh token (≤24h exp, rotated on next use) }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: access-token lifetime in seconds, example: 900 }
      required: [access_token, refresh_token, token_type, expires_in]
    RevokeRequest:
      type: object
      description: v1.2 AuthN — `POST /auth/revoke` body (operator/admin).
      properties:
        jti: { type: string, description: Token id to revoke }
        iss: { type: string, description: Issuer (jti is unique per iss only) }
        reason: { type: string, default: operator_revoked, description: "compromise | operator_revoked | rotation | custom" }
        expires_at: { type: integer, nullable: true, description: "Unix epoch; defaults to now + 15 min" }
      required: [jti, iss]
    OidcConfig:
      type: object
      description: v1.2 AuthN — OIDC Discovery metadata (RFC 8414). Empty placeholder when JWT is unconfigured.
      properties:
        issuer: { type: string, example: "https://brain.example.com/" }
        jwks_uri: { type: string, example: "https://brain.example.com/.well-known/jwks.json" }
        token_endpoint: { type: string, example: "https://brain.example.com/auth/refresh" }
        revocation_endpoint: { type: string, example: "https://brain.example.com/auth/revoke" }
        id_token_signing_alg_values_supported:
          type: array
          items: { type: string }
          example: [RS256, RS384, RS512, ES256, ES384, EdDSA]
        scopes_supported:
          type: array
          items: { type: string }
          example: [openid, read, write, admin]
        response_types_supported:
          type: array
          items: { type: string }
          example: [token]
        subject_types_supported:
          type: array
          items: { type: string }
          example: [public]
        claims_supported:
          type: array
          items: { type: string }
          example: [iss, aud, sub, jti, iat, nbf, exp, tenant, scopes]
    JwkSet:
      type: object
      description: v1.2 AuthN — RFC 7517 JWK Set served at `/.well-known/jwks.json`.
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/Jwk" }
      required: [keys]
    Jwk:
      type: object
      description: v1.2 AuthN — single JSON Web Key (RSA only in v1.2; EC/Ed emission is v1.3).
      properties:
        kty: { type: string, example: RSA }
        use: { type: string, example: sig }
        alg: { type: string, example: RS256 }
        kid: { type: string, description: Key id used in JWT `kid` header }
        n: { type: string, description: RSA modulus (base64url) }
        e: { type: string, description: RSA exponent (base64url), example: AQAB }
      required: [kty, use, alg, kid, n, e]
    Principal:
      type: object
      description: >
        v1.2 AuthN — the authenticated principal, injected into request
        extensions by the JWT middleware. `None` (absent) means opaque/no-auth
        back-compat path (= superuser). Never serialized in a response.
      properties:
        sub: { type: string, description: Subject (from JWT `sub` claim) }
        jti: { type: string, description: Token id (revocation key) }
        tenant: { type: string, description: Tenant context (from signed `tenant` claim) }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
      required: [sub, jti, tenant]
    Scope:
      type: object
      description: >
        v1.2 AuthN — authorization scope of the form `<action>:<team>/<domain>`.
        `team` and `domain` may be `*` (wildcard). Escalation: write implies
        read down, admin implies both. `read:*/*` is superuser.
      properties:
        action:
          type: string
          enum: [read, write, admin, traverse]
        team: { type: string, description: Team id or `*` }
        domain: { type: string, description: Domain id or `*` }
      required: [action, team, domain]
