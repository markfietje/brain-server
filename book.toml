[book]
title = "brain-server"
authors = ["markfietje"]
description = "Local-first semantic memory for AI agents"
language = "en"
src = "docs"

[build]
create-missing = false

[output.html]
# brain-server brand: dark-first, steel/blue accent, gold mark
default-theme = "coal"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/markfietje/brain-server"
edit-url-template = "https://github.com/markfietje/brain-server/edit/main/{path}"
additional-css = ["theme/css/steelkeep.css"]
additional-js = []
no-section-label = true

[output.html.print]
enable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 25
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = false
