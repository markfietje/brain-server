name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.20.26). Leave empty to use the pushed tag'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build (linux x86_64)
        # Full binary set: `bench`/`brain-migrate-rehearse` need `--features
        # bench,migrate`, `brain-connector-gh` needs `--features
        # connector-github` (both empty features that gate compilation).
        # brain-connector-crm likewise via `connector-crm`.
        run: |
          cargo build --release --features bench,migrate
          cargo build --release --features connector-github --bin brain-connector-gh
          cargo build --release --features connector-crm --bin brain-connector-crm
        continue-on-error: true

      - name: Build (linux aarch64 via cross)
        run: |
          cargo install cross --locked
          cross build --release --features bench,migrate --target aarch64-unknown-linux-gnu
          cross build --release --features connector-github --bin brain-connector-gh --target aarch64-unknown-linux-gnu
          cross build --release --features connector-crm --bin brain-connector-crm --target aarch64-unknown-linux-gnu
        continue-on-error: true

      - name: Generate CycloneDX SBOM
        # Reuses the local operator path (scripts/sbom.sh): a CycloneDX SBOM
        # from Cargo.lock, shipped alongside the release binaries (EU CRA /
        # OWASP A03:2025). cargo-cyclonedx is a release-time tool.
        run: |
          cargo install cargo-cyclonedx --locked
          ./scripts/sbom.sh
        continue-on-error: true

      - name: Stage artifacts
        # brain-server (the main binary) plus every operator CLI, one pairing
        # per target. Feature-gated bins present only if their feature built.
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh brain-connector-crm; do
            cp -f "target/release/$b" "dist/${b}-linux-x86_64" 2>/dev/null || true
            cp -f "target/aarch64-unknown-linux-gnu/release/$b" "dist/${b}-linux-aarch64" 2>/dev/null || true
          done
          cp -f sbom/*.cdx.json dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux
          path: dist/

  build-darwin:
    name: Build macOS binaries
    # The operator's native build target (the dev box is macOS arm64) — ships
    # the same full binary set, native arm64 + cross x86_64. Without this the
    # release is Linux-only and the local build is never published.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build (macOS arm64, native)
        run: |
          cargo build --release --features bench,migrate
          cargo build --release --features connector-github --bin brain-connector-gh
          cargo build --release --features connector-crm --bin brain-connector-crm
        continue-on-error: true

      - name: Build (macOS x86_64)
        run: |
          cargo build --release --features bench,migrate --target x86_64-apple-darwin
          cargo build --release --features connector-github --bin brain-connector-gh --target x86_64-apple-darwin
          cargo build --release --features connector-crm --bin brain-connector-crm --target x86_64-apple-darwin
        continue-on-error: true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh brain-connector-crm; do
            cp -f "target/release/$b" "dist/${b}-darwin-arm64" 2>/dev/null || true
            cp -f "target/x86_64-apple-darwin/release/$b" "dist/${b}-darwin-x86_64" 2>/dev/null || true
          done
          ls -la dist

      - name: Codesign (macOS, ad-hoc)
        # Ad-hoc signing (`codesign -s -`): a valid signature that detects
        # tampering, with NO identity, NO cert, NO Apple account, and NO private
        # key to protect — so no secrets enter the release pipeline at all. This
        # is the effectively-best option for a self-hosted, no-developer-account
        # build: a self-signed cert is untrusted by everyone anyway (Gatekeeper
        # on other Macs needs Developer ID + notarization), so the only thing it
        # bought was a key to keep secret. The toolchain also ad-hoc signs native
        # macOS binaries by default, so this is the honest baseline. (The Mac
        # will still warn on a *downloaded* file until the quarantine/provenance
        # xattr is cleared — install-service.sh already strips com.apple.provenance.)
        run: |
          set -e
          for f in dist/*-darwin-*; do
            echo "codesign (ad-hoc) -> $f"
            codesign --sign - --force "$f"
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin
          path: dist/

  docs-deploy:
    # Rebuild + redeploy the mdBook site from the TAGGED revision. docs.yml
    # only triggers on `main` path-pushes (docs/**, book.toml, theme/**), so a
    # release tag push would otherwise leave the published docs pointing at an
    # older commit — the docs must reflect the shipped binary's revision. Same
    # build+deploy shape as docs.yml, same `pages` concurrency lock, so a doc
    # deploy from a main push and from a tag cannot race.
    name: Build & deploy docs (tagged revision)
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: true
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: Install mdBook
        run: cargo install mdbook --version 0.5.4 --locked
      - name: Build
        run: mdbook build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./book
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  release:
    name: Assemble release + notes
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-linux
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist-darwin
          path: dist
          merge-multiple: true

      - name: Generate release notes from CHANGELOG
        # The published body is USER-FACING, not the engineering log. Each
        # CHANGELOG section (v1.21.0+) carries a `### Release notes` block
        # written for users — Bug fixes / Improvements / Security fixes — and
        # that block is what gets published. Internal references
        # (IMPLEMENTATION_PLAN files, USE_CASES.md, agent history) are
        # stripped before publishing. The block is MANDATORY: a release that
        # lacks it FAILS this step (no release is created) rather than shipping
        # a degraded body — forgetting to write the notes is a blocking error,
        # never a silent fallback. Written outside dist/ so it isn't uploaded
        # as an asset.
        run: |
          set -e
          if [ -n "${{ inputs.version }}" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          echo "version=${version}" >> "$GITHUB_ENV"
          # Internal plan/doc references never belong in the published notes
          # (IMPLEMENTATION_PLAN_*, IMPLEMENTATION_ROADMAP_*, USE_CASES.md,
          # agent history).
          sanitize() { awk '!/IMPLEMENTATION_|USE_CASES\.md|docs\/AGENTS/ { sub(/[ \t]*See[ \t]*$/, ""); print }'; }
          if ! awk -v ver="$version" '
                /^## \[/ { if (insec) exit; insec = ($0 ~ "^## \\[" ver "\\]"); next }
                insec && /^### Release notes/ { found=1; exit }
                END { exit found ? 0 : 1 }
              ' CHANGELOG.md; then
            echo "::error::CHANGELOG.md section '## [$version]' is missing a '### Release notes' block — refusing to publish a release without user-facing notes. Add the block, then re-tag."
            exit 1
          fi
          # The explicit user-facing block: the section heading + the
          # `### Release notes` subsection, stopping at the next
          # section/subsection heading. Skip everything above it (intro
          # prose, engineering bullets).
          awk -v ver="$version" '
            /^## \[/ { if (insec) exit; insec = ($0 ~ "^## \\[" ver "\\]"); if (insec) print; next }
            !insec { next }
            /^### Release notes/ { notes=1; print ""; print; next }
            !notes { next }
            /^### / { exit }
            { print }
          ' CHANGELOG.md | sanitize > RELEASE_BODY.md
          # Guard against an empty / bullet-free body (e.g. a `### Release
          # notes` heading with nothing under it): shipping no notes would be
          # worse than refusing. Only actual bullet lines count as content —
          # the `## [version]` heading is always present and must not satisfy
          # the check.
          if [ "$(grep -c '^- ' RELEASE_BODY.md)" -lt 1 ]; then
            echo "::error::CHANGELOG.md '### Release notes' block for $version produced no bullets. Add real notes, then re-tag."
            exit 1
          fi
          # Previous release = the largest CHANGELOG version numerically below
          # this one (heading order is not strictly sorted; [Unreleased] must
          # be skipped).
          prev=""
          while IFS= read -r v; do
            if [ "$v" = "$version" ]; then break; fi
            prev="$v"
          done < <(sed -nE 's/^## \[([0-9][0-9.]*)\].*/\1/p' CHANGELOG.md | sort -V)
          printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...v%s\n' \
            "$GITHUB_REPOSITORY" "$prev" "$version" >> RELEASE_BODY.md
          echo "notes lines: $(wc -l <RELEASE_BODY.md)"

      - name: Platform manifest
        # Spell out which platform+arch each binary asset targets, so the
        # attachments are unambiguous. Reflects the files actually staged (a
        # feature-gated binary that failed to build is simply absent here).
        run: |
          set -e
          : > dist/PLATFORMS.txt
          printf '%s\n' "Each asset's platform (by name suffix):" "---" >> dist/PLATFORMS.txt
          for f in dist/*; do
            case "${f##*/}" in
              *-linux-x86_64)  p="Linux x86_64 (amd64)";;
              *-linux-aarch64) p="Linux arm64 (aarch64, e.g. Jetson)";;
              *-darwin-arm64)  p="macOS arm64 (Apple Silicon)";;
              *-darwin-x86_64) p="macOS x86_64 (Intel)";;
              *.cdx.json)      p="CycloneDX SBOM (package manifest, any platform)";;
              *) continue;;
            esac
            printf '  %-34s %s\n' "${f##*/}" "$p" >> dist/PLATFORMS.txt
          done
          echo "manifest:"; cat dist/PLATFORMS.txt

      - name: Create release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: v${{ env.version }}
          body_path: RELEASE_BODY.md
          files: dist/*
          fail_on_unmatched_files: false