[package]
name = "brain-delivery-core"
version = "1.29.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The delivery-loop decision core (autonomy tiers, phase machine, promotion gate, attestation predicate, budget ledger, replay comparator); pure logic with no I/O."
publish = false

[dependencies]
# EXACTLY the brain-executor-core precedent's core three, per the R37 prereg:
# "serde, serde_json, sha2 -- NOTHING else". A need for any other dependency is
# a stop-and-preregister-addendum event. (Note: the executor-core manifest has
# since drifted to four, adding `hex`; this crate follows the prereg's letter and
# keeps the hex encoder self-contained. See the R37 evidence file.)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
