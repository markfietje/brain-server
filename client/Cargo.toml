[package]
name = "brain-client"
version = "1.28.22"
edition = "2024"
rust-version = "1.98"
description = "brain-server control surface — web + desktop + iOS + Android (Dioxus)"
publish = false

[dependencies]
# Dioxus 0.7: one codebase → four targets. The `router` feature gives the
# Routable enum + Link/Outlet. Web builds compile to WASM (DOM renderer, which
# is screen-reader accessible — do NOT enable the experimental wgpu web renderer).
dioxus = { version = "0.7", features = ["router"] }
# reqwest works on all targets incl. WASM (Dioxus integrates the browser fetch).
# JSON feature for typed (de)serialization of brain-server's responses.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# v1.28.1 M4: the SHA-256 subject digest for the offline DSAR queue payload —
# the raw subject never persists, only its one-way hash (re-prompted at
# replay). Pure Rust, wasm-compatible; hex formatting is hand-rolled (no `hex`
# dep — a dozen bytes of `format!` beats 30KB of wasm).
sha2 = "0.11"
# v1.20.8 M3: the `/events` SSE feed is read as a bounded `bytes_stream` (one
# chunk = handshake + buffered alerts, then close + reconnect). Already a
# transitive dep of reqwest; declared directly for the `StreamExt` trait.
futures-util = { version = "0.3", default-features = false }
# v1.16.7 M7.2: the single-refresh mutex. `sync` only (Mutex — no runtime),
# so it stays tiny and wasm-compatible; reqwest already pulls tokio on native.
tokio = { version = "1", default-features = false, features = ["sync"] }

# v1.16.6 M2: the secure-token storage seam. Non-web only (keyring has no wasm
# build) — the web build compiles the in-memory no-op path in src/storage.rs.
# `apple-native` → macOS/iOS Keychain; `windows-native` → Credential Manager;
# `sync-secret-service` → Linux Secret Service. Android uses the separate
# `android-native-keyring-store` crate (Keystore-encrypted prefs) — documented
# ceiling, wired by `dx` at bundle time.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# v1.27.20 "Console" (F-36): `client_times_out_on_hung_connection` needs an
# async runtime; the shipped `sync`-only tokio dep gets rt+macros here. Dev-only
# → zero wasm impact (dev-deps never compile into the bundle).
[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

# v1.28.20 Cockpit M1: platform targets are cargo features — one codebase,
# three renderers. Default stays `web` so every existing gate (wasm build,
# bundle budget) is untouched; desktop/mobile are additive opt-ins.
[features]
default = ["web"]
web = ["dioxus/web"]
desktop = ["dioxus/desktop"]
mobile = ["dioxus/mobile"]
