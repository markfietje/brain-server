name: CI

on:
  push:
    branches: [main]
    # Tag pushes re-run NOTHING here: release.sh pushes main first (this CI
    # matrix gates that exact SHA), then the tag triggers release.yml only.
    # Honest semantics: a branches-only push filter ALREADY excludes tag
    # pushes (GitHub: defining only branches means the workflow won't run
    # for the undefined ref) — the tags-ignore pins that intent explicitly,
    # so a future `tags:` addition can never silently double-run releases.
    tags-ignore: ['v*']
  pull_request:

# Supersede stale runs: rapid successive pushes cancel the earlier matrix
# instead of queueing N full runs behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the CI jobs build and test; they publish nothing.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint-test:
    name: fmt + clippy + test (default)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The embedder fixture downloads minishlab/potion-retrieval-32M at test
      # time; shared composite action (cache + retry) — see .github/actions/.
      - uses: ./.github/actions/huggingface-prefetch
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (default, all targets)
        run: cargo clippy --all-targets -- -D warnings
      - name: clippy (--features bench, all targets)
        # The bench binary is feature-gated and not exercised by the default
        # build. Without this, bench-binary changes only catch locally.
        run: cargo clippy --all-targets --features bench -- -D warnings
      - name: unused dependencies (cargo-machete)
        # The "imported a library for something the repo already had a
        # utility for" gate: an unused dep is almost always a duplicate of
        # something in-tree (or dead weight on the Jetson envelope).
        # Version-pinned like every other tool; bump deliberately.
        run: |
          cargo install cargo-machete --locked --version 0.9.2
          # exits non-zero when any unused dependency is found
          cargo machete
      - name: test (default)
        run: cargo test --all-targets
      - name: test (--features bench)
        # The bench feature gates the bench binary + its 4 unit tests.
        run: cargo test --all-targets --features bench

  engine-crates:
    # The engine-crate workspace node must stay decoupled from the server:
    # cores depend on brain-engine-sdk only (the stable ABI), never on
    # brain-server itself. A path dep back into the crate root would invert
    # the dependency direction the SDK line exists to establish.
    name: engine crates decoupled + green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            crates
      - name: no engine imports brain-server (grep gate)
        run: '! grep -r "brain-server" crates/*/Cargo.toml'
      - name: fmt
        run: cargo fmt --manifest-path crates/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path crates/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path crates/Cargo.toml --all-targets
      - name: settlement gate (brain-engine-sdk, harness-kernel)
        # v1.28.17 Settle — the SDK's workflow invariants (result never
        # rejects, bounded-grace cancel/dispose, observe-only event clones,
        # admission cap) are feature-gated; run them explicitly so no engine
        # can ship without them.
        run: cargo test --manifest-path crates/Cargo.toml -p brain-engine-sdk --features harness-kernel

  steward-harness-gate:
    # v1.28.17 Settle — the engine's tokio conformance (cancel settles at a
    # step boundary, sigterm-then-resume exactness, bounded grace vs a stuck
    # step, listener starvation) gates every harness release.
    name: steward-harness conformance + green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            .
            crates
            tools/steward-harness
      - name: fmt
        run: cargo fmt --manifest-path tools/steward-harness/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path tools/steward-harness/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path tools/steward-harness/Cargo.toml

  channel-bridge-gate:
    # v1.28.44 Caravel — the WhatsApp edge must not rot outside the main
    # workspace (standalone crate like signal-gateway): its hub-signature
    # hardening, platform translation bounds, and tier-throttle law gate here.
    name: channel-bridge conformance + green
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            tools/channel-bridge
      - name: fmt
        run: cargo fmt --manifest-path tools/channel-bridge/Cargo.toml --all -- --check
      - name: clippy
        run: cargo clippy --manifest-path tools/channel-bridge/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path tools/channel-bridge/Cargo.toml

  otel-gate:
    # v1.20.7 M1 — the `otel` feature (instrumented decision cores) must not
    # rot: the OTLP deps, the #[cfg_attr] spans, and the cfg-gated tests are
    # all absent from the default build, so nothing in lint-test exercises
    # them. This job compiles the feature (a default build compiles a
    # different surface — a broken otel build slips past lint-test), runs the
    # cfg-gated tests, and enforces clippy on the feature.
    name: otel feature clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Same Hub-blip defense as lint-test: the otel build runs the same
      # embedder fixtures. Shared composite action.
      - uses: ./.github/actions/huggingface-prefetch
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy (--features otel, all targets)
        run: cargo clippy --all-targets --features otel -- -D warnings
      - name: test (--features otel)
        run: cargo test --all-targets --features otel

  client-gate:
    # v1.18.0 M2 — the client (Dioxus control surface) had zero CI coverage;
    # this job gates fmt + clippy + unit tests + the wasm build (the web
    # target, and the one the M2 automated-a11y grep gates run against).
    name: client fmt + clippy + test + wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # One apt transaction for BOTH native-dep groups (the client's non-wasm
      # keyring feature links libdbus; the desktop feature needs the webkit
      # stack) — two `apt-get update` rounds used to run sequentially here.
      - name: Install libdbus + desktop webview headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libdbus-1-dev pkg-config \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: fmt
        run: cargo fmt --manifest-path client/Cargo.toml -- --check
      - name: clippy (all targets)
        run: cargo clippy --manifest-path client/Cargo.toml --all-targets -- -D warnings
      - name: test
        run: cargo test --manifest-path client/Cargo.toml
      - name: wasm build
        run: cargo build --manifest-path client/Cargo.toml --target wasm32-unknown-unknown
      # v1.28.20 Cockpit M1: desktop is a compile target, not a document.
      # No GUI run in CI — compile + clippy correctness only (the webkit2gtk
      # dep chain needs its system headers on Linux, installed above).
      - name: desktop feature compiles
        run: cargo check --manifest-path client/Cargo.toml --features desktop --all-targets
      # v1.28.20 Cockpit M4: mobile is a smoke target for this release
      # (allow-fail, honestly labeled — not a shipped platform).
      - name: mobile feature smoke (allow-fail)
        run: cargo check --manifest-path client/Cargo.toml --features mobile || echo "mobile smoke failed (documented allow-fail for v1.28.20)"
      # v1.20.0 M2.1 — the bundle regression budget (client/bundle-budget.sh):
      # release wasm must stay under the measured+headroom ceiling. `dx
      # bundle` is an operator step; this is the CI-side growth guard.
      - name: bundle budget
        run: bash client/bundle-budget.sh

  tier-smoke:
    # v1.28.41 "Terrain" — tiers are config, not forks: each checked-in tier
    # profile (deploy/tiers/*.env) must boot a fresh instance and pass the
    # smoke suite (health + doctor-style consistency + audit chain verify).
    # Drift between the guide and the profiles fails the meta-test in
    # src/workflow/tiers.rs; this job proves each profile actually BOOTS.
    name: tier smoke (${{ matrix.tier }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tier: [t1, t2, t3, t4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo build (debug binaries)
        run: cargo build --bin brain-server --bin brain
      - name: boot under ${{ matrix.tier }} profile + smoke
        env:
          TIER: ${{ matrix.tier }}
        run: |
          SCRATCH="$(mktemp -d)"
          printf 'tier-smoke-ci-token' > "$SCRATCH/token"
          chmod 600 "$SCRATCH/token"
          set -a; . "deploy/tiers/${TIER}.env"; set +a
          export BRAIN_DB_PATH="$SCRATCH/brain.db"
          export BIND_PORT=18590 AUTH_TOKEN_FILE="$SCRATCH/token"
          "$GITHUB_WORKSPACE/target/debug/brain-server" &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:$BIND_PORT/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:$BIND_PORT/health
          export BRAIN_URL="http://127.0.0.1:$BIND_PORT" BRAIN_TOKEN="tier-smoke-ci-token"
          "$GITHUB_WORKSPACE/target/debug/brain" doctor
          curl -fsS -H "Authorization: Bearer $BRAIN_TOKEN" \
            http://127.0.0.1:$BIND_PORT/audit/verify | grep -q '"ok":true'

  bench-concurrency:
    # v1.28.58 "Throughput" — the concurrent-truth gate: boot a scratch
    # release instance and drive it with 8 parallel bench clients over the
    # seeded mix. Desktop (x86 runner) ONLY — the jetson floor is asserted
    # locally on the device (no ARM runner: the known repo CI gap). The
    # BENCH_ASSERT_P95_MS bound is deliberately generous (release build on
    # shared CI runners): this gate fails on catastrophic contention
    # serialization (e.g. a lock that serializes recall), not on runner
    # noise. Retry-once policy: on breach, re-run once before investigating;
    # two consecutive breaches are a regression, never weather.
    name: bench concurrency (desktop, 8 clients)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo build --release --features bench (server + bench)
        run: cargo build --release --features bench --bin brain-server --bin bench
      - name: concurrent bench (BENCH_CLIENTS=8)
        run: |
          SCRATCH="$(mktemp -d)"
          printf 'bench-concurrency-ci-token' > "$SCRATCH/token"
          chmod 600 "$SCRATCH/token"
          BIND_PORT=18485 BRAIN_DB_PATH="$SCRATCH/brain.db" AUTH_TOKEN_FILE="$SCRATCH/token" \
            "$GITHUB_WORKSPACE/target/release/brain-server" &
          SRV=$!
          trap 'kill $SRV 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18485/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18485/health
          export BRAIN_URL="http://127.0.0.1:18485" BRAIN_TOKEN="bench-concurrency-ci-token"
          BENCH_CLIENTS=8 BENCH_SEARCHES=200 BENCH_SCALES=100 BENCH_ASSERT_P95_MS=10000 \
            "$GITHUB_WORKSPACE/target/release/bench"
          # the concurrent run must also leave the scrape surface intact:
          curl -fsS -H "Authorization: Bearer $BRAIN_TOKEN" \
            http://127.0.0.1:18485/metrics | grep -q 'brain_pool_timeouts_total'

  integration:
    # ONE release-profile build serves three gates that used to be three jobs
    # (release-build, ump-conformance, recall-gate) compiling the same
    # binaries separately on every push. The build doubles as the
    # release-profile compile check; the two live gates then run against the
    # SAME binaries sequentially on their own ports (UMP :18483, eval :18484).
    name: release build + UMP conformance + recall gate
    runs-on: ubuntu-latest
    env:
      # Recall steps must talk to the scratch instance, not the CLI default
      # (127.0.0.1:8765) — a misdirected seed silently ingests 0 docs.
      BRAIN_URL: http://127.0.0.1:18484
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: cargo build --release (compile gate + binaries for both live gates)
        run: cargo build --release

      # ── UMP 1.0 conformance ──
      # External reference-suite gate behind the README "UMP 1.0 / L3
      # verified" badge: boot a scratch keyed instance and run the official
      # @universalmemoryprotocol/core conformance runner. The runner exits 0
      # for any level >= L1, so the gate asserts the badge line itself.
      - name: start UMP scratch keyed instance
        run: |
          SCRATCH="$(mktemp -d)"
          echo "$SCRATCH" > /tmp/ump-scratch
          "$GITHUB_WORKSPACE/target/release/brain" ump keygen --dir "$SCRATCH/keys" > /tmp/ump-keygen.log
          printf 'ump-conformance-ci-token' > "$SCRATCH/token"
          chmod 600 "$SCRATCH/token"
          BIND_PORT=18483 \
            BRAIN_DB_PATH="$SCRATCH/brain.db" \
            BRAIN_UMP_KEY_DIR="$SCRATCH/keys" \
            AUTH_TOKEN_FILE="$SCRATCH/token" \
            "$GITHUB_WORKSPACE/target/release/brain-server" &
          echo $! > /tmp/ump-pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18483/health >/dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:18483/health
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - name: run reference conformance suite
        run: |
          npm install --no-save @universalmemoryprotocol/core@1.0.0
          OUT="$(node node_modules/@universalmemoryprotocol/core/dist/bin/conformance.js http://127.0.0.1:18483 --token ump-conformance-ci-token)"
          printf '%s\n' "$OUT"
          case "$OUT" in
            *"UMP 1.0 / L3"*) ;;
            *) echo "::error::UMP conformance below L3 (badge would be dishonest)" && exit 1 ;;
          esac
      - name: stop UMP scratch instance
        if: always()
        run: kill "$(cat /tmp/ump-pid)" 2>/dev/null || true

      # ── recall eval gate ──
      # Evidence-gated recall ship gate (v1.17.1 M3): seed a scratch instance
      # with the frozen 25-doc corpus, run `brain eval` over the 106 judged
      # queries (v1.28.6 expanded set), and enforce BENCH_RECALL_FLOOR.
      # Regressions on the frozen set fail CI. CI set only — parity claims are
      # gated by BENCHMARKS.md protocol (>=100 queries on target hardware),
      # not here.
      - name: seed recall scratch instance
        run: |
          SCRATCH="$(mktemp -d)"
          python3 - "$SCRATCH" <<'EOF'
          import sys, pathlib
          docs = [
            "Bignay is a tropical fruit and a good alternative to blueberry, rich in antioxidants.",
            "The Rust programming language guarantees memory safety without a garbage collector.",
            "Vitamin D3 supplementation improves immune function and bone density in deficient adults.",
            "The GDPR is a European regulation protecting the personal data of EU residents.",
            "Gut microbiome diversity affects inflammation markers and immune system regulation.",
            "SQLite is an embedded relational database with FTS5 full-text search support.",
            "ISO 9001 is the international standard for quality management systems.",
            "Ownership and borrowing are Rust's core concepts for compile-time memory safety.",
            "Antioxidants in tropical fruits like bignay help reduce oxidative stress.",
            "The GDPR covers any organization processing EU residents' data, with fines up to four percent of global revenue.",
            # ── migration vertical (docs 10-14) ──
            "VxRail LCM upgrades require a green RCM release certification manifest before any upgrade wave is scheduled.",
            "A stretched-cluster rolling reboot reboots one ESXi node at a time; never reboot two nodes concurrently.",
            "vSAN storage policies set FTT failures to tolerate and FTM failure tolerance method per virtual machine.",
            "PowerFlex protection domains map fault sets to failure boundaries across SDS storage pools.",
            "NSX-T managers push micro-segmentation firewall rules to transport nodes over the control plane.",
            # ── legal vertical (docs 15-19) ──
            "A DPA data processing agreement under GDPR Article 28 binds the processor to the controller's instructions.",
            "Standard Contractual Clauses 2021 are the approved EU transfer mechanism for processors outside the EEA.",
            "RA 10173 the Philippine Data Privacy Act requires NPC breach notification within 72 hours.",
            "Schrems II requires a transfer impact assessment before any personal-data transfer to a third country.",
            "Legal holds freeze erasure until every hold is explicitly released by the operator.",
            # ── troubleshoot vertical (docs 20-24) ──
            "Intermittent storage fabric latency usually traces to a failing SFP on one uplink port, not the array.",
            "High VM disk latency triage order: vSAN backend congestion, then host cache, then the physical disk group.",
            "A node flapping out of vCenter management is most often NTP drift breaking certificate validation.",
            "PSOD purple diagnostic screen dumps land in var log and must be collected before any reboot clears them.",
            "vMotion failing at ten percent points to VMkernel port mobility or a missing shared datastore.",
          ]
          d = pathlib.Path(sys.argv[1])
          (d / "corpus").mkdir()
          for i, doc in enumerate(docs):
            (d / "corpus" / f"doc{i}.md").write_text(f"---\ntitle: doc{i}\n---\n\n{doc}\n")
          EOF
          BIND_PORT=18484 \
            BRAIN_DB_PATH="$SCRATCH/brain.db" \
            "$GITHUB_WORKSPACE/target/release/brain-server" &
          echo $! > /tmp/eval-pid
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18484/health >/dev/null 2>&1 && break
            sleep 1
          done
          OUT="$("$GITHUB_WORKSPACE/target/release/brain" ingest-dir "$SCRATCH/corpus")"
          printf '%s\n' "$OUT"
          case "$OUT" in
            *"25 ingested"*) ;;
            *) echo "::error::seed ingest failed (expected '25 ingested')" && exit 1 ;;
          esac
      - name: run eval gate
        run: |
          set -o pipefail
          "$GITHUB_WORKSPACE/target/release/brain" eval \
            --floor r5=0.85 --floor r10=0.85 --floor mrr=0.85 | tail -5
      - name: stop recall scratch instance
        if: always()
        run: kill "$(cat /tmp/eval-pid)" 2>/dev/null || true

  docs:
    # mdBook docs build: the docs/ source feeds the GitHub Pages site via
    # docs.yml (deploy) and release.yml (tagged revision deploy). This job
    # validates the build on every PR + main push so a broken mdBook source
    # (bad link, missing file, new-style preprocessor) is caught in CI instead
    # of failing the deploy.
    name: mdBook docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cache mdbook binary
        # cargo install compiles mdbook (~50 crates) from source on EVERY run
        # otherwise; a version-keyed ~/.cargo/bin cache turns that into a
        # cache hit. Same pattern in docs.yml + release.yml.
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/mdbook
          key: mdbook-0.5.4
      - name: Install mdBook (skipped on cache hit)
        run: command -v mdbook >/dev/null 2>&1 || cargo install mdbook --version 0.5.4 --locked
      - name: Build
        run: mdbook build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # audit-check creates a check run; the default GITHUB_TOKEN can't without
    # this ("Resource not accessible by integration" — infra failure, not code).
    permissions:
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  lipstyk:
    # v1.27.27 "Seal" M5 — the de-slop watchdog: no NEW code may add a
    # lipstyk diagnostic. Diff-scoped (changed lines only) against the PR
    # base (or the previous commit on main pushes), so the documented legacy
    # baseline (the v1.27.24 honest ceiling: heuristic false-positive classes
    # on unchanged code) never blocks CI — only changed lines can fail. The
    # two group-attributed cross-file rules are disabled in .lipstyk.toml
    # (they cannot be scoped to changed lines and fire on untouched files).
    # plugin/src is TypeScript — lipstyk scans both languages.
    name: lipstyk (diff watchdog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: cache lipstyk binary
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/lipstyk
          key: lipstyk-0.3.0
      - name: Install lipstyk (skipped on cache hit)
        run: command -v lipstyk >/dev/null 2>&1 || cargo install lipstyk --version 0.3.0
      - name: Determine diff base
        id: base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            echo "ref=origin/$BASE_REF" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            # A multi-commit push diffs from the commit BEFORE the push, so
            # every new commit's lines are in scope (HEAD~1 would only cover
            # the last one).
            echo "ref=$BEFORE" >> "$GITHUB_OUTPUT"
          else
            echo "ref=HEAD~1" >> "$GITHUB_OUTPUT"
          fi
      - name: Watchdog (changed lines must add no diagnostic)
        run: |
          lipstyk --diff "${{ steps.base.outputs.ref }}" --exclude-tests src client plugin
