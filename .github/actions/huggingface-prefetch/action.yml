# Composite action: cache + prefetch the HuggingFace embedder fixture
# (minishlab/potion-retrieval-32M) with retries. Shared by every CI job that
# runs the embedder fixtures (lint-test, otel-gate) — was duplicated verbatim
# in each until the dedup.
#
# Anonymous Hub fetches rate-limit and transiently 5xx; the cache + retry loop
# keep a Hub blip from reding the whole matrix (a total outage degrades to a
# warning — tests fall back to whatever the cache holds).
name: 'HuggingFace model cache + prefetch'
description: 'Cache and prefetch minishlab/potion-retrieval-32M with retries'
runs:
  using: 'composite'
  steps:
    - name: cache huggingface model
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ~/.cache/huggingface
        key: hf-${{ hashFiles('src/config.rs') }}
    - name: prefetch model (retried)
      shell: bash
      run: |
        pip install -q huggingface_hub
        for i in 1 2 3 4 5; do
          if python3 -c "from huggingface_hub import snapshot_download; snapshot_download('minishlab/potion-retrieval-32M')"; then
            echo "model cached"; exit 0
          fi
          echo "attempt $i failed; backing off"; sleep $((i * 20))
        done
        echo "::warning::HuggingFace Hub unreachable — tests will rely on whatever is cached"
        exit 0
