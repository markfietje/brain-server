name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2

      - name: Build (linux x86_64)
        # Full binary set: `bench`/`brain-migrate-rehearse` need `--features
        # bench,migrate`, `brain-connector-gh` needs `--features
        # connector-github` (both empty features that gate compilation).
        run: |
          cargo build --release --features bench,migrate
          cargo build --release --features connector-github --bin brain-connector-gh
        continue-on-error: true

      - name: Build (linux aarch64 via cross)
        run: |
          cargo install cross --locked
          cross build --release --features bench,migrate --target aarch64-unknown-linux-gnu
          cross build --release --features connector-github --bin brain-connector-gh --target aarch64-unknown-linux-gnu
        continue-on-error: true

      - name: Generate CycloneDX SBOM
        # Reuses the local operator path (scripts/sbom.sh): a CycloneDX SBOM
        # from Cargo.lock, shipped alongside the release binaries (EU CRA /
        # OWASP A03:2025). cargo-cyclonedx is a release-time tool.
        run: |
          cargo install cargo-cyclonedx --locked
          ./scripts/sbom.sh
        continue-on-error: true

      - name: Stage artifacts
        # brain-server (the main binary) plus every operator CLI, one pairing
        # per target. Feature-gated bins present only if their feature built.
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh; do
            cp -f "target/release/$b" "dist/${b}-linux-x86_64" 2>/dev/null || true
            cp -f "target/aarch64-unknown-linux-gnu/release/$b" "dist/${b}-linux-aarch64" 2>/dev/null || true
          done
          cp -f sbom/*.cdx.json dist/ 2>/dev/null || true
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: dist/

  build-darwin:
    name: Build macOS binaries
    # The operator's native build target (the dev box is macOS arm64) — ships
    # the same full binary set, native arm64 + cross x86_64. Without this the
    # release is Linux-only and the local build is never published.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2

      - name: Build (macOS arm64, native)
        run: |
          cargo build --release --features bench,migrate
          cargo build --release --features connector-github --bin brain-connector-gh
        continue-on-error: true

      - name: Build (macOS x86_64)
        run: |
          cargo build --release --features bench,migrate --target x86_64-apple-darwin
          cargo build --release --features connector-github --bin brain-connector-gh --target x86_64-apple-darwin
        continue-on-error: true

      - name: Stage artifacts
        run: |
          mkdir -p dist
          for b in brain-server brain mcp bench brain-migrate-rehearse brain-connector-stub brain-connector-gh; do
            cp -f "target/release/$b" "dist/${b}-darwin-arm64" 2>/dev/null || true
            cp -f "target/x86_64-apple-darwin/release/$b" "dist/${b}-darwin-x86_64" 2>/dev/null || true
          done
          ls -la dist

      - name: Codesign (macOS, self-signed cert — optional)
        # Sign the darwin binaries with the operator's self-signed code-signing
        # identity (PKCS#12, base64 + password in GitHub secrets). Skips when no
        # cert is configured. Honesty: a self-signed cert is NOT Apple-Developer
        # trusted — it clears only machines that have the cert in their keychain;
        # Gatekeeper-on-others needs Developer ID + notarization instead.
        if: ${{ secrets.MACOS_SELF_SIGNED_CERT_B64 != '' }}
        env:
          MAC_CERT_B64: ${{ secrets.MACOS_SELF_SIGNED_CERT_B64 }}
          MAC_CERT_PW: ${{ secrets.MACOS_SELF_SIGNED_CERT_PW }}
        run: |
          set -e
          echo "$MAC_CERT_B64" | base64 -d >/tmp/codesign.p12
          security import /tmp/codesign.p12 -k "$HOME/Library/Keychains/login.keychain-db" -P "$MAC_CERT_PW" -T /usr/bin/codesign 2>/dev/null || \
            security import /tmp/codesign.p12 -k "$HOME/Library/Keychains/login.keychain-db" -P "$MAC_CERT_PW"
          ID=$(security find-identity -v -p codesigning | sed -nE 's/.*"([^"]+)"/\1/p' | head -1)
          for f in dist/*-darwin-*; do
            echo "codesign $ID -> $f"
            codesign --force --sign "$ID" "$f"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: dist-darwin
          path: dist/

  release:
    name: Assemble release + notes
    runs-on: ubuntu-latest
    needs: [build-linux, build-darwin]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: dist-linux
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: dist-darwin
          path: dist
          merge-multiple: true

      - name: Generate release notes from CHANGELOG
        # `generate_release_notes` produces only PR-based notes (empty here —
        # the repo ships via direct commits). Instead the body is a BRIEF core:
        # this tag's CHANGELOG heading + its intro paragraph (the agent-authored
        # one-line-what-changed), written outside dist/ so it isn't uploaded as
        # an asset. The previous tag is the CHANGELOG heading after the current
        # section, so no history fetch / tag walk is needed on the runner.
        run: |
          set -e
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            /^## \[/ { if (insec) exit; insec = ($0 ~ "^## \\[" ver "\\]"); if (insec) print; next }
            !insec { next }
            insec {
              if ($0 ~ /^#/) next
              if ($0 ~ /^([-*+] |[0-9]+\. )/) next
              if ($0 == "") { if (out) exit; next }
              if (!out) { print ""; out=1 }
              print
            }
          ' CHANGELOG.md > RELEASE_BODY.md
          prev=$(awk -v ver="$version" '
            /^## \[/ { if (have) { print $0; exit } have = ($0 ~ "^## \\[" ver "\\]") }
          ' CHANGELOG.md | sed -E 's/^## \[([0-9.]+)\].*/\1/')
          printf '\n**Full Changelog**: https://github.com/%s/compare/v%s...%s\n' \
            "$GITHUB_REPOSITORY" "$prev" "$GITHUB_REF_NAME" >> RELEASE_BODY.md
          echo "notes lines: $(wc -l <RELEASE_BODY.md)"

      - name: Platform manifest
        # Spell out which platform+arch each binary asset targets, so the
        # attachments are unambiguous. Reflects the files actually staged (a
        # feature-gated binary that failed to build is simply absent here).
        run: |
          set -e
          : > dist/PLATFORMS.txt
          printf '%s\n' "Each asset's platform (by name suffix):" "---" >> dist/PLATFORMS.txt
          for f in dist/*; do
            case "${f##*/}" in
              *-linux-x86_64)  p="Linux x86_64 (amd64)";;
              *-linux-aarch64) p="Linux arm64 (aarch64, e.g. Jetson)";;
              *-darwin-arm64)  p="macOS arm64 (Apple Silicon)";;
              *-darwin-x86_64) p="macOS x86_64 (Intel)";;
              *.cdx.json)      p="CycloneDX SBOM (package manifest, any platform)";;
              *) continue;;
            esac
            printf '  %-34s %s\n' "${f##*/}" "$p" >> dist/PLATFORMS.txt
          done
          echo "manifest:"; cat dist/PLATFORMS.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_BODY.md
          files: dist/*
          fail_on_unmatched_files: false