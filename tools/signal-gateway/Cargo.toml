[package]
name = "signal-gateway"
# Version tracks the libsignal stack this build is pinned against
# (Cargo.lock: libsignal tag v0.99.0 via presage main — see the stack-policy
# note near the bottom of this file) — bump both together.
version = "0.99.0"
edition = "2024"
rust-version = "1.98"
description = "Lightweight Signal daemon edge for brain-server Switchboard"
license = "MIT OR Apache-2.0"

[dependencies]
presage = { git = "https://github.com/whisperfish/presage", branch = "main" }
presage-store-sqlite = { git = "https://github.com/whisperfish/presage", branch = "main" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "fs"], default-features = false }

axum = { version = "0.8.9", features = ["macros", "json"] }
async-stream = "0.3.6"

reqwest = { version = "0.13.4", features = ["json"], default-features = false }

serde = "1"
serde_json = "1"
serde_yaml = "0.9"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.23"
hmac = "0.13"
sha2 = "0.11"
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"

futures = "0.3"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

# ── Switchboard stack policy (libsignal v0.99.0 → v0.101.0) ─────────────────
# STATUS: blocked by cargo's rule that a [patch] must point to a DIFFERENT
# source URL than the manifest being patched. presage pins libsignal crates
# with `git = .../signalapp/libsignal, tag = "v0.99.0"` and libsignal-service
# with `rev = bb43e81` — re-pointing those to newer tags of the SAME URL via
# our manifest is rejected ("patches must point to different sources").
#
# Consequence: the newest MUTUALLY-COMPATIBLE stack is whatever presage main
# pins: libsignal v0.99.0 + libsignal-service-rs bb43e81 (both confirmed the
# latest upstream publishes whisperfish ships against). The moment upstream
# merges a libsignal bump (watch presage PR #429 successors / service-rs deps),
# `cargo update` here inherits it automatically since we track branch=main.
#
# Options if vendoring is ever wanted: fork signalapp/libsignal under a new
# URL (e.g. github.com/markfietje/libsignal) at tag v0.101.0 and patch toward
# THAT URL; or wait for upstream. Kept out of the tree for now — dead config
# is worse than an honest ceiling.

# NOTE: the historic [patch.crates-io] curve25519-dalek → signalapp fork
# (tag signal-curve25519-4.1.3) was REMOVED with the presage/libsignal refresh:
# x25519-dalek 3.x requires curve25519-dalek ^5, which the fork does not
# provide, so the graph resolves the crates.io release like upstream intends.

# ── Hardening policy ───────────────────────────────────────────────────────
# Deny every runtime-panic vector we own (unwrap/expect/panic outside
# tests), keep the broad lint groups loud, and let unsafe_code = forbid stay
# compile-enforced from src/main.rs. Release builds KEEP arithmetic overflow
# checks ON (opt-z stays; correctness over the last percent of size).
[lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "warn"
arithmetic_side_effects = "warn"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
overflow-checks = true

[profile.release.package."*"]
opt-level = "z"
