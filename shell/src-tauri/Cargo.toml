[package]
name = "brain-shell"
version = "0.1.1"
description = "The SvelteTauri shell's Rust core: system integration only — zero business logic (the kernel owns every rule)."
edition = "2024"
# Tauri 2.12 states its MSRV policy as `stable - 3` (Context7, tauri-docs
# blog/tauri-2.12). At the 2.12 bump the floor was 1.90; 1.99 is the current
# stable and is this repo's floor everywhere else, so the shell matches the
# rest of the tree rather than carrying its own lower number.
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/markfietje/brain-server"
readme = "../README.md"
keywords = ["tauri", "shell", "wizard", "desktop"]
categories = ["gui"]

[lib]
name = "brain_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# The App Store (MAS) edition's excision gate (PLAN_MAS_FORK §3, 2026-10-30).
# A cargo feature — NOT a config-merge omission: Tauri config merging is
# additive per key, so an overlay can never REMOVE the base's
# `plugins.updater`; the registration itself is compiled out under `mas`
# (guideline 2.5.2: the store owns updates). Build with:
#   pnpm tauri build --config src-tauri/tauri.appstore.conf.json --features mas
mas = []

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
tauri-plugin-updater = { version = "2.14", features = [] }
# Phase I: `recall.rs` reads the kernel's `/recall` response body rather than
# trusting a caller-shaped object, so `serde` derives the wire types and
# `serde_json` parses them. Both are already in this workspace's graph through
# `tauri` -- the lockfile gained two lines, not two packages -- so these edges
# make an existing dependency explicit rather than adding one. No HTTP client is
# added: the core holds no transport (see capabilities/main.json).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# III-2: the keychain logic and its mock-store pins are platform-independent.
# `keyring-core` is pure Rust; the APPLE store is the only macOS-gated edge.
# The v1 `keyring` meta-crate is declined by name: it hard-wires the platform
# store in a process-global default, so a test cannot inject a mock without
# replacing global state (and its default feature names zbus on Linux).
keyring-core = "1.0.1"

[dev-dependencies]
tauri = { version = "2.12.4", features = ["test"] }

[target.'cfg(target_os = "macos")'.dependencies]
# The login-keychain implementation: `keychain` (legacy login keychain), NOT
# `protected` (data-protection keychain — entitlements/access groups are III-5).
apple-native-keyring-store = { version = "1.0.2", features = ["keychain"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
