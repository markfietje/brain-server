[package]
name = "brain-shell"
version = "0.1.0"
description = "The SvelteTauri shell's Rust core: system integration only — zero business logic (the kernel owns every rule)."
edition = "2021"
rust-version = "1.77.2"
license = "MIT"
repository = "https://github.com/markfietje/brain-server"
readme = "../README.md"
keywords = ["tauri", "shell", "wizard", "desktop"]
categories = ["gui"]

[lib]
name = "brain_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
