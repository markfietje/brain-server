# v1.27.27 "Seal" M5 — the de-slop watchdog config.
#
# Contract (CI `lipstyk` job): `lipstyk --diff <base> --exclude-tests` exits
# non-zero when CHANGED lines introduce a diagnostic — no new code can add a
# finding. The line-scoped rules are fully armed.
#
# The two cross-file rules are disabled because they attribute each finding to
# EVERY file in a duplicate group (3+ files sharing a block), so they cannot be
# scoped to changed lines: in --diff mode they fire on untouched baseline files
# and the gate would fail on code nobody touched. The repo's deliberate
# duplicate blocks are documented in the v1.27.24 honest ceiling (wire-shape
# error envelopes, per-sibling screen wrappers). To run the cross-file dedup
# review manually, bypass this config:
#   lipstyk --config /dev/null --exclude-tests src client plugin
[settings]
exclude_tests = true

[rules.cross-file-duplicate]
enabled = false

[rules.cross-file-error-pattern]
enabled = false

# error-swallowing on `unwrap_or_default` is intentional for best-effort
# fallbacks (e.g. audit chain defaults, optional config); noisy in diff.
[rules.error-swallowing]
enabled = false

# `expect` on invariant paths + section banners flagged as restating-comment
# are deliberate; not slop.
[rules.unwrap-overuse]
enabled = false

[rules.restating-comment]
enabled = false

[rules.comment-clustering]
enabled = false

# v1.28.15 diff: the workflow module's identifier vocabulary is its DOMAIN
# vocabulary (run/state/topic/answer/payload/question) — a single-purpose
# module has inherently low unique-stem entropy, so this heuristic fires on
# every touched line there regardless of authorship. False positive for
# diff gating; full scan (`--config /dev/null`) still surfaces it.
[rules.naming-entropy]
enabled = false

# v1.28.16 diff: bin_common/http.rs is #[path]-included by the brain/mcp/
# bench binaries with different call sets — the per-fn allow(dead_code)
# markers ARE the truthful record of which consumer calls what (bench calls
# none). The density heuristic misreads shared include-files; full scan
# (--config /dev/null) still surfaces them for manual review.
[rules.dead-code-markers]
enabled = false

# Lineage diff: the flagged `.clone()` sites (workflow.rs run_domain /
# put_run_state / post_answer) each produce an OWNED handle that is moved
# into a `spawn_blocking` closure — borrowing across the await is exactly
# what they exist to avoid. r2d2 Pool clones are Arc-cheap. False positives
# for diff gating; full scan (--config /dev/null) still surfaces them.
[rules.redundant-clone]
enabled = false

# Lineage diff: `exec_allowlist()` stays a named seam beside its twin
# `http_allowlist()` — three call sites read the operator env through one
# documented, fail-closed door; inlining it would duplicate the env name.
[rules.trivial-wrapper]
enabled = false
