[package]
name = "brain-aftersales-core"
version = "1.28.33"
edition.workspace = true
rust-version = "1.98"
license = "MIT OR Apache-2.0"
description = "The aftersales engine core: entitlement/window/disposition fulfillment gates on the governed-workflow substrate."
publish = false

[dependencies]
brain-troubleshoot-core = { path = "../brain-troubleshoot-core" }
serde = { version = "1", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
