[package]
name = "brain-troubleshoot-core"
version = "1.27.38"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Universal troubleshooting engine core on the governed-workflow substrate."
publish = false

[dependencies]
# The stable engine ABI: pure cores, policy vocabulary, WorkflowHost seam.
brain-engine-sdk = { path = "../brain-engine-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

# The SDK dep is this crate's DECLARED ABI contract (Survey-plan scaffold):
# intentionally ahead of the code. Told to cargo-machete so the unused-dep
# gate stays honest without erasing the contract.
[package.metadata.cargo-machete]
ignored = ["brain-engine-sdk"]
