# Dependabot configuration.
#
# The recurring red "cargo in /client for glib|rand - Update" runs are
# Dependabot SECURITY updates that can never resolve:
#
# - rand 0.7.3 arrives transitively via phf_generator 0.8.0 (proc-macro
#   build chain). The client never calls rand directly; no lockfile edit
#   resolves the advisory without upstream releasing a phf_generator that
#   uses rand >= 0.8.6.
# - glib 0.18.x is pinned by the gtk4-rs stack under dioxus-desktop. The
#   advisory requires >= 0.20.0, which does not exist in this dependency
#   graph until gtk4-rs/dioxus ship it.
#
# Both are ignored here so Dependabot stops attempting (and failing) the
# impossible update each run. Revisit when dioxus-desktop or phf_generator
# bumps land — remove the matching ignore entry then.
version: 2
updates:
  # Automate the GitHub Actions bumps themselves (checkout/rust-cache/…)
  # — the Node-runtime deprecation class gets fixed by PR, not by hand.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      # The codeql-action steps are a PAIR by contract: the analyze
      # post-action loads the database the init step wrote and refuses a
      # version mismatch (`Loaded a configuration file for version
      # '4.38.0', but running version '4.38.1'`). Separate init/analyze
      # PRs are structurally red — each alone can never pass. One grouped
      # PR bumps both together; demonstrated red on #42/#43, fixed on
      # main by the same commit.
      codeql-action-pair:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # The opentelemetry family moves as ONE unit: otlp 0.33 requires
      # opentelemetry 0.33 + sdk 0.33, so separate per-crate PRs conflict
      # with each other and with cargo resolution — same structural
      # hazard as the codeql-action pair, on the cargo side.
      opentelemetry-family:
        patterns:
          - "opentelemetry"
          - "opentelemetry_sdk"
          - "opentelemetry-otlp"
    ignore:
      - dependency-name: opentelemetry
        versions: [">=0.33"]
        # no tracing bridge exists yet: tracing-opentelemetry 0.33 (the
        # latest) pairs with opentelemetry 0.32, so the otel feature
        # cannot compile against 0.33 (two opentelemetry versions in one
        # graph — tracer trait mismatch, demonstrated on the grouped PR).
        # Remove when tracing-opentelemetry ships the 0.33 pairing.
      - dependency-name: opentelemetry_sdk
        versions: [">=0.33"]
      - dependency-name: opentelemetry-otlp
        versions: [">=0.33"]
      - dependency-name: fastembed
        versions: [">=7"]
        # 7.x is BREAKING where it hurts this deployment: the model cache
        # relocates (existing weights re-download unless HF_HOME is set —
        # a local-first regression), the sparse-model API changes shape,
        # and the neural-embed / rerank-tier paths it compiles into are
        # feature-gated OUT of the default CI matrix. Take the major
        # deliberately, with the tier smokes pointed at the gated
        # features; remove this ignore when that lands.
  - package-ecosystem: cargo
    directory: /crates
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /tools/steward-harness
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /client
    schedule:
      interval: weekly
    ignore:
      - dependency-name: rand
        versions: [">=0.7, <0.8.6"]
        # transitive via phf_generator 0.8 — no resolvable fix
      - dependency-name: glib
        versions: ["<0.20"]
        # pinned by gtk4-rs under dioxus-desktop — no resolvable fix
