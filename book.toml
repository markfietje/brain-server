[book]
title = "brain-server"
authors = ["markfietje"]
description = "Local-first semantic memory for AI agents"
language = "en"
src = "docs"

[build]
create-missing = false

[output.html]
# Canonical public URL — the GitHub Pages site. mdBook uses this for the
# <base href> (404 page) so relative links resolve correctly under the
# /brain-server/ subdirectory.
site-url = "https://markfietje.github.io/brain-server/"
# brain-server brand: steel/blue accent, gold mark. Follows the OS
# (light default, dark preferred) and the toolbar sun/moon button flips it.
default-theme = "light"
preferred-dark-theme = "coal"
git-repository-url = "https://github.com/markfietje/brain-server"
edit-url-template = "https://github.com/markfietje/brain-server/edit/main/{path}"
additional-css = ["theme/css/brain-server.css"]
additional-js = []
no-section-label = true

[output.html.print]
enable = true

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 25
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[output.html.fold]
enable = false
