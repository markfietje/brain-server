[package]
name = "brain-delivery-core"
version = "1.29.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The delivery-loop decision core (autonomy tiers, phase machine, promotion gate, attestation predicate, budget ledger, replay comparator); pure logic with no I/O."
publish = false

[dependencies]
# ADDENDUM 2 item 6 (plan:705) fixes this set at the brain-executor-core
# precedent: serde (derive), serde_json, sha2, plus `hex` only if the crate
# encodes digests as hex. It does, so `hex` is permitted -- and omitted here
# anyway: the encoder stays self-contained, and the pin
# `digest_encoding_is_a_known_answer_not_only_self_consistent` holds it against
# an independently computed value.
# Precedence is ADDENDUM 2 > AMENDMENT 1, so AMENDMENT 1's "serde/serde_json/
# sha2 ONLY" is SUPERSEDED and is NOT the governing text. brain-executor-core
# carrying `hex` is not drift -- it is the named precedent, and item 6
# anticipated that line.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
