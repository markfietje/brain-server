openapi: 3.0.3
info:
  title: brain-server API
  description: >
    HTTP API for the brain-server local agent memory / semantic search server
    (Axum + rusqlite + sqlite-vec + model2vec). This spec is hand-written from
    the source in src/server/router/** and src/handlers/*. Endpoints whose contract could
    not be fully verified from source are marked with `x-status: unverified`.
    Every response carries `X-Api-Version: <semver>`; legacy routes carry a
    `Deprecation` header per the deprecation policy in API_CONTRACT.md.
    UMP capability tokens (v1.17.3 M5, spec §5.2) are accepted as
    `Authorization: Bearer` on `/ump/*` + `/export` (signature/expiry at the
    middleware, verbs × scope per handler; `audit` surfaces deny tokens).
  version: 1.29.3
  x-api-version: "1.29.3"
servers:
  - url: http://127.0.0.1:8765
    description: Default local server (override BIND_HOST/BIND_PORT)
paths:
  /health:
    get:
      summary: Liveness probe (minimal, public)
      description: >-
        The load-balancer probe shape only: {status, version}. Every
        deployment-fingerprinting field (model, otel, pool, backup, webhook,
        hardening, compliance) lives behind the Read gate on /health/db
        (v1.27.23 M2 surface reduction).
      operationId: getHealth
      responses:
        "200":
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
  /health/db:
    get:
      summary: Detailed deployment health (Admin-gated full body; Read gets the reduced probe)
      description: >-
        The full health body: model id, system memory, pool, backup snapshot,
        webhook posture, otel, compliance (DPO contact), hardening counters
        (incl. audit_commit_failures), capacity envelope, audit-chain
        integrity, plus database_size_bytes and last_write. v1.28.70 (Twokeys,
        X-A5): the full body is OPERATOR telemetry and requires an Admin
        credential on global; a Read credential receives the reduced public
        shape {status, version, db_ok} (the public /health content plus the
        pool liveness bit); a credential with neither Read nor Admin is 403.
      operationId: getHealthDb
      responses:
        "200":
          description: >-
            Full health for Admin on global; the reduced probe
            {status, version, db_ok} for Read credentials.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
                  version: { type: string }
                  model: { type: string }
                  system:
                    type: object
                    properties:
                      memory_used_mb: { type: integer }
                      memory_total_mb: { type: integer }
                      memory_percent: { type: number }
                  pool:
                    type: object
                    properties:
                      connections: { type: integer }
                      idle_connections: { type: integer }
                      busy_connections: { type: integer }
                  backup: { type: object, description: Last backup+integrity snapshot state }
                  webhook:
                    type: object
                    properties:
                      replay_secs: { type: integer }
                      timestamp_required: { type: boolean }
                      scheme: { type: string, example: standard-webhooks }
                  otel:
                    type: object
                    properties:
                      enabled: { type: boolean }
                      endpoint: { type: string }
                  compliance:
                    type: object
                    properties:
                      dpo_contact: { type: string, nullable: true }
                  hardening:
                    type: object
                    properties:
                      unsafe_blocks: { type: integer, example: 1 }
                      panics_caught: { type: integer, example: 0 }
                      memory_leaks_detected: { type: integer, example: 0 }
                      audit_commit_failures: { type: integer, example: 0 }
                      injection_classifier_loaded: { type: boolean }
                      injection_policy:
                        type: string
                        enum: [quarantine, reject, allow]
                        description: The resolved INJECTION_POLICY. `allow` disables the injection screen entirely (trusted-local-sources posture) — surfaced here and warned at boot, never silent.
                  capacity:
                    type: object
                    description: Present when the pool had a connection to measure; omitted otherwise.
                    properties:
                      target: { type: string, example: jetson }
                      docs: { type: integer }
                      max_docs: { type: integer }
                      db_mib: { type: integer }
                      max_db_mib: { type: integer }
                      rss_mib: { type: integer }
                      max_rss_mib: { type: integer }
                      status: { type: string, example: ok }
                  integrity:
                    type: object
                    properties:
                      chain_ok: { type: boolean }
                      last_checked_at: { type: integer }
                      chain_head: { type: string }
                  concurrency:
                    type: object
                    description: >-
                      Contention telemetry (additive, v1.28.58). Counters are
                      process-local since process start; wal_pages_pending is
                      refreshed by THIS endpoint's WAL sweep (the PASSIVE
                      checkpoint PRAGMA runs only here, never per request).
                    properties:
                      pool_timeouts_total: { type: integer }
                      busy_errors_total: { type: integer }
                      wal_pages_pending:
                        type: object
                        additionalProperties: { type: integer }
                        description: Per-domain WAL frames not yet checkpointed (last sweep).
                  database_size_bytes: { type: integer }
                  last_write: { type: string, nullable: true }
        "403":
          description: >-
            Neither Read nor Admin on global (error envelope). Read
            credentials never 403 here — they receive the reduced probe.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: { type: object, description: code + message envelope }
  /ready:
    get:
      summary: Readiness probe
      operationId: getReady
      responses:
        "200":
          description: "status OK when ready, NOT_READY otherwise, plus the boot-enforced webhook_signing posture (on, or off when unsigned alert sends were explicitly admitted)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: OK }
                  webhook_signing: { type: string, example: "on" }
                  gdl_provider:
                    type: string
                    enum: [disabled, configured, invalid]
                    description: Redacted GDL provider configuration posture; invalid is NOT_READY.
  /openapi.yaml:
    get:
      summary: This OpenAPI document (machine-readable route discovery)
      operationId: getOpenapi
      responses:
        "200":
          description: OpenAPI 3.0 YAML
          content:
            application/yaml:
              schema: { type: string }
  /reindex:
    post:
      summary: Re-embed every chunk (vec0 rebuild)
      operationId: reindex
      responses:
        "200":
          description: Reindex result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string }
                  reembedded: { type: integer }
                  skipped: { type: integer }
  /version:
    get:
      summary: Server version
      operationId: getVersion
      responses:
        "200":
          description: Version string (text/plain)
          content:
            text/plain:
              schema: { type: string, example: "0.9.1" }
  /stats:
    get:
      summary: Corpus statistics
      operationId: getStats
      responses:
        "200":
          description: Counts and model info
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  embeddings: { type: integer }
                  entities: { type: integer }
                  relationships: { type: integer }
                  model: { type: string }
                  version: { type: string }
  /add:
    post:
      summary: Add a single text chunk
      operationId: addChunk
      description: >
        Legacy write path. v1.27.16 "Drawbridge" (M4.3): `source` is a closed
        vocabulary for JWT-authenticated (agent) principals — a trust label,
        not a free-form field. `manual` is EXCLUDED from the token-authenticated
        set (it marks human authorship via `origin:human`); the loopback/
        operator default stays `manual`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string }
                title: { type: string }
                source:
                  type: string
                  default: manual
                  description: >
                    Loopback/operator: any value (`manual` default).
                    JWT principals: one of
                    memory|markdown|structured|vault|github|crm|slack|email|jira|linear|notion|hris|ehr
                    (the connector family kinds); anything else is a 400
                    `invalid_source` with the allowed list.
      responses:
        "200":
          description: Add result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  status: { type: string }
                  chunk_id: { type: integer, nullable: true }
                  error: { type: string, nullable: true }
  /ingest/memory:
    post:
      summary: Ingest free-form memory text (raw body)
      operationId: ingestMemory
      requestBody:
        required: true
        content:
          text/plain:
            schema: { type: string }
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, description: "success | unchanged | error" }
                  chunk_id:
                    type: integer
                    nullable: true
                    description: First inserted rowid (null when nothing was added). v1.13.3.
                  chunk_ids:
                    type: array
                    items: { type: integer }
                    description: All inserted rowids this request. v1.13.3.
                  entries_added: { type: integer, description: Chunks actually inserted. v1.13.3. }
                  duplicates_skipped: { type: integer, description: Dedup-skipped entries. v1.13.3. }
                  entry_id:
                    type: integer
                    nullable: true
                    deprecated: true
                    description: Deprecated alias of chunk_id (was previously the count added).
                  similarity_score: { type: number }
  /search:
    get:
      summary: Hybrid semantic + lexical search (legacy GET contract)
      operationId: search
      description: >
        Legacy flat-query search. The structured v0.9.5 `QueryDoc` is available
        on `POST /recall`. Here `lex` maps to a single `LexSpec.terms` entry
        (FTS5-quoted, injection-safe); `sources` is a comma-separated OR scope.
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string }
        - name: k
          in: query
          schema: { type: integer, minimum: 1, maximum: 100 }
        - name: source
          in: query
          schema:
            type: string
            enum: [memory, markdown, structured, manual, vault, vector, fts, graph, both]
            description: "v1.13.3: ingest kind (SQL filter), retrieval leg (post-fusion filter), or both. Unknown values return 422."
        - name: sources
          in: query
          schema: { type: string, description: "comma-separated OR filter over ingest kind: memory,markdown,structured,manual,vault" }
        - name: since
          in: query
          schema: { type: string, description: ISO-8601 or YYYY-MM-DD HH:MM:SS }
        - name: lex
          in: query
          schema: { type: string, description: single lexical term (quoted) }
        - name: intent
          in: query
          schema: { type: string, description: recorded for provenance only }
        - name: profile
          in: query
          schema: { type: string, description: retrieval profile hint (passthrough) }
        - name: explain
          in: query
          schema: { type: boolean, description: return query_plan + telemetry (redacts content) }
        - name: graph
          in: query
          schema: { type: boolean, description: "v1.11.0 Associate: enable the graph-PPR retriever as a third RRF leg (opt-in)." }
      responses:
        "200":
          description: Ranked results (or explain block when explain=true)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  error: { type: string }
                  results:
                    type: array
                    items:
                      $ref: "#/components/schemas/SearchResult"
                  query_plan:
                    $ref: "#/components/schemas/QueryPlan"
                  telemetry:
                    $ref: "#/components/schemas/SearchTelemetry"
        "422":
          description: Unknown `source` value (v1.13.3). Body lists valid values.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, default: false }
                  error: { type: string }
  /v1/embeddings:
    post:
      summary: OpenAI-style embeddings
      operationId: embeddings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [input]
              properties:
                input:
                  oneOf:
                    - { type: string }
                    - type: array
                      items: { type: string }
                model: { type: string }
      responses:
        "200":
          description: Embeddings
          content:
            application/json:
              schema:
                type: object
                properties:
                  object: { type: string, example: list }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        object: { type: string }
                        embedding: { type: array, items: { type: number } }
                        index: { type: integer }
                  model: { type: string }
                  usage:
                    type: object
                    properties:
                      prompt_tokens: { type: integer }
                      total_tokens: { type: integer }
  /ingest/markdown:
    post:
      summary: Ingest a markdown document (requires title)
      operationId: ingestMarkdown
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                title: { type: string, nullable: true }
                source_path: { type: string, nullable: true, description: "Absolute file path for vault dedup/replace" }
                domain: { type: string, nullable: true, description: "Target domain (defaults to 'global' or YAML frontmatter domain:)" }
      responses:
        "200":
          description: Ingest result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  id: { type: integer }
  /graph/entity/{name}:
    get:
      summary: Get an entity and its relations
      operationId: getEntity
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          description: >-
            v1.20.18: max edges to return (default 500, clamped 1..=500). Bounded
            output keeps the operator-facing Graph surface finite on mega-hubs.
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Entity graph
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  type: { type: string }
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        to_entity: { type: string }
                        relation_type: { type: string }
                        direction: { type: string }
                  error: { type: string }
  /graph/relations:
    get:
      summary: Relations for an entity (from or to)
      operationId: getRelations
      parameters:
        - name: from
          in: query
          schema: { type: string }
        - name: to
          in: query
          schema: { type: string }
        - name: limit
          in: query
          description: >-
            v1.20.18: max relations to return (default 500, clamped 1..=500).
            Bounded output keeps the Graph surface finite on mega-hubs.
          schema: { type: integer, default: 500 }
      responses:
        "200":
          description: Relations
          content:
            application/json:
              schema:
                type: object
                properties:
                  relations:
                    type: array
                    items:
                      type: object
                      properties:
                        entity: { type: string }
                        relation: { type: string }
                        direction: { type: string }
  /graph/traverse:
    get:
      summary: Traverse the knowledge graph from an entity
      operationId: traverseGraph
      parameters:
        - name: start
          in: query
          required: true
          schema: { type: string }
          description: "Start entity. Aliases: name, entity (mirrors the response field)."
        - name: max_depth
          in: query
          schema: { type: integer, minimum: 1, maximum: 4 }
          description: "Max traversal hops (v1.4.0: hard-capped at 4 per the bounded-walk rule)"
        - name: cross_domain
          in: query
          schema: { type: boolean, default: false }
          description: "v1.0.0 M3: walk edges across every known domain pool"
        - name: at
          in: query
          schema: { type: string }
          description: "v1.4.0 Calibrate M1: bi-temporal point-in-time traversal (RFC3339 or YYYY-MM-DD). Edges whose valid-interval [valid_at, invalid_at) does not contain this instant are skipped (Graphiti semantics)."
        - name: kind
          in: query
          schema: { type: string }
          description: >
            v1.7.0 Explain: restrict the walk to edges whose relation_type
            matches. Exact match (e.g. `kind=works_at`) or prefix match when
            ending with `:` (e.g. `kind=causes:` for the causal subgraph).
            Opt-in filter — does not claim causality. Empty/absent walks all.
        - name: explain
          in: query
          schema: { type: boolean, default: false }
          description: >
            v1.7.0 Explain: when true, response includes a `paths` array with
            structured per-hop explanations ({from, relation, to}) suitable
            for rendering as "A --works_at--> B --ceo_of--> C". The flat
            `traversal` array stays for back-compat.
      responses:
        "200":
          description: Traversal
          content:
            application/json:
              schema:
                type: object
                properties:
                  traversal:
                    type: array
                    items:
                      type: object
                      properties:
                        entity: { type: string }
                        depth: { type: integer }
                        path: { type: string }
                        edge_path: { type: string, description: "v1.7.0: pipe-separated relation_types parallel to `path`" }
                        from_entity: { type: string, nullable: true, description: "v1.7.0: seed entity name" }
                        domain: { type: string }
                  paths:
                    type: array
                    description: "v1.7.0: present only when `explain=true`. Structured hop chains."
                    items:
                      type: object
                      properties:
                        hops:
                          type: array
                          items:
                            type: object
                            properties:
                              from:
                                type: object
                                properties:
                                  id: { type: string }
                                  name: { type: string }
                              relation: { type: string }
                              to:
                                type: object
                                properties:
                                  id: { type: string }
                                  name: { type: string }
                        depth: { type: integer }
                        domain: { type: string }
                  visited: { type: integer, description: "total distinct entities visited (bounded)" }
  /graph/relationships/{id}/history:
    get:
      summary: Edge supersession lineage
      operationId: getEdgeHistory
      description: >
        v1.27.22 Cascade: the full version history of a
        (from_entity, to_entity, relation_type) triple, given any one version's
        id. Returns every version in order (oldest → newest), each carrying its
        four timestamps (valid_at, invalid_at, created_at, superseded_at) and a
        `current` flag (superseded_at IS NULL). This is the read-side guarantee
        that supersession never deletes: retired versions are preserved verbatim
        and can always be reconstructed here, even though "current belief"
        reads hide them. Admin-gated at the row level (operator evidence) and
        audit-recorded.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
          description: Any version id of the triple.
      responses:
        "200":
          description: The lineage (all versions of the triple).
          content:
            application/json:
              schema:
                type: object
                properties:
                  relation_id: { type: integer }
                  from_entity: { type: string }
                  to_entity: { type: string }
                  relation_type: { type: string }
                  current:
                    type: object
                    nullable: true
                    description: The current version, if any.
                    properties:
                      id: { type: integer }
                      relation_id: { type: integer }
                      from_entity: { type: string }
                      to_entity: { type: string }
                      relation_type: { type: string }
                      knowledge_id: { type: integer, nullable: true }
                      valid_at: { type: string, nullable: true }
                      invalid_at: { type: string, nullable: true }
                      created_at: { type: string, nullable: true }
                      superseded_at: { type: string, nullable: true }
                      current: { type: boolean }
                  versions:
                    type: array
                    description: All versions, oldest → newest.
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        relation_id: { type: integer }
                        from_entity: { type: string }
                        to_entity: { type: string }
                        relation_type: { type: string }
                        knowledge_id: { type: integer, nullable: true }
                        valid_at: { type: string, nullable: true }
                        invalid_at: { type: string, nullable: true }
                        created_at: { type: string, nullable: true }
                        superseded_at: { type: string, nullable: true }
                        current: { type: boolean }
        "404":
          description: Relationship id not found
  /get/{id}:
    get:
      summary: Fetch a single chunk by id (stable reference)
      operationId: getChunk
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The chunk with provenance span + source link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Chunk"
        "404":
          description: Chunk not found
  /multi-get:
    post:
      summary: Fetch multiple chunks by id (bounded)
      operationId: multiGet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  maxItems: 1000
      responses:
        "200":
          description: Array of chunks (missing ids omitted)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chunk"
  /sources/reconcile:
    post:
      summary: Retire active sources whose live URI is no longer present
      operationId: reconcileSources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, live_uris]
              properties:
                kind: { type: string, description: e.g. "vault" }
                live_uris:
                  type: array
                  items: { type: string }
                  maxItems: 50000
      responses:
        "200":
          description: Reconcile result
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted_sources: { type: integer }
                  deleted_chunks: { type: integer }
                  orphan_uris:
                    type: array
                    items: { type: string }
  /sources/{id}:
    delete:
      summary: Retire a single source by id
      operationId: deleteSource
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Source retired
          content:
            application/json:
              schema:
                type: object
                example: {"deleted": true, "source_id": 13}
                description: 'true when the source existed and was retired; false when the id was already gone'
        "404":
          description: No such source
  /connectors:
    get:
      summary: List registered connector instances
      operationId: listConnectors
      responses:
        "200":
          description: Connector list (ordered by kind, then instance)
          content:
            application/json:
              schema:
                type: object
                properties:
                  connectors:
                    type: array
                    items:
                      $ref: '#/components/schemas/ConnectorRow'
  /connectors/register:
    post:
      summary: Register (or reactivate) a connector instance for a domain
      operationId: registerConnector
      description: >-
        Admin + audited. Validates the kind against the shipped vocabulary, then
        enforces the domain's bound profile `connectors_allowed`: a kind the
        profile does not grant is refused with 403 connector_not_in_profile. The
        default domain is 'global'; an unbound domain is the no-constraint
        posture (registration allowed).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterConnectorRequest'
      responses:
        "200":
          description: Registered (or reactivated) connector instance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterConnectorResponse'
        "403":
          description: The kind is not permitted by the domain's bound profile
  /webhooks/{kind}:
    post:
      summary: Verified webhook receiver (v0.9.7 Guard)
      operationId: receiveWebhook
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Connector kind, e.g. 'github'.
      responses:
        "200":
          description: Webhook accepted/enqueued (or duplicate)
          content:
            application/json:
              schema:
                type: object
                example: {"status": "enqueued"}
                description: '"enqueued" when the payload was queued for the connector worker; "duplicate" when a byte-identical payload for the same connector is already queued (idempotent replay)'
        "401":
          description: Signature verification failed
  /webhooks/channel/{kind}:
    post:
      summary: Channel bridge inbound receiver (v1.28.43 Switchboard)
      operationId: receiveChannelWebhook
      description: >-
        GOVERNED EDGE inbound for channel bridges (Signal first; the edge holds
        only its own 0600 `channel-{kind}-{tenant}.json` credentials, never a
        brain token). Verifies the Standard Webhooks signature against the
        bridge's config secret, replay-caps on (bridge, external_id), then in
        ONE transaction: sanitizes + injection-screens the text BEFORE any
        state, resolves the conversation thread via `channel_threads` (unknown
        conversations auto-open a `care/case` run under the bridge's domain;
        `[case N]` addressing overrides the map, cross-domain refused), and
        lands the message as a SCREENED case note with its audit row.
        Caravel (WhatsApp): attachment digests ride ON the note; delivery
        receipts land as ONE `case/channel_status` lineage event; tier
        transitions fire metadata-only operator alerts. The subscription
        handshake (`hub.challenge`) is answered by the EDGE process and never
        reaches the kernel.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
          description: Channel kind (filename segment of the bridge config), e.g. 'signal'.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [envelope]
              properties:
                envelope:
                  type: object
                  required: [conversation_ref, text, external_id]
                  description: >-
                    Caravel additions (all optional): `attachment_digests`
                    records SHA-256s ON the landed note (bytes stay quarantined
                    on the edge); `status` projects a platform delivery receipt
                    into ONE `case/channel_status` lineage event (refs never
                    bodies); `quality` reports a number-tier transition and
                    fires a METADATA-ONLY operator alert (alias + tiers).
                    Status/quality envelopes carry NO text.
                  properties:
                    conversation_ref:
                      type: string
                      maxLength: 200
                    text:
                      type: string
                    external_id:
                      type: string
                      maxLength: 200
                      description: Platform message id — the replay-cap key half.
                    attachment_digests:
                      type: array
                      maxItems: 8
                      items:
                        type: string
                        pattern: '^[0-9a-f]{64}$'
                      description: SHA-256 of each attachment; recorded verbatim on the note.
                    status:
                      type: object
                      required: [state, ref]
                      properties:
                        state:
                          type: string
                          enum: [sent, delivered, read, failed]
                        ref:
                          type: string
                          maxLength: 200
                          description: Platform message id the receipt refers to.
                    quality:
                      type: object
                      required: [number_alias, new_tier]
                      properties:
                        number_alias:
                          type: string
                          maxLength: 64
                        old_tier:
                          type: string
                          enum: [green, yellow, orange, red]
                        new_tier:
                          type: string
                          enum: [green, yellow, orange, red]
                    actor_ref:
                      type: string
                      maxLength: 128
                      description: >-
                        OPAQUE platform user id of the human sender (Herald).
                        When it maps in the bridge's user map AND the domain's
                        Crew DPO switch is on, it feeds presence as an activity
                        KIND only — never a display name, never content.
      responses:
        "200":
          description: >-
            Landed. `note_recorded` for message envelopes (with case_run_id /
            note_id / opened_case), `status_lineage_recorded` for delivery
            receipts, `quality_observed` (alerts_published = 0|1) for tier
            transitions — or `{"status":"duplicate"}` for replayed ids.
          content:
            application/json:
              schema:
                type: object
                example: {"status": "note_recorded", "case_run_id": 41, "note_id": 7, "opened_case": true}
        "400":
          description: Envelope invalid / screening refusal (blocklist or bounds)
        "401":
          description: Bridge signature verification failed / timestamp outside window
        "409":
          description: '[case N] addressing refused — run not in this bridge''s domain'
        "503":
          description: Flood bound hit (back off; retry later)
  /webhooks/channel/{kind}/drain:
    post:
      summary: Channel outbound drain for bridge cranks (v1.28.43 Switchboard)
      operationId: drainChannelOutbox
      description: >-
        Pull-model delivery of approved outbound envelopes from the `channel/out`
        topic to the SAME HMAC-authenticated bridge. Rows are ONLY approved acts
        (digest-bound proposals) or consented alert forwards — the alert bus stays
        metadata-only and this topic never rides the SSE broadcast. Rows stay
        pending until the bridge acks (`drain/ack`); unacked rows redrill and
        bridges dedupe on event_id (at-least-once, v1.28.78).
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Drain batch (possibly empty). `pings` (Herald) carries Relay handover pings — the receiving operator's mapped platform refs, the case room, and the I-PASS completeness state (refs only, never case content). Absent/empty when none.
          content:
            application/json:
              schema:
                type: object
                example: {"status": "ok", "count": 1, "envelopes": [{"event_id": 12, "text": "…", "source_payload": {"source": "approved_act", "proposal_id": 3, "kind": "channel/template", "template": "order_update_v3", "digest": "<sha256-of-drained-body>"}}], "pings": [{"event_id": 13, "to_principal": "ops@acme", "platform_refs": ["U0PING1"], "case_channel": "C0123ABCD", "case_run_id": 41, "offer_id": 3, "complete": true, "missing": []}]}
        "401":
          description: Bridge signature verification failed
  /webhooks/channel/{kind}/drain/ack:
    post:
      summary: Bridge delivery ack for drained channel/out envelopes (v1.28.78)
      operationId: ackChannelOutbox
      description: >-
        The at-least-once close of the pull-model drain: the bridge confirms
        delivered `event_id`s and those rows mark delivered. Same HMAC seam
        as the drain; acks are thread-scoped (a bridge cannot ack another
        bridge's rows) and idempotent. Unacked rows stay pending and redrill.
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Ack count. `acked` rows marked delivered.
          content:
            application/json:
              schema:
                type: object
                example: {"status": "ok", "acked": 2}
        "401":
          description: Bridge signature verification failed
  /webhooks/channel/{kind}/console:
    post:
      summary: Bridge-relayed operator console for the Slack/Teams annex (Herald)
      operationId: channelConsole
      description: >-
        The SAME HMAC-authenticated seam, carrying the console INTO the
        kernel for an operator who lives in Slack/Teams. The kernel resolves
        every actor through the proposal-maintained `channel_user_map`
        (platform identity is NEVER auto-trusted), role-checks the mapped
        principal against the role store, and then reuses the existing
        console machinery — `decide` runs the byte-identical approve/reject
        verbs, so the digest binding holds TWICE: bridge-side against the
        rendered digest, and server-side inside the approve verb
        (`digest_required`). Closed action vocabulary: `pending`
        (renderable proposals with their canonical review digest), `decide`
        (approve/reject + digest + actor), `due` (the valet due listing),
        `crank` (a bounded steward-harness crank, role-gated).
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [pending, decide, due, crank]
                decision:
                  type: string
                  enum: [approve, reject]
                proposal_id:
                  type: integer
                digest:
                  type: string
                  pattern: '^[0-9a-fA-F]{64}$'
                  description: The content_digest the operator was shown — REQUIRED for decide.
                actor_ref:
                  type: string
                  maxLength: 128
                  description: The opaque platform user id taking the action.
                limit:
                  type: integer
                run_id:
                  type: integer
                max_steps:
                  type: integer
      responses:
        "200":
          description: Action result (pending list / decide receipt / due listing / crank report)
          content:
            application/json:
              schema:
                type: object
                example: {"status": "approved", "id": 3}
        "400":
          description: Digest missing/malformed, or invalid action/actor/run
        "401":
          description: Bridge signature verification failed / timestamp outside window
        "403":
          description: Actor not mapped in the user map, unroled, or lacking the capability
        "404":
          description: Proposal already decided (replay = decided queue, never a second approval)
        "409":
          description: Proposal content changed since it was rendered (digest mismatch)
  /workflow/channel/user-map:
    post:
      summary: File a channel user-map change as a HITL proposal (Herald)
      operationId: postChannelUserMap
      description: >-
        The ONLY way identity mappings enter the system: a proposal. The
        `channel_user_map` TABLE has no write route — its sole writer is
        the approval path, so a Slack/Teams identity is never auto-trusted
        from platform membership. Payload names the bridge (channel +
        tenant), the OPAQUE platform user id, the principal it maps to,
        the role names it acts under (each must exist in the role store),
        and the action (add|remove). Probe-validated and audited at file
        time; applied only when the proposal is approved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, channel, tenant, platform_user_id, principal]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                channel:
                  type: string
                  maxLength: 32
                tenant:
                  type: string
                  maxLength: 32
                platform_user_id:
                  type: string
                  maxLength: 128
                  description: Opaque platform id — never a display name.
                principal:
                  type: string
                  maxLength: 256
                roles:
                  type: array
                  maxItems: 8
                  items:
                    type: string
      responses:
        "200":
          description: Proposal filed (status pending until approved)
          content:
            application/json:
              schema:
                type: object
                example: {"proposal_id": 17, "kind": "channel/user_map", "status": "pending"}
        "400":
          description: Change invalid (shape, bounds, or unknown role name)
        "403":
          description: Not authorized (Write on global required)
  /consolidate/propose:
    post:
      summary: Propose consolidation candidates (v0.9.8 Evidence; v1.6.0 unresolved-contradictions)
      operationId: proposeConsolidate
      description: >-
        Pure detection — finds exact-duplicate chunks, subject conflicts, and
        (v1.6.0) unresolved `contradicts` links. Never mutates rows. Review
        the returned candidates, then apply chosen links via
        POST /consolidate/apply. v1.6.0: `apply` with kind=`supersedes` now
        atomically expires the prior chunk (sets valid_to=now).
      responses:
        "200":
          description: Consolidation proposal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsolidateProposal'
  /consolidate/apply:
    post:
      summary: Record operator-chosen evidence links (v0.9.8; v1.6.0 supersedes expires)
      operationId: applyConsolidate
      description: >-
        Records typed links. v1.6.0: a link with kind=`supersedes` now expires
        the prior (to_chunk) fact atomically — sets valid_to=now so default
        /recall excludes it while ?at=<past> still returns it. Other kinds
        (contradicts/supports/references/derived_from) just record the link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyRequest'
      responses:
        "200":
          description: Links recorded (rejected links reported, non-fatal)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplyResponse'
  /consolidate/undo:
    post:
      summary: Reverse prior supersession resolutions (v1.8.0 Maintain)
      operationId: undoConsolidate
      description: >-
        v1.8.0 roadmap exit criterion: "reject or undo them without retrieval
        regression." For each `old_chunk`, clears `valid_to` back to NULL +
        removes the `supersedes` evidence_link, restoring the chunk to current
        recall. Audited. Idempotent (no-op if nothing to undo).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_chunks]
              properties:
                old_chunks:
                  type: array
                  items: { type: integer }
                  description: Chunk ids previously expired via supersedes.
      responses:
        "200":
          description: Undo result
          content:
            application/json:
              schema:
                type: object
                properties:
                  undone: { type: integer, description: "State changes applied (0 if nothing to undo)" }
                  rejected:
                    type: array
                    items: { type: string }
  /audit:
    get:
      summary: Operator audit-log diagnostics (v0.9.7 Guard; v1.1.0 tenant filter; v1.27.31 multi-domain)
      operationId: listAudit
      description: >
        v1.27.31 "AuditRepair" (M4/F-22): in multi-db mode the list covers
        EVERY registered domain's chain (rows carry their `domain` tag,
        merged newest-first); shim mode stays the single shared pool with
        every row tagged `global`.
      parameters:
        - name: kind
          in: query
          required: false
          schema:
            type: string
          description: >
            Filter by audit kind (auth|ingest|webhook|reconcile|backup|connector|
            recall|search|get|breach|transfer|client|graphread|retention|workflow|anchor)
        - name: tenant
          in: query
          required: false
          schema:
            type: string
          description: v1.1.0 — scope rows to a tenant at the SQL layer (default returns all tenants)
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max events to return (default 100, capped at MAX_MULTI_GET)
        - name: offset
          in: query
          required: false
          schema:
            type: integer
          description: v1.16.7 — pagination cursor (rows are newest-first; offset past the last row returns []). Pair with limit for Load-more paging.
      responses:
        "200":
          description: Recent audit events (hashes only; no raw secrets)
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditRow'
  /audit/export:
    get:
      summary: Export the Art.12 decision-evidence ledger (compliance-pack feature; v1.28.5)
      operationId: exportAudit
      description: >
        v1.28.5 "Compliance Pack": streams the per-decision evidence records
        (hash-chained, optionally Ed25519-signed via BRAIN_AUDIT_SIGNING_KEY)
        as JSONL or a human-readable PDF. `rpcId` is echoed on the first JSONL
        line for reconciliation. Admin only. Route exists only when the server
        is built with --features compliance-pack.
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
          description: Unix-seconds lower bound on record ts
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [jsonl, pdf]
        - name: rpcId
          in: query
          required: false
          schema:
            type: string
          description: Caller-supplied correlation id echoed in the export envelope
      responses:
        "200":
          description: The evidence bundle (attachment)
          content:
            application/x-ndjson:
              schema:
                type: string
            application/pdf:
              schema:
                type: string
  /audit/verify:
    get:
      summary: Verify the audit hash chain (v1.1.0 Harden; v1.27.31 multi-domain)
      operationId: verifyAuditChain
      description: >
        v1.27.31 "AuditRepair" (M4/F-22): verifies EVERY registered domain's
        chain, not just the global pool — `ok` is the all-domains aggregate
        and `domains` names each chain (a broken second-domain chain is
        reported, never silently absorbed). Chain verification is epoch-
        aware: a DB re-anchored via `brain-server --re-audit` verifies its
        HMAC-SHA256 links + head pin; a DB without its chain key reads as
        not-ok (fail-closed — cannot attest what it cannot compute).
      responses:
        "200":
          description: Chain integrity result (all registered domains)
          content:
            application/json:
              schema:
                type: object
                example: {"ok": true, "domains": {"global": true, "health": true}}
                properties:
                  ok:
                    type: boolean
                    description: true when every registered domain's recomputed chain matches its stored links + head pin
                  domains:
                    type: object
                    additionalProperties: { type: boolean }
                    description: v1.27.31 — per-domain verification breakdown
  /compliance/evaluation-record:
    post:
      summary: Append an accuracy/validation declaration to the decision ledger (Art.15; compliance-pack; v1.28.5)
      operationId: postEvaluationRecord
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [declaration, dataset_hash]
              properties:
                declaration: { type: string, description: free-text accuracy/validation methodology summary }
                dataset_hash: { type: string, description: SHA-256 of the frozen evaluation dataset }
                system_version: { type: string }
      responses:
        "201":
          description: The stored DecisionRecord
        "400": { description: evaluation_record_incomplete }
  /compliance/inventory:
    get:
      summary: Evidence-inventory checker across Art.12/14/15/17/73 + RoPA artefacts (compliance-pack; v1.28.5)
      operationId: complianceInventory
      responses:
        "200":
          description: Per-artifact presence flags; `complete` false when any class is missing
          content:
            application/json:
              schema:
                type: object
                properties:
                  complete: { type: boolean }
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        artifact: { type: string }
                        present: { type: boolean }
                        count: { type: integer }
  /ropa:
    get:
      summary: List RoPA activities (GDPR Art.30; compliance-pack; v1.28.5)
      operationId: listRopa
      responses:
        "200":
          description: The processing-activities register
          content:
            application/json:
              schema:
                type: object
                properties:
                  activities: { type: array, items: { $ref: '#/components/schemas/RopaActivity' } }
    post:
      summary: Create one RoPA activity (Admin; audited; compliance-pack; v1.28.5)
      operationId: createRopa
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RopaInput' }
      responses:
        "201": { description: Created (returns the row id) }
        "400": { description: ropa_incomplete }
  /ropa/{id}:
    post:
      summary: Update one RoPA activity (Admin; audited; compliance-pack; v1.28.5)
      operationId: updateRopa
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RopaInput' }
      responses:
        "201": { description: Created (returns the row id) }
        "400": { description: ropa_incomplete }
  /metrics:
    get:
      summary: Prometheus text-format exporter (v1.1.0 Harden M5)
      operationId: getMetrics
      responses:
        "200":
          description: Prometheus exposition text
          content:
            text/plain:
              schema:
                type: string
  /quarantine:
    get:
      summary: List quarantined (flagged) chunks (v0.9.7 Guard)
      operationId: listQuarantine
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
          description: Max rows to return (default 100, capped at MAX_MULTI_GET)
      responses:
        "200":
          description: Flagged chunks awaiting operator review (hashes only)
          content:
            application/json:
              schema:
                type: object
                properties:
                  quarantined:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                          nullable: true
                        source:
                          type: string
                          nullable: true
                        content_hash:
                          type: string
                          nullable: true
                        created_at:
                          type: string
                          nullable: true
                  count:
                    type: integer
  /quarantine/{id}/release:
    post:
      summary: Release a quarantined chunk back into retrieval (v0.9.7 Guard)
      operationId: releaseQuarantine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Quarantined chunk id
      responses:
        "200":
          description: Chunk released (flag cleared)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  released:
                    type: integer
        "404":
          description: No quarantined chunk with that id
  /quarantine/{id}/delete:
    post:
      summary: Delete a quarantined chunk (v0.9.7 Guard)
      operationId: deleteQuarantine
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: Quarantined chunk id
      responses:
        "200":
          description: Chunk purged (knowledge row + vec0 entry removed)
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  deleted:
                    type: integer
        "404":
          description: No quarantined chunk with that id
  /recall:
    post:
      summary: Deterministic end-to-end recall (v0.9.5 structured QueryDoc)
      operationId: recall
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryDoc"
      responses:
        "200":
          description: Recall hits + unified telemetry/provenance envelope
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits:
                    type: array
                    items:
                      $ref: "#/components/schemas/RecallHit"
                  decision:
                    type: string
                    enum: [ok, low_confidence]
                    default: ok
                    description: >
                      v1.5.0 "Epistemic" — calibrated abstention. `low_confidence`
                      is returned (with empty `hits`) when the quality estimator
                      classifies the query as ClarifyQuery: too weak to support a
                      claim. NOT a single-score cutoff; driven by overlap + gap +
                      lexical density signals.
                  domain: { type: string, nullable: true }
                  domains_searched:
                    type: array
                    items: { type: string }
                    description: "Domains of the returned hits. Always present (empty array when no hits); v1.13.3."
                  included_global:
                    type: boolean
                    description: "True when the global corpus was mixed into a domain-routed query (shim rescue leg). Always present; cross-domain mixing is visible, never silent."
                  telemetry:
                    $ref: "#/components/schemas/SearchTelemetry"
                  trace_id:
                    type: integer
                    nullable: true
                    description: >
                      v1.15.0 "Observe" — id of the recorded read-event audit
                      row when read-event auditing is on and the trace was
                      captured (see `trace` param). Replayable via
                      `GET /recall/{trace_id}/trace`. Null when auditing is
                      off/sampled-out or `trace` was not requested.
        "422":
          description: Unknown `source` value (v1.13.3). Body lists valid values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /verify:
    post:
      summary: Verify a claim against a chunk's actual text (v1.5.0)
      operationId: verifyClaim
      description: >
        Deterministic span verification (arXiv:2607.00895 baseline). Given a
        `claim` and a `chunk_id`, returns whether the claim is supported by
        the chunk's text via case-insensitive substring match. No embeddings,
        no LLM, no model load — the hallucination-resistance primitive.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunk_id, claim]
              properties:
                chunk_id: { type: integer }
                claim:
                  type: string
                  description: Claim to verify. Whitespace-trimmed; max 2000 chars.
      responses:
        "200":
          description: Verification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VerifyResponse"
        "400":
          description: Empty or oversized claim
        "404":
          description: No chunk with that id
  /procedure:
    post:
      summary: Ingest a procedure with ordered steps (v1.10.0 "Procedural")
      operationId: createProcedure
      description: >
        Ingests a procedure root chunk (node_kind='procedure') + each ordered
        step as its own chunk in ONE transaction. Steps are linked to the root
        via `next_step` edges carrying an explicit `step_index`. A step may
        carry a decision rule (JSON in content, node_kind='decision'). Up to
        100 steps. Embeddings are written best-effort after the commit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title: { type: string, description: Non-empty, max 200 chars. }
                content:
                  type: string
                  description: Procedure root body (overview / when-to-use).
                steps:
                  type: array
                  maxItems: 100
                  items:
                    type: object
                    required: [title, content]
                    properties:
                      title: { type: string }
                      content: { type: string }
                      is_decision:
                        type: boolean
                        default: false
                        description: Store this step as a decision rule (JSON in content).
                domain:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
      responses:
        "200":
          description: Procedure created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, description: Root chunk id. }
                  status: { type: string, example: created }
                  step_ids: { type: array, items: { type: integer } }
        "400": { description: Empty/oversized title, content, step, or too many steps }
        "413": { description: Content exceeds MAX_CONTENT bytes }
  /procedure/{id}/steps:
    get:
      summary: Ordered step chain for a procedure (v1.10.0)
      operationId: procedureSteps
      description: >
        Returns the root + its `next_step` children ordered by `step_index`.
        Each step exposes its `memory_kind` (step/decision, normalized via
        the forward-compat parse: unknown values fall back to fact).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Ordered steps
          content:
            application/json:
              schema:
                type: object
                properties:
                  procedure_id: { type: integer }
                  title: { type: string, nullable: true }
                  content: { type: string, nullable: true }
                  steps:
                    type: array
                    items:
                      $ref: "#/components/schemas/StepView"
        "404": { description: No procedure with that id }
  /classify:
    post:
      summary: Deterministic categorization (v1.10.0, Mem0's premium free)
      operationId: classify
      description: >
        Keyword-router categorization — no LLM, no cloud, fully auditable.
        Returns the winning category, confidence, the matched keywords, and
        the full taxonomy. `general` (confidence 0.0) when no keyword clears
        the threshold. Also returns the DEFERRAL DECISION for the same label,
        so a client learns "what is this?" and "does a human decide it?" in one
        call and cannot reconstruct the second from the confidence number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text: { type: string, description: Max MAX_CONTENT bytes. }
      responses:
        "200":
          description: Classification
          content:
            application/json:
              schema:
                type: object
                properties:
                  result: { $ref: "#/components/schemas/CategoryResult" }
                  categories: { type: array, items: { type: string } }
                  deferral: { $ref: "#/components/schemas/DeferralReceipt" }
        "400": { description: Empty text }
        "413": { description: Text exceeds MAX_CONTENT bytes }
  /decision/{id}/evaluate:
    post:
      summary: Evaluate a stored decision rule (v1.10.0)
      operationId: evaluateDecision
      description: >
        Loads the decision rule stored as JSON content on the `decision`-kind
        chunk `id` and evaluates it against numeric input variables. First
        matching branch wins; otherwise the rule's default_branch. Pure rule
        engine — no LLM.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                variables:
                  type: object
                  additionalProperties: { type: number }
                  description: 'Numeric inputs, e.g. {"employee_count": 25}.'
      responses:
        "200":
          description: Evaluation outcome
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionOutcome"
        "404": { description: No decision rule with that id }
        "400": { description: Stored content is not valid decision JSON }
  /suggest:
    post:
      summary: Opt-in anticipation pull (v1.9.0 "Suggest")
      operationId: suggest
      description: >
        Explicit, opt-in pull for related-but-not-surfaced chunks. The caller
        supplies the working `context`; the server embeds it and returns chunks
        that did not come up in a direct `/recall` (excluded via `exclude`).
        Every hit is tagged `provenance.reason = "anticipated"` so the
        consuming agent may ignore it. NOT proactive push — the agent asks.
        Gated by `BRAIN_SUGGEST_ENABLED` (returns 501 when disabled).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [context]
              properties:
                context:
                  type: string
                  description: What the caller is working on right now. Max 2000 chars.
                exclude:
                  type: array
                  maxItems: 100
                  items: { type: integer }
                  description: Chunk ids already surfaced (e.g. this turn's /recall hits).
                k:
                  type: integer
                  minimum: 1
                  maximum: 20
                  default: 5
                domain:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
                session:
                  type: string
                  description: Caller-supplied opaque session label (Mem0 run_id pattern).
      responses:
        "200":
          description: Suggestion list
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/SuggestionHit" }
                  telemetry: { $ref: "#/components/schemas/SuggestTelemetry" }
        "400":
          description: Invalid context / k / exclude
        "501":
          description: BRAIN_SUGGEST_ENABLED=false — surface disabled
  /suggest/feedback:
    post:
      summary: Record accept/dismiss for a surfaced suggestion (v1.9.0)
      operationId: suggestFeedback
      description: >
        Mem0-style feedback (POSITIVE/NEGATIVE collapsed to accept/dismiss).
        Drives the false-positive metric surfaced by `GET /suggest/metrics`.
        `reason` is hashed server-side, never stored raw. The feedback table
        is the audit surface for this mutation (append-only, tenant-scoped).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [chunk_id, feedback]
              properties:
                chunk_id: { type: integer }
                feedback:
                  type: string
                  enum: [accept, dismiss]
                reason:
                  type: string
                  description: Optional free-text reason (hashed before storage).
                session:
                  type: string
      responses:
        "200":
          description: Feedback recorded
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: recorded }
        "400":
          description: feedback must be 'accept' or 'dismiss'
        "404":
          description: No chunk with that id (refuses feedback on typos)
        "501":
          description: BRAIN_SUGGEST_ENABLED=false — surface disabled
  /suggest/metrics:
    get:
      summary: False-positive rate over the feedback ledger (v1.9.0)
      operationId: suggestMetrics
      description: >
        The v1.9 roadmap exit criterion, made queryable. Returns accept /
        dismiss counts and the false-positive rate (dismisses / total) over the
        feedback table. Optional `session` / `since` filter the window.
        Tenant-scoped: a principal sees only their own feedback rows.
      parameters:
        - in: query
          name: session
          schema: { type: string }
        - in: query
          name: since
          schema: { type: string }
          description: ISO-8601 timestamp (RFC3339 or YYYY-MM-DD).
      responses:
        "200":
          description: Metric totals + rates
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SuggestMetrics" }
        "501":
          description: BRAIN_SUGGEST_ENABLED=false — surface disabled
  /ingest/proposal:
    post:
      summary: Write-back gate — propose a candidate memory (v1.14.0 M1)
      operationId: ingestProposal
      description: >
        Human-in-the-loop write-back. A proposal stores a *candidate* memory
        scored deterministically (novelty via vec0 KNN, conflict via the
        consolidate machinery, salience via a length/entity heuristic) but
        creates NO `knowledge` row — the candidate becomes memory only when a
        human approves it (`POST /proposals/{id}/approve`). No auto-promote.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 10000 }
                kind:
                  type: string
                  enum: [fact, procedure, step, decision, episodic, entitlement, draft, channel/template, registry_lifecycle]
                  default: fact
                  description: >-
                    `draft` is proposal-only (never becomes a knowledge
                    node_kind). `channel/template` (Caravel) is likewise
                    proposal-only: its content is the JSON send packet
                    `{tenant, conversation_ref, template, body}` and approval
                    dispatches through the channel seam — never promoted to
                    knowledge. `registry_lifecycle` is proposal-only (never
                    becomes a knowledge node_kind). Its `content` string is the
                    exact JSON serialization of
                    `{"action":"promote"|"retire","id":"<registry id>","version":"<registry version>","row_digest":"<64 lowercase hex>","row":{"id":"<same id>","version":"<same version>","kind":"deterministic-rules"|"learned"|"reranker","name":"<bounded name>","output_vocabulary":["choice"|"score"|"noul"],"artifact_digest":"<64 lowercase hex>"|null,"config_digest":"<64 lowercase hex>"|null,"calibration_ref":"<bounded string>"|null,"status":"candidate"|"evaluated"|"promoted"|"retired","evaluation_refs":[],"proposed_by":"<actor label>","approved_by":"<actor label>"|null,"created_at":0,"updated_at":0}}`.
                    Copy `row` and `row_digest` unchanged from the single-row
                    `GET /workflow/model-registry/{model_ref}` response. Only
                    `promote` and `retire` are legal. Creation validates the
                    live row, digest, and legal transition but does not dispose
                    the proposal, create knowledge, or change status; only the
                    existing human approval gate disposes it. Non-empty
                    `evaluation_refs` are refused. This is not a generic
                    signature record and does not make `evaluated` reachable.
                source: { type: string }
                origin_context:
                  type: string
                  enum: [owner, channel]
                  description: >
                    `channel` stamps the proposal's source as
                    `channel-capture` — the review-queue badge the operator
                    approves against; the promoted row carries the origin.
                authority: { type: number }
                observed_at: { type: integer }
                domain: { type: string }
                title:
                  type: string
                  maxLength: 500
                  description: >-
                    v1.28.53 "Triage": the optional candidate title (the
                    autocapture's source title), stored on the proposal row and
                    surfaced in the queue view. Bounded + screened like every
                    untrusted text; never gates approval. The row is stamped
                    with the `domain` the write was authorized against.
      responses:
        "200":
          description: Proposal queued with deterministic scores
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [pending] }
                  novelty: { type: number }
                  conflict_with: { type: integer }
                  salience: { type: number }
  /proposals:
    get:
      summary: List the review queue (v1.14.0 M1)
      operationId: listProposals
      description: >
        The human review queue. v1.20.23 adds `decided_at` (the decision
        timestamp, `null` while pending — the reviewer calibration signal) and
        an optional `since` window so a client can fetch a bounded 7/30-day
        decision set in one request. v1.28.53 "Triage": every row carries its
        `domain` residency label, and an optional `domain` query param scopes
        the queue — the read gate checks the REQUESTED domain (fail-closed 403
        for a foreign one; loopback/opaque unchanged), so a site-scoped
        reviewer works only their own queue. Absent → the legacy
        global-authorized queue.
      parameters:
        - in: query
          name: status
          schema: { type: string, enum: [pending, approved, rejected] }
        - in: query
          name: domain
          schema: { type: string }
          description: >-
            v1.28.53: narrow the queue to rows stamped with this domain
            (pre-Triage rows read `global` forever). The caller must hold a
            Read grant on the named domain.
        - in: query
          name: since
          schema: { type: integer }
          description: >-
            v1.20.23: unix ts lower bound on `created_at`; rows created before
            it are excluded. Absent → every row (the legacy query).
        - in: query
          name: limit
          schema: { type: integer, default: 50 }
          description: >-
            Max rows (clamped to 200). A `since` window still stops at
            `limit`, so a stats fetch must pass `limit=200` to read a full window.
      responses:
        "200":
          description: Proposals in the queue
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProposalView"
  /proposals/{id}/approve:
    post:
      summary: Approve a proposal — promote to memory in one tx (v1.14.0 M1)
      operationId: approveProposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
        - in: query
          name: supersedes
          schema: { type: integer }
          description: Expire an existing chunk via resolve_supersession in the same tx.
        - in: query
          name: digest
          required: true
          schema: { type: string }
          description: >
            v1.27.12 "ReviewArmour": REQUIRED — the `content_digest` the
            reviewer was shown (returned by GET /proposals); absent is
            `400 digest_required`. The server recomputes it from the current
            row and returns 409 if the content drifted since display — the
            approval binds to the bytes that were actually rendered.
      responses:
        "200":
          description: >-
            Kind-dependent. Memory kinds promote to a knowledge row;
            `channel/template` (Caravel) CASes approved and DISPATCHES the
            governed send in the SAME tx — `{moved:true, enqueued:true,
            case_run_id, opened_case}` on dispatch, `{moved:false}` as the
            decided receipt when the proposal was already decided (replay-
            safe, never double-sends), or — only when the kernel's own gates
            still refuse (e.g. no standing consent for business-initiated
            contact) — 409 with the approval rolled back and nothing written.
          content:
            application/json:
              schema:
                type: object
                example: {"proposal_id": 42, "chunk_id": 317, "status": "approved", "superseded": null}
                description: 'superseded = the chunk id expired via resolve_supersession in the same tx, or null when none was requested'
        "409":
          description: >
            Proposal content changed since it was displayed (content_digest
            mismatch) — reload and re-approve.
  /proposals/{id}/reject:
    post:
      summary: Reject a proposal — creates nothing (v1.14.0 M1)
      operationId: rejectProposal
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Proposal rejected
          content:
            application/json:
              schema:
                type: object
                example: {"proposal_id": 42, "status": "rejected"}
                description: 'creates nothing — the proposal row is marked rejected and the audit chain records the decision'
  /proposals/{id}/edit:
    post:
      summary: Edit a pending proposal's content and re-score it (v1.20.14 M1)
      operationId: editProposal
      description: >
        Rewrites a pending proposal's content, recomputes the deterministic
        novelty / conflict / salience scores, and stamps `edited_at`. The
        injection screen still runs (Reject → 400 `input_rejected`). The audit
        detail records only the SHA-256 of the before + after content. Only
        `pending` proposals may be edited (already-decided → 409).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  description: The replacement content (non-empty, <= MAX_QUERY chars).
      responses:
        "200":
          description: The re-scored proposal with `edited_at` set
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  kind: { type: string }
                  content: { type: string }
                  source: { type: string, nullable: true }
                  source_prompt: { type: string, nullable: true }
                  authority: { type: number, nullable: true }
                  novelty: { type: number }
                  conflict_with: { type: integer, nullable: true }
                  salience: { type: number }
                  created_at: { type: integer }
                  screen_verdict: { type: string, enum: [clean, quarantine] }
                  edited_at: { type: integer, nullable: true }
                  decided_at:
                    type: integer
                    nullable: true
                    description: >-
                      v1.20.23: unix ts of the decision (approve/reject/expire);
                      `null` while pending. The reviewer calibration latency
                      input (`decided_at - created_at`).
                  expires_at:
                    type: integer
                    description: Unix deadline when this proposal ages out of the review window (created_at + TTL); the client ticks its countdown against this.
                  warn_secs:
                    type: integer
                    description: SLA warn band (secs of remaining life), mirroring ALERT_WARN_SECS.
                  critical_secs:
                    type: integer
                    description: SLA critical band (secs of remaining life), mirroring ALERT_CRITICAL_SECS.
                  owner:
                    type: string
                    nullable: true
                    description: >-
                      v1.27.8: the agent whose interaction produced the candidate;
                      `null` for loopback/opaque (unowned) writes. Keys the
                      supervisor's owner scope (R1 role `manages`).
                  qa_note:
                    type: string
                    nullable: true
                    description: >-
                      v1.27.8: the supervisor's coaching note (set via the coach
                      verb); `null` until coached.
                  qa_score:
                    type: integer
                    description: >-
                      v1.27.8: the R7 QA scorecard composed from the proposal's
                      owner + trace signals (0..100, advisory, never gates approve).
        "400":
          description: Empty/too-long content, injection reject, or expired proposal
        "409":
          description: Proposal already decided by a concurrent action
  /decayed:
    get:
      summary: List decayed chunks for operator review (v1.14.0 M2)
      operationId: listDecayed
      description: >
        Chunks whose effective expiry (own `expires_at`, else the kind-level
        retention default derived from `created_at`) is in the past. Each row
        carries a `reason` (`per_chunk` or `kind_policy`) so the operator sees
        *why* a chunk is decayed. Nothing is deleted autonomously; the operator
        reviews and purges explicitly. v1.20.18: bounded by `limit`/`offset`.
      parameters:
        - name: limit
          in: query
          description: >-
            v1.20.18: max decayed rows per page (default 500, clamped 1..=500);
            `?offset=` pages the rest. Applied after the Rust-side expiry filter.
          schema: { type: integer, default: 500 }
        - name: offset
          in: query
          description: >-
            v1.20.18: rows to skip for paging (default 0).
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Decayed chunks
          content:
            application/json:
              schema:
                type: array
                description: 'reason: per_chunk (the row''s own expires_at elapsed) or kind_policy (the kind-level retention default elapsed)'
                items:
                  type: object
                  example: {"id": 317, "content_hash": "9f2c…", "expires_at": 1753000000, "effective_expiry": 1753000000, "memory_kind": "chunk", "reason": "per_chunk"}
  /retention:
    get:
      summary: Current per-kind retention policy (v1.17.1 M2)
      operationId: retentionGet
      description: >
        The effective per-kind retention policy (code defaults merged with
        persisted overrides), the `BRAIN_RETENTION_ENABLED` kill-switch state,
        and the current per-kind chunk counts. Read-only.
      responses:
        "200":
          description: Retention policy
          content:
            application/json:
              schema:
                type: object
                example: {"enabled": true, "policy": {"chunk": 30, "procedure": 180}, "counts": {"chunk": 430}, "projection": "kind-default expiry is derived from each chunk''s created_at at query time"}
    post:
      summary: Override the per-kind retention policy (v1.17.1 M2)
      operationId: retentionPost
      description: >
        Upserts a persisted per-kind retention override (survives restart).
        Accepts a single `{kind, days}` pair or a `{policy: {kind: days}}` map.
        Admin + audited. Retention is applied at query time, never by a
        background sweeper.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                kind: { type: string }
                days: { type: integer, minimum: 1, maximum: 36500 }
                policy:
                  type: object
                  additionalProperties: { type: integer }
      responses:
        "200":
          description: Policy updated
          content:
            application/json:
              schema:
                type: object
                example: {"updated": 1, "set": {"chunk": 30, "procedure": 180}}
                description: 'set = the per-kind ttl_days map now in force (empty when retention is disabled)'
  /art30:
    get:
      summary: Art 30 records-of-processing register (v1.17.1 M5)
      operationId: art30
      description: >
        A projection of existing tables into the EU GDPR Art 30 register the
        controller must maintain: categories of data, purpose, retention,
        recipients, transfer legal bases, DSAR exercise history, and chunk
        lifecycle summary. Admin, read-only.
      responses:
        "200":
          description: The Art 30 register
          content:
            application/json:
              schema:
                type: object
                example: {"art30": {"register_name": "brain-server records of processing activities", "controller": "<operator>", "categories_of_data": [{"category": "chunk", "count": 430, "purpose": "chunk memory retrieved into decision context"}], "retention": {"chunk": 30}, "recipients": [{"name": "connector:github:acme/repo", "purpose": "external data source ingestion", "legal_basis": "legitimate interest / contract"}], "transfer_legal_bases": [{"transfer": "Art 19 webhook", "legal_basis": "not configured"}], "dsar_history": [{"action": "purge", "status": "completed", "count": 1}], "lifecycle": {"live": 410, "superseded": 12, "tombstoned": 8}, "provenance_fields": ["source", "assertion_kind", "confidence"]}}
                description: 'generated_at (RFC3339) is also present; categories = live rows by memory_kind; recipients derive from configured webhooks + registered connectors'
  /snapshot/status:
    get:
      summary: Snapshot self-check panel (v1.17.1 M7)
      operationId: snapshotStatus
      description: >
        Inspects every `VACUUM INTO` `.bak` snapshot in the DB directory:
        exists, size, 0600 mode, `PRAGMA integrity_check`, and audit-chain
        verification of its log. Read-only — never creates or mutates a
        snapshot.
      responses:
        "200":
          description: Per-snapshot status
          content:
            application/json:
              schema:
                type: object
                example: {"db": "/Users/me/.openclaw/workspace/brain.db", "snapshot_count": 1, "all_ok": true, "snapshots": [{"file": "brain.db.snapshot-2026-08-10.bak", "exists": true, "size_bytes": 1048576, "mode_0600": true, "integrity_check": true, "audit_chain_ok": true, "ok": true}]}
                description: 'ok = exists && mode_0600 && integrity_check && audit_chain_ok; a tampered snapshot reports its failure, never a crash'
  /legal-hold:
    post:
      summary: Freeze knowledge ids against erasure (v1.22.0 M1)
      operationId: postLegalHold
      description: >
        Places one legal hold per id. A held id is frozen against every erasure
        path (decay registry, /purge, DSAR) until EVERY hold on it is released
        — never auto-released. Admin + audited. Body: `{ids, reason, domain?}`.
        Unknown ids refuse the whole request; one id may carry multiple
        concurrent holds (litigation + retention audit).
      responses:
        "200":
          description: The hold ids created
          content:
            application/json:
              schema:
                type: object
                example: {"held": 2, "hold_ids": [10, 11]}
                description: 'all-or-nothing: any unknown knowledge id rejects the whole request (400 unknown_ids)'
        "400":
          description: Empty/oversized ids or a blank/oversized reason
        "409":
          description: A target id is already under an active legal hold
  /legal-hold/{id}/release:
    post:
      summary: Release one legal hold (v1.22.0 M1)
      operationId: releaseLegalHold
      description: >
        The explicit un-freeze. Releasing an already-released hold is a no-op;
        the id stays frozen while ANY other active hold on it remains. 404 when
        the hold row does not exist. Admin + audited. `?domain=` targets the
        hold's pool in multi-db mode.
      responses:
        "200":
          description: The released hold
          content:
            application/json:
              schema:
                type: object
                example: {"released": true, "hold": {"id": 3, "knowledge_id": 10, "reason": "litigation hold", "held_by": "alice", "held_at": 1753000000, "released_at": 1753086400}, "note": "the knowledge id stays frozen while any other active hold on it remains"}
                description: 'released_at is null while the hold is active'
        "404":
          description: No legal hold with this id
  /legal-holds:
    get:
      summary: The legal-hold registry (v1.22.0 M1)
      operationId: listLegalHolds
      description: >
        Every hold, released or not, newest-first, bounded (default 100).
        `?id=` filters by knowledge id, `?reason=` by substring, `?active=true`
        narrows to unreleased holds, `?limit=` bounds the page. Multi-db: every
        pool's holds, tagged with the pool's domain. Admin.
      responses:
        "200":
          description: The hold registry
          content:
            application/json:
              schema:
                type: object
                example: {"holds": [{"domain": "global", "hold": {"id": 3, "knowledge_id": 10, "reason": "litigation hold", "held_by": "alice", "held_at": 1753000000, "released_at": null}}], "total": 1}
                description: 'hold ids are per-DB AUTOINCREMENT — the domain tag disambiguates; total counts before the limit clamp'
  /breach:
    post:
      summary: Open a breach-notification incident (v1.25.0 M2)
      operationId: postBreach
      description: >
        Human-opened by the DPO role (or admin capability). Body:
        `{scope, description, severity, discovered_at?, affected_estimate?,
        jurisdictions?}`. `jurisdictions` are country codes (e.g. `ph`, `eu`)
        that drive the per-jurisdiction notification deadlines from
        `discovered_at`. DPO/admin + audited (kind 'breach'). Automated
        detection is a v2.x concern — this is the manual record.
      responses:
        "200":
          description: The incident id + its computed notification deadlines
          content:
            application/json:
              schema:
                type: object
                example: {"breach_id": 1, "deadlines": [{"jurisdiction": "ph", "audience": "NPC", "hours": 72, "deadline": 1753000000}]}
                description: 'deadlines = notification_deadlines from the affected jurisdictions + discovered_at (per-law hours)'
        "400":
          description: Invalid scope/description/severity/jurisdictions
        "403":
          description: The principal holds no dpo/admin role
  /breach/{id}/event:
    post:
      summary: Append a notification/assessment/note to a breach (v1.25.0 M2)
      operationId: postBreachEvent
      description: >
        `{event_type: notification|assessment|note, jurisdiction?, body}`.
        Append-only; a closed breach refuses new events (409). DPO/admin +
        audited — every event is also hash-chained into the audit.
      responses:
        "200":
          description: The event was appended
          content:
            application/json:
              schema:
                type: object
                example: {"appended": true, "breach_id": 1}
                description: 'appended to the incident''s append-only event log; appending to a closed breach → 409'
        "400":
          description: Invalid event_type or an empty/oversized body
        "404":
          description: No breach with this id
        "409":
          description: The breach is closed
  /breach/{id}/close:
    post:
      summary: Close a breach incident (v1.25.0 M2)
      operationId: closeBreach
      description: >
        The explicit close (never auto). Closing an already-closed breach is a
        no-op; the id must exist (404). DPO/admin + audited.
      responses:
        "200":
          description: The breach was closed
          content:
            application/json:
              schema:
                type: object
                example: {"closed": true, "breach_id": 1, "closed_at": 1753086400}
                description: 'no further events may be appended once closed'
        "404":
          description: No breach with this id
  /breaches:
    get:
      summary: The breach incident registry (v1.25.0 M2)
      operationId: listBreaches
      description: >
        Every incident, newest-first, bounded (`?limit=`, default 100). The
        DPO/auditor ledger. DPO/admin read.
      responses:
        "200":
          description: The breach registry
          content:
            application/json:
              schema:
                type: object
                example: {"breaches": [{"id": 1, "scope": "customer-support", "description": "unencrypted backup exposed", "severity": "high", "discovered_at": 1753000000, "affected_estimate": 12, "jurisdictions": ["ph", "eu"], "status": "open", "opened_by": "dpo", "opened_at": 1753000100, "closed_by": null, "closed_at": null}]}
                description: 'status: open | closed; severity from the fixed SEVERITIES vocabulary'
  /breaches/{id}:
    get:
      summary: One breach + its events + computed deadlines (v1.25.0 M2)
      operationId: getBreach
      description: >
        One incident with its append-only event history and the computed
        per-jurisdiction notification deadlines (the client Security-panel
        countdown source). DPO/admin read.
      responses:
        "200":
          description: The breach view {breach, events, deadlines}
          content:
            application/json:
              schema:
                type: object
                example: {"id": 1, "scope": "customer-support", "description": "unencrypted backup exposed", "severity": "high", "discovered_at": 1753000000, "affected_estimate": 12, "jurisdictions": ["ph", "eu"], "status": "open", "opened_by": "dpo", "opened_at": 1753000100, "closed_by": null, "closed_at": null, "events": [{"id": 1, "event_type": "assessment", "jurisdiction": "ph", "body": "NPC notified", "noted_by": "dpo", "created_at": 1753000200}], "deadlines": [{"jurisdiction": "ph", "audience": "NPC", "hours": 72, "deadline": 1753007200}]}
                description: 'the breach fields are flattened; deadlines are computed like POST /breach'
        "404":
          description: No breach with this id
  /transfers:
    post:
      summary: Record a cross-border transfer (v1.26.0 M1)
      operationId: registerTransfer
      description: >
        The Art 30 processing-activities + Art 46 transfer-safeguard evidence.
        Body: `{dataset, origin_jurisdiction, destination_jurisdiction,
        mechanism, counterparty, lawful_basis?, purpose, signed_at?,
        expires_at?}`. `mechanism` must be one of the registered mechanisms
        (scc-eu-2021 | uk-idta | dpf-us | cbpr | bcr | adequacy). Admin +
        audited (kind 'transfer'). These rows + the TIA/DPA artifacts are what
        a client's regulator audit asks for.
      responses:
        "200":
          description: The transfer id + recorded mechanism
          content:
            application/json:
              schema:
                type: object
                example: {"id": 7, "mechanism": "scc-eu-2021"}
                description: 'lawful_basis/purpose per Art 30 + 46 evidence; a transfer expiring before its signing time is rejected (400)'
        "400":
          description: Invalid dataset/jurisdiction/mechanism/counterparty/purpose/lawful_basis or invalid timestamp bounds (non-negative epoch; expires_at not before signed_at)
        "403":
          description: The principal is not admin
    get:
      summary: List the cross-border transfer register (v1.26.0 M1)
      operationId: listTransfers
      description: >
        The transfer register, newest-first, bounded (limit, default 100).
        Optional exact-match filters: `mechanism`, `jurisdiction` (matches
        origin OR destination), `dataset`. Admin read.
      responses:
        "200":
          description: "The transfer register rows as {transfers: [...]}"
          content:
            application/json:
              schema:
                type: object
                example: {"transfers": [{"id": 7, "dataset": "support-tickets", "origin_jurisdiction": "ph", "destination_jurisdiction": "eu", "mechanism": "scc-eu-2021", "counterparty": "acme-eu", "lawful_basis": "contract", "purpose": "ticket escalation", "signed_at": 1753000000, "expires_at": 1784536000}]}
                description: 'lawful_basis is null when never recorded — a NULL serializes as null, never an empty string'
  /transfers/{id}/tia:
    get:
      summary: Transfer Impact Assessment template (v1.26.0 M4)
      operationId: getTia
      description: >
        The Schrems II Transfer Impact Assessment, pre-filled from the register
        row + the destination jurisdiction's curated law + surveillance
        posture. An evidence artifact a human (DPO/legal) reviews + signs — it
        does not render legal judgment. Admin read.
      responses:
        "200":
          description: The pre-filled TIA template
          content:
            application/json:
              schema:
                type: object
                example: {"transfer": {"id": 7, "dataset": "support-tickets", "origin_jurisdiction": "ph", "destination_jurisdiction": "eu", "mechanism": "scc-eu-2021", "counterparty": "acme-eu", "lawful_basis": "contract", "purpose": "ticket escalation", "signed_at": 1753000000, "expires_at": 1784536000}, "destination_law": "EU GDPR", "destination_posture": {"jurisdiction": "eu", "note": "…curated surveillance note…"}, "sections": [{"key": "transfer", "title": "Transfer to be assessed", "prompt": "Dataset support-tickets from ph to eu …"}]}
                description: 'an EVIDENCE ARTIFACT a human DPO/legal reviews + signs — nothing renders legal judgment; destination_posture is null when the destination has no curated posture'
        "404":
          description: No transfer with this id
  /transfers/{id}/dpa:
    get:
      summary: Data Processing Agreement fields (v1.26.0 M4)
      operationId: getDpa
      description: >
        The DPA (Art 28 sub-processor terms) fields, pre-filled from the
        transfer row + mechanism defaults (retention, deletion-on-termination,
        audit rights, breach-notification timeline, onward-transfer
        restrictions) — the evidence a client's controller demands before
        authorizing the sub-processor. Admin read.
      responses:
        "200":
          description: The pre-filled DPA fields
          content:
            application/json:
              schema:
                type: object
                example: {"counterparty": "acme-eu", "dataset": "support-tickets", "mechanism": "scc-eu-2021", "role": "processor/sub-processor", "retention": "per the domain retention policy; erased on termination", "deletion_on_termination": true, "audit_rights": "documented + exercised on request", "breach_notification": "within the affected jurisdictions statutory windows (see /breaches)", "onward_transfers": "per the registered mechanism (scc-eu-2021) — no onward transfer without the controller authorization", "lawful_basis": "contract", "purpose": "ticket escalation"}
                description: 'pre-filled evidence the controller reviews before authorizing the sub-processor'
        "404":
          description: No transfer with this id
  /clients:
    post:
      summary: Register an operating client (v1.27.1)
      operationId: registerClient
      description: >
        The BPO operating-register entry (the spine later BPO releases read —
        onboard/DPA/DSAR/holds/termination). Body: `{name, domain,
        jurisdiction, profile?}`. `name` + `domain` are lowercase
        domain-safe identifiers; `jurisdiction` is a short lowercase country
        code. Admin + audited (kind 'client'). Identity/evidence only — this
        does not gate enforcement.
      responses:
        "200":
          description: The registered client name
          content:
            application/json:
              schema:
                type: object
                example: {"name": "acme-us"}
                description: 'the name is normalized (trimmed, lowercased) before registration; creating a client for a missing/archived domain is still allowed (identity register only)'
        "400":
          description: Invalid name/domain/jurisdiction
        "403":
          description: The principal is not admin
        "409":
          description: A client with this name already exists
    get:
      summary: List the client register (v1.27.1)
      operationId: listClients
      description: >
        The full BPO client register, ordered by name. Admin read.
      responses:
        "200":
          description: "The client register rows as {clients: [...]}"
          content:
            application/json:
              schema:
                type: object
                example: {"clients": [{"name": "acme-us", "domain": "acme-us", "jurisdiction": "us", "profile": null, "dpa_terms": null, "status": "active", "created_at": 1753000000, "archived_at": null}]}
                description: 'a client-auditor sees only the clients whose domain is in their granted set; every other principal sees the full register'
  /clients/{name}:
    get:
      summary: Resolve one client (v1.27.1)
      operationId: getClient
      description: >
        A single client register row by its `name`. Admin read.
      responses:
        "200":
          description: The client row
          content:
            application/json:
              schema:
                type: object
                example: {"name": "acme-us", "domain": "acme-us", "jurisdiction": "us", "profile": null, "dpa_terms": {"retention_on_termination": "purge, return", "deletion_timeline": "within 30 days of end", "audit_rights": "annual + on request", "breach_notification_timeline": "within 72h", "onward_transfer_restriction": "no onward transfer", "sub_sub_processor_list": ""}, "status": "active", "created_at": 1753000000, "archived_at": null}
                description: '404 for an unknown name; for a client-auditor the specific client is 404 (no existence leak) unless its domain is granted'
        "404":
          description: No client with this name
  /clients/{name}/dpa:
    get:
      summary: Read a client's Art 28 DPA terms (v1.27.3)
      operationId: getClientDpa
      description: >
        The stored sub-processor DPA terms for a client, or `null` when set
        never. The evidence a client's controller checks. Admin read.
      responses:
        "200":
          description: The DPA terms object, or null
          content:
            application/json:
              schema:
                type: object
                example: {"retention_on_termination": "purge, return", "deletion_timeline": "within 30 days of end", "audit_rights": "annual + on request", "breach_notification_timeline": "within 72h", "onward_transfer_restriction": "no onward transfer", "sub_sub_processor_list": ""}
                description: 'raw DpaTerms object on success (all six keys); JSON null when the client has no recorded terms'
        "404":
          description: No client with this name
    post:
      summary: Set a client's Art 28 DPA terms (v1.27.3)
      operationId: setClientDpa
      description: >
        Persist the sub-processor DPA terms for a client. Body is the DpaTerms
        object; every field must be non-blank and <= 2000 chars
        (`400 dpa_field_invalid`). Admin + audited (kind 'client').
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DpaTerms'
      responses:
        "200":
          description: The updated client name
          content:
            application/json:
              schema:
                type: object
                example: {"name": "acme-us"}
                description: 'all six DpaTerms fields are required; 404 when the client does not exist, 409 when archived'
        "400":
          description: A DPA field is blank or too long
        "403":
          description: The principal is not admin
        "404":
          description: No client with this name
  /clients/{name}/dsar:
    post:
      summary: Per-client jurisdiction-aware DSAR (v1.27.4)
      operationId: clientDsar
      description: >
        A subject erasure scoped to a single client's domain, stamped with that
        client's jurisdiction, deadline, rights, and transfer mechanism. The
        "erase Client Beta's data on contract end" building block. Resolves the
        client's domain + jurisdiction from the register and delegates to the
        shared DSAR run (no new purge logic). `action` = purge | export | both
        (default purge); `dry_run` previews the would-be footprint write-free.
        Admin + audited (kind 'client').
      parameters:
        - in: path
          name: name
          required: true
          description: Client name (lowercase, domain-safe).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: Owner/principal being actioned (max 2000 chars).
                action:
                  type: string
                  enum: [purge, export, both]
                  default: purge
                dry_run:
                  type: boolean
                  default: false
                subject_exact:
                  type: boolean
                  default: false
                  description: >
                    Exact-subject matching for the residue sweeps (default is
                    the erasure-safe substring sweep).
      responses:
        "200":
          description: >
            A DsarResponse: the ledger row id, the client's jurisdiction +
            deadline (per its law) + rights, and a deletion certificate stamped
            with the client's jurisdiction + mechanism (or a footprint when
            dry-run).
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  subject: { type: string }
                  status: { type: string, enum: [completed, preview] }
                  created_at: { type: integer }
                  deadline: { type: integer }
                  jurisdiction: { type: string, nullable: true }
                  rights:
                    type: array
                    items: { type: string }
                  certificate:
                    type: object
                    description: Subject/action/certificate (absent on dry-run).
                  footprint:
                    $ref: "#/components/schemas/Footprint"
        "400":
          description: Empty/overlong subject or invalid action
        "403":
          description: The principal is not admin / lacks the dsar_export role
        "404":
          description: No client with this name
        "409":
          description: Client is not active (archived)
  /clients/{name}/hold:
    post:
      summary: Legal hold a client's ids (v1.27.5)
      operationId: clientHold
      description: >
        Place a legal hold on knowledge ids in THAT client's domain, never
        another's. Composes the shared per-domain hold write; the hold freezes
        the ids against decay, /purge, and DSAR deferral until explicitly
        released. `reason` is a required non-blank citation (case number,
        ticket, regulation). Resolves the client's domain from the register.
        Admin + audited (kind 'client').
      parameters:
        - in: path
          name: name
          required: true
          description: Client name (lowercase, domain-safe).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: Knowledge ids to freeze (1..=1000, all must exist in the client's domain).
                reason:
                  type: string
                  description: Non-blank legal citation (max 500 chars).
      responses:
        "200":
          description: "{held, hold_ids} — one hold row id per frozen id."
          content:
            application/json:
              schema:
                type: object
                example: {"held": 2, "hold_ids": [10, 11]}
                description: 'identical shape to POST /legal-hold — the hold lands in the client''s own domain pool (per-client isolation); 404 unknown client, 409 archived'
        "400":
          description: Empty ids, unknown id, or blank/overlong reason
        "403":
          description: The principal is not admin
        "404":
          description: No client with this name
        "409":
          description: Client is not active (archived)
  /clients/{name}/end:
    post:
      summary: Run a client's contract-end termination clause (v1.27.6)
      operationId: clientEnd
      description: >
        The clean exit: erase (purge) or export (return) the client's active
        memory per its DPA `retention_on_termination` (the default — a purge
        DPA is the common PH BPO posture), honor per-domain legal holds
        (deferred on the certificate, never purged), then archive the client +
        domain. The audit chain is never deleted. Body: `{purge?, dataset?}` —
        `purge` overrides the DPA policy (absent follows the terms); `dataset`
        is the tombstone/audit reason tag (default `termination`). Returns a
        TerminationCertificate. Admin + audited (kind 'client').
      parameters:
        - in: path
          name: name
          required: true
          description: Client name (lowercase, domain-safe).
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                purge:
                  type: boolean
                  description: >
                    Override the DPA retention policy (true = erase, false =
                    export-and-freeze); absent follows the client's terms.
                dataset:
                  type: string
                  default: termination
                  description: Tombstone + audit reason tag (max 2000 chars).
      responses:
        "200":
          description: The TerminationCertificate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TerminationCertificate"
        "403":
          description: The principal is not admin
        "404":
          description: No client with this name
        "409":
          description: Client is not active (archived)
  /clients/{name}/proposals:
    get:
      summary: The supervisor QA queue for a client (v1.27.8)
      operationId: clientProposals
      description: >
        The client's pending review items, owner-scoped to the supervisor's
        `manages` set (R1 role; empty manages = the whole queue), each with its
        R7 `qa_score`. Same `ProposalView` shape as `GET /proposals`. Admin.
      parameters:
        - in: path
          name: name
          required: true
          description: Client name (lowercase, domain-safe).
          schema: { type: string }
      responses:
        "200":
          description: The owner-scoped proposal page with QA scores
          content:
            application/json:
              schema:
                type: object
                example: {"proposals": [{"id": 12, "kind": "chunk", "content_digest": "sha256:…", "source": "manual", "authority": 0.9, "novelty": 0.4, "salience": 0.7, "created_at": 1753000000, "screen_verdict": "clean", "decided_at": null}], "total": 1}
                description: 'the client''s pending review queue, owner-scoped to the supervisor''s manages set; 403 for non-admin supervisors'
        "403":
          description: The principal is not admin
        "404":
          description: No client with this name
        "409":
          description: Client is not active (archived)
  /clients/{name}/proposals/{id}/coach:
    post:
      summary: Supervisor coaching on a QA review item (v1.27.8)
      operationId: coachProposal
      description: >
        Set/clear the `qa_note` (+ advisory `flagged`) on a proposal in the
        client's domain. Never gates approval — a flag + note a human decides
        on. The audit detail carries only the id + flagged flag (the note may
        contain feedback; never stored raw in the audit). Admin + audited.
      parameters:
        - in: path
          name: name
          required: true
          description: Client name (lowercase, domain-safe).
          schema: { type: string }
        - in: path
          name: id
          required: true
          description: Proposal id in the client's domain.
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                flagged:
                  type: boolean
                  default: false
                  description: Advisory QA flag.
                note:
                  type: string
                  nullable: true
                  description: The coaching note (default/`null` clears it).
      responses:
        "200":
          description: '{proposal_id, client, flagged, status: coached}'
          content:
            application/json:
              schema:
                type: object
                example: {"proposal_id": 12, "client": "acme-us", "flagged": true, "status": "coached"}
                description: 'flagged = whether the deterministic injection screen would flag the content (provenance; the human''s decision is final)'
        "400":
          description: Invalid request
        "403":
          description: The principal is not admin
        "404":
          description: No client with this name, or no proposal with this id
        "409":
          description: Client is not active (archived)
  /retention/report:
    get:
      summary: Per-domain × per-kind retention schedule (v1.22.0 M2)
      operationId: retentionReport
      description: >
        The effective per-domain ✕ per-kind TTL policy surfaced as a report:
        ttl_days → row count → rows expiring in the next 30 days. The Art
        5(1)(e) storage-limitation + HIPAA/SOX retention-schedule evidence the
        regulated presets ship. Effective TTL is a bound profile's retention
        block (v1.21.0) for its domain, else the server-wide policy. Reports
        coverage; it does not auto-enforce (the human purges). Admin.
      responses:
        "200":
          description: The retention schedule table
          content:
            application/json:
              schema:
                type: object
                example: {"window_days": 30, "generated_at": "2026-08-15T12:00:00Z", "rows": [{"domain": "global", "kind": "chunk", "ttl_days": 30, "count": 430, "expiring_30d": 12}], "projection": "effective expiry = explicit expires_at, else created_at + ttl_days"}
                description: 'the Art 5(1)(e) storage-limitation + HIPAA/SOX retention-schedule evidence; reports coverage, does not auto-enforce'
  /legal/rules:
    get:
      summary: Curated law-version diff over the legal-rules DB (read-only)
      operationId: legalRules
      description: >
        The deterministic diff of the curated jurisdiction rules newer than
        the `since` law_version's snapshot point, ordered by (jurisdiction,
        subject, effective_at, revision). Absent `since` = the full ordered
        snapshot. Reads the curated legal DB (BRAIN_LEGAL_DB_PATH) READ-ONLY
        per request; unset/unreadable refuses NAMED (legal_db_unconfigured /
        legal_db_unavailable); an unknown `since` refuses 404
        law_version_unknown. The DB is populated by the DPO's quarterly
        import — no auto-pull, no enforcement on this surface. Admin gate +
        DPO role; same byte-for-byte response for the same DB state.
      parameters:
        - name: since
          in: query
          required: false
          schema: { type: string }
          description: A law_version label; rules newer than its snapshot point are returned.
      responses:
        "200":
          description: The ordered diff
          content:
            application/json:
              schema:
                type: object
                example: {"since": "gdpr-consolidated-2021", "since_effective_at": 0, "head": {"rules": 9, "versions": 8, "postures": 6, "max_rules_id": 9}, "rules": [{"id": 9, "jurisdiction": "eu", "subject": "dsar", "rule_key": "eu_dsar_curated", "body": "GDPR (Art 12/15/17), amended", "source_ref": "GDPR (Art 12/15/17)", "law_version": "gdpr-consolidated-2021", "deadline_days": 30, "rights": ["access"], "effective_at": 1800000000, "reviewed_at": 1800000000, "expires_at": null, "revision": 2, "superseded_by": null}]}
        "404":
          description: 'law_version_unknown — the pinned version is not in the curated DB'
        "501":
          description: 'legal_db_unconfigured — BRAIN_LEGAL_DB_PATH is unset'
        "503":
          description: 'legal_db_unavailable — the curated DB is missing or unreadable'
  /ump/capabilities:
    get:
      summary: UMP 1.0 negotiation handshake (v1.17.3 M2)
      operationId: umpCapabilities
      description: >
        Universal Memory Protocol 1.0 handshake (public — no auth). Reports
        conformance (L3 with an operator signing key configured, L2 otherwise),
        kinds, bindings, retrieval signals, max_recall, writable, audit.
      responses:
        "200":
          description: Capabilities document
          content:
            application/json:
              schema:
                type: object
                example: {"server": {"name": "brain-server", "version": "1.27.16"}, "ump": "1.0", "conformance": "L2", "kinds": ["semantic", "episodic", "procedural", "working", "identity"], "bindings": ["http", "mcp", "file"], "retrieval_signals": ["similarity", "recency", "salience", "scope_match", "provenance_depth"], "max_recall": 50, "writable": true, "audit": true}
                description: 'conformance = L3 when an operator signing key is configured, L2 otherwise'
  /ump/remember:
    post:
      summary: Store a memory record (v1.17.3 M2, UMP §3.3)
      operationId: umpRemember
      description: >
        Accepts a partial UMP record (`{record: …}` or a bare record). Lowered
        through the structured-ingest path. Consent: a declared `scope.owner`
        must match the authenticated principal. L3: signed records verify
        against the operator key. Returns `{id, result: created|merged|rejected}`.
      responses:
        "200":
          description: "{id, result}"
          content:
            application/json:
              schema:
                type: object
                example: {"id": 42, "result": "created"}
                description: 'result: created | merged | rejected (a byte-identical proposal merges); 400 invalid_record / signature_invalid / forbidden_scope'
        "400":
          description: invalid_record / signature_invalid / forbidden_scope
  /ump/memory/{id}:
    get:
      summary: Read one record by id (v1.17.3 M2)
      operationId: umpGetMemory
      description: >
        Returns `{record}` with integrity re-verified on read (§5.3); rows
        whose stored integrity fails verification are treated as absent. Other
        owners' rows are §2.7-redacted for authenticated principals.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: "{record}"
          content:
            application/json:
              schema:
                type: object
                example: {"record": {"ump": "1.0", "id": "urn:ump:brain-server:42", "body": {"text": "…"}, "scope": {"owner": "alice"}, "time": {"created_at": "2026-08-15T12:00:00Z"}, "integrity": {"content_hash": "sha256:…"}}}
                description: 'the record is re-verified on read; a row whose stored integrity fails verification is treated as absent; other owners'' rows are §2.7-redacted'
        "404":
          description: not_found
  /ump/recall:
    post:
      summary: Ranked recall with per-result signals (v1.17.3 M2, UMP §3.2)
      operationId: umpRecall
      description: >
        Runs the shared deterministic recall core (`run_recall` — the same
        pipeline as `/recall`) and renders §3.2 `{results:[{record, signals,
        score}]}` with the five standard signals (similarity, recency,
        salience, scope_match, provenance_depth). `filter.kind` maps UMP kinds
        to brain memory_kinds; `filter.valid_at` maps to the bi-temporal
        `at` filter. `ranking_hints` is accepted but ignored (no rank
        steering). Clamped to `max_recall`.
      responses:
        "200":
          description: "{results: [...]}"
          content:
            application/json:
              schema:
                type: object
                example: {"results": [{"record": {"ump": "1.0", "id": "urn:ump:brain-server:42", "body": {"text": "…"}, "scope": {"owner": "alice"}}, "signals": {"similarity": 0.9, "recency": 1.0, "salience": 0.4, "scope_match": 1.0, "provenance_depth": 0.3}, "score": 0.87}]}
                description: 'record + the five standard signals + the fused score; clamped to max_recall'
  /ump/revise:
    post:
      summary: Patch a record (v1.17.3 M2, UMP §3.5)
      operationId: umpRevise
      description: >
        `{id, patch}` — the patch is deep-merged over the stored record
        (`id`/`integrity` are server-authoritative and never patched), lowered
        through the ingest path as a new chunk, and the old chunk is expired
        via `resolve_supersession` (default recall returns the new revision;
        `?at=<past>` still finds the old). Returns `{id, supersedes}`.
      responses:
        "200":
          description: "{id, supersedes: [old_id]}"
          content:
            application/json:
              schema:
                type: object
                example: {"id": 43, "supersedes": [42]}
                description: 'the patched record id + the superseded old revision id(s); default recall returns the new revision'
  /ump/forget:
    post:
      summary: Delete or soft-delete a record (v1.17.3 M2, UMP §3.4)
      operationId: umpForget
      description: >
        `{id, reason?, hard?}` — `hard:false` (default) flags the row
        (quarantine-style, still retrievable with `include_flagged`) + tombstone
        + audit; `hard:true` runs the v1.14 `purge_chunk_ids` erase path.
        Returns `{result: "tombstoned"}`.
      responses:
        "200":
          description: "{result: tombstoned}"
          content:
            application/json:
              schema:
                type: object
                example: {"result": "tombstoned"}
                description: 'hard:false flags the row + tombstone + audit; hard:true runs the v1.14 purge erase path'
        "404":
          description: not_found
  /ump/feedback:
    post:
      summary: Record outcome feedback (v1.17.3 M2, UMP §3.6)
      operationId: umpFeedback
      description: >
        `{id, outcome, reason?}` with outcome in followed|overridden|ignored|
        contradicted. Mapped to the suggest-feedback last-wins upsert
        (followed → accept, rest → dismiss) with the granular outcome
        persisted in `ump_outcome`.
      responses:
        "200":
          description: "{result: recorded}"
          content:
            application/json:
              schema:
                type: object
                example: {"result": "recorded"}
                description: 'feedback mapped to the suggest-feedback last-wins upsert (followed → accept, rest → dismiss)'
        "400":
          description: feedback_invalid
  /ump/subscribe:
    get:
      summary: SSE change signal (v1.17.3 M2, UMP §3.8)
      operationId: umpSubscribe
      description: >
        Server-sent events over a bounded broadcast channel: a `pending`
        handshake event, then `{kind, id}` events on remember/revise/forget.
        Never record bodies — the stream is a change signal, not a data
        channel. Lagged subscribers drop missed events.
      responses:
        "200":
          description: "text/event-stream"
          content:
            text/event-stream:
              schema:
                type: string
  /ump/audit:
    post:
      summary: Reference audit facility (v1.17.3 M2, UMP §9)
      operationId: umpAudit
      description: >
        Recent hash-chained audit rows (`{kind?, limit?, offset?}`). Admin +
        tenant-scoped (same semantics as `/audit`).
      responses:
        "200":
          description: "{rows: [...], count: n}"
          content:
            application/json:
              schema:
                type: object
                example: {"rows": [{"id": 900, "ts": "2026-08-15T12:00:00Z", "kind": "auth", "actor": "dpo", "target_hash": "sha256:…", "status": "Ok", "detail_hash": "sha256:…", "tenant_id": "global"}], "count": 1}
                description: 'tenant-scoped: a non-superuser admin sees only their tenant; limit defaults to 100, clamped to MAX_MULTI_GET'
  /ump/audit/verify:
    get:
      summary: Fresh full-chain verification (v1.17.3 M2, UMP §9; v1.27.31 multi-domain)
      operationId: umpAuditVerify
      description: >
        Authoritative full scan of the audit hash chain (unlike the TTL-cached
        `/metrics` signal). Admin. v1.27.31 "AuditRepair" (M4/F-22): verifies
        EVERY registered domain's chain — `ok` is the all-domains aggregate
        and `domains` names each chain. Since v1.28.67 "Pin" (X-C2) the
        response carries the additive `integrity` census over the UMP record
        population: `verified` = records that verify (the ones serve would
        release), `signed` = carrying an operator signature under the current
        serve posture, `hash_only` = verified − signed. When the operator key
        EXISTS and `hash_only > 0`, a `note:
        hash_only_records_present` lights (the one combination an operator
        must act on). Visibility, not gating — serve behavior is unchanged.
      responses:
        "200":
          description: "{ok, domains: {name: bool}, integrity: {verified, signed, hash_only}, note?}"
          content:
            application/json:
              schema:
                type: object
                example: {"ok": true, "domains": {"global": true}, "integrity": {"verified": 410, "signed": 410, "hash_only": 0}}
                description: 'authoritative full scan of every registered domain''s audit hash chain + the record-integrity census'
  /.well-known/ump.json:
    get:
      summary: UMP discovery document (v1.17.3 M2)
      operationId: umpDiscovery
      description: >
        Public discovery document — same payload as `/ump/capabilities`,
        mounted with the other well-known public routes.
      responses:
        "200":
          description: Capabilities document
          content:
            application/json:
              schema:
                type: object
                example: {"server": {"name": "brain-server", "version": "1.27.16"}, "ump": "1.0", "conformance": "L2", "kinds": ["semantic", "episodic", "procedural", "working", "identity"], "bindings": ["http", "mcp", "file"], "retrieval_signals": ["similarity", "recency", "salience", "scope_match", "provenance_depth"], "max_recall": 50, "writable": true, "audit": true}
                description: 'identical payload to /ump/capabilities, mounted on the public well-known surface'
  /events:
    get:
      summary: Operator alert feed (v1.20.8 M1, SSE)
      operationId: alertEvents
      description: >
        Server-sent events for the operator console's live regions. A `pending`
        handshake event, then `{kind, ts, seq, payload}` signals over a bounded
        broadcast channel. Kinds are a fixed, hand-curated set — `pending` /
        `expiry` / `screen` / `chain` — and the envelope never carries content
        or PII (payloads are small signal objects; the client fetches detail
        from existing endpoints on demand). Optional `?kinds=pending,expiry`
        filters the stream. Read-gated; lagged subscribers drop missed events.
        Since 1.28.19 the bus also carries drained `workflow/*` outbox events
        under kind `workflow` with payload
        `{topic, run_id, payload_json, event_id, parent_event_id, domain}`:
        ADDITIVE and default-off — a subscriber receives them only by asking
        `?kinds=workflow`, and only when it may Read the run's domain (denied
        events are dropped, never leaked); payloads pass the sanitize seam
        before broadcast.
      parameters:
        - name: kinds
          in: query
          required: false
          schema:
            type: string
            description: "comma-separated kind filter; absent = all except `workflow` (opt-in)"
        - name: Last-Event-ID
          in: header
          required: false
          schema:
            type: integer
            description: >
              Fathom M3: resume the workflow coordinate space — on reconnect,
              send the highest workflow `event_id` seen; stored rows with a
              larger id are replayed (bounded, Read-gated) before the live
              broadcast attaches.
      responses:
        "200":
          description: "text/event-stream"
          content:
            text/event-stream:
              schema:
                type: string
        "403":
          description: >
            Not authorized for the feed. The denial is an HTTP status, not a
            200-then-error-event: monitors see the 403 and the caller's poll
            fallback keys on the connection failure. Mid-stream failures
            still arrive as `error` events on an open stream.
  /export:
    get:
      summary: Portable JSON export for data portability (v1.14.0 M2)
      operationId: exportData
      description: >
        Live `knowledge` rows + graph + proposals ledger. v1.17.1 "Govern" M4:
        `?format=ump` re-renders the payload as UMP wire records (Universal
        Memory Protocol 1.0, github.com/edihasaj/universal-memory-protocol).
        v1.18.2 "Transparency" M1: each `knowledge` row carries `source` (ingest
        kind) + `origin` (human|model|imported), and the envelope adds
        `export_format_version: 2` + a `provenance_summary` (total / by_origin /
        by_source) for the Art 50 model-vs-human transparency bridge. v1.20.17
        "Scrub" M2: with a `redact_owner` query param that doesn't match a row's
        `owner`, that row's `content` is redacted (`[redacted]`) — a cross-owner
        export never leaks another subject's chunk body. v1.20.19 "Vault": there
        is no `pii_map` vault to resolve — PII control is deterministic output
        redaction, so raw PII is never exported.
      parameters:
        - in: query
          name: format
          description: "`ump` re-renders the payload as UMP records (one per chunk, name-based graph); `ump-md` renders the UMP markdown file binding"
          schema: { type: string, enum: [ump, ump-md] }
        - in: query
          name: redact_owner
          description: "v1.20.17: owner label to keep; rows owned by another owner export with `content` redacted to `[redacted]`."
          schema: { type: string }
      responses:
        "200":
          description: Portable JSON export
          content:
            application/json:
              schema:
                type: object
                properties:
                  export_format_version: { type: integer, description: "additive; 2 since v1.18.2 adds provenance_summary + per-row origin" }
                  exported_at: { type: string, format: date-time }
                  knowledge:
                    type: array
                    items:
                      type: object
                      description: "A knowledge row; v1 fields unchanged. Adds `origin` (human|model|imported)."
                  provenance_summary:
                    type: object
                    description: "Art 50 model-vs-human origin counts across all exported rows"
                    properties:
                      total: { type: integer }
                      by_origin:
                        type: object
                        description: "counts keyed by human|model|imported"
                      by_source:
                        type: object
                        description: "counts keyed by ingest kind"
                  entities: { type: array }
                  relationships: { type: array }
                  proposals: { type: array }
  /purge:
    post:
      summary: Hard, explicit, audited deletion across all tables (v1.14.0 M2)
      operationId: purge
      description: >
        Removes a chunk from knowledge + vec_knowledge + relationships +
        proposals references in one transaction and leaves a tombstone. Accepts
        `ids` or an `owner` (principal subject) anchor. Nothing is deleted
        autonomously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ids: { type: array, items: { type: integer } }
                owner: { type: string }
      responses:
        "200":
          description: Number of chunks purged
          content:
            application/json:
              schema:
                type: object
                example: {"purged": 2}
                description: 'the number of chunks hard-deleted (ids or owner form); legal-hold frozen ids are refused with 409 legal_hold_active'
  /recall/{trace_id}/trace:
    get:
      summary: Replay a recorded recall decision path (v1.15.0 M2)
      operationId: getRecallTrace
      description: >
        Replays the stored trace JSON captured when a recall read event was
        recorded with `trace: true`: the exact query, abstention decision,
        domains searched, applied access-scope filter, actor, and per-hit
        injection details. v1.20.17 "Scrub" M3: the stored `query_hash` field
        holds the structured-query fingerprint (xxh3) — never raw query text.
        Pure read; no audit row of its own. 404 when the id has no
        trace (event recorded without trace, or none at all).
      parameters:
        - in: path
          name: trace_id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The stored trace JSON
          content:
            application/json:
              schema:
                type: object
                example: {"query_hash": "sha256:…", "decision": "Ok", "domains_searched": ["global"], "scope": ["private"], "actor": "dpo", "hits": [{"id": 317, "score": 0.87, "assertion_kind": "stated", "source": "manual", "relevance": "high", "decayed": false}]}
                description: 'query_hash is a bounded hash of the query — never raw query text (a recall query can be personal data)'
        "404":
          description: No trace for this id
  /dsar:
    post:
      summary: GDPR Art 15/17 DSAR workflow (v1.15.0 M3)
      operationId: postDsar
      description: >
        Locate every record for a subject (content rows by `owner` plus
        transitive `derived_from` descendants), export the bundle (portable
        JSON), purge (hard, one transaction, reaching vec0 + graph +
        pointers), and return a chain-verifiable deletion certificate. One
        atomic workflow; `action` = export | purge | both. Admin-only:
        erasure is irreversible. Nothing runs autonomously.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: Owner/principal being actioned (max 2000 chars).
                action:
                  type: string
                  enum: [export, purge, both]
                  default: both
                dry_run:
                  type: boolean
                  default: false
                  description: >
                    v1.20.21 — set true to preview the would-be deletion
                    footprint (locate + bundle build) without executing any
                    write: no purge, no sweep, no ledger row, no certificate.
                    The 200 carries `footprint` instead of `certificate`.
                subject_exact:
                  type: boolean
                  default: false
                  description: >
                    Exact-subject matching for the residue sweeps (traces,
                    proposals, workflow state) — default is the erasure-safe
                    substring sweep.
                jurisdiction:
                  type: string
                  description: >
                    v1.26.0 — the subject's jurisdiction (short lowercase
                    country code, e.g. `eu`, `us`, `uk`). When set, the
                    response + certificate carry the law's deadline + subject
                    rights per the curated `JurisdictionRule` table.
                mechanism:
                  type: string
                  description: >
                    v1.26.0 — the free-text transfer safeguard label attached
                    to the certificate (not validated — curated in the DPA).
      responses:
        "200":
          description: Workflow row id + deletion certificate (or footprint when dry-run)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  subject: { type: string }
                  status: { type: string, enum: [completed, preview] }
                  created_at:
                    type: integer
                    description: >
                      v1.20.22 — ledger `created_at` (unix ts). 0 on a dry-run
                      preview (no ledger row). The client clock's origin.
                  deadline:
                    type: integer
                    description: >
                      v1.20.22 — computed Art 17 erasure deadline
                      (`created_at + window`, unix ts); 0 on a dry-run. The
                      subject-countdown source of truth.
                  jurisdiction:
                    type: string
                    nullable: true
                    description: >
                      v1.26.0 — the subject's jurisdiction when provided on the
                      request (absent on a dry-run preview / generic surface).
                  rights:
                    type: array
                    items: { type: string }
                    description: >
                      v1.26.0 — the jurisdiction's applicable subject rights
                      (access/erasure/rectification/... per the curated table;
                      empty when no jurisdiction was given).
                  certificate:
                    type: object
                    description: >
                      subject, action, found_count, purged_ids,
                      tombstone_root, certified_at, chain_head. Absent for a
                      dry-run (nothing was deleted).
                  footprint:
                    $ref: "#/components/schemas/Footprint"
                    description: >
                      v1.20.21 — present only on a dry-run. The would-be
                      deletion footprint.
        "422":
          description: Empty/overlong subject or invalid action
    get:
      summary: DSAR ledger list (v1.20.22 M1.2)
      operationId: listDsar
      description: >
        Bounded, newest-first page of `dsar_requests` rows for the operator:
        `{requests: [{id, subject, action, status, created_at, completed_at}],
        total}`. Admin-only — the subject is the operator's operand. The client
        derives each open row's Art 17 deadline from `created_at`.
      parameters:
        - in: query
          name: limit
          description: Max rows (default 100, clamped 1..1000).
          schema: { type: integer }
        - in: query
          name: offset
          schema: { type: integer }
      responses:
        "200":
          description: DsarLedger — the requests page + total count.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DsarLedger"
  /tombstones:
    get:
      summary: Queryable deletion registry (v1.15.0 M3)
      operationId: listTombstones
      description: >
        Hash-only, append-only tombstone rows (the EDPB Coordinated
        Enforcement Framework ask). `?subject=` filters by the
        `owner:<subject>` purge reason; `?since=` filters by purged_at.
        Admin-only.
      parameters:
        - in: query
          name: subject
          schema: { type: string }
        - in: query
          name: since
          schema: { type: integer }
      responses:
        "200":
          description: Tombstone rows (bounded at 1000)
          content:
            application/json:
              schema:
                type: object
                example: {"tombstones": [{"knowledge_id": 317, "content_hash": "sha256:…", "purged_at": 1753000000, "reason": "owner:alice@example.com", "origin_id": null}]}
                description: 'hash-only, append-only rows; reason is owner:<subject> for roots or derived (scoped via origin_id); bounded at 1000'
  /dsar/{id}/certificate:
    get:
      summary: Re-fetch a deletion certificate (v1.15.0 M3)
      operationId: getDsarCertificate
      description: >
        Returns the stored certificate plus a live `chain_verifies` flag
        computed by re-running the audit hash-chain verification, so the
        caller sees whether the chain the certificate anchored to still
        holds. 404 when the id has no DSAR row.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Certificate + live chain verification
          content:
            application/json:
              schema:
                type: object
                example: {"certificate": {"subject": "alice@example.com", "action": "both", "found_count": 3, "purged_ids": [317, 318], "region": "<residency stamp>", "held_ids": [], "jurisdiction": "eu", "mechanism": "scc-eu-2021", "tombstone_root": 900, "certified_at": "2026-08-15T12:00:00Z", "chain_head": "sha256:…"}, "chain_verifies": true}
                description: 'held_ids lists {id, reasons} for legal-hold-deferred targets (never purged); 404 for an unknown id or another tenant''s certificate'
        "404":
          description: No DSAR request with this id
  /ingest:
    post:
      summary: Structured ingest (v1.0 primary path)
      operationId: ingest
      description: >
        Ingest a memory with optional entities/relations into the resolved
        domain's knowledge graph. Server trusts the caller's graph data after
        validation; entities/relations are upserted idempotently. Centroid is
        recomputed after each successful ingest. v1.17.1 "Govern" M4:
        `?format=ump` accepts a UMP envelope (`{"ump":"1.0","records":[…]}`,
        one record per call) lowered into this same path.
      parameters:
        - in: query
          name: format
          description: "`ump` accepts a UMP envelope body (one record per call); `ump-md` accepts the UMP markdown file binding"
          schema: { type: string, enum: [ump, ump-md] }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 500 }
                content: { type: string, maxLength: 1000000 }
                origin_context:
                  type: string
                  enum: [owner, channel]
                  description: >
                    The capture-taint label: where the content came from.
                    Absent = owner (byte-compat default). `channel` stores
                    the row with origin `channel-capture`, which recall
                    surfaces label (and the plugin can exclude). Any other
                    value is a 400.
                domain:
                  type: string
                  description: Target domain (defaults to 'global').
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
                entities:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      name: { type: string, maxLength: 100 }
                      type: { type: string, maxLength: 64 }
                    required: [name]
                relations:
                  type: array
                  maxItems: 200
                  items:
                    type: object
                    properties:
                      from: { type: string, maxLength: 100 }
                      to: { type: string, maxLength: 100 }
                      type:
                        type: string
                        maxLength: 64
                        pattern: "^[a-z0-9_]{1,64}$"
                    required: [from, to, type]
                lawful_basis:
                  type: string
                  description: >
                    v1.25.0 — the documented lawful basis for the ingest
                    (e.g. consent | contract). A strict-posture domain without
                    one is flagged in `compliance.lawful_basis_missing`.
                purpose:
                  type: string
                  description: >
                    v1.26.0 — the purpose-limitation label (Art 5/6 + NPC
                    2024-04 evidence) attached to the record.
                memory_kind:
                  type: string
                  enum: [fact, procedure, step, decision, episodic]
                  description: >
                    v1.27.16 "Drawbridge" (M4/F-33) — the write-boundary kind
                    label. A strict round-trip validation rejects unknown or
                    mixed-case values with 400 `invalid_memory_kind` (no silent
                    fallback to `fact`).
                confidence:
                  type: number
                  format: float
                  minimum: 0
                  maximum: 1
                  description: >
                    v1.27.16 "Drawbridge" (M4/F-33) — a client-asserted
                    probability. Values outside 0.0..=1.0 are rejected with 400
                    `invalid_confidence` (never silently clamped — a clamped
                    lie hides the liar).
              required: [title, content]
      responses:
        "200":
          description: Ingest result (created or duplicate)
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  status: { type: string, enum: [created, duplicate] }
                  domain: { type: string }
                  entities_added: { type: integer }
                  relations_added: { type: integer }
                  compliance:
                    type: object
                    description: >
                      v1.26.0 — compliance signals for this ingest.
                    properties:
                      lawful_basis_missing:
                        type: boolean
                        description: >
                          v1.26.0 — true when the target domain runs the
                          strict PII posture and no `lawful_basis` was
                          documented (Art 5/6 + NPC 2024-04 evidence flag).
        "400": { $ref: "#/components/responses/BadRequest" }
        "507": { $ref: "#/components/responses/CapacityExceeded" }
  /memory/{id}:
    delete:
      summary: Forget / delete a memory (contract stub)
      operationId: forget
      x-status: unverified
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: scrub_proposals
          in: query
          required: false
          description: 'F4-S-02: also replace the retained HITL decision-record copies` content with a dated scrub marker (audit row per proposal, in-tx). Default false — the decision record survives verbatim and is disclosed instead.'
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Unverified response shape
          content:
            application/json:
              schema:
                type: object
                example: {"deleted": true, "retained_proposal_copies": [{"id": 1, "status": "approved"}], "retained_truncated": false, "scrubbed": false, "scrubbed_count": 0}
                description: 'true when the knowledge row existed and was erased (vec0 + FTS + graph + suggest_feedback residue + tombstone + in-tx erasure audit row, one tx); retained_proposal_copies names up to 500 HITL decision records still carrying the content verbatim (exact-bytes correlation; retained_truncated signals overflow; empty for direct /add chunks); scrubbed echoes the query flag and scrubbed_count the rows actually scrubbed. Art-17-grade demands: use /dsar purge (subject-wide) or ?scrub_proposals=1 — single-forget default preserves the decision record (see the Art 17(3) directive in docs/compliance.md).'
  /domains:
    get:
      summary: List domains with per-domain counts
      operationId: listDomains
      responses:
        "200":
          description: Domains and their stats
          content:
            application/json:
              schema:
                type: object
                properties:
                  domains:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        entries: { type: integer }
                        entities: { type: integer }
                        relations: { type: integer }
                        multi_db: { type: boolean }
    post:
      summary: Create or warm a domain
      operationId: createDomain
      description: >
        Idempotent. Returns 201 if the domain was newly created (file opened +
        migration run), 200 if it already existed. v1.27.16 "Drawbridge"
        (M5/F-41): POST is the ONE creation path — registration is
        cap-bounded (`BRAIN_MAX_DOMAIN_DBS`, default 256) and a probeable
        read can never create a file (an unregistered name resolves 404
        `domain_unknown` on GET-style routes).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  pattern: "^[a-z0-9][a-z0-9_-]{0,62}$"
              required: [name]
      responses:
        "200":
          description: Domain already existed
          content:
            application/json:
              schema:
                type: object
                example: {"name": "acme-eu", "created": false, "multi_db": true}
                description: '200 when the domain already existed; 201 when newly created — same body shape'
        "201":
          description: Domain created
          content:
            application/json:
              schema:
                type: object
                example: {"name": "acme-eu", "created": true, "multi_db": true}
                description: '201 when newly created; 200 when it already existed — same body shape'
        "400": { $ref: "#/components/responses/BadRequest" }
        "507":
          description: >
            v1.27.16 (M5/F-41) — `insufficient_storage`: the registration cap
            (`BRAIN_MAX_DOMAIN_DBS`, default 256) is exhausted. A domain must
            be freed (remove its per-domain files) or the cap raised.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /domains/{name}:
    delete:
      summary: Delete a domain and all its data
      operationId: deleteDomain
      description: >
        The `global` domain is protected. The caller MUST echo the domain name
        as `?confirm=<name>` so a typoed URL or replay cannot destroy data.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
        - name: confirm
          in: query
          required: true
          schema: { type: string }
          description: Must equal `{name}`.
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  deleted: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
  /domains/{name}/vacuum:
    post:
      summary: Reclaim free pages in the domain's DB
      operationId: vacuumDomain
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Vacuumed
          content:
            application/json:
              schema:
                type: object
                example: {"name": "acme-eu", "vacuumed": true}
                description: 'VACUUM run on the domain pool (full snapshot write; the connection tracker quiesced first)'
  /domains/{name}/export:
    get:
      summary: Stream a consistent snapshot of the domain's .db file
      operationId: exportDomain
      description: >
        Uses SQLite `VACUUM INTO` (quote-escaped path) for a consistent
        snapshot — safe under concurrent writes. Returns
        `application/octet-stream` with a `Content-Disposition: attachment`
        header. Authorization is layout-dependent (S2-08): Read on the named
        domain in multi-db mode (the file IS the domain); Admin in shim mode,
        where the snapshot resolves to the ONE shared pool and therefore
        contains every tenant's data.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The .db snapshot
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /domains/{name}/import:
    post:
      summary: Restore a previously-exported .db snapshot into a NEW domain
      operationId: importDomain
      description: >
        Body is the raw bytes of a brain-<domain>.db. Target domain must NOT
        already exist on disk (no overwrite of live data). `global` is
        protected. Bytes are written via temp file + atomic rename.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                type: object
                properties:
                  name: { type: string }
                  imported: { type: boolean }
                  bytes: { type: integer }
        "400": { $ref: "#/components/responses/BadRequest" }
        "413": { $ref: "#/components/responses/PayloadTooLarge" }
  /profiles:
    get:
      summary: List profiles (v1.21.0 Profiles)
      operationId: listProfiles
      description: >
        Every profile: the 12 ship-with presets (seeded at migration, editable)
        plus operator-created clones. Read-gated. Consumed by the onboarding
        wizard and `brain setup`.
      responses:
        "200":
          description: The profile list, name-ordered
          content:
            application/json:
              schema:
                type: object
                properties:
                  profiles:
                    type: array
                    items: { $ref: "#/components/schemas/Profile" }
  /profiles/{name}:
    get:
      summary: Get one profile
      operationId: getProfile
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Create or edit a profile (Admin, audited)
      operationId: upsertProfile
      description: >
        The path is the name (a body `name` field is ignored). Absent fields
        mean "don't set that knob". Editing a seeded preset overwrites it;
        operator edits survive re-migrations (INSERT OR IGNORE seeding).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpsert" }
      responses:
        "200":
          description: The stored profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/BadRequest" }
  /domains/{name}/profile:
    get:
      summary: The domain's bound profile + effective knobs
      operationId: getDomainProfile
      description: >
        The Health-panel transparency view. `profile`/`knobs` are null when
        unbound (server defaults — the pre-v1.21 posture).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The binding + knobs
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  profile: { type: string, nullable: true }
                  knobs:
                    type: object
                    nullable: true
                    description: The profile's knob block; null when unbound.
                  effective:
                    type: object
                    properties:
                      retention_days:
                        type: object
                        nullable: true
                        additionalProperties: { type: integer }
                        description: What recall will apply for this domain (null = the server-wide policy governs).
    post:
      summary: Bind (or unbind) a domain's profile (Admin, audited)
      operationId: bindDomainProfile
      description: >
        `{"profile": "health-hipaa"}` binds; `{"profile": null}` unbinds
        (the back-compat escape hatch). Takes effect at the next request — no
        restart, no re-ingest; the profile sets defaults, existing rows are
        untouched (the row always wins).
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                profile: { type: string, nullable: true }
      responses:
        "200":
          description: The new binding
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  profile: { type: string, nullable: true }
                  status: { type: string }
        "404": { $ref: "#/components/responses/NotFound" }
  /roles:
    get:
      summary: List every role bundle (admin surface, Read)
      operationId: listRoles
      description: >
        The seeded presets + operator-defined bundles, name-ordered. Reads are
        Read at global scope (roles are server config, not domain data). Roles
        bind to a principal via the IdP `roles` claim or an admin.
      responses:
        "200":
          description: The role bundles
          content:
            application/json:
              schema:
                type: object
                properties:
                  roles:
                    type: array
                    items: { $ref: "#/components/schemas/Role" }
  /roles/{name}:
    get:
      summary: Get one role bundle (Read)
      operationId: getRole
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The role bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      summary: Define or edit a role bundle (Admin, audited)
      operationId: upsertRole
      description: >
        The path is the name (a body `name` field is ignored). Absent vectors
        default to empty (deny-by-default for reads + actions). The change
        takes effect at the next request (no restart): the data gate + the
        action gate read the same store. Editing a seeded preset overwrites it;
        operator edits survive re-migrations.
      parameters:
        - name: name
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleUpsert" }
      responses:
        "200":
          description: The stored role bundle
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
  /domains/move:
    post:
      summary: Bulk-relabel chunks into a target domain (v1.13.0 Route)
      operationId: moveDomains
      description: >
        The non-re-ingest fix for the 99%-in-`global` corpus. Relabels
        `knowledge.domain` for the given ids in ONE transaction (provenance
        fields `source`/`authority`/`observed_at` are untouched), then
        recomputes the centroids of every domain touched so routing sees the
        move. `to` may not be `global` (the fallback bucket); moving rows OUT
        of `global` requires `?confirm=global` (typo-replay guard). Admin-only.
      parameters:
        - name: confirm
          in: query
          required: false
          schema: { type: string }
          description: Must equal `global` to move rows out of the fallback bucket.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids, to]
              properties:
                ids:
                  type: array
                  items: { type: integer }
                  description: Chunk ids to relabel (max 1000 per call).
                to: { type: string, description: Target domain (never `global`). }
      responses:
        "200":
          description: Moved
          content:
            application/json:
              schema:
                type: object
                properties:
                  to: { type: string }
                  moved: { type: integer }
                  from_domains:
                    type: array
                    items: { type: string }
                  recomputed:
                    type: array
                    items: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /domains/recompute:
    post:
      summary: One-shot recompute of every domain's routing centroid (v1.13.0 Route)
      operationId: recomputeDomains
      description: >
        The post-migration catch-up sweep that makes auto-routing meaningful:
        recomputes every known domain's centroid from the live `vec_knowledge`
        index and deletes stale centroids for domains that emptied out. Run
        right after deploying v1.13.0 (before auto-routed ingests accumulate)
        and again after `POST /domains/move` passes. Admin-only.
      responses:
        "200":
          description: Recomputed
          content:
            application/json:
              schema:
                type: object
                properties:
                  recomputed:
                    type: array
                    description: (domain, vector count) per domain.
                    items:
                      type: array
                      minItems: 2
                      maxItems: 2
                      items: {}
        "403": { $ref: "#/components/responses/Forbidden" }
  /auth/refresh:
    post:
      summary: Exchange a refresh token for a new access + refresh token pair (v1.2 AuthN)
      description: >
        Verifies the presented refresh token cryptographically, detects reuse
        (revoke_chain burns the family on reuse — OWASP pattern), rotates the
        chain, returns a fresh access (≤15 min) + refresh (≤24h) token pair.
        PUBLIC route — the refresh token is the credential. Returns 404
        `jwt_unavailable` when the server is in opaque-token mode.
      operationId: authRefresh
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: Fresh token pair
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        "401":
          description: Refresh token invalid / expired / wrong type
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: invalid_claim }
                  error: { type: string }
        "403":
          description: Refresh-chain reuse detected; the chain has been revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: refresh_reuse_detected }
                  error: { type: string }
  /auth/logout:
    post:
      summary: Revoke the request's access token (v1.2 AuthN)
      description: >
        Adds the request's access-token `jti` to the `(jti, iss)` denylist with
        `reason='logout'`. v1.27.16 "Drawbridge" (M3.4): sits BEHIND the bearer
        middleware — the presented access token is verified first (a public
        logout could only ever "succeed" at revoking nothing, so an
        unauthenticated call gets a middleware 401). Reads the `Principal`
        injected by the JWT middleware on the verified access-token request.
      operationId: authLogout
      responses:
        "204":
          description: The access token was revoked (reason=logout) — no body. A request without a verified bearer returns 401 instead.
        "401":
          description: No valid bearer was presented — nothing to revoke
  /auth/revoke:
    post:
      summary: Operator/admin revoke a specific token by jti (v1.2 AuthN)
      description: >
        Revokes a specific `jti` without the holder presenting it. Requires
        admin auth. Body: `{ jti, iss, reason, expires_at? }`. Used for
        incident response (suspected compromise) without waiting for natural
        expiry. Invalidates the negative-lookup cache for the revoked `(jti, iss)`.
      operationId: authRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RevokeRequest"
      responses:
        "204":
          description: Revoked
        "401":
          description: Not authenticated
        "403":
          description: Not admin-scoped
  /workflow/reflection/corpus:
    get:
      summary: De-identified disagreement-corpus export (DPO/admin; audited)
      description: >
        The labeled-corpus export for the Reflect/learn round: the
        after-action reflection records the close seam captures, each with
        its hard-negative disagreement rows. Every row carries its frozen
        train/holdout partition (a pure function of the run id over a
        pinned constant) so a bleed is checkable. Identifiers render as
        content digests and text excerpts pass the read-seam sanitizer with
        unconditional PII masking — the raw case input never exports. The
        page is bounded (limit inside 1..=500) and EVERY export lands a
        global audit row naming the principal, the filter set, and the row
        count.
      operationId: workflowReflectionCorpus
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: integer
          description: Only rows recorded at or after this epoch second.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: partition
          in: query
          required: false
          schema:
            type: string
            enum: [all, train, holdout]
          description: The frozen-split side to export (all = unfiltered).
      responses:
        "200":
          description: The bounded, de-identified corpus page
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id:
                          type: integer
                        seq:
                          type: integer
                        partition:
                          type: string
                          enum: [train, holdout]
                        record:
                          type: object
                        disagreements:
                          type: array
                          items:
                            type: object
        "400":
          description: limit or partition outside the pinned vocabulary
        "403":
          description: Admin scope or DPO role missing
  /workflow/scoreboard:
    get:
      summary: Workflow outcome/efficiency scoreboard (DPO/admin evidence surface)
      description: >
        Aggregates the governed-workflow scoreboard over the most recent
        1000 runs: first-contact resolution, repeat-contact rate, correctness,
        override rate, abstention, guidance acceptance, handoff completeness,
        and escalation honor. All rates are integer ten-thousandths (10000 =
        100%). `audit_ok` is fail-closed per run — a run counts green only
        when a workflow audit row actually references it. Weekly report +
        monthly human-signed recalibration posture.
      operationId: workflowScoreboard
      responses:
        "200":
          description: The aggregated scoreboard
          content:
            application/json:
              schema:
                type: object
                properties:
                  fcr_units:
                    type: integer
                  repeat_contact_rate_units:
                    type: integer
                  correctness_units:
                    type: integer
                  override_rate_units:
                    type: integer
                  gap_rate_units:
                    type: integer
                  abstention_rate_units:
                    type: integer
                  guidance_acceptance_units:
                    type: integer
                  handoff_completeness_units:
                    type: integer
                  audit_green:
                    type: boolean
                  escalation_honored_units:
                    type: integer
                  runs_scored:
                    type: integer
                  calibration_report_emitted:
                    type: boolean
                    description: >-
                      True when this read triggered the weekly machine-generated
                      CalibrationReport on the workflow audit chain.
                  kcs_linkage_rate_units:
                    type: integer
                    description: KCS Evolve-loop linkage rate (ten-thousandths).
                  searched_found_rate_units:
                    type: integer
                    description: KCS search-and-solve rate (ten-thousandths).
                  article_freshness_median_age_secs:
                    type: integer
                    description: Median governed-article age since last review.
                  self_service_deflection_units:
                    type: integer
                    description: Indicative deflection from KB feedback (docs/kb-deflection.md).
                  kb_feedback_total:
                    type: integer
                    description: Total on-page KB feedback events counted.
                  kb_hot_topics:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        feedback_count:
                          type: integer
                  return_rate_units:
                    type: integer
                    description: Share of runs that are return/RMA runs (ten-thousandths).
                  warranty_claim_rate_units:
                    type: integer
                    description: Share of runs that are warranty-claim runs (ten-thousandths).
                  ftfr_units:
                    type: integer
                    description: >-
                      First-time-fix rate over the repair-field cohort — the FCR
                      repeat-window method applied to first-visit resolution.
                  refund_cycle_time_median_secs:
                    type: integer
                    description: Median seconds to terminal resolution over resolved return/warranty runs.
                  returnless_share_units:
                    type: integer
                    description: Share of return runs disposed returnless-refund (ten-thousandths).
                  aftersales_fraud_flag_rate_units:
                    type: integer
                    description: Share of return runs flagged by deterministic fraud signals (ten-thousandths).
                  goodwill_total_cents_30d:
                    type: integer
                    description: Total goodwill amount over the trailing 30 days (cents), aggregated only over audited remedies.
                  goodwill_entries_30d:
                    type: integer
                    description: Count of goodwill entries over the trailing 30 days.
                  goodwill_unaudited_excluded_30d:
                    type: integer
                    description: Count of goodwill rows EXCLUDED for missing audit linkage (the honest gap signal).
                  voc_contacts_total:
                    type: integer
                    description: Contact volume (workflow runs) — the ISO 10004 VoC denominator.
                  voc_complaints_total:
                    type: integer
                    description: Complaint-run count — the ISO 10004 VoC numerator.
                  voc_complaints_per_thousand_contacts_units:
                    type: integer
                    description: Complaints per thousand contacts (hundredths, lineage-derived).
                  review_independence_risk:
                    type: integer
                    description: ASI09 approval-fatigue telemetry (v1.28.62) — 1 when the windowed approval rate exceeds 0.9 over >= 20 decisions (the client detector's verdict, server-side); else 0.
                  approval_uniformity_ratio:
                    type: integer
                    description: The windowed approval rate in integer ten-thousandths (truncating; 10000 = 100%) over the same sample.
                  review_decisions_window:
                    type: integer
                    description: approved + rejected decisions in the uniformity sample (the denominator context).
        "401":
          description: Not authenticated
        "403":
          description: Not DPO/admin
  /kcs/articles:
    get:
      summary: KCS content-health worklist (Evolve)
      description: >
        Lists knowledge rows that carry a KCS lifecycle state
        (`draft`/`approved`/`published`). `state=` filters by lifecycle;
        `stale=1` keeps only the content-health worklist: articles past their
        freshness-review deadline or carrying open improve flags
        (`kcs_flag` findings from runs that contradicted them). Every text
        field passes the read seam; rows in domains the principal cannot
        read are filtered.
      operationId: listKcsArticles
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [draft, approved, published]
        - name: stale
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: The filtered article worklist
          content:
            application/json:
              schema:
                type: object
                properties:
                  articles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        title:
                          type: string
                        snippet:
                          type: string
                        kcs_state:
                          type: string
                          enum: [none, draft, approved, published]
                        freshness_review_due:
                          type: integer
                          nullable: true
                        open_flags:
                          type: integer
                        stale:
                          type: boolean
        "400":
          $ref: "#/components/responses/BadRequest"
  /kcs/translate:
    post:
      summary: File a human translation proposal (Write + workflow role)
      description: >
        Keystone: files a pending `kcs_translate` HITL proposal for a
        per-locale translation of a published article. Translation is a
        HUMAN act — the tool files and governs, it never machine-translates.
        Approval (role `approve`) is the ONLY writer of an approved
        `kcs_translations` row, pinned to `based_revision` so the source
        advancing later lands it on the content-health worklist. Audited in
        the same transaction.
      operationId: fileKcsTranslation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [knowledge_id, locale, title, body_md]
              properties:
                knowledge_id: { type: integer }
                locale: { type: string, maxLength: 12 }
                title: { type: string }
                body_md: { type: string }
      responses:
        "200":
          description: The pending proposal reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id: { type: integer }
                  status: { type: string, enum: [pending] }
                  kind: { type: string, enum: [kcs_translate] }
        "400":
          description: translation_invalid (bounds | locale | missing article)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /kcs/articles/{id}/approve:
    post:
      summary: Approve a draft KCS article (HITL gate)
      description: >
        Moves an article `draft -> approved` and stamps its freshness-review
        deadline (90 days). Requires Write on the article's domain plus the
        `approve` role. Publishing is deliberately out of scope — nothing
        auto-publishes. Audited in the same transaction as the transition.
      operationId: approveKcsArticle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The approved article summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  kcs_state:
                    type: string
                  freshness_review_due:
                    type: integer
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Article is not in the draft state (or changed concurrently)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kcs/articles/{id}/publish:
    post:
      summary: Propose publishing a KCS article to the public KB (Beacon)
      description: >
        Creates a pending `kcs_publish` proposal. Approval (which requires the
        `approve` role AND a distinct `publish` capability) flips the article
        `approved -> published`, assigns its `public_slug` (unique among
        published articles), and stamps the freshness deadline.
        `action=retract` is the operational rollback: state back to
        `approved`; the next `brain kb build` drops the page. Proposing needs
        Write on the article's domain; the publish capability is enforced at
        APPROVAL time. Audited (`workflow/kcs/publish` / `workflow/kcs/retract`).
      operationId: proposeKcsPublish
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                public_slug:
                  type: string
                  description: Required for action=publish; lowercase alnum + hyphen.
                action:
                  type: string
                  enum: [publish, retract]
                  default: publish
      responses:
        "200":
          description: The pending proposal summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id:
                    type: integer
                  knowledge_id:
                    type: integer
                  action:
                    type: string
                  status:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Article is not in the state the action requires
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /kcs/articles/{id}/preview:
    get:
      summary: Preview the exact sanitized public page for an article (Beacon)
      description: >
        Renders the article through the SAME function the static KB build uses,
        under the strict public seam — unconditional PII redaction, invisible-
        Unicode strip, markdown-ref strip, no operator bypass. What you approve
        is byte-identical to what ships. Requires Read.
      operationId: previewKcsArticle
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The public HTML plus lifecycle state
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  kcs_state:
                    type: string
                  public_html:
                    type: string
        "404":
          $ref: "#/components/responses/NotFound"
  /ops/shifts:
    get:
      summary: The shift ring view — which site owns the queue right now (Watchbill)
      description: >
        Follow-the-sun as data: pure read-time arithmetic over stored shift
        rows. Returns the site whose queue is in scope at `now` (the queue
        re-scopes to the incoming site at the START of the derived overlap
        window, never the open cases), whether an overlap window is running,
        and when the next boundary lands. Deterministic; no scheduler daemon.
        Requires Read on the domain.
      operationId: opsShifts
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
        - name: now
          in: query
          description: Evaluation instant (epoch seconds); defaults to server time.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The ring view plus every stored shift for the domain
          content:
            application/json:
              schema:
                type: object
                required: [schema_version]
                properties:
                  schema_version:
                    type: string
                    description: >
                      The WFM interchange schema version (`wfm/1`).
                      Additive-only change policy; see docs/wfm-seam.md.
                  now: { type: integer, format: int64 }
                  domain: { type: string }
                  queue_scope_site:
                    type: string
                    nullable: true
                    description: Site that owns the queue at `now` (null before the first shift).
                  incoming_site:
                    type: string
                    nullable: true
                    description: Set while inside an overlap window.
                  in_overlap: { type: boolean }
                  next_boundary_epoch:
                    type: integer
                    format: int64
                    nullable: true
                  shifts:
                    type: array
                    items: { $ref: "#/components/schemas/Shift" }
        "400":
          $ref: "#/components/responses/BadRequest"
    post:
      summary: Declare a site's on-call window (audited)
      description: >
        Stores one shift `(site, tz, window, overlap_minutes, roster)`.
        Refuses bad windows (`400 shift_window_invalid` / `shift_overlap_invalid`,
        overlap capped at 120 minutes) and double booking (`409
        shift_double_booked`) — two shifts may share time only inside the
        earlier shift's declared overlap budget. Validation, insert, and the
        audit row ride one transaction. Requires Admin on the domain (pure operator
        configuration — an agent-class principal must not re-anchor the queue).
      operationId: createShift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                domain: { type: string, default: global }
                site: { type: string }
                tz: { type: string, default: UTC }
                start_epoch: { type: integer, format: int64 }
                end_epoch: { type: integer, format: int64 }
                overlap_minutes: { type: integer, default: 0 }
                roster:
                  type: array
                  items: { type: string }
              required: [site, start_epoch, end_epoch]
      responses:
        "200":
          description: The stored shift id
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  domain: { type: string }
                  site: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          description: shift_double_booked — overlaps beyond a declared overlap budget
  /ops/crew:
    get:
      summary: The crew roster — presence, sites, roles, skills (Crew)
      description: >
        TTL-decayed presence computed at read time (active < 5 min, away <
        30 min, offline beyond), joined with the Watchbill shift ring (site
        badge) and HITL-maintained skills tags. Presence shows WHAT KIND of
        act (closed vocabulary), never case content — only an opaque
        `current_case_ref`. When the DPO switch is off (or its config row
        cannot be read) the roster is EMPTY — hidden, never an error.
        Requires Read on the domain. Read capped at the newest 500 rows.
      operationId: opsCrew
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
        - name: now
          in: query
          description: Evaluation instant (epoch seconds); defaults to server time.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The roster view
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: integer, format: int64 }
                  domain: { type: string }
                  presence_enabled: { type: boolean }
                  members:
                    type: array
                    items: { $ref: "#/components/schemas/CrewMember" }
        "400":
          $ref: "#/components/responses/BadRequest"
  /ops/skills:
    get:
      summary: The WFM skills feed (interop boundary)
      description: >
        The domain's HITL-maintained skill registry as a stable, bounded,
        ordered read — the documented interop boundary for
        workforce-management tools (COPC alignment is interop, not
        reimplementation; no forecasting/scheduling engine exists here).
        Read capped at the newest 1000 rows. Requires Read on the domain.
      operationId: listSkillsFeed
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
      responses:
        "200":
          description: The skills feed, grouped by principal
          content:
            application/json:
              schema:
                type: object
                required: [schema_version]
                properties:
                  schema_version:
                    type: string
                    description: >
                      The WFM interchange schema version (`wfm/1`).
                      Additive-only change policy; see docs/wfm-seam.md.
                  domain: { type: string }
                  skills:
                    type: array
                    items:
                      type: object
                      properties:
                        principal: { type: string }
                        skills:
                          type: array
                          items: { type: string }
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: Propose a skills change — the ONLY door to `principal_skills` (audited)
      description: >
        Creates ONE pending `crew_skills_update` proposal carrying
        `{principal, add[], remove[]}`. Tags are lowercase alnum + hyphen,
        1..=32 chars, at most 32 per principal; the same validation runs again
        at approval time inside the applying transaction. No direct write to
        the skills table exists. Requires Write on the domain.
      operationId: proposeSkillsChange
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal]
              properties:
                domain: { type: string, default: global }
                principal: { type: string, maxLength: 256 }
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
      responses:
        "200":
          description: The created proposal reference
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id: { type: integer }
                  kind: { type: string }
                  status: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
  /ops/workload:
    get:
      summary: Per-principal workload + fatigue signals (Handshake, G7)
      description: >
        Workload visibility computed from lineage ONLY: concurrent open
        envelopes, pending outbound handover burden, accepted transfers-in on
        open runs, re-ask load (`case/reask` events attributed through the
        run), and the confirm-gate backlog. Fatigue signals (consecutive-
        shift and open-load patterns from the shift tables) alert the
        scheduling HUMAN — nothing here ever reassigns work. Read-only by
        construction; no case content is emitted. Requires Read on the
        domain.
      operationId: opsWorkload
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
        - name: now
          in: query
          description: Evaluation instant (epoch seconds); defaults to server time.
          schema: { type: integer, format: int64 }
      responses:
        "200":
          description: The workload view plus fatigue signals
          content:
            application/json:
              schema:
                type: object
                required: [schema_version]
                properties:
                  schema_version: { type: string }
                  now: { type: integer, format: int64 }
                  domain: { type: string }
                  workload:
                    type: array
                    items:
                      type: object
                      properties:
                        principal: { type: string }
                        open_envelopes: { type: integer }
                        handover_burden_outbound: { type: integer }
                        transfers_in_open: { type: integer }
                        reask_load: { type: integer }
                        gate_backlog:
                          type: integer
                          description: >
                            Pending proposals owned by the principal that this
                            domain's lineage already surfaced. Since v1.28.53
                            proposals carry a `domain` column, but this view's
                            attribution still rides domain-lineage only (by
                            owner within the queried pool) — no cross-tenant
                            inference.
                  fatigue_signals:
                    type: array
                    items:
                      type: object
                      properties:
                        principal: { type: string }
                        consecutive_shifts: { type: integer }
                        open_envelopes: { type: integer }
                        reason: { type: string }
        "400":
          $ref: "#/components/responses/BadRequest"
  /ops/coverage:
    get:
      summary: Competence coverage — skills vs worktype demand queue (Handshake, G7)
      description: >
        One row per demanded worktype: required tags (the routing tags), the
        principals whose HITL-maintained skills cover EVERY tag, the open
        demand depth (active runs of that kind), and whether the board is
        covered. Deterministic read over the same routing data the colleague
        board uses. Requires Read on the domain.
      operationId: opsCoverage
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
      responses:
        "200":
          description: The coverage view
          content:
            application/json:
              schema:
                type: object
                required: [schema_version]
                properties:
                  schema_version: { type: string }
                  domain: { type: string }
                  coverage:
                    type: array
                    items:
                      type: object
                      properties:
                        worktype: { type: string }
                        required_tags:
                          type: array
                          items: { type: string }
                        qualified_principals:
                          type: array
                          items: { type: string }
                        open_demand: { type: integer }
                        covered: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
  /ops/crew/config:
    post:
      summary: The DPO presence switch (Admin, audited)
      description: >
        Enables or disables presence visibility for a domain. Fail-open to
        HIDDEN: when the config cannot be trusted the roster reads as empty.
        The flip and its audit row ride one transaction. Requires Admin on
        the domain.
      operationId: setCrewConfig
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [presence_enabled]
              properties:
                domain: { type: string, default: global }
                presence_enabled: { type: boolean }
      responses:
        "200":
          description: The applied configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  presence_enabled: { type: boolean }
        "400":
          $ref: "#/components/responses/BadRequest"
  /workflow/plugins/mount:
    post:
      summary: Record UI-plugin mount/unmount evidence (Art. 12 record-keeping)
      description: >
        Records one audited evidence row for a UI-plugin mount or unmount —
        the plugin identity, the slot-registry revision it composed at, and
        the SHA-256 of its bundle when the boot manifest carries one.
        Metadata only; never plugin content.
      operationId: recordPluginMount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [plugin]
              additionalProperties: false
              properties:
                plugin:
                  type: string
                  minLength: 1
                  maxLength: 64
                  pattern: "^[a-z0-9-]+$"
                action:
                  type: string
                  enum: [mount, unmount]
                revision:
                  type: integer
                  format: int64
                bundle_sha256:
                  type: string
                  minLength: 64
                  maxLength: 64
      responses:
        "200":
          description: Evidence row recorded on the audit chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400":
          description: plugin_invalid, action_invalid, or sha_invalid
        "401":
          $ref: "#/components/responses/Unauthorized"
  /workflow/calibration/sign:
    post:
      summary: Monthly human-signed workflow calibration gate (DPO/admin)
      description: >
        Records one human-signed CalibrationRecord per calendar month on the
        workflow audit chain (scorer version, reviewer-supplied
        scorer-vs-human kappa in ten-thousandths, uplift vs our own baseline,
        reviewer id). A signature re-anchors the baseline. 409
        `already_signed_this_month` when the gate is closed for the month.
      operationId: signWorkflowCalibration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reviewer_id, human_agreement_kappa_units]
              additionalProperties: false
              properties:
                reviewer_id:
                  type: string
                  minLength: 1
                  maxLength: 128
                human_agreement_kappa_units:
                  type: integer
                  description: "-1 sentinel (no human calibration yet) or 0..=10000"
      responses:
        "200":
          description: Signed; the record is on the audit chain
          content:
            application/json:
              schema:
                type: object
                properties:
                  signed: { type: boolean }
                  month: { type: integer }
        "400":
          description: reviewer_invalid or kappa_invalid
        "401":
          description: Not authenticated
        "403":
          description: Not DPO/admin
        "409":
          description: already_signed_this_month
  /workflow/runs/{id}:
    get:
      summary: Fetch one workflow run (Read on the run's domain)
      description: >
        Returns the run row (id, domain, kind, status, state_json, created_at,
        updated_at). The `state_json` body is routed through the shared read
        seam (`sanitize_read`) like every other stored-text surface. 404 when
        the run does not exist.
      operationId: getWorkflowRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The run row
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer }
                  domain: { type: string }
                  kind: { type: string }
                  status: { type: string }
                  state_json: { type: string }
                  created_at: { type: integer }
                  updated_at: { type: integer }
        "401": { description: Not authenticated }
        "403": { description: Not authorized for the run's domain }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/report:
    get:
      summary: The run's recorded-rows report at a pinned law version (Read on the run's domain)
      operationId: workflowRunReport
      description: >
        A pure rendering of the run's RECORDED rows only — its gate records
        (workflow_steps) and workflow audit rows — labeled with the pinned
        law_version (absent pin = the run's own intake stamp). The
        law_version_mismatch advisory compares the pin against the curated
        legal DB's current law version for the pin's jurisdiction: advisory
        ONLY — never a refusal, never a block; the advisory is absent when
        BRAIN_LEGAL_DB_PATH is unset or unreadable (or no pin was named).
        Reads are not audited (an audited read would break the
        byte-reproducibility of the report itself). Same rows + same pin →
        byte-identical report.
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: law_version
          in: query
          required: false
          schema: { type: string }
          description: Pin the view to this law version.
      responses:
        "200":
          description: The deterministic report
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  domain: { type: string }
                  kind: { type: string }
                  status: { type: string }
                  created_at: { type: integer }
                  updated_at: { type: integer }
                  state_revision: { type: integer }
                  law_version: { type: string }
                  law_version_pinned: { type: string, nullable: true }
                  law_version_mismatch: { type: boolean, nullable: true }
                  legal_db_head:
                    type: string
                    nullable: true
                    description: The curated DB's current law version for the pin's jurisdiction (advisory data).
                  gate_records:
                    type: array
                    items: { type: object }
                  audit:
                    type: array
                    items: { type: object }
        "401": { description: Not authenticated }
        "403": { description: Not authorized for the run's domain }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/steps:
    get:
      summary: List the steps of a workflow run (Read on the run's domain)
      operationId: listWorkflowRunSteps
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The step rows (state_json sanitized at the read seam)
          content:
            application/json:
              schema:
                type: object
                properties:
                  steps:
                    type: array
                    items: { type: object }
        "401": { description: Not authenticated }
        "403": { description: Not authorized for the run's domain }
        "404": { description: Workflow run not found }
  /workflow/runs:
    post:
      summary: Open a governed workflow run (Write + workflow role gate)
      description: >
        Substrate projection (v1.28.15): an INSERT under WorkflowTx with the
        `workflow/run/open` audit row in the SAME transaction. No engine
        logic lives server-side — the steward-harness drives this route.
      operationId: openWorkflowRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, kind, state_json]
              properties:
                domain: { type: string }
                kind: { type: string }
                jurisdiction:
                  type: string
                  description: OPTIONAL intake hint; the server stamps the run's law_version through the SDK's single-owner table — absent/unknown stamps empty. The raw value is never stored.
                state_json:
                  type: string
                  description: Opaque engine state; valid JSON, <= 256 KiB. For `valet/%` kinds this MUST be a readable valet envelope whose `what` passes the injection screen (v1.28.63 Wardline).
      responses:
        "200":
          description: The opened run
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  revision: { type: integer }
                  law_version:
                    type: string
                    description: The server-derived stamp (may be empty).
        "400": { description: domain_invalid | kind_invalid | state_invalid | state_too_large | screen_rejected (valet/% kind, label tripped the injection screen) | valet_state_invalid (valet/% kind, state is not a readable valet envelope) }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (domain Write or workflow role gate) }
  /workflow/runs/{id}/state:
    get:
      summary: Engine-exact run state `{state_json, revision}` (Read + workflow role gate)
      description: >
        The MACHINE round-trip view. Deliberately NOT sanitized at the read
        seam (engines CAS against the exact stored bytes); the human view is
        `GET /workflow/runs/{id}`. The read is audited on the workflow chain.
      operationId: getWorkflowRunState
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The engine-exact state
          content:
            application/json:
              schema:
                type: object
                properties:
                  state_json: { type: string }
                  revision: { type: integer }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
    put:
      summary: CAS-advance a run's state (Write + workflow role gate)
      operationId: putWorkflowRunState
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [expected_rev, state_json]
              properties:
                expected_rev: { type: integer }
                state_json: { type: string, maxLength: 262144 }
                status:
                  type: string
                  enum: [active, cancelled, closed, completed, fired, resolved]
                  default: active
                  description: >
                    CLOSED vocabulary (v1.28.63 Wardline) — exactly the statuses
                    the kernel writes and the shipped readers distinguish; an
                    unknown value refuses with `unknown_status`.
      responses:
        "200":
          description: Advanced
          content:
            application/json:
              schema:
                type: object
                properties:
                  revision: { type: integer }
        "400": { description: unknown_status — status outside the closed vocabulary (active | cancelled | closed | completed | fired | resolved) }
        "409":
          description: cas_stale — the body carries `actual_revision`
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string }
                  details:
                    type: object
                    properties:
                      actual_revision: { type: integer }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/events:
    post:
      summary: Enqueue an outbox event, exactly-once by key (Write + workflow role gate)
      operationId: postWorkflowEvent
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic, payload_json, idempotency_key]
              properties:
                topic:
                  type: string
                  description: >
                    1..=64 lowercase alnum/`/`/`-`. RESERVED vocabulary
                    (v1.28.63 Wardline): `channel/*`, `steering`,
                    `workflow/valet*` are kernel-only — the route refuses them
                    with `topic_reserved` (audited).
                payload_json: { type: string }
                idempotency_key: { type: string, maxLength: 128 }
                parent_event_id: { type: integer, description: "optional outbox id this event follows (lineage)" }
      responses:
        "200":
          description: "`{first, event_id}` — first=false when the key replayed; event_id resolves the surviving row either way"
          content:
            application/json:
              schema:
                type: object
                properties:
                  first: { type: boolean }
                  event_id: { type: integer }
        "400": { description: "topic_invalid | topic_reserved (kernel-only vocabulary: channel/* | steering | workflow/valet*) | payload_invalid | payload_too_large | key_invalid | parent_invalid" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
    get:
      summary: The run's lineage read — ordered events with parent links (Read)
      description: >
        Ordered outbox events for the run, each carrying its `parent_id`
        ancestry link. `?branch=<event_id>` narrows to that event's ancestor
        chain, root-first (the rewind/UI timeline view). Payloads ride the
        read seam.
      operationId: getWorkflowEvents
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: branch
          in: query
          required: false
          schema: { type: integer, description: "event id whose ancestor chain is returned" }
        - name: since
          in: query
          required: false
          schema: { type: integer, description: "Fathom M3: return only rows with event_id > since (reconnect gap backfill)" }
      responses:
        "200":
          description: "`{events: [{event_id, parent_id, topic, payload_json, status}]} ordered by id"
          content:
            application/json:
              schema:
                type: object
                properties:
                  events:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id: { type: integer }
                        parent_id: { type: integer, nullable: true }
                        topic: { type: string }
                        payload_json: { type: string }
                        status: { type: string }
        "400": { description: branch_invalid | since_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/context:
    get:
      summary: The derived context window — write→select (Read on the run's domain)
      description: >
        Fathom M2: the deterministic window over the run's unbounded event
        chain — latest `workflow/checkpoint` at-or-before `at_event` + delta
        events after it + per-finding digests + the open question. Field-
        budgeted (`budget`, default 2000, cap 100000): truncation drops the
        OLDEST delta first and never drops the checkpoint or open question,
        flagged with `truncated`. Prefix-stable: appending events never
        changes an earlier window. One counted field ≈ one token — a
        documented approximation for consumers; LLM-side compaction is the
        consumer's contract, never the server's.
      operationId: getWorkflowContext
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: at_event
          in: query
          required: false
          schema: { type: integer, description: "anchor point (event id); absent = latest" }
        - name: budget
          in: query
          required: false
          schema: { type: integer, description: "field budget over delta payloads (default 2000, cap 100000)" }
      responses:
        "200":
          description: >
            `{run_id, at_event, checkpoint: {event_id, topic, payload_json} | null,
            delta: [{event_id, topic, payload_json}], findings_digests: [hex],
            open_question: string | null, truncated}`
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  at_event: { type: integer, nullable: true }
                  checkpoint:
                    type: object
                    nullable: true
                    properties:
                      event_id: { type: integer }
                      topic: { type: string }
                      payload_json: { type: string }
                  delta:
                    type: array
                    items:
                      type: object
                      properties:
                        event_id: { type: integer }
                        topic: { type: string }
                        payload_json: { type: string }
                  findings_digests:
                    type: array
                    items: { type: string }
                  open_question: { type: string, nullable: true }
                  truncated: { type: boolean }
        "400": { description: at_event_invalid | budget_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/rewind:
    post:
      summary: Rewind = branch, never delete (Write + approve role gate)
      description: >
        Verify the target is a `workflow/checkpoint` event (or the run root)
        of THIS run, then CAS-write the checkpoint's state snapshot back over
        the live state appending a `branches[]` marker
        (`{from_event, reason, at}`). Nothing is deleted; the abandoned branch
        stays fully queryable via GET /events. The engine's next emitted event
        parents at the rewind target.
      operationId: rewindWorkflowRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_event_id, reason]
              properties:
                to_event_id: { type: integer, description: "checkpoint event (or run root) to branch from" }
                reason: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Branched
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revision: { type: integer }
                  branched_from: { type: integer }
        "400": { description: reason_invalid | reason_rejected | rewind_target_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (domain Write or approve role gate) }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/handoff:
    get:
      summary: The I-PASS handoff packet (Read on domain)
      description: >
        Assembled from what exists: Illness = intent/is_seed/is_not_seed +
        opening event; Patient = domain + subject rows; Action = steps + step
        events; Situation = latest checkpoint digest + open pending_question;
        Safety = SLA envelope, legal-hold status, escalation flag.
        `handoff_complete` derives exactly as the scoreboard derives it
        (`status == "completed"`). Every text field rides the read seam.
      operationId: workflowHandoff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The packet
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  domain: { type: string }
                  illness: { $ref: "#/components/schemas/IpassSection" }
                  patient: { $ref: "#/components/schemas/IpassSection" }
                  action: { $ref: "#/components/schemas/IpassSection" }
                  situation: { $ref: "#/components/schemas/IpassSection" }
                  safety: { $ref: "#/components/schemas/IpassSection" }
                  handoff_complete: { type: boolean }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/cases/{id}/gdl:
    post:
      summary: Launch one GDL case episode on a fresh run through the real configured provider (Write on domain + workflow role)
      description: >
        The operator case-launch boundary. Agents (`agent@loopback` bearers)
        are refused (403): agents do not self-launch cases. JWT callers must
        also hold the `workflow` role; role-less JWTs and unknown roles are refused.
        The run must be fresh (kind `troubleshoot`, status `active`, revision 0,
        state `{}`) -- the checkpoint law admits nothing else. Provider
        destination, model, and secret are server-owned configuration
        (`BRAIN_GDL_PROVIDER_BASE_URL`, `BRAIN_GDL_PROVIDER_MODEL`,
        `BRAIN_GDL_PROVIDER_SECRET_FILE`, and
        `BRAIN_GDL_PROVIDER_SECRET_ROOT`); caller-supplied legacy provider
        fields are refused with `gdl_request_migrated` and are never used.
        Production endpoints require HTTPS, reject unsafe URL shapes, pass the
        existing address screen and DNS pinning, and never follow redirects.
        The request has a 25-second total request/body deadline; dropping the
        stream receiver cancels the in-flight HTTP future. A provider failure
        after admission is durably terminal and non-retryable: the first launch
        returns 503 `gdl_provider_failed`, and a later launch returns 409
        `gdl_provider_failed` without replaying provider work. Outcomes
        otherwise use the existing GDL vocabulary: a pending capture PROPOSAL
        (human-approved later) or a Handoff/route/escalation -- nothing publishes
        automatically. Provider failures expose stable codes only; raw provider
        text, credentials, secret paths, and secret-bearing URLs are not
        reflected.
      operationId: launchGdlCase
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ticket]
              properties:
                ticket:
                  type: string
                  maxLength: 8192
                  description: The ticket verbatim (bounded 1..=8192 bytes after trimming).
      responses:
        "200":
          description: The case episode reached an existing GDL terminal outcome
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  outcome:
                    type: object
                    properties:
                      kind: { type: string, enum: [resolved, routed, escalated, verify_failed, canceled, capped] }
                      at_phase: { type: string, nullable: true }
                  capture: { type: string, description: Where the capture landed (pending proposals / audited no-proposal row); nothing is published }
        "400": { description: ticket_invalid | provider_config_invalid | secret_file_invalid | gdl_request_migrated }
        "401": { description: Not authenticated (a revoked identity dies at the middleware as 401 identity_revoked, before any route logic) }
        "403": { description: Not authorized (domain Write plus the GDL workflow role; includes the agent refusal) }
        "404": { description: Workflow run not found (refused before any provider contact) }
        "409": { description: run_not_fresh | gdl_provider_failed (the run is terminal after provider failure; no provider replay) }
        "422": { description: run_kind_invalid | provider_endpoint_refused | provider_refused }
        "503": { description: provider_unavailable | provider_response_invalid | provider_timeout | provider_cancelled | gdl_provider_failed | gdl_episode_unavailable -- no loopback fallback }
  /workflow/runs/{id}/complaint/lifecycle:
    post:
      summary: Advance the complaint lifecycle one legal step (Write on domain + workflow role)
      description: >
        Goodwill (v1.28.34): the ISO 10002 lifecycle — received → acknowledged
        → investigated → remedy_proposed → remedy_approved → closed →
        adr_referred. Transitions validate against the CLOSED table; anything
        else is a loud 400. The lineage event (`workflow/complaint`) and its
        audit row land in ONE transaction.
      operationId: complaintLifecycleTransition
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                to:
                  type: string
                  enum: [received, acknowledged, investigated, remedy_proposed, remedy_approved, closed, adr_referred]
      responses:
        "200":
          description: The transition landed
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  from: { type: string }
                  to: { type: string }
        "400":
          description: complaint_invalid (transition not in the table | non-complaint run | unknown state) | actor unbounded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/complaint/remedy:
    post:
      summary: Propose a remedy from the ISO 10002 matrix (Write on domain + workflow role)
      description: >
        Goodwill (v1.28.34): creates ONE pending HITL proposal citing its
        legal basis (closed anchor set) and its published code-of-conduct
        clause (ISO 10001). A remedy contradicting the published promise is
        FLAGGED visibly on the packet — never silently blocked. Nothing
        financial is ever executed here. Approval rides the standard
        proposal-approve gate with deterministic role-tier caps; over cap it
        escalates exactly one level with the packet attached.
      operationId: complaintRemedyPropose
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [kind, amount_cents, code_clause_id, tier]
              properties:
                kind:
                  type: string
                  enum: [repair, replace, refund, goodwill_payment, explanation_only]
                amount_cents: { type: integer, minimum: -100000000, maximum: 100000000 }
                code_clause_id: { type: string, maxLength: 128 }
                tier: { type: integer, minimum: 1, maximum: 4 }
      responses:
        "200":
          description: The pending remedy proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id: { type: integer }
                  status: { type: string, enum: [pending] }
                  legal_basis: { type: string }
                  conflicts: { type: array, items: { type: string } }
                  contradicts_published_code: { type: boolean }
                  provenance: { type: object, description: "Attestation v1.28.62 — Art 50(2) AIGEN mark: {mark, generator, generated_at, signed_by, sig}; ed25519 over the canonical claim-bound body bytes (provenance::verify refuses any tampering); sig/signed_by null when no operator key is configured (visibly unsigned)" }
        "400":
          description: remedy_kind_invalid | amount_unbounded | clause_id_unbounded | complaint_invalid (missing citation | non-complaint run)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run or cited conduct clause not found }
  /workflow/runs/{id}/complaint/adr-packet:
    get:
      summary: The ISO 10003 external-dispute packet for a member state's national ADR body (Read on domain + workflow role)
      description: >
        Goodwill (v1.28.34): run identity, audited remedy history, and the
        competent NATIONAL ADR body from the DPO-maintained registry
        (knowledge source `adr_body`). The EU ODR platform is discontinued
        (Reg. 2024/3228) — every packet states that basis and targets the
        national body; humans file. An unregistered member state denies
        loudly (fail closed).
      operationId: complaintAdrPacket
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: member_state
          in: query
          required: true
          schema: { type: string, maxLength: 64 }
      responses:
        "200":
          description: The dispute packet
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  lifecycle_state: { type: string }
                  remedy_history: { type: array, items: { type: object } }
                  adr_body: { type: string }
                  member_state: { type: string }
                  odr_note: { type: string }
                  filing: { type: string }
                  provenance: { type: object, description: "Attestation v1.28.62 — Art 50(2) AIGEN mark over the post-read-seam boundary bytes; see /complaint/remedy for the shape" }
        "400":
          description: complaint_invalid (non-complaint run | member_state unbounded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run or national ADR body not found }
  /workflow/runs/{id}/complaint/ack:
    post:
      summary: Acknowledge the complaint (Write on domain + workflow role)
      description: >
        Advocate: the legal lifecycle step `received → acknowledged` with its
        dedicated audit marker, so the monthly register can measure ack-SLA
        attainment (ISO 10002 posture: acknowledged within the hour).
      operationId: complaintAck
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The acknowledgment landed (lineage event + audit in ONE tx)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  from: { type: string }
                  to: { type: string }
        "400":
          description: complaint_invalid (non-complaint run | transition not legal | actor unbounded)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/complaints/ack-sweep:
    post:
      summary: One overdue-acknowledgment sweep over every active complaint (Write global + workflow role)
      description: >
        Advocate: exactly one `workflow/complaint/ack_overdue` alert event per
        overdue complaint on the alert bus, audited inside the caller's
        transaction, idempotent per run (a replayed sweep alerts nothing),
        bounded. Global scope — no run binds it.
      operationId: complaintAckSweep
      responses:
        "200":
          description: The sweep ran; the alerted runs are named
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerted: { type: integer }
                  run_ids: { type: array, items: { type: integer } }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/outreach/campaign:
    post:
      summary: Propose a governed outreach campaign as a HITL proposal (Write + workflow role)
      description: >
        Outreach: the deterministic consent gate runs per recipient at
        proposal time. Only recipients holding an in-force grant for the
        channel+purpose ride the proposal, each with its consent proof
        attached; everyone else is excluded with the reason visible. An
        audience producing zero eligible recipients refuses loudly. Raw
        audience identifiers are hashed at the door — the registry and the
        proposals table never see them. NOTHING sends here: an approved
        campaign exports via GET below for CRM-side execution.
      operationId: outreachCampaignPropose
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, channel, purpose, template_id, audience]
              properties:
                domain: { type: string, maxLength: 128 }
                channel: { type: string, enum: [email, sms, call] }
                purpose: { type: string, enum: [care_followup, retention, recall_notice] }
                template_id: { type: string, maxLength: 256 }
                audience:
                  type: array
                  maxItems: 1000
                  items: { type: string, maxLength: 512 }
      responses:
        "200":
          description: The pending campaign proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id: { type: integer }
                  status: { type: string, enum: [pending] }
                  recipients: { type: integer }
                  excluded:
                    type: array
                    items:
                      type: object
                      properties:
                        subject_hash: { type: string }
                        reason: { type: string, enum: [absent, revoked, expired] }
        "400":
          description: channel_invalid | purpose_invalid | audience_unbounded | field_unbounded | outreach_invalid (zero eligible recipients)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/outreach/campaign/{id}:
    get:
      summary: Export packet for an APPROVED campaign (Read + workflow role)
      description: >
        Outreach: recipients WITH their consent proof plus the message
        template reference — the artifact a CRM connector feed or operator
        export executes OUTSIDE this server. A pending or rejected campaign
        exports nothing (404).
      operationId: outreachCampaignExport
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The export packet
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id: { type: integer }
                  channel: { type: string }
                  purpose: { type: string }
                  template_id: { type: string }
                  recipients: { type: array, items: { type: object } }
                  excluded: { type: array, items: { type: object } }
                  execution: { type: string }
                  provenance: { type: object, description: "Attestation v1.28.62 — Art 50(2) AIGEN mark over the post-read-seam boundary bytes; see /complaint/remedy for the shape" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Campaign not found or not approved }
  /workflow/outreach/consent:
    get:
      summary: The deterministic consent verdict for one hashed subject/channel/purpose (Read + workflow role)
      description: >
        Outreach: absent/revoked/expired all DENY — only an in-force grant
        reads `granted`. The proof row (granted_at, expires_at, provenance)
        rides every verdict. The raw subject never leaves the handler; only
        its hash is echoed.
      operationId: outreachConsentCheck
      parameters:
        - name: subject
          in: query
          required: true
          schema: { type: string, maxLength: 512 }
        - name: channel
          in: query
          required: true
          schema: { type: string, enum: [email, sms, call] }
        - name: purpose
          in: query
          required: true
          schema: { type: string, enum: [care_followup, retention, recall_notice] }
        - name: domain
          in: query
          required: false
          schema: { type: string, maxLength: 128, default: global }
      responses:
        "200":
          description: The verdict plus its proof
          content:
            application/json:
              schema:
                type: object
                properties:
                  subject_hash: { type: string }
                  channel: { type: string }
                  purpose: { type: string }
                  decision: { type: string, enum: [granted, absent, revoked, expired] }
                  proof: { type: object, nullable: true }
        "400":
          description: channel_invalid | purpose_invalid | subject_unbounded | domain_unbounded
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/valet/due:
    post:
      summary: Fire every due valet envelope (Write + workflow role)
      description: >
        Valet (v1.28.42): the cron-cranked scheduler. Loads active runs of
        kind valet/% whose state due_at has passed, fires each in its own
        audited transaction (outbox idempotency key valet-{run}-{due_at} —
        a double cron never double-fires), re-arms repeats via CAS, and
        enqueues a metadata-only alert envelope for the Signal relay.
        Without an in-force one-subject consent the envelope is suppressed
        (audited, counted, never sent). Daemon-free by construction.
      operationId: valetDueCrank
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                now: { type: integer, description: unix-seconds override (testing/replay) }
      responses:
        "200":
          description: Crank outcome counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  fired: { type: integer }
                  suppressed_no_consent: { type: integer }
                  already_fired: { type: integer }
                  remaining:
                    type: integer
                    description: >
                      Due envelopes still waiting after this capped batch
                      (v1.28.77, additive). The batch always fires; a
                      non-zero remainder is audited and drained by the next
                      crank — re-run the crank (no auto-loop).
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/valet/brief:
    get:
      summary: Today's derived context for the operator (Read + workflow role)
      description: >
        The morning brief: due/overdue valet runs, draft proposals pending
        approval with their ADVISORY lint scores, and the trailing-window
        evening-capture notes (the Engine Diary raw material). Read-only,
        read-seam sanitized.
      operationId: valetBrief
      responses:
        "200":
          description: The composed brief
          content:
            application/json:
              schema:
                type: object
                properties:
                  now: { type: integer }
                  due:
                    type: array
                    items: { type: object }
                  drafts_pending:
                    type: array
                    items: { type: object }
                  evening_notes:
                    type: array
                    items: { type: object }
                  signal_consent_in_force: { type: boolean }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/valet/consent:
    put:
      summary: The one-subject Outreach-lite consent registry write (Write + workflow role)
      description: >
        Valet (v1.28.42): grant or revoke the SOLE subject's consent for the
        SOLE channel (signal). Anything else refuses loudly. Subjects are
        hashed at rest. This is the dogfood-scoped pull-forward of the full
        v1.28.35 Outreach registry.
      operationId: valetConsentPut
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [granted]
              properties:
                granted: { type: boolean }
                subject: { type: string, default: owner }
                channel: { type: string, enum: [signal] }
      responses:
        "200":
          description: Registry write acknowledged
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  granted: { type: boolean }
        "400": { description: consent_refused (subject/channel out of scope) }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/runs/{id}/outreach/followup:
    post:
      summary: Schedule the post-close follow-up check (Write on domain + workflow role)
      description: >
        Outreach / Order-of-Care: for a CLOSED complaint run whose state
        carries `subject`, files ONE pending HITL follow-up proposal due at
        the policy interval (default 7 days) after close — gated on an
        IN-FORCE care_followup consent for the email channel. No consent →
        loud 400 refusal and nothing is filed (a gate, not a warning).
      operationId: outreachFollowupSchedule
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The pending follow-up proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal_id: { type: integer }
                  due_at: { type: integer }
                  status: { type: string, enum: [pending] }
        "400":
          description: outreach_invalid (no consent | not closed | no subject | non-complaint run)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/status-ref:
    post:
      summary: Mint|rotate|revoke the public case-status ref (Write on domain + approve role)
      description: >
        Keystone: manages the run's unguessable public case-status ref
        (base32(HMAC-SHA256(salt, run:version))[..26]) naming the static
        `status/{ref}.json` artifact that `brain kb build --with-case-status`
        emits. `mint` is idempotent-per-run; `rotate` bumps the rotation
        counter so the old token dies; `revoke` removes the page from the
        next build and the run refuses fresh mints. brain NEVER sends the
        ref anywhere — it ships by human/CRM channel. Audited inside ONE tx.
      operationId: statusRefAction
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [mint, rotate, revoke] }
      responses:
        "200":
          description: The action result
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  action: { type: string }
                  ref: { type: string, description: "the live ref (mint/rotate only)" }
        "400":
          description: action_invalid | status_ref_revoked (mint after revoke)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run or existing ref not found }
  /workflow/runs/{id}/handover/offer:
    post:
      summary: Offer a one-click handover (Write on domain + workflow role)
      description: >
        Relay: gated by the packet-completeness check over the run's I-PASS
        fields — open question, un-breached SLA, current step, linked
        evidence/checkpoint, resolved escalation. An incomplete packet
        refuses with the MISSING list and writes nothing. The offer, its
        lineage event (`workflow/handover`), and its audit row land in ONE
        transaction; a retried POST is idempotent (same offer id).
      operationId: handoverOffer
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_principal]
              properties:
                to_principal: { type: string, maxLength: 256 }
                overlap_minutes: { type: integer, minimum: 0, maximum: 120, default: 0 }
      responses:
        "200":
          description: The open offer
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id: { type: integer }
                  run_id: { type: integer }
                  to_principal: { type: string }
                  state: { type: string, enum: ["offered"] }
                  sla_deadline: { type: integer }
        "400":
          description: packet_incomplete (details.missing lists the gaps) | principal_invalid (bounds, control/invisible chars) | handover_self | overlap_invalid
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
        "409": { description: run_not_active — only active runs can change hands }
  /workflow/runs/{id}/handover/{offer_id}/accept:
    post:
      summary: Accept an offer — CAS owner transfer (Write on domain + workflow role)
      description: >
        In the SAME WorkflowTx as the offer state move, the run `owner` is
        CAS-transferred to the acceptor and the SLA clock is untouched; the
        reply points at the resume-at checkpoint. Deciding a decided offer
        replays the receipt (`moved: false`).
      operationId: handoverAccept
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: offer_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Acceptance receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id: { type: integer }
                  run_id: { type: integer }
                  moved: { type: boolean }
                  owner: { type: string }
                  resume_at_checkpoint: {}
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Offer or run not found }
        "409": { description: cas_stale — state advanced concurrently, or run_not_active — a finished run is never resurrected by acceptance }
  /workflow/runs/{id}/handover/{offer_id}/decline:
    post:
      summary: Decline an offer with a REQUIRED reason (Write on domain + workflow role)
      description: >
        An audited refusal beats a silent bounce: the reason is screened,
        bounded at 4000 chars, stored with the offer row, and rides the
        lineage event.
      operationId: handoverDecline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: offer_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: Decline receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id: { type: integer }
                  run_id: { type: integer }
                  moved: { type: boolean }
        "400": { description: reason_required (missing or empty after trim) | reason_too_long }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Offer or run not found }
  /workflow/runs/{id}/handoff/decision:
    post:
      summary: The operator's handoff decision — deliver or cancel (Write on domain + workflow role)
      description: >
        The operator decision surface for the handoff lifecycle: the
        machine-generated handoff moves to `delivered` or `cancelled` ONLY on
        an operator decision carrying a decision reference (the audit-recovery
        handle — screened, bounded, no free-text pass-through). The lifecycle
        row and its audit row land in ONE transaction; a decision-required
        transition without the reference refuses `400 decision_ref_required`
        (the machine never closes a handoff on its own authority).
      operationId: handoffDecision
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transition, decision_ref]
              properties:
                transition: { type: string, enum: ["delivered", "cancelled"] }
                decision_ref: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The decision receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  transition: { type: string, enum: ["delivered", "cancelled"] }
                  decision_ref: { type: string }
                  audited: { type: boolean }
        "400": { description: decision_ref_required | decision_ref_invalid | unknown_transition }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/back-referral/return:
    post:
      summary: Release a back-referral return contract with the operator's report (Write on domain + workflow role)
      description: >
        The receiver's release: the operator's report plus a decision
        reference flips the contract to `returned`. A report missing a
        required field refuses `400 report_incomplete` with the missing list
        (the B3 law at the surface); the contract's `late` flag is computed
        at the server clock when the receipt lands past the deadline. The
        release row and its audit land in ONE transaction.
      operationId: backReferralReturn
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [contract_key, report, decision_ref]
              properties:
                contract_key: { type: string, maxLength: 256 }
                report:
                  type: object
                  description: The contract's required report fields (B3-checked server-side)
                decision_ref: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The release receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  contract_key: { type: string }
                  status: { type: string, enum: ["returned"] }
                  late: { type: boolean }
        "400": { description: decision_ref_required | decision_ref_invalid | contract_key_required | report_invalid | report_incomplete (details.missing lists the B3 field errors) }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run or back-referral contract not found }
  /ops/handovers:
    get:
      summary: The handover-due board ranked by SLA remaining (Read on domain)
      description: >
        Follow-the-sun board over active runs: SLA remaining per run
        (recorded deadline wins, else P3-from-created), ranked soonest-first,
        flagged while `now` sits inside the ring boundary's derived overlap
        window (Watchbill). Pure read-time arithmetic.
      operationId: opsHandovers
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
        - name: now
          in: query
          schema: { type: integer, description: epoch seconds; defaults to server now }
      responses:
        "200":
          description: The board
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  now: { type: integer }
                  board:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: integer }
                        owner: { type: string, nullable: true }
                        sla_deadline: { type: integer }
                        remaining_secs: { type: integer }
                        in_overlap: { type: boolean }
                  corrupt_state_rows_skipped:
                    type: integer
                    description: active runs skipped because their stored state_json was corrupt — counted loudly, never silently absorbed
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /workflow/runs/{id}/notes:
    post:
      summary: Post a case note; mentions resolve into swarm invites (Write on domain)
      description: >
        Channel: a human speaks inside the case room. Content is screened at
        write (empty/≤4000 chars/prompt-injection blocklist) and stored through
        the invisible-strip + markdown-ref seam.         `@skill:<tag>` mentions resolve
        against `principal_skills`, bare `@principal` mentions against the
        domain's presence roster; each resolved principal receives an invite
        row plus a `case/note` lineage event that drains to `/events` as the
        Crew ping (visible to subscribers who opted in via `?kinds=workflow`
        and hold Read on the run's domain — the workflow family's admission
        law). Unresolvable mentions refuse with `details.unresolved`.
        Not chat infrastructure — everything is case-scoped.
      operationId: postWorkflowRunNotes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: The stored note (+ invites, one per resolved mention)
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  note_id: { type: integer }
                  author: { type: string }
                  content: { type: string }
                  created_at: { type: integer }
                  invites:
                    type: array
                    items:
                      type: object
                      properties:
                        invite_id: { type: integer }
                        to: { type: string }
        "400":
          description: note_invalid (empty | too_long | blocklist) | mentions_unresolved (details.unresolved lists the dead tokens) | invite_limit (>16 resolved)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
        "409":
          description: channel_full — the run's channel reached its per-run row ceiling (notes and their invites share one budget; evidence is refused, never drop-oldest-deleted). details.cap names the bound.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      summary: The channel view — chronological notes + invites for one run (Read on domain)
      description: >
        Policy-expired rows are hidden at read time before the page split
        (`case-note` retention kind: a bound profile's block replaces the
        server-wide map; kill-switch off = nothing decays). Every emitted
        string rides the read seam. Bounded page (limit 1..=500, default 200).
      operationId: getWorkflowRunNotes
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 200, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: The channel
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  count: { type: integer }
                  notes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        kind: { type: string, enum: [note, invite] }
                        author: { type: string }
                        content: { type: string }
                        addressed_to: { type: string, nullable: true }
                        parent_note_id: { type: integer, nullable: true }
                        state: { type: string, enum: [visible, pending, accepted] }
                        created_at: { type: integer }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/notes/{invite_id}/accept:
    post:
      summary: Accept an invite into the channel (Write on domain)
      description: >
        Relay's accept machinery, smaller: a CAS move pending → accepted on
        the invite row in ONE transaction with its lineage event and audit;
        replaying a decided invite returns `{moved:false}` without
        re-applying. Ownership never changes here.
      operationId: acceptWorkflowRunNoteInvite
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: invite_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The acceptance receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  invite_id: { type: integer }
                  moved: { type: boolean }
                  state: { type: string, enum: [pending, accepted] }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Invite or run not found }
  /ops/agents/cards:
    post:
      summary: Provision (or re-sign) an agent's card with the operator key (Admin on domain)
      description: >
        Mesh: the A2A-shaped identity manifest per agent principal — signed
        with the UMP operator key at provisioning; no key refuses (409
        `operator_key_missing`). Re-provisioning replaces the manifest and its
        signature in one row.
      operationId: postAgentCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, principal, name]
              properties:
                domain: { type: string }
                principal: { type: string, maxLength: 256 }
                name: { type: string, maxLength: 200 }
                description: { type: string, maxLength: 1000 }
                capabilities: { type: object }
      responses:
        "200":
          description: The signed card
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: { type: string }
                  domain: { type: string }
                  name: { type: string }
                  card: { type: object }
                  signature: { type: string }
                  signed_by: { type: string }
        "400": { description: input_invalid | capabilities_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin required) }
        "409": { description: operator_key_missing }
    get:
      summary: The domain's verified agent cards (Read on domain)
      description: >
        Every card is re-verified against the current operator key before it
        leaves the server; a tampered card fails the whole list closed.
      operationId: getAgentCards
      parameters:
        - name: domain
          in: query
          schema: { type: string, default: global }
      responses:
        "200":
          description: Verified cards
          content:
            application/json:
              schema:
                type: object
                properties:
                  domain: { type: string }
                  count: { type: integer }
                  cards:
                    type: array
                    items: { type: object }
        "400": { description: card_tampered | agent_unknown }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /ops/agents/revoke:
    post:
      summary: Revoke a principal — the ASI03/07 kill-switch (Admin on global)
      description: >
        Attestation v1.28.62: revokes an identity. Every card use, delegation
        dispatch, and result submission re-checks revocation and refuses
        closed (403 `principal_revoked`); every ACTIVE run where the
        principal owns in-flight delegation work drains through the existing
        run-cancel path. Revocation, hash-chained audit row, and drain commit
        or roll back together. Identity-wide (not domain-scoped). The opaque
        operator superuser's label is the one refused principal (400
        operator_bearer_unrevocable): its bearer is a static token the
        kill-switch structurally cannot reach, so the verb refuses loudly —
        naming token rotation + restart as the remedy — instead of writing
        an inert row and reporting success.
      operationId: postAgentRevoke
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [principal]
              properties:
                principal: { type: string, maxLength: 256 }
                reason: { type: string, maxLength: 500 }
                allow_unknown: { type: boolean, default: false, description: 'DEPRECATED no-op (v1.28.83): accepted for wire compatibility and ignored. Every well-formed revoke of a REVOCABLE identity writes unconditionally; an unseen name is reported via known:false + warning, never refused. The one refusal (R77, F9-01): the opaque operator label operator_bearer_unrevocable — a static token no revocation row can reach.' }
      responses:
        "200":
          description: Revoked (unconditional since v1.28.83 — availability-first kill-switch)
          content:
            application/json:
              schema:
                type: object
                properties:
                  principal: { type: string }
                  revoked: { type: boolean }
                  runs_drained: { type: integer }
                  known: { type: boolean, description: 'Whether the name matched a card, crew record, delegation, prior revocation, or the loopback agent. false carries a warning — the revocation WAS written.' }
                  wedged_delegations: { type: array, items: { type: integer }, description: 'Active run ids where the revoked principal owes an in-flight delegation result (delegatee-side wedge — the drain cancels owned work only; cancel these runs by hand).' }
                  warning: { type: string, description: 'Present only when known:false. Names the loopback agent; re-revoke the intended name if this was a typo (the written row is harmless).' }
        "400": { description: input_invalid | principal_malformed | operator_bearer_unrevocable (the opaque operator label is structurally outside the kill-switch — the remedy is token rotation + restart, and nothing is written) }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin required) }
  /ops/agents/revocations:
    get:
      summary: The revocation register (Read on global)
      description: >
        Attestation v1.28.62: newest-first register of revoked principals.
        The hash-chained audit chain carries the full story (revoke, drain).
      operationId: getAgentRevocations
      responses:
        "200":
          description: Revocations
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  revocations:
                    type: array
                    items:
                      type: object
                      properties:
                        principal: { type: string }
                        revoked_at: { type: integer }
                        reason: { type: string }
                        revoked_by: { type: string }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /ops/agents/bom:
    get:
      summary: Live agent bill of materials, CycloneDX 1.6 shape (Read on global)
      description: >
        AgBOM v1.28.81: regenerated per request, never a build snapshot —
        models (embedder profile, classifier state), knowledge stores
        (domains), and enforcement posture (authn, write posture, quorum,
        injection policy) with the static SBOM artifact named. MCP tool
        inventory lives fork-side (catalog pins); the calling agent's own
        tools and models are out of this process by construction.
      operationId: getAgentBom
      responses:
        "200":
          description: Bill of materials
          content:
            application/json:
              schema:
                type: object
                properties:
                  bomFormat: { type: string }
                  specVersion: { type: string }
                  version: { type: integer }
                  metadata: { type: object }
                  components:
                    type: array
                    items:
                      type: object
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /ops/authz/explain:
    get:
      summary: Explain this caller's own RBAC verdict for a route (Admin on global; audited)
      description: >
        R47: the operator-facing half of the RBAC round. Returns the gate row
        for a route PATTERN, the required action, and the verdict for the
        CALLER'S OWN principal with a closed reason. Deliberately never answers
        "what would another role get": given a role set, "which gates would
        these clear" is the reconnaissance tool this surface refuses to be.
        A route with no gate row answers a probe-blind 404. Role-less posture
        (BRAIN_RBAC_ROLELESS_POSTURE) is echoed on every response.
      operationId: explainAuthzVerdict
      security: [{ bearerAuth: [] }]
      parameters:
        - name: route
          in: query
          required: true
          description: The route PATTERN, e.g. /workflow/runs/{id}
          schema: { type: string, maxLength: 512 }
        - name: method
          in: query
          required: false
          description: The HTTP method (the gate table is not method-keyed)
          schema: { type: string, maxLength: 16, default: GET }
      responses:
        "200":
          description: The caller's own verdict for this route
          content:
            application/json:
              schema:
                type: object
                properties:
                  route: { type: string }
                  method: { type: string }
                  required_action: { type: string, enum: [Read, Write, Admin] }
                  verdict: { type: string, enum: [allow, defer, deny] }
                  reason: { type: string }
                  roleless_posture: { type: string, enum: [pass, deny] }
        "400":
          description: >
            authz_explain_role_set_refused (a role-set query is refused by
            design), authz_explain_route_invalid, authz_explain_method_invalid
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin on global) }
        "404": { description: No gate row for that route (probe-blind) }
  /workflow/runs/{id}/delegations:
    post:
      summary: Delegate a task to a named agent on this run (Write on domain)
      description: >
        Mesh delegation: the target's card is VERIFIED first (an unknown or
        tampered card refuses with `agent_unknown` / `card_tampered` — fail
        closed); then one `delegations` row + a `delegation/request` lineage
        event + audit commit together. Task content is screened at write
        (empty/≤4000/blocklist) and lives in the table — lineage payloads
        carry ids + actors only.
      operationId: postWorkflowRunDelegation
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to_principal, task]
              properties:
                to_principal: { type: string, maxLength: 256 }
                task: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: The delegation receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  delegation_id: { type: integer }
                  event_id: { type: integer }
                  to: { type: string }
                  state: { type: string, enum: [requested] }
        "400": { description: note_invalid | agent_unknown | card_tampered }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
        "409": { description: delegations_full (details.cap names the per-run bound) }
    get:
      summary: The run's delegation view (Read on domain)
      operationId: getWorkflowRunDelegations
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          schema: { type: integer, default: 200, minimum: 1, maximum: 500 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Chronological delegations
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  count: { type: integer }
                  delegations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        from: { type: string }
                        to: { type: string }
                        task: { type: string }
                        state: { type: string, enum: [requested, completed] }
                        result: { type: string, nullable: true }
                        created_at: { type: integer }
                        decided_at: { type: integer, nullable: true }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Workflow run not found }
  /parcels/export:
    post:
      summary: Build + sign a knowledge parcel for a domain's approved rows (Admin on domain)
      description: >
        v1.28.30 "Parcels" — sites share knowledge, governed. The bundle carries
        only promoted (non-quarantined) knowledge with provenance + residency
        stamps copied read-only, signed with the UMP operator key over the exact
        manifest bytes. No key refuses (409 `operator_key_missing`); an
        over-cap selection refuses (`400 parcel_too_large`). The export crossing
        is ledgered + audited in the same transaction.
      operationId: postParcelsExport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                since:
                  type: integer
                  nullable: true
                  description: Export only rows created after this cursor.
      responses:
        "200":
          description: The signed parcel bundle.
          content:
            application/json:
              schema:
                type: object
                properties:
                  parcel:
                    type: object
                    properties:
                      manifest: { type: object }
                      signature: { type: string }
                      signed_by: { type: string }
                  parcel_hash: { type: string }
                  source_domain: { type: string }
                  region: { type: string, nullable: true }
                  row_count: { type: integer }
        "400": { description: input_invalid | parcel_too_large }
        "401": { description: Not authenticated }
        "403": { description: Admin on domain required }
        "409": { description: operator_key_missing }
  /parcels/import:
    post:
      summary: Import a signed parcel as pending proposals — never direct writes (Write on domain)
      description: >
        v1.28.30 "Parcels". The signature is verified BEFORE any write; an
        unsigned or tampered parcel refuses (`400 parcel_unsigned` /
        `parcel_tampered`). Since v1.28.67 "Pin" the publisher is NAMED,
        always: `expected_signer` is REQUIRED (missing → `400
        signer_required` — name your counterparty), and when the local
        operator key exists an `expected_signer` aliasing THIS operator's
        did on a foreign-produced parcel refuses (`409 signer_alias`) — no
        one imports parcels "from us" that we did not produce. Surviving
        rows land as PENDING proposals in the target domain (HITL),
        deduplicated by content hash against knowledge and pending
        proposals; injection-screened rows are refused and counted. Ledger +
        audit ride the same transaction.
      operationId: postParcelsImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain, parcel, expected_signer]
              properties:
                domain: { type: string }
                expected_signer:
                  type: string
                  description: |
                    REQUIRED (v1.28.67 "Pin"): the out-of-band expected
                    publisher did:key. A parcel whose signer differs refuses
                    `400 signer_mismatch`; an expected_signer equal to the
                    local operator did on a parcel signed by a DIFFERENT did
                    refuses `409 signer_alias`.
                parcel:
                  type: object
                  required: [manifest, signature, signed_by]
                  properties:
                    manifest: { type: object }
                    signature: { type: string }
                    signed_by: { type: string }
      responses:
        "200":
          description: Import outcome — proposals created, duplicates, screened-out counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ledger_id: { type: integer }
                  parcel_hash: { type: string }
                  proposals_created: { type: integer }
                  duplicates: { type: integer }
                  screened_out: { type: integer }
                  status: { type: string }
        "400": { description: signer_required | input_invalid | parcel_unsigned | parcel_tampered | signer_mismatch | parcel_too_large }
        "401": { description: Not authenticated }
        "403": { description: Write on domain required }
        "409": { description: signer_alias — expected_signer aliases the local operator did for a foreign-produced parcel }
  /parcels:
    get:
      summary: The parcel ledger for a domain — every signed crossing (Read)
      description: >
        v1.28.30 "Parcels" — in/out crossings with hash, signer did, row count,
        and reviewer, chronological and bounded (limit <= 200).
      operationId: getParcelsLedger
      parameters:
        - { name: domain, in: query, schema: { type: string }, required: false }
        - { name: limit, in: query, schema: { type: integer }, required: false }
        - { name: offset, in: query, schema: { type: integer }, required: false }
      responses:
        "200":
          description: The bounded ledger view.
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  parcels:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        direction: { type: string, enum: [in, out] }
                        parcel_hash: { type: string }
                        signer: { type: string }
                        row_count: { type: integer }
                        reviewer: { type: string }
                        created_at: { type: integer }
        "401": { description: Not authenticated }
        "403": { description: Read on domain required }
  /workflow/runs/{id}/delegations/{delegation_id}/result:
    post:
      summary: Submit a delegation's result — delegatee-only, exactly once (Write on domain)
      description: >
        Only the delegated agent may submit; CAS `requested → completed` in ONE
        transaction with the `delegation/result` child lineage event + audit. A
        replayed result refuses (409). Result content is screened like notes.
      operationId: postWorkflowRunDelegationResult
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: delegation_id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: The completion receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  delegation_id: { type: integer }
                  event_id: { type: integer }
                  state: { type: string, enum: [completed] }
        "400": { description: note_invalid | not_delegatee }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Delegation or run not found }
        "409": { description: 'conflict — "this delegation already returned its result"' }
  /workflow/runs/{id}/answer:
    post:
      summary: Answer a pending AskHuman question (Write + approve role gate)
      description: >
        The AskHuman closer: in ONE WorkflowTx the server re-reads the state,
        verifies SHA-256(`pending_question`) == `question_digest`, appends to
        `answers[]`, clears `pending_question`, and CAS-writes. A mismatched
        digest leaves the run untouched (409).
      operationId: answerWorkflowRun
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer, question_digest]
              properties:
                answer: { type: string, maxLength: 4000 }
                question_digest: { type: string }
      responses:
        "200":
          description: Answered
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revision: { type: integer }
        "400": { description: answer_too_long | answer_empty | answer_rejected | digest_invalid }
        "409": { description: no_pending_question | question_digest_mismatch }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (domain Write or approve role gate) }
  /workflow/runs/{id}/steering:
    post:
      summary: Queue a steering message for a run (Write + approve-class role gate)
      description: >
        Screens the message against the prompt-injection blocklist BEFORE it
        can reach the outbox topic that drives the engine state machine
        (400 `steering_rejected` on a hit), applies the standard Write
        authorization on the run's domain plus the approve-class role gate,
        and enqueues atomically under the bounded steering inbox
        (drop-oldest at 100).
      operationId: postWorkflowSteering
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                message: { type: string, maxLength: 4000 }
      responses:
        "200":
          description: 'Accepted — `{ok: true}`'
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "400": { description: message_too_long | message_empty | steering_rejected }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (domain Write or role gate) }
        "404": { description: Workflow run not found }
    get:
      summary: Drain a run's steering outbox (Read on the run's domain)
      description: >
        The read half of the advisory inbox: post_steering enqueues, the
        engine drains at the step boundary. Advisory only — never autonomous.
      operationId: getWorkflowSteering
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: since
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: The drained messages
          content:
            application/json:
              schema:
                type: object
                properties:
                  messages:
                    type: array
                    items:
                      type: object
                      properties:
                        outbox_id: { type: integer }
                        message: { type: string }
        "401": { description: Not authenticated }
        "403": { description: Not authorized for the run's domain }
        "404": { description: Workflow run not found }
  /workflow/runs/{id}/suggestions:
    get:
      summary: Retrieval-backed suggestions for a run (Read on the run's domain)
      operationId: getWorkflowSuggestions
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: >
            Suggestion hits (may be empty). The KCS evidence side-effect
            (abstention / SIR rows) fires only for principals holding Write
            on the run's domain AND the `workflow` role capability;
            `evidence_recorded` names what happened.
          content:
            application/json:
              schema:
                type: object
                properties:
                  suggestions:
                    type: array
                    items: { type: object }
                  evidence_recorded:
                    type: boolean
                    description: >
                      Whether the read recorded KCS evidence rows. `false`
                      for Read-only principals (the body is unchanged; only
                      the write is gated).
        "401": { description: Not authenticated }
        "403": { description: Not authorized for the run's domain }
        "404": { description: Workflow run not found }
  /.well-known/openid-configuration:
    get:
      summary: OIDC Discovery metadata (RFC 8414) (v1.2 AuthN)
      description: >
        PUBLIC route. Returns the OIDC Discovery metadata. `issuer` + `jwks_uri`
        are derived from `BRAIN_PUBLIC_BASE_URL` (never from the Host header —
        OWASP A02:2025). When JWT is not configured, returns an empty placeholder
        so probing clients get a clear "not configured" signal instead of a 404.
      operationId: getOidcConfig
      responses:
        "200":
          description: OIDC Discovery metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OidcConfig"
  /.well-known/jwks.json:
    get:
      summary: JWK Set (RFC 7517) for key distribution (v1.2 AuthN)
      description: >
        PUBLIC route. Returns the current signing key set as a JWK Set.
        Served with `Cache-Control: public, max-age=3600`; rotation keeps the
        old key live > cache TTL so a stale client cache can't break
        verification. Returns 500 `jwks_unavailable` when no RSA signing keys
        are configured (EC/Ed JWK emission is a v1.3 follow-up).
      operationId: getJwks
      responses:
        "200":
          description: JWK Set
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/jwk-set+json:
              schema:
                $ref: "#/components/schemas/JwkSet"
        "500":
          description: No RSA signing keys configured for JWKS emission
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: jwks_unavailable }
                  error: { type: string }
  /.well-known/security.txt:
    get:
      summary: security.txt (RFC 9116) disclosure endpoint (v1.13.6 Hygiene)
      description: >
        PUBLIC route. Machine-readable vulnerability disclosure: Contact,
        Expires, Preferred-Languages, and Canonical (when BRAIN_PUBLIC_BASE_URL
        is set). Contact is set via BRAIN_SECURITY_CONTACT and omitted when
        unset. Expires is now + 1 year (never stale).
      operationId: getSecurityTxt
      responses:
        "200":
          description: RFC 9116 security.txt
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            text/plain:
              schema:
                type: string
                example: |
                  Expires: 2027-08-07T00:00:00+00:00
                  Preferred-Languages: en
  /.well-known/ai-notice:
    get:
      summary: AI Act Art 50 transparency notice
      description: >
        PUBLIC route. Machine-readable disclosure that this service stores,
        retrieves, and may return AI-generated or AI-processed content, so
        consumers can mark output accordingly (EU AI Act Article 50, effective
        2026-08-02).
      operationId: getAiNotice
      responses:
        "200":
          description: Art 50 transparency notice (JSON)
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/json:
              schema:
                type: object
                example:
                  schema_version: "1.0"
                  service: brain-server
                  art_50: true
  /.well-known/ai-literacy:
    get:
      summary: AI Act Art 4 AI-literacy disclosure
      description: >
        PUBLIC route. Machine-readable pointer to the operator's AI-literacy
        playbook (docs/AI_LITERACY.md) and the inspectable controls that make
        the component's decisions reviewable — the operational substance of
        the deployer's Art 4 literacy obligation (EU AI Act Article 4).
      operationId: getAiLiteracy
      responses:
        "200":
          description: Art 4 AI-literacy disclosure (JSON)
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/json:
              schema:
                type: object
                example:
                  schema_version: "1.0"
                  service: brain-server
                  art_4: true
  /.well-known/cop-notice:
    get:
      summary: EU AI Act Code of Practice conformity marker (v1.17.1 M6)
      description: >
        PUBLIC route. Machine-readable self-attested conformity state the
        client's CoP icon lane renders: covered commitments, self-assessment
        link, last-review timestamp. Declarative only — asserts posture, not
        certification (a certification badge is the v2.x external gate).
      operationId: getCopNotice
      responses:
        "200":
          description: CoP conformity marker (JSON)
          headers:
            Cache-Control:
              schema: { type: string, example: "public, max-age=3600" }
          content:
            application/json:
              schema:
                type: object
                example:
                  schema_version: "1.0"
                  service: brain-server
                  cop: true
                  status: self_attested
  /accounts:
    get:
      summary: The bounded account listing (DPO/admin dual gate; audited per call)
      description: >
        The DPO's read window over the account record layer: every account
        row, newest first, bounded page. The DPO dual gate holds — the Admin
        scope AND the DPO role (the scoreboard/corpus posture) — and EVERY
        listing lands a global audit row naming the principal, the filter,
        and the row count. Account rows hold identifiers (name, owner label,
        status, timestamps), never request bodies.
      operationId: listAccounts
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The bounded listing page
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        account_id: { type: integer }
                        name: { type: string }
                        status: { type: string, enum: [active, archived] }
                        domain: { type: string }
                        created_at: { type: integer }
                        updated_at: { type: integer }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the DPO dual gate) }
    post:
      summary: Create the account record (Write on the body domain + workflow role)
      description: >
        The deliberately-not-a-CRM record layer: accounts are workflow_runs
        rows of kind `account`. The client supplies the name (screened,
        bounded 1..=256, control/invisible-refused) and the domain; the id,
        the owner label, the status (`active`), and the clock are
        server-derived. The record + its audit row land in ONE transaction.
        Agents cannot mint account rows (the role gate).
      operationId: createAccount
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, domain]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 256 }
                domain: { type: string }
      responses:
        "200":
          description: The create receipt (the account id is the run id)
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: integer }
                  name: { type: string }
                  domain: { type: string }
                  audited: { type: boolean }
        "400": { description: account_name_required | account_name_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
  /accounts/{id}:
    get:
      summary: The account record + derived stage + pipeline timeline (Write on domain + workflow role)
      description: >
        The single account view. The stage is DERIVED, never stored: the
        latest `pipeline` row's stage under the account's run id, else the
        entry stage `lead`. An absent id AND a non-account id answer the
        SAME probe-blind 404 — the surface never reveals whether an id
        exists as some other kind of run.
      operationId: getAccount
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The account view
          content:
            application/json:
              schema:
                type: object
                properties:
                  account:
                    type: object
                    properties:
                      account_id: { type: string }
                      name: { type: string }
                      owner_principal: { type: string }
                      status: { type: string, enum: [active, archived] }
                      created_at: { type: integer }
                      updated_at: { type: integer }
                  stage: { type: string, enum: [lead, qualified, proposal, closed_won, closed_lost] }
                  timeline:
                    type: array
                    items: { type: object }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Account not found (probe-blind; non-account ids answer the same) }
  /accounts/{id}/pipeline:
    post:
      summary: Advance the pipeline stage — decision_ref REQUIRED (Write on domain + workflow role)
      description: >
        The thin pipeline over the closed, operator-ratified vocabulary
        (lead, qualified, proposal, closed_won, closed_lost; the
        allowed-edge table; self-transitions refuse). The machine-refusal
        law holds verbatim: no decision reference, no movement —
        `400 decision_ref_required` at the surface and an independent core
        refusal. The appended timeline row carries {stage, decision_ref,
        prev_stage}; the stage row and its audit land in ONE transaction.
        The classifier NEVER advances a stage.
      operationId: advanceAccountPipeline
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [stage]
              additionalProperties: false
              properties:
                stage: { type: string, enum: [lead, qualified, proposal, closed_won, closed_lost] }
                decision_ref: { type: string, maxLength: 256 }
      responses:
        "200":
          description: The advance receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: integer }
                  stage: { type: string }
                  prev_stage: { type: string }
                  decision_ref: { type: string }
                  audited: { type: boolean }
        "400": { description: decision_ref_required | decision_ref_invalid | pipeline_stage_unknown | illegal_stage_transition | account_archived }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Account not found (probe-blind) }
  /accounts/{id}/requests:
    get:
      summary: The bounded per-account request history — the decision join (Write on domain + workflow role)
      description: >
        The account's link rows joined to their request runs' headlines and
        recorded decision rows (the pure join over existing rows; no new
        table shape). The page is bounded (limit inside 1..=500).
      operationId: listAccountRequests
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The bounded history page
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: integer }
                        linked_at: { type: integer }
                        link_seq: { type: integer }
                        run: { type: object }
                        decisions:
                          type: array
                          items: { type: object }
        "400": { description: account_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Account not found (probe-blind) }
  /accounts/{id}/requests/{run_id}/link:
    post:
      summary: Attach one request run to the account (Write on the account's domain + workflow role)
      description: >
        The request→account linkage: an additive `account:link` row under
        the ACCOUNT's run id plus its audited row, atomic in ONE
        transaction. Re-links append new audited rows — rows are never
        mutated; archived accounts refuse (`400 account_archived`); absent
        ids answer the probe-blind 404s.
      operationId: linkAccountRequest
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
        - name: run_id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The link receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  account_id: { type: integer }
                  run_id: { type: integer }
                  status: { type: string, enum: [linked] }
                  audited: { type: boolean }
        "400": { description: account_archived }
        "401": { description: Not authenticated }
        "403": { description: Not authorized }
        "404": { description: Account or request run not found (probe-blind) }
  /workflow/kappa/queue:
    get:
      summary: The caller's own κ labeling assignment (calibrate role; both partitions)
      description: >
        The labeling bench's rater queue: the mined disagreement tuples
        assigned to the CALLER'S slot (the slot derives from the
        authenticated principal, never the client), oldest first, bounded.
        Rows carry the machine's proposal (masked through the read seam
        with unconditional PII masking), the phase, and the frozen
        train/holdout partition — the bench labels both partitions, each
        row carrying its frozen side. The governed truth is NOT in the
        rows, and no other rater's labels are reachable at any gate:
        blindness is the core's output type. The response echoes the
        caller's slot.
      operationId: workflowKappaQueue
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The caller's own bounded queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot: { type: integer, minimum: 0 }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: integer }
                        seq: { type: integer }
                        digest: { type: string }
                        phase: { type: string }
                        partition: { type: string, enum: [train, holdout] }
                        model_proposal: { type: string }
                        my_label: { type: string, nullable: true }
                        my_label_seq: { type: integer, nullable: true }
                  count: { type: integer }
        "400": { description: kappa_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the calibrate capability is required) }
  /workflow/kappa/labels:
    post:
      summary: Capture one blind label (calibrate role; the slot derives from the principal)
      description: >
        One judgment on one tuple: body `{digest, label, run_id}` — the
        label comes from the closed ratified vocabulary
        (agree | disagree | uncertain), the slot derives from the
        authenticated principal. The write is exactly-once and append-only
        under the TUPLE's run id: a re-submitted latest judgment is the
        no-op receipt, a changed judgment appends a supersession row, and
        ONE audit row lands per created label (ids + counts, never label
        text). An absent tuple and a tuple not assigned to the caller are
        the SAME probe-blind 404.
      operationId: workflowKappaLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [digest, label, run_id]
              properties:
                digest: { type: string }
                label: { type: string, enum: [agree, disagree, uncertain] }
                run_id: { type: integer }
      responses:
        "200":
          description: The label receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  slot: { type: integer }
                  created: { type: boolean }
                  seq: { type: integer }
                  supersession: { type: integer }
                  audited: { type: boolean }
        "400": { description: label_required / label_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the calibrate capability is required) }
        "404": { description: No such assignment (probe-blind) }
  /workflow/kappa/report:
    get:
      summary: The per-rater-pair κ report (DPO/admin dual gate + calibrate; audited)
      description: >
        Cohen's κ over the labeled set, one cell per (domain × frozen
        partition × slot pair), integer ten-thousandths, latest-wins over
        superseded rows. A degenerate pair names itself (NO_KAPPA plus the
        κ function's own refusal) and never pretends to agree.
        `meets_bar` (κ ≥ 0.70) is REPORTED DATA for the operator's read —
        the κ value never auto-gates anything. EVERY call lands an audit
        row naming the principal and the counts.
      operationId: workflowKappaReport
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The bounded κ cells
          content:
            application/json:
              schema:
                type: object
                properties:
                  bar_units: { type: integer }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: { type: string }
                        partition: { type: string, enum: [train, holdout] }
                        slot_a: { type: integer }
                        slot_b: { type: integer }
                        n_joint: { type: integer }
                        kappa_units: { type: integer }
                        kappa_note: { type: string, nullable: true }
                        meets_bar: { type: boolean }
                  count: { type: integer }
        "400": { description: kappa_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the DPO dual gate + calibrate) }
  /workflow/agreement/queue:
    get:
      summary: The caller's own run rows awaiting a verdict (calibrate role)
      description: >
        The agreement-labelling path's reviewer queue: REAL `delivery_traces`
        rows carrying a populated `model_ref`, oldest first, bounded. Rows
        carry the trace's metadata (masked through the read seam with
        unconditional PII masking) and the CALLER'S own latest verdict — never
        another reviewer's. The machine's verdict is NOT in the rows: it has
        no field on the type a reviewer reads, so blindness is the core's
        output type and not a discipline. The response echoes the caller's
        slot and reviewer id. Rows are ordered oldest-first; a row with a
        NULL `model_ref` is not labelable and never appears.
        **`confidence` / `evidence_count` / `outcome` / `routing_class` (R67-DECISION)
        are the run's CARRIED deferral decision, and every one of them is
        NULLABLE because NULL is load-bearing: it means "no decision was
        recorded for this run", NOT "zero" and NOT "measured as nothing". A run
        created before the carrying seam has no decision, and a defaulted `0.0`
        would put a number on a reviewer's screen that was never measured.
        Read `confidence` and `evidence_count` TOGETHER or not at all —
        `confidence` is the winning category's uncontested SHARE, so one
        keyword firing alone and ten agreeing both read `1.0`.
        **`outcome` is `defer` for every row today.** `deferral::AUTO_CLASSES`
        is empty and the decision is fail-closed, so `clarify` and `stop` are
        UNREACHED rather than broken; a client rendering two empty panels is
        showing the truth about the policy's coverage. This is a per-CASE
        routing decision and is distinct from the machine's VERDICT, which
        remains unreachable by a reviewer.
      operationId: workflowAgreementQueue
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The caller's own bounded queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  slot: { type: integer, minimum: 0 }
                  reviewer_id: { type: string }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        run_id: { type: integer }
                        subject_id: { type: string }
                        stage: { type: string }
                        phase: { type: string }
                        tier: { type: string }
                        model_ref: { type: string, nullable: true }
                        my_verdict: { type: string, nullable: true }
                        my_verdict_seq: { type: integer, nullable: true }
                        routing_class: { type: string, nullable: true }
                        outcome: { type: string, nullable: true, enum: [defer, clarify, stop, null] }
                        confidence: { type: number, format: float, nullable: true }
                        evidence_count: { type: integer, nullable: true }
                  count: { type: integer }
        "400": { description: agreement_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the calibrate capability is required) }
  /workflow/agreement/labels:
    post:
      summary: Bind one verdict to one real run row (calibrate role; the reviewer is the principal)
      description: >
        One verdict on one REAL run row: body `{run_id, subject_id, verdict}`
        — the verdict comes from the closed vocabulary (confirmed |
        overturned | uncertain), the reviewer IS the authenticated
        principal, and the reviewer slot derives from it (the client never
        names the judge). The write is exactly-once and append-only under the
        run id: a re-submitted latest verdict is the no-op receipt, a changed
        verdict appends a supersession row, and the audit rows land inside the
        caller's transaction. The machine's verdict is DERIVED from the run
        row and FROZEN into the label, so flipping the run's outcome later
        does not silently re-score a judgment made against what the row said
        then. A label without a reviewer is refused before any write.
      operationId: workflowAgreementLabel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, subject_id, verdict]
              properties:
                run_id: { type: integer }
                subject_id: { type: string }
                verdict: { type: string, enum: [confirmed, overturned, uncertain] }
      responses:
        "200":
          description: The verdict receipt
          content:
            application/json:
              schema:
                type: object
                properties:
                  run_id: { type: integer }
                  subject_id: { type: string }
                  reviewer_id: { type: string }
                  slot: { type: integer }
                  created: { type: boolean }
                  seq: { type: integer }
                  supersession: { type: integer }
                  machine_verdict: { type: string, enum: [advanced, stopped, deferred] }
                  audited: { type: boolean }
        "400": { description: verdict_required / verdict_invalid / reviewer_required / reviewer_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the calibrate capability is required) }
        "404": { description: No such run row (probe-blind) }
  /workflow/agreement/report:
    get:
      summary: The agreement report — raw agreement per reviewer, plus inter-rater kappa pairs (DPO/admin dual gate + calibrate; audited)
      description: >
        Agreement WITH THE OPERATOR over the labeled set, kept in two halves
        that are never blended. `rows` is one cell per (domain × reviewer):
        `n_confirmed` / `n_overturned` / `n_uncertain` are reported SEPARATELY
        (collapsing the last two would let clean uncertainty masquerade as
        failure) and `raw_agreement_units` is `confirmed / labeled` in integer
        ten-thousandths. `distinct_reviewers` rides each cell so the
        single-rater era is readable from the data: `1` means NO inter-rater
        reliability exists behind the number. `pairs` is one cell per
        (domain × reviewer PAIR) with Cohen's kappa, DELEGATED to the shared
        pure function — it is EMPTY in a single-rater era, because a pair
        that does not exist is not a reliability. Every number here is DATA;
        nothing gates on it and no promotion bar is applied. EVERY call lands
        an audit row naming the principal and the counts.
      operationId: workflowAgreementReport
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
      responses:
        "200":
          description: The bounded agreement cells and pair cells
          content:
            application/json:
              schema:
                type: object
                properties:
                  measure: { type: string, enum: [agreement-with-the-operator] }
                  rows:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: { type: string }
                        reviewer_id: { type: string }
                        reviewer_kind: { type: string, enum: [operator] }
                        n_labeled: { type: integer }
                        n_confirmed: { type: integer }
                        n_overturned: { type: integer }
                        n_uncertain: { type: integer }
                        raw_agreement_units: { type: integer }
                        distinct_reviewers: { type: integer }
                        distinct_reviewer_kinds: { type: integer }
                  count: { type: integer }
                  pairs:
                    type: array
                    items:
                      type: object
                      properties:
                        domain: { type: string }
                        reviewer_a: { type: string }
                        reviewer_b: { type: string }
                        rater_kind: { type: string, enum: [operator] }
                        n_joint: { type: integer }
                        kappa_units: { type: integer }
                        kappa_note: { type: string, nullable: true }
                  pair_count: { type: integer }
        "400": { description: agreement_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the DPO dual gate + calibrate) }
  /workflow/wizard/packs:
    get:
      summary: The ratified wizard pack catalog (Read on global; validated data)
      description: >
        The three operator-ratified wizard packs as read-only, validated
        data: the pack templates are compile-time-embedded from the
        committed corpus files (ONE source of truth) and EVERY served entry
        re-validates through the total pack validator at read time — a
        corrupt pack is a compile-time test failure, never a runtime panic.
        The renderer (the SvelteTauri shell) branches client-side on the
        packs' total next-maps; answers never ride this route. Plain Read
        gate on the global domain (any authenticated principal) — reading a
        PII-free schema template is not a privileged act.
      operationId: workflowWizardPacks
      responses:
        "200":
          description: The validated pack catalog (never empty)
          content:
            application/json:
              schema:
                type: object
                required: [packs, count]
                properties:
                  packs:
                    type: array
                    items:
                      type: object
                      required: [id, question_count, pack]
                      properties:
                        id: { type: string }
                        question_count: { type: integer, minimum: 1 }
                        pack:
                          type: object
                          required: [pack, first, questions]
                          properties:
                            pack: { type: string }
                            first: { type: string }
                            questions:
                              type: array
                              items:
                                type: object
                                required: [id, qtype, instructions, next]
                                properties:
                                  id: { type: string }
                                  qtype: { type: string, enum: [choice, score, noul] }
                                  instructions: { type: string }
                                  criteria: {}
                                  next:
                                    type: object
                                    additionalProperties: { type: string }
                  count: { type: integer }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the global domain) }
  /workflow/decision-runs:
    post:
      summary: Execute one decision-pipeline run and persist its trace (Write on the run's domain + workflow role)
      description: >
        Runs the configured deterministic pipeline over the request's ask
        and persists the run's trace (digests and refs only — the raw
        query is hashed before anything durable). The config document and
        the rules table both ride the request body; the rules table must
        digest to the config's bound model or the run refuses
        (`model_digest_mismatch`). With `proposal: true` AND an escalated
        outcome, an escalation proposal is queued in the SAME transaction
        carrying the run's provenance ref — the promotion gate reads the
        ref's mode: an exploratory run can propose, never promote.
      operationId: workflowDecisionRunCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, rules_config, run_id, mode, request_id, question_ids, query]
              properties:
                config:
                  type: object
                  description: The raw pipeline config document (harness.pipeline/v1); the loader's total validation applies.
                rules_config:
                  type: object
                  description: The rules table document; its canonical digest must equal the config's bound model digest.
                run_id: { type: integer }
                mode: { type: string, enum: [deterministic, exploratory] }
                request_id: { type: string, maxLength: 256 }
                question_id: { type: string }
                question_kind: { type: string, enum: [choice, score, noul] }
                question_ids:
                  type: array
                  items: { type: string }
                  maxItems: 64
                query: { type: string, maxLength: 4096, description: The ONE raw-text field; hashed into the trace, never stored. }
                proposal: { type: boolean, default: false }
      responses:
        "201":
          description: The run executed and its trace persisted
          content:
            application/json:
              schema:
                type: object
                required: [trace_id, action, records]
                properties:
                  trace_id: { type: integer }
                  action: { type: string, enum: [act, approve, reject, escalate] }
                  escalation:
                    type: object
                    properties:
                      stage: { type: string }
                      reason: { type: string }
                      detail: { type: string }
                  output:
                    type: object
                    description: The model's proposed decision (present whenever the model decided, even on escalate).
                  records: { type: integer, description: The stage-record count. }
                  proposal_id: { type: integer, description: Present only when an escalation proposal was queued. }
        "400": { description: config_invalid | rules_config_invalid | model_digest_mismatch | mode_invalid | query_invalid | request_id_invalid | question_ids_invalid | question_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on the run's domain + the workflow role) }
        "404": { description: Workflow run not found (probe-blind — absent and foreign runs answer identically) }
    get:
      summary: The bounded decision-run listing (DPO/admin dual gate; audited)
      description: >
        Newest-first page over the stored decision-run traces with bounded
        columns only (id, run_id, mode, pipeline_version, config_hash,
        created_at, stage_count) — the trace documents themselves never
        ride a listing. THE exfiltration surface: the DPO dual gate (Admin
        action AND the DPO role) plus an audited global row per call.
      operationId: workflowDecisionRunsList
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: run_id
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: The bounded listing page
          content:
            application/json:
              schema:
                type: object
                required: [rows, count]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [id, run_id, mode, pipeline_version, config_hash, created_at, stage_count]
                      properties:
                        id: { type: integer }
                        run_id: { type: integer }
                        mode: { type: string, enum: [deterministic, exploratory] }
                        pipeline_version: { type: string }
                        config_hash: { type: string }
                        created_at: { type: integer }
                        stage_count: { type: integer }
                  count: { type: integer }
        "400": { description: decision_runs_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (the DPO dual gate — Admin action AND the DPO role) }
  /workflow/decision-runs/{id}:
    get:
      summary: The stored decision-run trace by row id (Read on global + workflow role)
      description: >
        Returns the stored trace document verbatim — digests and refs only
        (the input query rides only as its digest; per-stage records carry
        input/output digests, trust tiers, and timing). Absent ids answer
        the probe-blind 404. The read is audited.
      operationId: workflowDecisionRunGet
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: The stored trace document
          content:
            application/json:
              schema:
                type: object
                description: The trace document (run_id, pipeline_version, mode, config_hash, model_refs, input_digest, context_refs, retrieval_params, env_fingerprint, stages[], outcome).
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the global domain + the workflow role) }
        "404": { description: Decision run trace not found (probe-blind) }
  /workflow/decision-runs/{id}/replay-diff:
    post:
      summary: Re-execute a stored run under its own recorded conditions and report per-stage digest agreement (Write on the run's domain + workflow role)
      description: >
        Verifies the supplied config's canonical hash equals the stored
        trace's config_hash (mismatch → 409 config_hash_mismatch — a
        replay replays its own recorded conditions or refuses), re-builds
        the digest-bound model, re-executes the pipeline with LIVE
        retrieval under the server clock, and reports per-stage
        outputs-digest agreement. Timing fields are provenance and are
        never compared. The report is DATA (all_match is not a status) and
        the replay persists NOTHING. POST (not GET): the config + rules
        documents are large structured bodies, and the body must re-carry
        the run's input fields — the stored trace binds the input only as
        its digest.
      operationId: workflowDecisionRunReplayDiff
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config, rules_config, mode, request_id, question_ids, query]
              properties:
                config: { type: object }
                rules_config: { type: object }
                mode: { type: string, enum: [deterministic, exploratory] }
                request_id: { type: string, maxLength: 256 }
                question_id: { type: string }
                question_kind: { type: string, enum: [choice, score, noul] }
                question_ids:
                  type: array
                  items: { type: string }
                  maxItems: 64
                query: { type: string, maxLength: 4096 }
      responses:
        "200":
          description: The replay agreement report
          content:
            application/json:
              schema:
                type: object
                required: [trace_id, config_hash, config_hash_match, replay_input_digest, input_digest_match, stages, all_match]
                properties:
                  trace_id: { type: integer }
                  config_hash: { type: string }
                  config_hash_match: { type: boolean }
                  replay_input_digest: { type: string }
                  input_digest_match: { type: boolean }
                  stages:
                    type: array
                    items:
                      type: object
                      required: [stage, match, stored_outputs_digest, replayed_outputs_digest]
                      properties:
                        stage: { type: string }
                        match: { type: boolean }
                        stored_outputs_digest: { type: string }
                        replayed_outputs_digest: { type: string }
                  all_match: { type: boolean, description: DATA, not a status — mismatches are the product (poison visibility). }
        "400": { description: config_invalid | rules_config_invalid | model_digest_mismatch | query_invalid | … }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on the run's domain + the workflow role) }
        "404": { description: Decision run trace or run not found (probe-blind) }
        "409": { description: config_hash_mismatch }
  /workflow/decision-evals:
    post:
      summary: Create a digest-pinned, non-authoritative decision evaluation (Admin plus DPO)
      description: >
        Evaluates a bounded operator-declared judgment manifest against
        persisted decision traces. The manifest is explicitly non-authoritative;
        no gold pack is treated as a decision label, raw query/evidence text is
        not accepted, and missing metric legs remain unavailable rather than
        zero. The acceptance state is a checked audit fact, not a detached
        cryptographic signature.
      operationId: createDecisionEvaluation
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [idempotency_key, target, judgment_set]
              properties:
                idempotency_key: { type: string, minLength: 1, maxLength: 128 }
                target:
                  type: object
                  additionalProperties: false
                  required: [pipeline_version, config_hash, model_registry_id, model_registry_version, model_registry_digest]
                  properties:
                    pipeline_version: { type: string, maxLength: 64 }
                    config_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
                    model_registry_id: { type: string, maxLength: 256 }
                    model_registry_version: { type: string, maxLength: 128 }
                    model_registry_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                    model_artifact_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                judgment_set:
                  type: object
                  additionalProperties: false
                  required: [source, authoritative, judgment_set_ref, frozen_at, manifest_digest, cases]
                  properties:
                    source: { type: string, enum: [operator_declared] }
                    authoritative: { type: boolean, enum: [false] }
                    judgment_set_ref: { type: string, maxLength: 256 }
                    frozen_at: { type: integer, format: int64, minimum: 1 }
                    manifest_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                    cases:
                      type: array
                      minItems: 1
                      maxItems: 128
                      items:
                        type: object
                        additionalProperties: false
                        required: [case_id, trace_id, relevant_evidence_ids, expected_action, expected_output_label, expected_output_digest, case_digest]
                        properties:
                          case_id: { type: string, maxLength: 256 }
                          trace_id: { type: integer, format: int64, minimum: 1 }
                          relevant_evidence_ids:
                            type: array
                            minItems: 1
                            maxItems: 32
                            items: { type: string, maxLength: 256 }
                          expected_action: { type: string, enum: [act, approve, reject, escalate] }
                          expected_output_label: { type: string, enum: [choice, score, noul, none] }
                          expected_output_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                          case_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
      responses:
        "201":
          description: Evaluation record created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEvaluationRecord"
        "200":
          description: Idempotent replay of the original evaluation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEvaluationRecord"
        "400": { description: judgment_set_unavailable | judgment_set_digest_mismatch | evaluation_target_mismatch | model_artifact_digest_required | evaluation_idempotency_key_invalid | evaluation_target_invalid | judgment_set_size_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin on global plus DPO role) }
        "409": { description: evaluation_idempotency_conflict }
    get:
      summary: List bounded decision evaluation records (Admin plus DPO; audited)
      operationId: listDecisionEvaluations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: Bounded evaluation metadata; full manifests and reports are omitted
          content:
            application/json:
              schema:
                type: object
                required: [rows, count]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [evaluation_id, pipeline_version, config_hash, model_registry_id, model_registry_version, judgment_set_ref, judgment_set_digest, judgment_set_count, acceptance_state, created_at]
                      properties:
                        evaluation_id: { type: string }
                        pipeline_version: { type: string }
                        config_hash: { type: string }
                        model_registry_id: { type: string }
                        model_registry_version: { type: string }
                        judgment_set_ref: { type: string }
                        judgment_set_digest: { type: string }
                        judgment_set_count: { type: integer }
                        acceptance_state: { type: string, enum: [operator_accepted_non_authoritative] }
                        created_at: { type: integer, format: int64 }
                  count: { type: integer }
        "400": { description: evaluation_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin on global plus DPO role) }
  /workflow/decision-evals/{id}:
    get:
      summary: Read one decision evaluation record (Admin plus DPO; audited)
      operationId: getDecisionEvaluation
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^eval_[0-9a-f]{32}$" }
      responses:
        "200":
          description: The digest-verified evaluation record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DecisionEvaluationRecord"
        "400": { description: evaluation_id_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin on global plus DPO role) }
        "404": { description: Evaluation record not found (probe-blind) }
  /workflow/delivery/runs:
    post:
      summary: Open a delivery run (Write on the target domain plus the `workflow` role)
      description: >
        Admits a run onto the EXISTING run engine with kind = `delivery` — no
        second engine and no schema widening. The phase machine is the pure
        crate's: forward-only, total, and borrowed rather than re-derived. The
        tier is the design owner's closed set (observe, propose, bounded-auto,
        delegated) and the trace mode is DERIVED from it, never taken from the
        client. Any budget ceilings in the request are STORED as evidence and
        are not enforced by this round: no route consults a ceiling here. A
        delivery run carries no jurisdiction, so no law-version stamp is
        written.
      operationId: createDeliveryRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain, goal, tier]
              properties:
                domain: { type: string, minLength: 1, maxLength: 128 }
                goal: { type: string, minLength: 1, maxLength: 2000 }
                tier:
                  type: string
                  enum: [observe, propose, bounded-auto, delegated]
                policy_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                config_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                budgets:
                  type: array
                  minItems: 0
                  maxItems: 5
                  items:
                    type: object
                    additionalProperties: false
                    required: [kind, ceiling]
                    properties:
                      kind:
                        type: string
                        enum: [tokens, tool_calls, files, minutes, blast_radius]
                      ceiling: { type: integer, format: int64, minimum: 0 }
      responses:
        "200":
          description: Delivery run admitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRunCreated"
        "400": { description: delivery_unknown_vocabulary | delivery_goal_too_long | delivery_budgets_too_many }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on the domain plus the `workflow` role) }
    get:
      summary: The domain's delivery runs (Read on the queried domain plus the `workflow` role)
      description: >
        The run read census's listing: every delivery run in ONE domain, oldest
        first, keyset-paginated on the id (`after_id`) so a caller never sees a
        row twice. `limit` is clamped in the core — the cap is law, not a
        request field — and both bounds are disclosed in the payload. The phase
        and tier are read from the run's own state; the state bytes themselves
        are not echoed (the engine-exact view is the machine surface).
        Read on the queried domain plus the `workflow` role. Serving this list
        grants no authority and makes no compliance finding.
      operationId: listDeliveryRuns
      security: [{ bearerAuth: [] }]
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50 }
        - name: after_id
          in: query
          schema: { type: integer }
      responses:
        "200":
          description: The domain's delivery runs plus the disclosed bounds
        "400": { description: domain is required }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the domain plus the `workflow` role) }
  /workflow/delivery/runs/{id}/advance:
    post:
      summary: Advance a delivery run one phase (Write on the run's domain plus the `workflow` role)
      description: >
        One phase pass, and one transaction: the step row, the revision CAS, the
        trace row, and a fail-closed audit row commit together or not at all.
        The move is legal only if it is one of the five adjacent phases; a skip
        and a rewind are both refusals, and a lost CAS refuses the whole pass
        rather than overwriting the winner. The run closes `completed` only at
        the terminal phase, inside the engine's existing closed status set.
        An optional `artifact` rides the pass: a TYPED artifact the phase
        produces, filed in the SAME transaction as a PENDING proposal with no
        disposition, so a reviewable artifact can never cite a pass that did not
        commit. The executor proposes; only the gate disposes. On a `build` pass
        the artifact's `quality_gate` is evaluated first and an artifact whose
        evidence is not a live surface is refused before anything is written.
        The response's `proposal_id` is the proposal the artifact filed, or `0`
        when the pass carried none. The digest is derived server-side — there is
        no digest field to supply.
        R40: the pass now also signs an ATTESTATION link and appends it to the
        run's chain, inside this same transaction, and the trace row names the
        chain head. An optional `model` binding names the registry row this pass
        executed under: the server resolves it, and the signed predicate carries
        the row's ARTIFACT DIGEST, so a model name with no bytes behind it is
        refused rather than recorded. The four registry refusals are distinct.
        KEY POSTURE (fail-closed): a phase pass REFUSES when the host has no
        usable operator key — `delivery_attestation_refused` covers an absent key
        and a refused one alike, and neither ever degrades into an unsigned link.
        A run on a keyless host therefore never advances past its admission.
      operationId: advanceDeliveryRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, to_phase]
              properties:
                expected_revision: { type: integer, format: int64, minimum: 0 }
                to_phase:
                  type: string
                  enum: [scope, design, build, release, operate, done]
                artifact_refs:
                  type: array
                  minItems: 0
                  maxItems: 32
                  items: { type: string, maxLength: 256 }
                artifact:
                  $ref: "#/components/schemas/DeliveryArtifact"
                model:
                  $ref: "#/components/schemas/DeliveryModelBinding"
      responses:
        "200":
          description: Phase pass committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRunAdvanced"
        "400":
          description: delivery_unknown_vocabulary | artifact_screened_reject | delivery_input_too_long | delivery_input_too_many
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind; unaudited) }
        "409":
          description: delivery_gate_stale_revision | delivery_illegal_phase_transition | delivery_terminal_phase | delivery_quality_gate_refused | artifact_screened_quarantine | delivery_attestation_refused | delivery_model_not_registered | delivery_model_not_promoted | delivery_model_retired | delivery_model_digest_missing
  /workflow/delivery/runs/{id}/answer:
    post:
      summary: Answer a delivery run's pending question (Write plus the `workflow` role)
      description: >
        Clears the run's `pending_question` routing key through the same
        revision CAS the phase pass uses, and records that an answer happened.
        The answer itself is operator-authored prose on a run the operator owns:
        it is stored in the run's own state, bounded, and is never copied into
        a trace row. A run with no pending question is a refusal.
      operationId: answerDeliveryRun
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [expected_revision, answer]
              properties:
                expected_revision: { type: integer, format: int64, minimum: 0 }
                answer: { type: string, minLength: 1, maxLength: 2000 }
      responses:
        "200":
          description: Question answered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryRunAnswered"
        "400": { description: delivery_answer_too_long }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind; unaudited) }
        "409": { description: delivery_gate_stale_revision | delivery_no_pending_question }
  /workflow/delivery/runs/{id}/gates:
    post:
      summary: Evaluate the phase gate for a delivery run (Write plus the `workflow` role)
      description: >
        A DISPOSITION, never a mutation: the run's phase, status, and revision
        are untouched, and the only writes are the trace row and its audit. The
        evaluation is pure and offline. Deny wins — the terminal phase and an
        illegal move are refusals, and a value outside the closed phase
        vocabulary is a refusal rather than a nearest-match guess. A tier that
        may not promote is told to ask: the disposition is `prompt`, and the
        human's advance route is the disposal. No budget ceiling is consulted.
      operationId: evaluateDeliveryGate
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                to_phase:
                  type: string
                  enum: [scope, design, build, release, operate, done]
      responses:
        "200":
          description: Gate disposition (200 whatever the verdict; a deny is a recorded outcome, not a transport error)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryGateVerdict"
        "400": { description: delivery_unknown_vocabulary }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind; unaudited) }
  /workflow/delivery/runs/{id}/attestations:
    get:
      summary: Read the run's attestation chain and its verification verdict (Read plus the `workflow` role)
      description: >
        The chain of signed statements about what this run's phase passes actually
        did, newest-last, and the UNCONDITIONAL verification verdict over it. The
        verdict ships on every response and no parameter can switch it off;
        `?verify=1` is accepted and is an explicit request for the IDENTICAL
        payload. A link that does not verify is REPORTED per link with a named
        refusal code — it is never hidden, never dropped, and never downgraded
        into a mark that reads as verified. The only 409 is a chain that could
        not be READ at all, which is reported rather than rendered as an empty
        verified-looking chain.
        THE NON-CLAIMS, which are load-bearing and not decorative.
        This envelope is NOT DSSE. It is the project envelope convention: a
        signature over a canonicalized JSON object. It does not implement the
        DSSE envelope structure and does not apply the DSSE Pre-Authentication
        Encoding (DSSE v1.0.2, 2024-05-10), and it WILL NOT VERIFY AGAINST ANY
        DSSE VERIFIER.
        The field names `subject_digest`, `predicate_type`, and `predicate` were
        chosen to MIRROR the naming of the in-toto Attestation Framework's
        Statement v1 model (`subject[].digest`, `predicateType`, `predicate`;
        `_type` `https://in-toto.io/Statement/v1`). That is naming adjacency in
        this project's own design lineage. The envelope is not an in-toto
        Statement, carries no `_type` field, and verifies against neither an
        in-toto nor a DSSE verifier.
        No SLSA claim. SLSA (Supply-chain Levels for Software Artifacts,
        Version 1.2, 2025-11-24) is the ecosystem's frame for BUILD provenance.
        This is not a build artifact: there is NO SLSA PROVENANCE ATTESTATION
        here and no SLSA build level is claimed, so the envelope will not verify
        against a SLSA or in-toto provenance verifier either.
        The IETF WIMSE agent-audit drafts (2026; four drafts, zero RFCs, two of
        them individual submissions rather than Working Group documents) are
        contemporaneous prior art for signed statements about what an agent did.
        They are cited as prior art only: no WIMSE relationship, adoption, or
        alignment is claimed.
        AUTHORSHIP IS NOT AUTHORITY. A verified link proves the holder of the key
        named in `signer_did` signed these bytes. There is no PKI, no revocation
        oracle, and no key epoch, so a rotated key leaves historical links
        verifiable and valid. Nothing about whether the act was PERMITTED is
        asserted anywhere in this payload.
        OPERATIONAL POSTURE: on a host with NO operator key, every delivery phase
        pass REFUSES, because an attestation that cannot be signed is never
        written as an unsigned link. A run created on such a host therefore has
        an empty chain rather than a chain of unsigned rows.
        The predicate carries 4 of its 13 fields non-empty today —
        `gate_verdicts`, `approval_ref`, `authority_receipts`, and
        `budget_spend` stay empty until the rounds that populate them ship. Do
        not read it as a rich claim.
      operationId: getDeliveryAttestations
      security: [{ bearerAuth: [] }]
      parameters:
        - name: verify
          in: query
          required: false
          description: >
            Accepted and documented for explicitness; carries no behaviour. The
            chain verdict is unconditional and is present whether this parameter
            is sent or not.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: The chain, its per-link verdicts, and the overall verdict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAttestationChain"
        "400": { description: delivery_unknown_vocabulary }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind) }
        "409": { description: attestation_chain_too_long | attestation_envelope_malformed | attestation_storage }
  /workflow/delivery/runs/{id}/replay-verify:
    get:
      summary: Re-derive the run's stored trace and report whether it is internally consistent (Read plus the `workflow` role)
      description: >
        For every trace row, in ORDINAL order, this re-computes the row's content
        address from its own STORED columns and compares it with the address
        stored beside it. A disagreement is reported as a diff row and the request
        still succeeds: a mismatch is DATA, never an error status. The ordinal
        series is also checked for contiguity, and a gap or a descent is reported
        as an `order` diff.
        Models are NEVER re-run. This surface reaches no model provider and no
        network — the comparator lives in a crate whose entire dependency set is
        serde, serde_json and sha2, so the zero-model property is structural
        rather than a promise. The verdict says NOTHING about whether an outcome
        was CORRECT; it compares stored bytes to each other.
        ADJACENCY, DISCLOSED RATHER THAN HIDDEN. A pre-existing route,
        `POST /workflow/decision-runs/{id}/replay-diff`, publishes a similar
        concept under similar wire keys (`stages`, `match`, `all_match`). The two
        are NOT unified, share no code, and disagree about method: that route
        RE-EXECUTES the pipeline and loads a bound model, where this one
        does not re-execute anything — it re-derives from stored bytes only and
        cannot run a model even in principle. Do not read one route's verdict as
        bearing on the other.
        THE CEILING, which is the whole point. This is tamper EVIDENCE over
        stored bytes. It is NOT tamper-proofing: an attacker who edits a stored
        column AND recomputes the row's content address leaves nothing to detect
        here. It does NOT bind a trace row to the signed attestation chain — the
        chain is what binds, and this checks; cross-checking the two is not
        implemented and is not claimed. A verified replay AUTHORIZES NOTHING:
        authorship is not authority, and a byte-identical replay is NOT a
        compliance finding. Classification, retention, and any legal sufficiency
        of this output are operator-and-counsel determinations.
        The window is bounded at 500 rows and the bound is DISCLOSED in every
        response (`window.cap`, `window.truncated`); a bounded window never reads
        as the whole run. The `ddl_*` narrative appendix is bounded separately
        and discloses its own cap.
      operationId: getDeliveryReplayVerify
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The replay verdict, as data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryReplayReport"
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind) }
  /workflow/delivery/runs/{id}/trace:
    get:
      summary: The run's stored trace rows in ordinal order, with the chain head (Read plus the `workflow` role)
      description: >
        The rows `delivery_traces` actually holds for this run, in the stored
        ordinal order, plus the attestation chain head read from storage and the
        same bounded, self-disclosing `ddl_*` narrative appendix the replay
        verdict carries. It rides the SAME read function and the SAME window
        function as the verdict, so the two apply identical logic to storage:
        any difference you observe between them is a change in storage, not a
        difference of method. They are two separate requests with no shared
        snapshot, so this is not a consistency guarantee across a moving run —
        this one answers "what is actually there", which is the question a
        reader has when the verdict reports that something did not line up.
        Serving these bytes is not an endorsement of them. The rows are
        operator-authored text and digests, returned as stored.
        The window is bounded at 500 rows and the bound is DISCLOSED in every
        response (`window.cap`, `window.truncated`).
      operationId: getDeliveryTrace
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: The run's trace rows, chain head, and event log
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryTraceListing"
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind) }
  /workflow/delivery/bindings:
    get:
      summary: The authority bindings configured for a domain (Read plus the `workflow` role)
      description: >
        The standing authorities this machine holds to read external systems on
        behalf of ONE domain. `domain` is a query parameter and is required; the
        surface is domain-scoped because a binding resolves to one tenant's
        authority and an unscoped resolve would be a cross-tenant leak.
        A binding names an endpoint, a stable external ref (`owner/repo`), and an
        `authority_digest` covering the endpoint, the ref, and the secret's FILE
        NAME. The digest never covers the secret and never its path: a digest over
        secret material is a credential at rest in a hash column. No field in this
        response reveals where a credential lives.
        `capabilities` is the operator's declared read/intent surface, parsed with
        `deny_unknown_fields` — an unknown field or an unknown capability is a
        REFUSED binding, not an ignored one. A block this server cannot parse
        renders as the literal `"unparseable"` rather than as a default that would
        read as unconstrained.
        The pending-intent counters are the ops signal that a delivery intent
        which is merely not-yet-promoted is distinguishable from one that was
        lost, and from a FORGED row carrying a delivery topic whose key is not a
        kernel mint. `untrusted_pending` should be zero; a non-zero value means
        something wrote the reserved topic root without the minter.
        There is deliberately NO write route. Consent to an external authority is
        given by configuring a binding at boot and withdrawn by setting
        `active = 0` — never by a request, because a request must never be able to
        create or widen an authority.
        Serving this list grants no authority, approves nothing, and makes no
        compliance finding. Authorship is not authority.
      operationId: listDeliveryBindings
      security: [{ bearerAuth: [] }]
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
          description: The tenant whose bindings to read. Scoped by the Read gate.
      responses:
        "200":
          description: The domain's bindings and its pending-intent census
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryBindingsView" }
        "400": { description: domain is required }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the domain plus the `workflow` role) }
  /workflow/delivery/releases:
    post:
      summary: File a governed release (Write on the run's domain plus the `workflow` role; the agent preset is refused)
      description: >
        The machine's proposal to move ONE artifact toward ONE external
        authority. The kernel names everything that binds: the artifact digest is
        derived from the run's own typed-artifact bytes (never from a request
        field), and the authority binding is resolved from the run's own domain
        and the named target kind — a client-named binding id could name another
        tenant's authority. The request names only the run, the target kind, the
        governed ref, the OTel environment (the closed four-value
        `deployment.environment.name` set), and, honestly optionally, the OTel
        revision (`vcs.repository.ref.revision` is Release Candidate — cited by
        name, never claimed stable).
        The new release lands `proposed`. It is not an approval, not an
        authority, and not a compliance finding: it is the row a human's
        approval will later bind to.
        The agent preset is refused before any work: agents hold `write:*`, the
        role gate alone would admit them, and this is the write family whose
        consequences reach another system.
      operationId: createDeliveryRelease
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [run_id, target_kind, ref, environment]
              properties:
                run_id: { type: integer }
                target_kind: { type: string, enum: [vcs, ci] }
                ref: { type: string, maxLength: 200 }
                environment: { type: string, enum: [development, test, staging, production] }
                commit_sha: { type: string, maxLength: 128 }
      responses:
        "200":
          description: The release, `proposed`
        "400": { description: A value is outside its closed vocabulary or over its bound }
        "401": { description: Not authenticated }
        "403": { description: Not authorized, or the agent preset }
        "404": { description: Delivery run not found (probe-blind) }
        "409": { description: The release law refused (no artifact, binding unresolved) }
    get:
      summary: The domain's release rows (Read on the queried domain plus the `workflow` role)
      description: >
        The release census: every release row in ONE domain, newest first,
        capped, with the cap DISCLOSED in the payload. The approval columns
        ride the row because the row IS the approval artifact; every text
        field passes the read seam. Serving this list grants no authority,
        approves nothing, and makes no compliance finding.
      operationId: listDeliveryReleases
      security: [{ bearerAuth: [] }]
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The domain's release rows plus the disclosed cap
        "400": { description: domain is required }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the domain plus the `workflow` role) }
  /workflow/delivery/releases/{id}/approve:
    post:
      summary: Record the approval (Write on the release's domain plus the `workflow` role; the agent preset is refused)
      description: >
        The approval is COLUMNS on the release row, and the binding is
        THREE-WAY: the content digest as of the approval (kernel-written from
        the release row, never client-asserted), the authority digest
        recomputed from the binding row as it is now, and the run's state
        revision as it is now. An approval that binds content but not the
        target is replayable against a different external system; one that
        binds both but not the revision is replayable across a later phase
        pass. The expiry is measured from `approved_at` — the window that
        matters is exactly the gap between approve and promote — and is
        evaluated inside the promote transaction, fail-closed at the boundary.
        The approving principal is recorded from the authenticated caller,
        never asserted from the body. Approve and promote are separate
        requests by design: today's atomic approve-and-promote shape is what
        makes replay possible, and splitting them is what makes the binding
        re-verifiable at the moment of the act.
        An approval is an authorization ARTIFACT, not an identity record and
        not a compliance finding.
      operationId: approveDeliveryRelease
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scope: { type: string, maxLength: 128, default: promote }
                ttl_secs: { type: integer, description: Window from approved_at; capped, never clamped }
      responses:
        "200":
          description: The approval, recorded
        "401": { description: Not authenticated }
        "403": { description: Not authorized, or the agent preset }
        "404": { description: Release not found (probe-blind) }
        "409": { description: The approval law refused (not proposed, binding inactive, TTL out of bounds) }
  /workflow/delivery/releases/{id}/promote:
    post:
      summary: The promotion gate (Write on the release's domain plus the `workflow` role; the agent preset is refused)
      description: >
        One transaction that re-verifies EVERYTHING before the pure gate reads
        anything: the signature chain (offline verifier — a broken chain is a
        typed refusal before the gate), the live digest re-derived from the
        artifact bytes as they exist now, the authority (recomputed; drift is
        a 409), the run's revision (unchanged since the approval), the
        approver's principal (the kill-switch), and the tier (the run's state
        and the chain's signed predicate must agree — a tier the run never
        granted is the forgery this refuses). Then the crate's total gate
        decides, deny-wins, first reason reported in push order.
        The trace mode is carried and deliberately UNREAD — authority comes
        from the tier, never from how a trace was produced.
        A permitted promotion walks the crate's one-step-at-a-time transition
        law inside the same transaction, lands `promoted`, records the
        post-hoc budget draw (elapsed minutes and the one artifact moved —
        `spent` moves only when a producer exists), and MINTS the dispatch
        intents. Promotion IS the outbox write: nothing here touches the
        network, and the intents wait for the /due crank. The ledger's belief
        moves only when the inbound authority observation reconciles — the
        crank never writes `verified_at`.
        Budgets are enforced at PROMOTION TIME, inside the promote
        transaction — not at a hostcall seam, which the delivery loop never
        touches (the hostcall `Budget` is a 30 s wall clock with no
        run/kind/spend). Every enforced budget kind needs explicit,
        unexhausted headroom; `blast_radius` is never enforced (crate law).
        `confirm` is the human disposition act on a `prompt` verdict; absent
        is false, and nothing moves until the answer arrives.
      operationId: promoteDeliveryRelease
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm: { type: boolean, default: false }
      responses:
        "200":
          description: >
            The verdict, total over the gate's three answers: disposition
            allowed (status promoted), prompt (awaiting confirm), or denied
            (the crate's first reason in push order, no state change).
        "401": { description: Not authenticated }
        "403": { description: Not authorized, or the agent preset }
        "404": { description: Release not found (probe-blind) }
        "409":
          description: >
            The release law refused — not approved, not promotable, authority
            drift, approval stale (the run moved since the approval), approver
            revoked, tier mismatch, or a chain that fails its signatures.
  /workflow/delivery/due:
    post:
      summary: The /due crank (Write on the body's domain plus the `workflow` role; the agent preset is refused)
      description: >
        The valet precedent, transplanted: request-scoped (no daemon, no
        scheduler — the cron recipe IS the scheduler), a bounded batch that
        DRAINS (never wedges), `remaining` reported AND audited, and a hard
        in-handler batch cap — no route-level rate limiter exists, so the cap
        is the only thing between a crank and an egress storm.
        The body's `domain` is the scope, checked immediately after authz.
        Three phases, and the middle one holds NO database connection:
        (1) select and RE-VERIFY each pending kernel-authentic intent whose
        release is `promoted` — authenticity, the release's status, the
        approval's currency against the LIVE artifact digest, the approver's
        principal, and the chain's verification — all re-run here even though
        the promote checked them too, because the world moves between the
        mint and the drain; (2) dispatch each verified intent through the R42
        pinned read-egress path (the only egress the tree has — exact-host
        refused, bearer read at the call and never stored); (3) mark each
        succeeded row delivered through the guarded `pending → delivered`
        update, where a concurrent drain is a receipt and not a second
        effect.
        The ledger's BELIEF moves only when the inbound authority observation
        reconciles — the crank NEVER writes `verified_at`. A crash between a
        mark and anything else replays a durable row, never a double-release,
        because promotion IS the outbox write and the dispatch is a read.
      operationId: runDeliveryDueCrank
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [domain]
              properties:
                domain: { type: string }
                now: { type: integer, description: Evaluate "now" at this unix-seconds timestamp (testing/replay) }
      responses:
        "200":
          description: The drain report — `{ok, domain, batch_cap, drained, refused, failed, remaining}`
        "400": { description: domain is required }
        "401": { description: Not authenticated }
        "403": { description: Not authorized, or the agent preset }
        "409": { description: The delivery authority is not configured }
  /workflow/delivery/runs/{id}:
    get:
      summary: One delivery run's head (Read on the run's domain plus the `workflow` role)
      description: >
        The id-scoped half of the census. The domain resolve comes first
        (probe-blind 404 on an absent or foreign run), and a non-delivery run
        reads as absent rather than as a wrong-kind error — the collapse that
        keeps this surface from being an existence oracle.
      operationId: getDeliveryRun
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: The run's head }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind) }
  /workflow/delivery/runs/{id}/steps:
    get:
      summary: One delivery run's steps (Read on the run's domain plus the `workflow` role)
      description: >
        The run's steps in id order, capped like every list surface. Same
        probe-blind collapse as the head read.
      operationId: listDeliveryRunSteps
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200": { description: The run's steps }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the run's domain plus the `workflow` role) }
        "404": { description: Delivery run not found (probe-blind) }
  /workflow/delivery/outcomes:
    get:
      summary: The derived delivery read model (Read on the domain plus the `workflow` role)
      description: >
        The DO-named operate surface: a derived, read-time-only cluster over the
        domain's own audited release rows and authority-fact findings.
        Throughput and instability are a coupled cluster; change_fail_rate is
        the control — its readings carry `role: "control"`, and the cluster
        carries the recorded framing (leading indicators for organizational
        performance; lagging for delivery practices) so no client can render a
        bare throughput number as a performance verdict. There is one route
        and one response object: no field decomposition lets a consumer target
        throughput in isolation.
        `domain` is a required query parameter and the surface is
        domain-scoped, because a release row resolves to one tenant and an
        unscoped resolve would be a cross-tenant leak. `window` is an optional
        integer number of days, default 30, bounded 1..=366 and validated in
        the core: a value outside the bound is `400 window_out_of_bounds`,
        never a silent clamp. OWASP LLM10 (unbounded consumption) is the
        relevant threat and the window bound is the control; there is no model
        call, so no injection surface is added.
        Every metric carries a typed state — `computed` with a value, or
        `insufficient` with a closed reason (`window_empty`,
        `no_vcs_revision_recorded`, `no_incident_facts`, `no_rework_signal`,
        `insufficient_history`). An absent metric is never rendered `0`, and a
        zero is never rendered absent. Where DORA (DevOps Research and
        Assessment) names are used at all they carry `dora_name` +
        `definition_match: proxy` + a one-line definition note; the native
        measures (`approval_to_promotion_elapsed`, `governed_release_cadence`)
        are named natively, and the native elapsed measure is never presented
        as DORA change lead time. Metrics vocabulary only; no thresholds or
        tables reproduced — no benchmark thresholds, tables, figures, or
        performance bands appear anywhere, and the run's own history
        (`own_baseline`) is the only baseline the response carries.
        The change-fail rate is the count of the window's promoted releases
        whose run carries a delivery authority contradiction (the closed
        `delivery:%` source vocabulary narrowed by the typed confidence
        column — the claim text is never read) over all of the window's
        promoted releases; a contradiction on a run whose release is not
        promoted in-window is out of the denominator.
        Commit-anchored change lead time computes only when the release's
        `commit_sha` joins to a recorded vcs commit-time fact. No production
        writer records such a fact today, so the live branch is `insufficient`
        (`no_vcs_revision_recorded`) — the honest answer, not an approximation;
        the computed branch is implemented and unit-proven so the metric is
        correct the day the facts exist.
        This surface is transparency and auditability by design: a governed
        operator reads derived facts over their own audited records. It makes
        no automated decision about a person, so no AI Act high-risk duty is
        triggered by this code. It carries no EU DORA obligation and makes no
        operational-resilience claim. Nothing is persisted: the derivation is
        a pure query, deterministic for (window, now), and it writes no
        findings row, no counter, and no scalar anywhere.
      operationId: getDeliveryOutcomes
      security: [{ bearerAuth: [] }]
      parameters:
        - name: domain
          in: query
          required: true
          schema: { type: string }
          description: The tenant whose derived outcomes to read. Scoped by the Read gate.
        - name: window
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 366, default: 30 }
          description: The window in days; validated in the core and refused outside the bound, never clamped.
      responses:
        "200":
          description: The coupled cluster for the domain and window
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeliveryOutcomesView" }
        "400": { description: domain is required, or window is out of bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on the domain plus the `workflow` role) }
  /webhooks/delivery/{kind}:
    post:
      summary: An inbound AUTHORITY OBSERVATION (public; HMAC self-authenticating)
      description: >
        The delivery observation sub-family. It is admitted by the EXISTING public
        `/webhooks/` prefix rule and adds no new public path: it authenticates with
        the shipped GitHub HMAC verifier over the raw body and lands in the same
        bounded queue as every other verified webhook, so the replay window, the
        delivery-id idempotency, and the flood cap are the consent boundary it
        actually passes through rather than properties it re-implements.
        The observation is NEVER trusted ahead of reconciliation. A verified body
        says only that these bytes came from the configured sender; what the ledger
        believes comes from the authority itself, read through the shared egress
        family, and a mismatch is recorded as typed evidence for a human to decide.
        The 200 reports the RECONCILED verdict, not the claim.
        The run, the domain, and the secret root are resolved SERVER-SIDE from the
        configured binding. None of them rides the request: a body claiming a
        different tenant is ignored, which is the point of a domain-scoped
        authority. An observation arriving with no open run in that domain is
        refused rather than attached to an arbitrary one.
        The signature shows the holder of the configured secret sent these bytes.
        It says nothing about whether their contents are true.
      operationId: receiveDeliveryObservation
      parameters:
        - name: kind
          in: path
          required: true
          schema: { type: string, enum: [github, actions] }
          description: >-
            `github` reconciles a `vcs` binding; `actions` reconciles a `ci`
            one. A kind outside this vocabulary is refused by name.
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Enqueued and reconciled, or a duplicate replay }
        "400": { description: Malformed body, missing delivery id, or unknown kind }
        "401": { description: Signature verification failed }
        "503": { description: Queue full, or the authority could not be observed }
  /workflow/model-registry:
    get:
      summary: List registered model identities (Admin plus DPO role; audited)
      description: >
        Newest-first bounded listing of model identities and lifecycle state.
        The artifact digest is represented only by a presence boolean; its value
        is available on the single-row read. The listing is an audited global
        DPO/admin dual-gated surface.
      operationId: listModelRegistry
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [candidate, evaluated, promoted, retired] }
        - name: kind
          in: query
          required: false
          schema: { type: string, enum: [deterministic-rules, learned, reranker] }
      responses:
        "200":
          description: The bounded registry listing
          content:
            application/json:
              schema:
                type: object
                required: [rows, count]
                properties:
                  rows:
                    type: array
                    items:
                      type: object
                      required: [id, version, kind, name, output_vocabulary, artifact_digest_present, config_digest, status, proposed_by, created_at, updated_at]
                      properties:
                        id: { type: string }
                        version: { type: string }
                        kind: { type: string }
                        name: { type: string }
                        output_vocabulary:
                          type: array
                          items: { type: string, enum: [choice, score, noul] }
                        artifact_digest_present: { type: boolean }
                        config_digest: { type: string, nullable: true }
                        status: { type: string, enum: [candidate, evaluated, promoted, retired] }
                        proposed_by: { type: string }
                        created_at: { type: integer }
                        updated_at: { type: integer }
                  count: { type: integer }
        "400": { description: model_registry_limit_out_of_bounds | registry_status_invalid | registry_kind_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin plus DPO role) }
  /workflow/model-registry/{model_ref}:
    get:
      summary: Read one registered model identity by id@version (Read; audited)
      description: >
        The model_ref path value is one captured segment in the form
        `{id}@{version}`. The response carries identity, vocabulary, lifecycle,
        and digest references; it never carries weights or evaluation contents.
        An absent row answers the same probe-blind not-found response.
      operationId: getModelRegistryEntry
      security: [{ bearerAuth: [] }]
      parameters:
        - name: model_ref
          in: path
          required: true
          schema: { type: string, pattern: "^[^@]+@[^@]+$" }
      responses:
        "200":
          description: The full identity and digest reference record
          content:
            application/json:
              schema:
                type: object
                required: [id, version, kind, name, output_vocabulary, status, evaluation_refs, proposed_by, created_at, updated_at, row_digest]
                properties:
                  id: { type: string }
                  version: { type: string }
                  kind: { type: string, enum: [deterministic-rules, learned, reranker] }
                  name: { type: string }
                  output_vocabulary:
                    type: array
                    items: { type: string, enum: [choice, score, noul] }
                  artifact_digest: { type: string, nullable: true }
                  config_digest: { type: string, nullable: true }
                  calibration_ref: { type: string, nullable: true }
                  status: { type: string, enum: [candidate, evaluated, promoted, retired] }
                  evaluation_refs:
                    type: array
                    items: { type: string }
                  proposed_by: { type: string }
                  approved_by: { type: string, nullable: true }
                  created_at: { type: integer }
                  updated_at: { type: integer }
                  row_digest:
                    type: string
                    pattern: "^[0-9a-f]{64}$"
                    description: >-
                      Server-computed SHA-256 over the canonical compact
                      RegistryRow bytes; this is the exact digest required by a
                      registry_lifecycle proposal.
        "400": { description: model_ref_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on global) }
        "404": { description: Model registry row not found (probe-blind) }
  /workflow/model-registry/register:
    post:
      summary: Register a model identity as a candidate (Admin; audited)
      description: >
        The deterministic-rules arm requires the actual rules document in the
        request body; the server derives its identity and canonical digest and
        stores no rules content. Learned and reranker registrations declare
        identity and digest references directly. Every registration lands as
        candidate; promotion and retirement use the existing human proposal gate.
      operationId: registerModel
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [kind]
              properties:
                kind: { type: string, enum: [deterministic-rules, learned, reranker] }
                rules_config:
                  type: object
                  description: Required only for deterministic-rules; supplied bytes are validated and discarded after digesting.
                id: { type: string, maxLength: 256 }
                version: { type: string, maxLength: 64 }
                name: { type: string, maxLength: 256 }
                output_vocabulary:
                  type: array
                  minItems: 1
                  items: { type: string, enum: [choice, score, noul] }
                artifact_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                config_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                calibration_ref: { type: string }
      responses:
        "201":
          description: Candidate identity registered
          content:
            application/json:
              schema:
                type: object
                required: [id, version, status, config_digest]
                properties:
                  id: { type: string }
                  version: { type: string }
                  status: { type: string, enum: [candidate] }
                  config_digest: { type: string, nullable: true }
        "400": { description: rules_config_invalid | registry_identity_declared | registry_identity_required | registry_vocabulary_invalid | artifact_digest_required | artifact_digest_invalid | config_digest_invalid | registry_id_invalid | registry_version_invalid | registry_kind_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Admin on global) }
        "409": { description: model_already_registered }
  /workflow/claim-schemas:
    post:
      summary: Author a claim schema (Write on global plus the `workflow` role; human principal only)
      description: >
        A claim schema is a HUMAN artifact. Only a human principal may author
        one, and a self-authored schema is refused at admission rather than
        warned about. The reason is measured rather than assumed: an agent
        writing its own specification gains nothing over an unaided baseline,
        and the reported failure mode is faithfulness — it constrains part of
        the problem and frees the rest, which an author who cannot tell the
        difference is not positioned to review.
        The stored `authored_by` string is mapped from the TYPED principal
        kind inside the service core, so no request body can name its own
        author. The table's CHECK on that column is a tripwire on the write
        path, not an identity proof — a CHECK reads a column, never the live
        session — and the binding check that the acting principal is human
        lives in this route's role gate.
        The budget consequence is real and is not hidden: one human artifact
        per domain, recurring forever.
      operationId: createClaimSchema
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [domain, version, body]
              properties:
                domain: { type: string, minLength: 1, maxLength: 128 }
                version: { type: integer, minimum: 1 }
                body:
                  type: string
                  maxLength: 8192
                  description: >
                    The typed slot document. JSON Schema is deliberately NOT
                    used: a schema document is a syntax contract, and the
                    contradiction arithmetic needs a disjointness CLASS, which
                    a JSON Schema can express only as a comment.
      responses:
        "201":
          description: Schema authored and ratified at admission
          content:
            application/json:
              schema:
                type: object
                required: [domain, version, body_digest, authored_by, authored]
                properties:
                  domain: { type: string }
                  version: { type: integer }
                  body_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                  authored_by: { type: string, enum: [human] }
                  authored: { type: boolean }
        "400": { description: claim_incomplete | body_too_large | empty_schema | too_many_slots | malformed_predicate | malformed_bounds | malformed_labels | malformed_version | not_human_authored }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on global plus `workflow`, and a human principal) }
  /workflow/claims:
    post:
      summary: Propose a claim (Write on global plus the `workflow` role; audited)
      description: >
        A claim is a TYPED tuple — domain, subject, predicate, value — against
        a ratified schema. A free-text proposal cannot mint one, which is the
        defect this loop exists for. Every typed slot must be filled: a slot
        that defaulted its way to ratified would be the same failure in a
        narrower column.
        The claim lands `pending`, invisible to every recall surface. The
        stored principal kind is derived from the caller's typed principal, so
        the `created_by` fence column cannot be asserted by a request body.
      operationId: createClaim
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [claim_id, domain, subject, predicate, object]
              properties:
                claim_id: { type: string, minLength: 1, maxLength: 128, pattern: "^[A-Za-z0-9_.-]+$" }
                domain: { type: string, minLength: 1, maxLength: 128 }
                subject: { type: string, minLength: 1, maxLength: 128 }
                predicate: { type: string, minLength: 1, maxLength: 128 }
                object: { description: The typed slot value }
      responses:
        "201":
          description: Claim recorded as pending
          content:
            application/json:
              schema:
                type: object
                required: [claim_id, status, created_by]
                properties:
                  claim_id: { type: string }
                  status: { type: string, enum: [pending] }
                  created_by: { type: string, enum: [human, agent] }
        "400": { description: claim_incomplete | claim_id_invalid | no_schema }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on global plus `workflow`) }
    get:
      summary: The gated claim read (Read on global; audited)
      description: >
        The loop's ONLY reader. It joins on `status = 'ratified' AND
        recall_visible = 1` — the same two columns the database fence
        protects — so a trigger that was somehow bypassed still leaves an
        unratified claim invisible here, and a row that somehow became visible
        without a promote audit row is invisible there.
        The surface has no parameter that could reach unratified material, so
        it cannot be asked for any. Bounded, newest-first, every emitted text
        field through the read seam.
      operationId: listRecallableClaims
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
      responses:
        "200":
          description: The recallable claims, bounded
          content:
            application/json:
              schema:
                type: object
                required: [claims, limit]
                properties:
                  limit: { type: integer }
                  claims:
                    type: array
                    items:
                      type: object
                      required: [claim_id, subject, predicate, object]
                      properties:
                        claim_id: { type: string }
                        subject: { type: string }
                        predicate: { type: string }
                        object: { type: string }
                        scope: { type: string, nullable: true }
                        promoted_by: { type: string, nullable: true }
                        promoted_at: { type: integer, nullable: true }
        "400": { description: claim_limit_out_of_bounds }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on global) }
  /workflow/claims/{id}:
    get:
      summary: Read one claim for the promotion screen (Read on global; audited)
      description: >
        The ONE surface besides the service core that may see a claim that is
        not yet ratified, which is why it is a separate operation rather than a
        flag on the gated read. Authorization precedes the lookup, so an
        absent id is probe-blind.
      operationId: getClaimForPromotion
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The claim row
          content:
            application/json:
              schema:
                type: object
                required: [claim_id, subject, predicate, object]
                properties:
                  claim_id: { type: string }
                  subject: { type: string }
                  predicate: { type: string }
                  object: { type: string }
                  scope: { type: string, nullable: true }
                  promoted_by: { type: string, nullable: true }
                  promoted_at: { type: integer, nullable: true }
        "400": { description: claim_id_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Read on global) }
        "404": { description: claim not found }
  /workflow/claims/{id}/verify:
    post:
      summary: Run the gate over a claim (Write on global plus the `workflow` role; audited)
      description: >
        The gate is six deterministic checks in a fixed order, each a pure
        function over rows: shape, bounds, referential, citation
        resolvability, contradiction, and premise discipline. No model, no
        score, no threshold, no tie-break by judgement — and that is the
        design, because if any gate authority derived from model judgement
        then more proposals would make the gate strictly worse.
        Citation resolution is delegated to the byte-range evidence resolver
        over ADMITTED bytes, never over a live substring match.
        The response carries the verdict and a CLOSED refusal code. It never
        carries the failing byte offset, the adjacent text, or which evidence
        item was at fault: a location hint handed back to a generator turns
        the gate into an oracle it can be searched against. The detailed
        diagnostic goes to the audit chain and the promotion screen only.
      operationId: verifyClaimGate
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The gate verdict
          content:
            application/json:
              schema:
                type: object
                required: [claim_id, verdict]
                properties:
                  claim_id: { type: string }
                  verdict: { type: string, enum: [pass, refused, unavailable] }
                  reason:
                    type: string
                    description: >
                      A CLOSED vocabulary, and never an index: schema_mismatch,
                      out_of_bounds, referential, evidence_unresolvable,
                      contradicts_ratified, premise_dependent,
                      insufficient_support, no_schema. A code carrying a digit
                      would be an index into the proposer's own evidence.
                    enum: [schema_mismatch, out_of_bounds, referential, evidence_unresolvable, contradicts_ratified, premise_dependent, insufficient_support, no_schema]
                  check: { type: string, description: Which check was reached, on an unavailable verdict }
        "400": { description: claim_id_invalid }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on global plus `workflow`) }
  /workflow/claims/{id}/promote:
    post:
      summary: Promote a claim — DISABLED, returns a typed refusal in every configuration
      description: >
        THE LOOP SHIPS INERT. This route exists, is authorized, is audited, and
        returns `promotion_disabled` in every configuration, for every actor,
        whether or not a token was presented.
        A deterministic gate's honesty is a MEASURED property, not an
        architectural one. The one relevant published datapoint reads zero
        failures in benchmark and one in a hundred and forty-six out of
        benchmark, and nobody has published a long-run figure. Promotion
        therefore stays disabled until a published out-of-sample figure exists
        and has a NAMED OWNER. The switch is a compile-time constant with no
        environment variable and no flag behind it.
        The attempt is audited whether or not it succeeds: a promotion path
        that only records its successes is one whose refusals are invisible,
        and an invisible refusal rate is a gate that has already lost.
      operationId: promoteClaim
      security: [{ bearerAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: The typed disabled refusal
          content:
            application/json:
              schema:
                type: object
                required: [claim_id, status, reason, note]
                properties:
                  claim_id: { type: string }
                  status: { type: string, enum: [refused] }
                  reason: { type: string, enum: [promotion_disabled] }
                  note: { type: string }
        "401": { description: Not authenticated }
        "403": { description: Not authorized (Write on global plus `workflow`) }
        "404": { description: claim not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Bearer token authentication. Accepted credentials: a JWT signed by a
        `BRAIN_JWT_KEY_DIR` key, or the static bearer token from
        `BRAIN_TOKEN_FILE`/`BRAIN_TOKEN`. Authz is scope-based
        (`<action>:<team>/<domain>`; see the `Scope` schema); the per-route role
        matrix (public / read / write / admin) lives in
        src/server/router/route_guards.rs
        (the authz-guard table) and API_CONTRACT.md. Most routes require auth;
        the exempt public set is /health, /ready, /version, /openapi.yaml,
        /.well-known/*, /ump/capabilities and /auth/refresh (logout is NOT
        public — it must verify the bearer before revoking it).
        A revoked identity (the principal kill-switch) is denied 401
        `identity_revoked` on every route BEFORE authorization (see the
        IdentityRevoked response).
  responses:
    BadRequest:
      description: Validation failure
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    CapacityExceeded:
      description: Capacity envelope exceeded; new writes refused (HTTP 507)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    PayloadTooLarge:
      description: Body exceeded the size cap
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Unauthorized:
      description: >
        Not authenticated: no bearer, an unverifiable one, or a configured-but-
        empty token store. Shape `{error, code}` per the middleware.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    Forbidden:
      description: >
        Authenticated but not authorized for (action, team, domain) — the
        authorize gate's 403. Shape `{error, code}` per the handler error
        vocabulary.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    IdentityRevoked:
      description: >
        401 `identity_revoked`: the bearer verified, but the identity it names
        sits in the revocation table (the principal kill-switch). Returned on
        EVERY route, ahead of authorization — the identity is dead, not
        unauthorized for the route. Byte-identical for every revoked
        principal (probe-blind: nothing about provisioning state leaks), and
        the denial is audited path-only (never the token). Capability tokens
        deny on their issuer principal.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
    NotFound:
      description: >
        The named resource (profile, domain, chunk…) does not exist.
        v1.27.16 "Drawbridge" (M5/F-41): an unregistered domain (multi-db mode)
        carries the `domain_unknown` code — deliberately probe-blind, the same
        shape as an empty-but-real domain, and no read ever creates the file.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    DeliveryRunCreated:
      type: object
      additionalProperties: false
      required: [run_id, phase, tier, trace_mode, trace_id, state_revision, principal]
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        phase: { type: string, enum: [scope, design, build, release, operate, done] }
        tier: { type: string, enum: [observe, propose, bounded-auto, delegated] }
        trace_mode: { type: string, enum: [deterministic, exploratory] }
        trace_id: { type: string, pattern: "^trc_[0-9a-f]{32}$" }
        state_revision: { type: integer, format: int64, minimum: 0 }
        principal: { type: string, maxLength: 64 }
    DeliveryRunAdvanced:
      type: object
      description: >
        The response of `POST /workflow/delivery/runs/{id}/advance`. Served by
        the route handler `post_delivery_advance`, which calls
        `workflow::delivery::advance` and serializes its return value — the
        `pub(crate) struct Advanced` at `src/workflow/delivery.rs:868`.
        The Rust and spec names deliberately differ, and this is a house
        convention rather than a one-off: the wire vocabulary is namespaced
        (`DeliveryRunCreated`, `DeliveryRunAdvanced`, `DeliveryRunAnswered`,
        `DeliveryGateVerdict`) while the service-core types are terse
        (`Created`, `Advanced`, `Answered`, `GateVerdict`) because they live in
        one module and the module already supplies the namespace. The same
        divergence exists across the spec (`MemorySearchResult`,
        `DsarExport`), so renaming either side would be a repo-wide convention
        change, not a correction — deliberately not done unilaterally.
        The pairing is machine-checked, not asserted: see
        `delivery_advance_wire_schema_matches_the_handler` in
        `src/docs_truth.rs`, which pins the key set AND this route-to-type
        binding, so a future rename on either side fails the build rather than
        silently desynchronizing the spec from the served response.
      additionalProperties: false
      required: [run_id, phase, tier, trace_mode, trace_id, state_revision, step_id, proposal_id]
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        phase: { type: string, enum: [scope, design, build, release, operate, done] }
        tier: { type: string, enum: [observe, propose, bounded-auto, delegated] }
        trace_mode: { type: string, enum: [deterministic, exploratory] }
        trace_id: { type: string, pattern: "^trc_[0-9a-f]{32}$" }
        state_revision: { type: integer, format: int64, minimum: 0 }
        step_id: { type: integer, format: int64, minimum: 1 }
        proposal_id:
          type: integer
          format: int64
          minimum: 0
          description: The pending proposal the typed artifact filed, or 0 when the pass carried no artifact
    DeliveryArtifact:
      type: object
      additionalProperties: false
      required: [id, content]
      description: >
        The typed artifact a phase pass carries. Its SHA-256 is derived
        server-side from `content` — there is no digest field, so a client
        cannot name the digest of an artifact the server did not derive. The
        content is screened at this boundary (reject 400, quarantine 409) and
        stored verbatim, so the approval digest is computed over one shape.
      properties:
        id: { type: string, minLength: 1, maxLength: 128 }
        content: { type: string, minLength: 1, maxLength: 8000 }
        quality_gate:
          type: string
          maxLength: 8000
          description: >
            The executor's checkpoint gate as JSON, evaluated by the shipped
            validator on a `build` pass. Consulted only when the pass targets
            `build`; carried and ignored on every other phase. Parsed as
            structured data and never rendered.
    DeliveryRunAnswered:
      type: object
      additionalProperties: false
      required: [run_id, trace_id, state_revision]
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        trace_id: { type: string, pattern: "^trc_[0-9a-f]{32}$" }
        state_revision: { type: integer, format: int64, minimum: 0 }
    DeliveryGateVerdict:
      type: object
      additionalProperties: false
      required: [run_id, phase, tier, trace_mode, disposition, deny_reason, trace_id, evaluated_at]
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        phase: { type: string, enum: [scope, design, build, release, operate, done] }
        next_phase:
          type: string
          nullable: true
          enum: [scope, design, build, release, operate, done]
        tier: { type: string, enum: [observe, propose, bounded-auto, delegated] }
        trace_mode: { type: string, enum: [deterministic, exploratory] }
        disposition: { type: string, enum: [allowed, prompt, denied] }
        deny_reason:
          type: string
          nullable: true
          enum: [terminal-phase, illegal-phase-transition, closed-vocabulary, exhausted-budget]
        trace_id: { type: string, pattern: "^trc_[0-9a-f]{32}$" }
        evaluated_at: { type: integer, format: int64, minimum: 1 }
    DeliveryModelBinding:
      type: object
      additionalProperties: false
      required: [key, config_digest]
      description: >
        The registry row a phase pass executes under, NAMED by the client. The
        server resolves the key and derives the artifact digest, so a client can
        never vouch for a model it did not run; a row that resolves without an
        artifact digest is refused. Absent is the previous behaviour: the trace
        rows carry honest nulls and the signed predicate's model fields stay
        empty.
      properties:
        key:
          type: string
          maxLength: 128
          pattern: "^rules:[a-z0-9][a-z0-9._-]*$"
        config_digest:
          type: string
          pattern: "^[0-9a-f]{64}$"
    DeliveryAttestationLink:
      type: object
      additionalProperties: false
      required: [id, run_id, step_id, subject_name, subject_digest, predicate_type, predicate_digest, signer_did, parent_id, chain_hash, created_at, verified]
      description: >
        One signed statement about one phase pass. `verified` is this link's own
        verdict and `refusal` (present only when it is false) names why — a
        closed vocabulary, never a generic failure. The raw signed envelope is
        deliberately NOT returned: it is canonical bytes carrying a base64
        signature, and this surface answers "does it verify, and who signed it".
        The envelope is retrievable from storage by a holder of the chain.
      properties:
        id: { type: string, pattern: "^att_[0-9a-f]{32}$" }
        run_id: { type: integer, format: int64, minimum: 1 }
        step_id: { type: integer, format: int64, minimum: 1 }
        subject_name:
          type: string
          maxLength: 160
          description: Kernel-derived (`delivery/phase/{phase}` plus a bounded artifact-id suffix). Agent free text never becomes a signed name.
        subject_digest: { type: string }
        predicate_type: { type: string, enum: ["urn:brain:attest:delivery:v1"] }
        predicate_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        signer_did:
          type: string
          description: >
            The key that signed, as a did:key. This IS the key history: there is
            no epoch column, no revocation oracle, and no PKI, so a rotated key
            leaves historical links verifiable. Authorship is not authority.
        parent_id: { type: string, description: Empty at the chain root; otherwise the parent link's row id. }
        chain_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
        created_at: { type: integer, format: int64, minimum: 1 }
        verified: { type: boolean }
        refusal:
          type: string
          description: Why this link does not verify. Present only when `verified` is false.
          enum:
            - attestation_root_has_parent
            - attestation_broken_link
            - attestation_envelope_malformed
            - attestation_integrity_incomplete
            - attestation_signer_mismatch
            - attestation_content_hash_mismatch
            - attestation_unknown_signer
            - attestation_signature_invalid
            - attestation_predicate_type_mismatch
            - attestation_predicate_malformed
            - attestation_predicate_incomplete
            - attestation_predicate_digest_mismatch
            - attestation_chain_hash_mismatch
            - attestation_column_mismatch
            - attestation_dated_in_future
    DeliveryAttestationVerdict:
      type: object
      additionalProperties: false
      required: [verified, link_count, signer_dids]
      description: >
        The UNCONDITIONAL verdict over the chain. There is no parameter that can
        switch it off. An empty chain (a run that has not yet passed a phase)
        reports `verified: true` with `link_count: 0`, which means "nothing to
        refute", not "everything is fine".
      properties:
        verified: { type: boolean }
        head:
          type: string
          nullable: true
          description: The last link's row id, or null when the chain is empty.
        link_count: { type: integer, minimum: 0, maximum: 500 }
        signer_dids:
          type: array
          description: Distinct keys that signed this chain, sorted.
          items: { type: string }
    DeliveryAttestationChain:
      type: object
      additionalProperties: false
      required: [run_id, chain, verdict]
      description: >
        The run's chain in append order, with the verdict. Served from
        `brain_delivery_core`'s predicate and record-digest forms over the
        shipped integrity stack; verified OFFLINE, with no key file, no
        network, and no clock involved. See the route description for the
        non-claims, which are part of the contract.
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        chain:
          type: array
          maxItems: 500
          items:
            $ref: "#/components/schemas/DeliveryAttestationLink"
        verdict:
          $ref: "#/components/schemas/DeliveryAttestationVerdict"
    DeliveryStageDigest:
      type: object
      additionalProperties: false
      required: [stage, input_digest, output_digest]
      description: >
        One stage's digests, as the replay surface projects them. `input_digest`
        is `sha256:` over the row's canonical stored facts; `output_digest` is the
        row's content address (`trc_...`) — STORED on the recorded side and
        RE-DERIVED from the columns on the other. Because the recorded side
        carries the stored address and the re-derived side the recomputed one,
        `output_digest` is the only field in this document whose disagreement
        carries information: the `input_digest` arms are computed by the same
        pure function over the same stored columns and therefore always agree.
      properties:
        stage: { type: string, enum: [run, phase, gate, answer, order] }
        input_digest: { type: string }
        output_digest: { type: string }
    DeliveryStageDiff:
      type: object
      additionalProperties: false
      required: [stage, mismatch, recorded, rederived]
      description: >
        One mismatch. A diff is the PRODUCT of this surface, not an error: the
        request returns 200 and the reader is handed what was stored, what the
        columns imply, and which of the two comparisons failed. `stage` is
        `order` when the STORED ORDINAL series is not contiguous ascending, in
        which case the digests carry the expected and actual ordinals and
        `mismatch` is `order_not_contiguous` — a code of its own, because
        `input_digest_differs` is reserved for a digest comparison and (per
        `DeliveryStageDigest` above) those arms can never actually disagree.
        A violation of contiguity means a hole in the evidence log, not a
        malformed projection, and the two demand different responses.
      properties:
        stage: { type: string, enum: [run, phase, gate, answer, order] }
        mismatch:
          type: string
          enum:
            [
              missing_recorded,
              missing_rederived,
              stage_differs,
              input_digest_differs,
              output_digest_differs,
              order_not_contiguous,
            ]
        # `type: object` is REQUIRED here, not decoration. The OpenAPI 3.0.x
        # spec (§4.7.24.2) states that `nullable` "only takes effect if `type` is
        # explicitly defined within the same Schema Object" — an `allOf` + `$ref`
        # with no `type` is undefined behavior, and §3.9 says relying on it is
        # NOT RECOMMENDED. Naming the type is what makes the nullability
        # actually hold.
        recorded:
          type: object
          allOf: [{ $ref: "#/components/schemas/DeliveryStageDigest" }]
          nullable: true
        rederived:
          type: object
          allOf: [{ $ref: "#/components/schemas/DeliveryStageDigest" }]
          nullable: true
    DeliveryEventRow:
      type: object
      additionalProperties: false
      required: [seq, kind, payload_json, created_at]
      properties:
        seq: { type: integer, format: int64 }
        kind: { type: string }
        payload_json: { type: string }
        created_at: { type: integer, format: int64 }
    DeliveryEventLog:
      type: object
      additionalProperties: false
      required: [rows, cap, truncated]
      description: >
        The `ddl_*` narrative appendix. It is human-readable and ADDITIVE: it is
        never the re-derivation source, and a mismatch is never read out of it.
        `cap` and `truncated` travel together so a reader can always tell a
        bounded tail from the whole log.
      properties:
        rows:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/DeliveryEventRow" }
        cap: { type: integer, minimum: 1 }
        truncated: { type: boolean }
    DeliveryWindow:
      type: object
      additionalProperties: false
      required: [rows, cap, truncated]
      description: >
        The disclosed bounds of a read. `rows` is what was returned, `cap` is the
        bound that was applied, and `truncated` says whether the bound actually
        bit. A bounded window that does not announce itself is a silent short
        read, so all three are always present.
      properties:
        rows: { type: integer, minimum: 0 }
        cap: { type: integer, minimum: 1 }
        truncated: { type: boolean }
    DeliveryReplayReport:
      type: object
      additionalProperties: false
      required:
        [
          run_id,
          window,
          order_ok,
          compared,
          matched,
          mismatched,
          diffs,
          event_log,
          generated_at,
        ]
      description: >
        The replay verdict, as DATA. It contains no run status, no approval, and
        no disposition, and the surface persists nothing. `order_ok` is the
        contiguity verdict on the stored ordinal series; a violation appears in
        `diffs` with stage `order` and is counted in `mismatched`, so
        `matched + mismatched == compared` holds. This is tamper EVIDENCE over
        stored bytes and is not tamper-proofing; it binds nothing to the
        attestation chain and is not a compliance finding. See the route
        description, which carries the ceiling.
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        window: { $ref: "#/components/schemas/DeliveryWindow" }
        order_ok: { type: boolean }
        compared: { type: integer, minimum: 0 }
        matched: { type: integer, minimum: 0 }
        mismatched: { type: integer, minimum: 0 }
        diffs:
          type: array
          maxItems: 1000
          items: { $ref: "#/components/schemas/DeliveryStageDiff" }
        event_log: { $ref: "#/components/schemas/DeliveryEventLog" }
        generated_at: { type: integer, format: int64 }
    DeliveryTraceRow:
      type: object
      additionalProperties: false
      required:
        [
          id,
          run_id,
          seq,
          stage,
          phase,
          status,
          tier,
          actor,
          model_ref,
          model_registry_id,
          model_registry_version,
          policy_digest,
          config_digest,
          pipeline_version,
          budget_digest,
          artifact_refs_json,
          attestation_root,
          created_at,
        ]
      description: >
        One stored trace row, as it sits in `delivery_traces`. Returned as
        stored; serving these bytes is not an endorsement of them.
      properties:
        id: { type: string, pattern: "^trc_[0-9a-f]{32}$" }
        run_id: { type: integer, format: int64 }
        seq: { type: integer, format: int64, minimum: 1 }
        stage: { type: string, enum: [run, phase, gate, answer] }
        phase: { type: string }
        status: { type: string }
        tier: { type: string, enum: [observe, propose, bounded-auto, delegated] }
        actor: { type: string }
        model_ref: { type: string, nullable: true }
        model_registry_id:
          type: string
          nullable: true
          description: >
            The cited model's registry `id`, BARE (no `rules:` prefix), as the
            resolver returned it — NOT derived from `model_ref`. `null` means the
            trace carries no model citation.
        model_registry_version:
          type: string
          nullable: true
          description: >
            The cited model's registry `version`, the second half of the
            registry's composite key. Together with `model_registry_id` this is
            the key that joins a trace to `decision_model_registry`. `null` means
            the trace carries no model citation.
        policy_digest: { type: string, nullable: true }
        config_digest: { type: string, nullable: true }
        pipeline_version: { type: string }
        budget_digest: { type: string, nullable: true }
        artifact_refs_json: { type: string }
        attestation_root: { type: string, nullable: true }
        created_at: { type: integer, format: int64 }
    DeliveryTraceListing:
      type: object
      additionalProperties: false
      required: [run_id, window, rows, attestation_root, event_log, generated_at]
      description: >
        The run's stored rows in ORDINAL order, the attestation chain head READ
        from storage (`null` before the first link — never a fabricated address),
        and the same bounded, self-disclosing narrative appendix the replay
        verdict carries. It rides the same read function and the same window
        function as the verdict, so the two apply identical logic to storage:
        any difference you observe between them is a change in storage, not a
        difference of method. They are two separate requests with no shared
        snapshot, so this is not a consistency guarantee across a moving run.
      properties:
        run_id: { type: integer, format: int64, minimum: 1 }
        window: { $ref: "#/components/schemas/DeliveryWindow" }
        rows:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/DeliveryTraceRow" }
        attestation_root: { type: string, nullable: true }
        event_log: { $ref: "#/components/schemas/DeliveryEventLog" }
        generated_at: { type: integer, format: int64 }
    DeliveryBinding:
      type: object
      additionalProperties: false
      required: [id, domain, target_kind, target_ref, endpoint, authority_digest, capabilities, active, updated_at]
      description: >
        One standing authority. `authority_digest` covers the endpoint, the stable
        external ref, and the secret's FILE NAME — never the secret and never its
        path. No field here reveals where a credential lives.
      properties:
        id: { type: integer, format: int64, minimum: 1 }
        domain: { type: string }
        target_kind:
          type: string
          enum: [vcs, ci, registry, deploy, pm, incident]
          description: >-
            `registry`, `deploy`, `pm` and `incident` are declared and
            CONSUMER-LESS: they have no adapter, and a binding of one of those
            kinds is never read. They stay in the vocabulary so adding one is a
            deliberate act with code behind it.
        target_ref: { type: string, maxLength: 200 }
        endpoint: { type: string, maxLength: 2048 }
        authority_digest: { type: string, pattern: "^sha256:[0-9a-f]{64}$" }
        capabilities:
          type: string
          description: >-
            The operator's declared surface, serialized. It parses with
            `deny_unknown_fields`; a block this server cannot parse renders as the
            literal `"unparseable"` rather than as a default that would read as
            unconstrained.
        active: { type: integer, enum: [0, 1] }
        updated_at: { type: integer, format: int64 }
    DeliveryBindingsView:
      type: object
      additionalProperties: false
      required: [bindings, intents_pending, observed_pending, untrusted_pending]
      description: >
        The domain's bindings plus the pending-intent census. `intents_pending`
        and `observed_pending` are EXPECTED to be non-zero in normal operation:
        the intents are undrained by design and the release act belongs to a gate
        that does not exist yet. They exist so a lost intent is distinguishable
        from an un-promoted one. `untrusted_pending` should be zero — a non-zero
        value means something wrote the reserved topic root without the minter.
      properties:
        bindings:
          type: array
          maxItems: 64
          items: { $ref: "#/components/schemas/DeliveryBinding" }
        intents_pending: { type: integer, format: int64, minimum: 0 }
        observed_pending: { type: integer, format: int64, minimum: 0 }
        untrusted_pending: { type: integer, format: int64, minimum: 0 }
    DeliveryOutcomesView:
      type: object
      additionalProperties: false
      required: [window_days, generated_at, domain, cluster, attribution]
      description: >
        The derived read model. Metrics vocabulary only; no thresholds or
        tables reproduced. Every metric object carries `state` — `computed`
        with a value, or `insufficient` with a closed `reason` — so an absent
        metric is never rendered `0` and a zero is never rendered absent.
      properties:
        window_days: { type: integer, minimum: 1, maximum: 366 }
        generated_at: { type: integer, format: int64, description: epoch seconds; the `now` the derivation is deterministic against }
        domain: { type: string }
        cluster:
          type: object
          additionalProperties: false
          required: [note, framing, throughput, instability, native_measures, own_baseline]
          properties:
            note: { type: string }
            framing: { type: string }
            throughput:
              type: object
              additionalProperties: false
              required: [change_lead_time, governed_release_cadence, failed_deployment_recovery_time, control]
              properties:
                change_lead_time: { $ref: "#/components/schemas/DeliveryLeadTimeMetric" }
                governed_release_cadence: { $ref: "#/components/schemas/DeliveryCadenceMetric" }
                failed_deployment_recovery_time:
                  type: object
                  additionalProperties: false
                  required: [state, reason]
                  properties:
                    state: { type: string, enum: [insufficient] }
                    reason: { type: string, enum: [no_incident_facts] }
                control: { type: string, enum: [change_fail_rate] }
            instability:
              type: object
              additionalProperties: false
              required: [change_fail_rate, deployment_rework_rate]
              properties:
                change_fail_rate: { $ref: "#/components/schemas/DeliveryFailRateMetric" }
                deployment_rework_rate:
                  type: object
                  additionalProperties: false
                  required: [state, reason]
                  properties:
                    state: { type: string, enum: [insufficient] }
                    reason: { type: string, enum: [no_rework_signal] }
            native_measures:
              type: object
              additionalProperties: false
              required: [approval_to_promotion_elapsed, note]
              properties:
                approval_to_promotion_elapsed:
                  type: object
                  additionalProperties: false
                  required: [state]
                  description: The NATIVE measure — never presented as DORA change lead time; it carries no dora_name.
                  properties:
                    state: { type: string, enum: [computed, insufficient] }
                    value_minutes: { type: number }
                    reason: { type: string, enum: [window_empty] }
                note: { type: string }
            own_baseline:
              type: object
              additionalProperties: false
              required: [window_days, change_fail_rate, cadence_per_week]
              description: The run's OWN history — the only baseline the model carries.
              properties:
                window_days: { type: integer, minimum: 1, maximum: 366 }
                change_fail_rate: { $ref: "#/components/schemas/DeliveryFailRateMetric" }
                cadence_per_week: { $ref: "#/components/schemas/DeliveryCadenceMetric" }
        attribution:
          type: object
          additionalProperties: false
          required: [programme, reference, license_note]
          properties:
            programme: { type: string }
            reference: { type: string }
            license_note: { type: string }
    DeliveryLeadTimeMetric:
      type: object
      additionalProperties: false
      required: [state, dora_name, definition_match, definition_note, anchor]
      description: Commit-anchored change lead time; computed only when the release's commit_sha joins to a recorded vcs commit-time fact.
      properties:
        state: { type: string, enum: [computed, insufficient] }
        value_minutes: { type: number }
        percentile: { type: integer, enum: [50] }
        dora_name: { type: string, enum: [change lead time] }
        definition_match: { type: string, enum: [proxy] }
        definition_note: { type: string }
        anchor: { type: string }
        reason: { type: string, enum: [window_empty, no_vcs_revision_recorded] }
    DeliveryCadenceMetric:
      type: object
      additionalProperties: false
      required: [state, dora_name, definition_match, definition_note]
      properties:
        state: { type: string, enum: [computed, insufficient] }
        per_week: { type: number }
        dora_name: { type: string, enum: [deployment frequency] }
        definition_match: { type: string, enum: [proxy] }
        definition_note: { type: string }
        reason: { type: string, enum: [window_empty, insufficient_history] }
    DeliveryFailRateMetric:
      type: object
      additionalProperties: false
      required: [state, dora_name, definition_match, definition_note]
      properties:
        state: { type: string, enum: [computed, insufficient] }
        ratio: { type: number }
        role: { type: string, enum: [control] }
        dora_name: { type: string, enum: [change failure rate] }
        definition_match: { type: string, enum: [proxy] }
        definition_note: { type: string }
        reason: { type: string, enum: [window_empty, insufficient_history] }
    DecisionEvaluationRecord:
      type: object
      additionalProperties: false
      required: [evaluation_id, idempotency_key, request_digest, target, judgment_set, report, acceptance_state, acceptance_bars, creator_id, reviewer_id, created_at, record_digest, audit_target]
      properties:
        evaluation_id: { type: string, pattern: "^eval_[0-9a-f]{32}$" }
        idempotency_key: { type: string, maxLength: 128 }
        request_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        target:
          type: object
          additionalProperties: false
          required: [pipeline_version, config_hash, model_registry_id, model_registry_version, model_registry_digest]
          properties:
            pipeline_version: { type: string }
            config_hash: { type: string, pattern: "^[0-9a-f]{64}$" }
            model_registry_id: { type: string }
            model_registry_version: { type: string }
            model_registry_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
            model_artifact_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        judgment_set:
          type: object
          additionalProperties: false
          required: [source, authoritative, judgment_set_ref, frozen_at, manifest_digest, cases]
          properties:
            source: { type: string, enum: [operator_declared] }
            authoritative: { type: boolean, enum: [false] }
            judgment_set_ref: { type: string }
            frozen_at: { type: integer, format: int64 }
            manifest_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
            cases:
              type: array
              maxItems: 128
              items:
                type: object
                additionalProperties: false
                required: [case_id, trace_id, relevant_evidence_ids, expected_action, expected_output_label, expected_output_digest, case_digest]
                properties:
                  case_id: { type: string }
                  trace_id: { type: integer, format: int64 }
                  relevant_evidence_ids: { type: array, items: { type: string } }
                  expected_action: { type: string, enum: [act, approve, reject, escalate] }
                  expected_output_label: { type: string, enum: [choice, score, noul, none] }
                  expected_output_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
                  case_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        report:
          type: object
          required: [report_version, case_results, retrieval, agreement, abstention, ood_abstention, calibration, red_team, acceptance_reported_as_data_only, acceptance_bars]
          properties:
            report_version: { type: string }
            case_results: { type: array, items: { type: object } }
            retrieval: { type: object }
            agreement: { type: object }
            abstention: { type: object }
            ood_abstention: { type: object }
            calibration: { type: object }
            red_team: { type: object }
            acceptance_reported_as_data_only: { type: boolean, enum: [true] }
            acceptance_bars: { type: object }
        acceptance_state: { type: string, enum: [operator_accepted_non_authoritative] }
        acceptance_bars: { type: object }
        creator_id: { type: string }
        reviewer_id: { type: string }
        created_at: { type: integer, format: int64 }
        record_digest: { type: string, pattern: "^[0-9a-f]{64}$" }
        audit_target: { type: string }
    ProposalView:
      type: object
      description: >-
        One row of the human review queue (GET /proposals and
        /clients/{name}/proposals). `content` is the read-canonical form the
        reviewer sees; `content_digest` is the SHA-256 the approve verb binds
        to.
      required: [id, kind, content, novelty, salience, created_at, screen_verdict,
                 expires_at, warn_secs, critical_secs, domain]
      properties:
        id: { type: integer }
        kind: { type: string }
        content: { type: string }
        content_digest:
          type: string
          description: SHA-256 of the canonical review form; the digest the approve verb binds to (empty on pre-digest rows).
        source: { type: string, nullable: true }
        source_prompt: { type: string, nullable: true }
        authority: { type: number, nullable: true }
        novelty: { type: number }
        conflict_with: { type: integer, nullable: true }
        salience: { type: number }
        created_at: { type: integer }
        screen_verdict: { type: string, enum: [clean, quarantine] }
        edited_at: { type: integer, nullable: true }
        decided_at: { type: integer, nullable: true }
        expires_at: { type: integer }
        warn_secs: { type: integer }
        critical_secs: { type: integer }
        owner: { type: string, nullable: true }
        qa_note: { type: string, nullable: true }
        qa_score: { type: integer }
        domain:
          type: string
          description: >-
            v1.28.53 "Triage": the residency label the queue scopes by.
            Stamped at creation from the caller's domain context; parcels
            stamp the TARGET domain; pre-Triage rows read `global` forever.
        title:
          type: string
          nullable: true
          description: >-
            v1.28.53: the optional caller title (autocapture source title,
            parcel row title); absent for bodies without one.
    IpassSection:
      type: object
      description: One rendered I-PASS handoff section.
      properties:
        title: { type: string }
        lines:
          type: array
          items: { type: string }
    DpaTerms:
      type: object
      description: >
        v1.27.3 — Art 28 sub-processor DPA terms: the evidence a client's
        controller checks before authorizing the BPO. All free-text + bounded
        (each <= 2000 chars, never blank). Config the operator fills — not a
        signed contract.
      required:
        - retention_on_termination
        - deletion_timeline
        - audit_rights
        - breach_notification_timeline
        - onward_transfer_restriction
        - sub_sub_processor_list
      properties:
        retention_on_termination: { type: string, description: e.g. purge, return }
        deletion_timeline: { type: string, description: e.g. within 30 days of end }
        audit_rights: { type: string, description: e.g. annual + on request }
        breach_notification_timeline: { type: string, description: e.g. within 72h }
        onward_transfer_restriction: { type: string, description: e.g. no onward transfer }
        sub_sub_processor_list: { type: string, description: comma list of names }
    Profile:
      type: object
      description: >
        v1.21.0 — a typed bundle of existing knob defaults bound to a domain.
        Absent fields mean "this profile does not touch that knob". The
        profile sets defaults; an explicit row value always wins.
      properties:
        name: { type: string }
        description: { type: string, description: Display-only one-liner for the wizard/Health panel. }
        default_access_scope:
          type: string
          enum: [private, domain, team]
        pii_mode:
          type: string
          enum: [off, standard, strict]
          description: strict = write-time one-way masking (email/phone/card placeholders stored; no vault, no recovery).
        retention:
          type: object
          description: Per-memory_kind days; JSON null for a kind = no decay. The map REPLACES the server-wide policy for the bound domain; absent = server-wide policy applies.
          additionalProperties:
            type: integer
            nullable: true
        audit_level:
          type: string
          enum: [minimal, standard, verbose]
          description: Drives /recall read-event auditing when BRAIN_AUDIT_READ_EVENTS is unset.
        kinds: { type: array, items: { type: string }, description: Allowed memory_kind vocabulary; an out-of-vocabulary ingest is 422. }
        connectors_allowed: { type: array, items: { type: string }, description: Stored + surfaced only in v1.21 (enforcement lands with the v1.24 connector work). }
        legal_hold_default: { type: boolean, description: Stored flag; enforcement is v1.22.0 "Regulated". }
    ProfileUpsert:
      type: object
      description: POST /profiles/{name} body — a Profile minus the name (the path is the name).
      properties:
        description: { type: string }
        default_access_scope: { type: string, enum: [private, domain, team] }
        pii_mode: { type: string, enum: [off, standard, strict] }
        retention:
          type: object
          additionalProperties:
            type: integer
            nullable: true
        audit_level: { type: string, enum: [minimal, standard, verbose] }
        kinds: { type: array, items: { type: string } }
        connectors_allowed: { type: array, items: { type: string } }
        legal_hold_default: { type: boolean }
    Role:
      type: object
      description: >
        v1.23.0 — a named bundle of scopes + panel visibility + an action
        `can` allowlist, resolved from a JWT principal's `roles` claim. The
        server enforces the data gate (access_scopes + owner) and the action
        gate (can); panel visibility is client UX (defense-in-depth, not the
        only gate). `admin` short-circuits to unrestricted data.
      properties:
        name: { type: string }
        description: { type: string, description: Display-only one-liner. Never interpreted. }
        scopes:
          type: array
          description: access_scope values this role may read; empty + not admin = deny-by-default.
          items: { type: string, enum: [private, domain, team] }
        owner_filter:
          type: string
          description: self = own owner rows; reports = the manages claim set; all = unrestricted.
          enum: [self, reports, all]
        can:
          type: array
          description: Action allowlist enforced by the authorize_role gate (a held action omitted here is 403).
          items:
            type: string
            enum: [read, write, approve, reject, calibrate, release_quarantine, dsar_export, purge, admin, workflow]
        panels_default:
          type: array
          items: { type: string }
          nullable: true
        panels_hidden:
          type: array
          items: { type: string }
          nullable: true
        tools_allowed:
          type: array
          description: MCP ump.* tools (stored + surfaced now; enforcement is v1.24). "*" = all.
          items: { type: string }
          nullable: true
    RoleUpsert:
      type: object
      description: POST /roles/{name} body — a Role minus the name (the path is the name).
      properties:
        description: { type: string }
        scopes:
          type: array
          items: { type: string, enum: [private, domain, team] }
        owner_filter: { type: string, enum: [self, reports, all] }
        can:
          type: array
          items:
            type: string
            enum: [read, write, approve, reject, calibrate, release_quarantine, dsar_export, purge, admin, workflow]
        panels_default: { type: array, items: { type: string }, nullable: true }
        panels_hidden: { type: array, items: { type: string }, nullable: true }
        tools_allowed: { type: array, items: { type: string }, nullable: true }
    Footprint:
      type: object
      description: >
        v1.20.21 — the would-be DSAR deletion footprint. A `POST /dsar` with
        `dry_run: true` returns this instead of a certificate: what a live
        purge would locate + export + delete, without executing any write.
      properties:
        roots: { type: integer, description: owner rows located }
        derived: { type: integer, description: transitive derived_from descendants }
        export_rows: { type: integer, description: knowledge rows in the export bundle }
        tombstones: { type: integer, description: prior deletions for this subject (ledger trace) }
        dsar_rows: { type: integer, description: prior DSAR ledger rows for this subject }
        workflow_rows:
          type: integer
          description: >
            Governed-workflow rows a live purge would reach — matched
            workflow_runs plus their dependents (steps/outbox/findings/
            contradictions); runs frozen by an active legal hold are counted
            as matched and listed as deferred on the live certificate.
        dry_run: { type: boolean, default: true }
    TerminationCertificate:
      type: object
      description: >
        v1.27.6 — the contract-end record: which policy the termination ran
        (purge = erased active memory; return = exported + frozen), how many
        chunks were purged, which ids a legal hold deferred (never purged), the
        return-path export bundle, and the audit chain head anchoring it. The
        register archive + audit row survive; the certificate is the operator's
        durable evidence.
      properties:
        client: { type: string }
        domain: { type: string }
        jurisdiction: { type: string }
        policy: { type: string, enum: [purge, return] }
        purged_chunk_count: { type: integer }
        held_ids:
          type: array
          items: { type: integer }
          description: Ids frozen by a legal hold (deferred, never purged).
        exported_bundle:
          type: string
          nullable: true
          description: The return-path export bundle (null on purge).
        archived_at: { type: integer }
        chain_head:
          type: string
          nullable: true
          description: The audit chain tip anchoring the certificate.
    DsarLedger:
      type: object
      description: >
        v1.20.22 — the `GET /dsar` ledger page: the bounded, newest-first
        request rows + the total count.
      properties:
        requests:
          type: array
          items: { $ref: "#/components/schemas/DsarLedgerRow" }
        total: { type: integer, description: total dsar_requests rows }
    DsarLedgerRow:
      type: object
      description: >
        v1.20.22 — one DSAR request. `created_at` keys the computed Art 17
        deadline (the client countdown source of truth).
      properties:
        id: { type: integer }
        subject: { type: string }
        action: { type: string }
        status: { type: string }
        created_at:
          type: integer
          nullable: true
          description: unix ts when the request was created.
        deadline:
          type: integer
          nullable: true
          description: >
            server-computed Art 17 erasure deadline (created_at + window) —
            the client countdown's source of truth; the same number the POST
            response carries.
        completed_at:
          type: integer
          nullable: true
          description: unix ts when the workflow completed; null while open.
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, nullable: true }
    Error:
      type: object
      description: >
        The error shape under its original name — the same object `ApiError`
        models (the rename missed these route blocks; both names resolve to
        the identical shape).
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object, nullable: true }
    LexSpec:
      type: object
      description: >
        Structured lexical controls, compiled server-side into a single
        FTS5-quoted MATCH expression (injection-safe). All fields optional;
        empty = fall back to the bare query.
      properties:
        terms:
          type: array
          items: { type: string }
          description: Implicit-AND terms.
        phrases:
          type: array
          items: { type: string }
          description: Quoted phrase matches (ordered token runs).
        exclude:
          type: array
          items: { type: string }
          description: Exclusions, prefixed with FTS5 NOT (-).
        code:
          type: array
          items: { type: string }
          description: Exact identifier / code path, matched verbatim.
    QueryDoc:
      type: object
      description: v0.9.5 structured query document. `v` must be 1 (unknown versions are rejected).
      properties:
        v: { type: integer, default: 1, description: schema version }
        q: { type: string, description: plain-text fallback query }
        query: { type: string, description: recall query (POST /recall) }
        lex: { $ref: "#/components/schemas/LexSpec" }
        vec: { type: string, description: explicit embedding query (overrides q) }
        hyde: { type: string, description: hypothetical answer (overrides vec) }
        intent: { type: string, description: recorded for provenance/telemetry only }
        sources:
          type: array
          items: { type: string }
          description: "OR filter over ingest kind: memory | markdown | structured | manual | vault (filters the source column, NOT source URIs)."
        source:
          type: string
          enum: [memory, markdown, structured, manual, vault, vector, fts, graph, both]
          description: "v1.13.3: ingest kind (SQL filter), retrieval leg (post-fusion filter), or both (unrestricted). Unknown values are rejected with 422."
        since: { type: string, description: ISO-8601 / YYYY-MM-DD HH:MM:SS lower bound }
        domain: { type: string, description: domain isolation label }
        k: { type: integer, description: result count (GET /search) }
        limit: { type: integer, description: result count (POST /recall) }
        profile: { type: string, description: retrieval profile hint (passthrough) }
        explain: { type: boolean, description: "GET /search query_plan toggle" }
        provenance: { type: boolean, description: "POST /recall telemetry/provenance toggle (alias: explain)" }
        include_flagged: { type: boolean, description: "v0.9.7 Guard: include quarantined chunks" }
        as_of: { type: string, nullable: true, description: "v0.9.8 Evidence: point-in-time recall (RFC3339)" }
        evidence: { type: boolean, description: "v0.9.8 Evidence: include structured Evidence on every hit" }
        at: { type: string, nullable: true, description: "v1.4.0 Calibrate M1: bi-temporal valid-time filter (RFC3339 or YYYY-MM-DD). Only chunks whose valid-interval contains this instant are returned. Distinct from as_of (transaction-time recall)." }
        max_context_tokens: { type: integer, nullable: true, description: "v1.4.0 Calibrate M2: submodular evidence packing token budget. When set, results are re-ranked by budgeted monotone submodular maximization (relevance+coverage+representativeness+diversity) and truncated to fit." }
        gold_answer: { type: string, nullable: true, description: "v1.4.0 Calibrate M2: optional gold-answer substring for the answer_in_context diagnostic (did the gold survive packing?)." }
        graph: { type: boolean, description: "v1.11.0 Associate: the graph-PPR retriever as a third RRF leg behind vector+FTS. Default ON since v1.12 (per-request opt-OUT; the BRAIN_RECALL_GRAPH_ENABLED kill switch disables it process-wide). Deterministic, zero-token, no embeddings." }
    Evidence:
      type: object
      description: >-
        Faithful, bounded evidence for a hit (verbatim snippet + span + source
        link). v0.9.8 adds time semantics, lifecycle, and typed links.
      properties:
        text: { type: string, description: verbatim substring of content }
        line_start: { type: integer, nullable: true }
        line_end: { type: integer, nullable: true }
        heading_path: { type: string, nullable: true }
        source_uri: { type: string, nullable: true }
        revision_id: { type: integer, nullable: true }
        valid_from: { type: string, nullable: true, description: when the fact became true (RFC3339) }
        valid_to: { type: string, nullable: true, description: when the fact ceased to be true; null = current }
        observed_at: { type: string, nullable: true, description: when brain-server learned the fact (RFC3339) }
        authority: { type: number, nullable: true, description: "source-authority tie-breaker (0..1)" }
        lifecycle:
          type: string
          nullable: true
          enum: [current, historical, superseded]
          description: current vs historical vs superseded; omitted when current
        links:
          type: array
          items:
            type: object
            properties:
              to_chunk: { type: integer }
              kind: { type: string, enum: [supports, supersedes, contradicts, references, derived_from] }
        highlights:
          type: array
          items:
            type: array
            items: { type: integer }
            description: "[start,end) byte offsets within `text`"
    SearchResult:
      type: object
      properties:
        id: { type: integer }
        similarity: { type: number, description: cosine similarity score }
        title: { type: string, nullable: true }
        content: { type: string }
        source:
          type: string
          enum: [vector, fts, both]
          nullable: true
        snippet: { type: string, description: bounded verbatim preview }
        source_uri: { type: string, nullable: true }
        revision_id: { type: integer, nullable: true }
        evidence:
          $ref: "#/components/schemas/Evidence"
        provenance:
          type: object
          nullable: true
          properties:
            vector_rank: { type: integer, nullable: true }
            fts_rank: { type: integer, nullable: true }
            graph_rank: { type: integer, nullable: true, description: "v1.11.0 Associate: rank assigned by the graph-PPR retriever (0 = best); null when the graph leg didn't retrieve the document." }
            fused_score: { type: number, nullable: true }
            rerank_score: { type: number, nullable: true }
            rerank_truncated: { type: boolean }
            prf_expanded: { type: boolean }
    RecallHit:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        snippet: { type: string, description: bounded verbatim preview }
        score: { type: number }
        domain: { type: string, nullable: true }
        source:
          type: string
          enum: [vector, fts, both, graph]
          nullable: true
        evidence:
          $ref: "#/components/schemas/Evidence"
        conflict:
          type: boolean
          nullable: true
          description: "v0.9.8: true when this chunk has a contradicts/supersedes link to a current chunk"
        provenance:
          type: object
          nullable: true
          properties:
            vector_rank: { type: integer, nullable: true }
            fts_rank: { type: integer, nullable: true }
            graph_rank: { type: integer, nullable: true, description: "v1.11.0 Associate: rank assigned by the graph-PPR retriever (0 = best); null when the graph leg didn't retrieve the document." }
            fused_score: { type: number, nullable: true }
            rerank_score: { type: number, nullable: true }
            rerank_truncated: { type: boolean }
            prf_expanded: { type: boolean }
        ingest_kind:
          type: string
          nullable: true
          description: >
            v1.27.12 "Provenance": the stored ingest kind of the row
            (memory/markdown/structured/manual/vault/connector). Absent when
            unset. Label only — never a ranking or trust assertion.
        memory_kind:
          type: string
          nullable: true
          description: "v1.27.12 \"Provenance\": the stored node_kind memory-kind (fact/procedure/step/decision/episodic). Label only."
        lawful_basis:
          type: string
          nullable: true
          description: "v1.27.12 \"Provenance\": the stored lawful basis (Art 5/6 posture) when declared. Label only."
        region:
          type: string
          nullable: true
          description: "v1.27.12 \"Provenance\": the stored data-residency region stamp. Label only."
        origin:
          type: string
          nullable: true
          description: >
            v1.28.11 "Boundary": who produced this memory (human/model/agent/
            operator/imported) — the write-side taint label, serialized so the
            consumer can see the provenance. Absent for legacy rows.
        flagged:
          type: boolean
          description: "v1.28.11 \"Boundary\": true when the source row was quarantined by the injection screen."
        authority:
          type: number
          nullable: true
          description: "v1.28.11 \"Boundary\": source-authority tie-breaker (0..1), surfaced as a provenance label."
    Chunk:
      type: object
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        source: { type: string, nullable: true }
        document_id: { type: string, nullable: true }
        chunk_index: { type: integer, nullable: true }
        heading_path: { type: string, nullable: true }
        line_start: { type: integer, nullable: true }
        line_end: { type: integer, nullable: true }
        created_at: { type: string, nullable: true }
        source_uri: { type: string, nullable: true }
        revision_id: { type: integer, nullable: true }
        flagged:
          type: boolean
          description: >
            The quarantine marker (v1.28.77, additive — the same vocabulary
            /recall emits on every hit). True means the row is quarantined;
            by-id reads never filter, the operator decides.
    VerifyResponse:
      type: object
      description: >
        Result of `/verify` (v1.5.0). `supported` is true when at least one
        case-insensitive occurrence of the claim was found in the chunk text.
      properties:
        chunk_id: { type: integer }
        supported: { type: boolean }
        decision:
          type: string
          enum: [supported, unsupported_claim]
        match_ranges:
          type: array
          description: >
            `[start, end)` byte offsets within chunk `content`. Capped at 100;
            further matches are not reported but do not change `supported`.
            items:
              type: array
              items: { type: integer }
              minItems: 2
              maxItems: 2
    StepView:
      type: object
      description: One ordered step of a procedure (`GET /procedure/{id}/steps`).
      properties:
        step_index: { type: integer }
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        memory_kind:
          type: string
          enum: [fact, procedure, step, decision]
          description: >
            Normalized node_kind of the step chunk. Unknown stored values fall
            back to `fact` (forward-compat parse).
    CategoryResult:
      type: object
      description: Deterministic classification result from `POST /classify`.
      properties:
        category:
          type: string
          enum: [technology, business_process, compliance, finance, vendor, assessment, infrastructure, general]
        confidence:
          type: number
          format: float
          description: >
            In [0.0, 1.0]. The winning category's SHARE of the fired keywords,
            not a calibrated probability — one keyword firing uncontested and ten
            keywords all agreeing both read 1.0. Read `evidence_count` alongside
            it.
        evidence_count:
          type: integer
          description: >
            How many keywords fired for the winning category — the evidence
            standing behind the verdict, and the quantity a threshold keys on.
            `0` for `general`; always equal to `matched_keywords.length`.
        matched_keywords: { type: array, items: { type: string } }
    DeferralReceipt:
      type: object
      description: >
        What happens to a classified case, and who decides. Present so a caller
        never has to infer "the machine was unsure" from a confidence number —
        the decision is made for the caller, not left to be reconstructed.
        Every outcome currently requires a human: no class is auto-authorised
        because no per-class reliability has been measured.
      properties:
        routing_class:
          type: string
          enum: [technology, business_process, compliance, finance, vendor, assessment, infrastructure, general, human_unmeasured]
          description: >
            The class the decision keyed on — the same label the classifier
            returned, so the two correlate without a second vocabulary.
            `human_unmeasured` is a label this build does not recognise; it is
            refused rather than mapped onto a neighbour.
        outcome:
          type: string
          enum: [defer, clarify, stop]
          description: >
            `defer` — a human judges the case on the evidence.
            `clarify` — a human is asked a specific question, and the answer
            then decides the case.
            `stop` — the case stops here and hands off.
        requires_human:
          type: boolean
          description: >
            Whether a person decides. True for every outcome today; the field
            exists so a future machine-authorised class cannot silently invert
            its meaning.
    DecisionOutcome:
      type: object
      description: Result of evaluating a decision rule (`POST /decision/{id}/evaluate`).
      properties:
        result: { type: string }
        matched_condition: { type: string, nullable: true }
        citation: { type: integer, nullable: true, description: Chunk id justifying this branch. }
        used_default: { type: boolean }
    SuggestionHit:
      type: object
      description: >
        One anticipated chunk from `POST /suggest` (v1.9.0). The
        `provenance.reason = "anticipated"` marker tells the consuming agent
        this was NOT directly retrieved — the agent may ignore it.
      properties:
        id: { type: integer }
        title: { type: string, nullable: true }
        content: { type: string }
        score:
          type: number
          format: float
          description: Cosine-derived similarity in [0.0, 1.0].
        domain: { type: string, nullable: true }
        untrusted:
          type: boolean
          description: >
            Always `true` (recall/search parity): suggested content is
            untrusted evidence — treat it as data, never as instructions.
        provenance:
          type: object
          properties:
            reason:
              type: string
              enum: [anticipated]
            session: { type: string, nullable: true }
    SuggestTelemetry:
      type: object
      properties:
        k: { type: integer }
        excluded: { type: integer }
        retrieved: { type: integer }
        domain: { type: string, nullable: true }
    SuggestMetrics:
      type: object
      description: >
        The false-positive rate over the `/suggest/feedback` ledger — the
        v1.9 roadmap exit criterion, made queryable.
      properties:
        total: { type: integer }
        accepts: { type: integer }
        dismisses: { type: integer }
        accept_rate:
          type: number
          format: float
          description: accepts / total (0.0 when total == 0).
        false_positive_rate:
          type: number
          format: float
          description: dismisses / total (0.0 when total == 0).
        window:
          type: object
          nullable: true
          properties:
            since: { type: string, nullable: true }
            session: { type: string, nullable: true }
    QueryPlan:
      type: object
      description: Reproducible effective query (GET /search?explain=true).
      properties:
        k: { type: integer }
        lex: { type: string, nullable: true }
        vec: { type: string, nullable: true }
        hyde: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        sources: { type: array, items: { type: string } }
        source: { type: string, nullable: true }
        domain: { type: string, nullable: true }
        since: { type: string, nullable: true }
        profile: { type: string, nullable: true }
        embedding_query: { type: string, nullable: true }
    SearchTelemetry:
      type: object
      description: Unified retrieval telemetry (POST /recall provenance=true).
      properties:
        embed_ms: { type: number }
        vector_ms: { type: number }
        fts_ms: { type: number }
        graph_ms: { type: number, description: "v1.11.0 Associate: graph-PPR retrieval latency (ms); 0 when the graph leg was disabled." }
        fusion_ms: { type: number }
        prf_ms: { type: number }
        rerank_ms: { type: number }
        vec_candidates: { type: integer }
        fts_candidates: { type: integer }
        graph_candidates: { type: integer, description: "v1.11.0 Associate: graph-PPR candidates before RRF." }
        graph_rescued: { type: boolean, description: "v1.12.0 Discern: the graph leg was auto-engaged as a complexity-gated rescue pass (estimator said ClarifyQuery, caller had not enabled graph)." }
        fused_count: { type: integer }
        rrf_k: { type: integer }
        embedding_query: { type: string, nullable: true }
        intent: { type: string, nullable: true }
        retrieval_ms_vec: { type: number }
        retrieval_ms_fts: { type: number }
        confidence: { type: number }
        recommendation: { type: string, nullable: true }
    ConnectorRow:
      type: object
      description: A registered connector instance (v0.9.6 Bridge).
      properties:
        id: { type: integer }
        kind:
          type: string
          description: Connector kind, e.g. 'github', 'stub'. Matches the manifest `kind`.
        instance:
          type: string
          description: Disambiguator within a kind, e.g. 'markfietje/brain-server' for github.
        state:
          type: string
          enum: [registered, running, stopped, failed]
        last_sync_at: { type: string, nullable: true }
        last_error: { type: string, nullable: true }
      required: [id, kind, instance, state]
    RegisterConnectorRequest:
      type: object
      description: v1.24.0 connector registration (profile-gated).
      properties:
        kind: { type: string, description: A shipped connector kind (e.g. 'crm-salesforce'). }
        instance: { type: string, description: Disambiguator within the kind (1..=128 chars). }
        domain: { type: string, default: global, description: Domain whose bound profile gates the kind. }
        config_json: { type: string, default: '{}', description: Opaque connector config, stored verbatim (never logged). }
      required: [kind, instance]
    RegisterConnectorResponse:
      type: object
      properties:
        id: { type: integer }
        kind: { type: string }
        instance: { type: string }
        domain: { type: string }
      required: [id, kind, instance, domain]
    RopaInput:
      type: object
      required: [activity, controller, processor, lawful_basis]
      properties:
        activity: { type: string }
        controller: { type: string }
        processor: { type: string }
        categories: { type: string }
        recipients: { type: string }
        lawful_basis: { type: string }
        retention_days: { type: integer, nullable: true }
        security_measures: { type: string }
        transfers: { type: string }
    RopaActivity:
      type: object
      properties:
        id: { type: integer }
        activity: { type: string }
        controller: { type: string }
        processor: { type: string }
        categories: { type: string }
        recipients: { type: string }
        lawful_basis: { type: string }
        retention_days: { type: integer, nullable: true }
        security_measures: { type: string }
        transfers: { type: string }
        updated_at: { type: integer }
    AuditRow:
      type: object
      description: >
        A single audit event (v0.9.7 Guard). Contains only hashes — no raw
        content or secrets. v1.27.31 "AuditRepair": rows from `GET /audit`
        carry the `domain` they live in (multi-db mode lists every registered
        domain's chain; shim mode tags every row `global`).
      properties:
        id: { type: integer }
        ts: { type: string }
        kind:
          type: string
          enum: [auth, ingest, webhook, reconcile, backup, connector, recall, search, get, breach, transfer, client, graphread, retention, workflow, anchor]
        actor: { type: string }
        target_hash: { type: string, description: SHA-256 of the affected uri/id }
        status:
          type: string
          enum: [ok, denied, error]
        detail_hash: { type: string, description: SHA-256 of a short detail string }
        tenant_id:
          type: string
          description: v1.1.0 — tenant this row belongs to ('global' for pre-v1.1 rows)
          default: global
        domain:
          type: string
          description: v1.27.31 — the domain chain this row lives in (`GET /audit` only)
      required: [id, ts, kind, actor, target_hash, status, detail_hash, tenant_id]
    ConsolidateProposal:
      type: object
      description: v0.9.8 Evidence — reviewable consolidation candidates (no mutation).
      properties:
        exact_duplicates:
          type: array
          items:
            type: array
            items: { type: integer }
          description: groups of chunk ids sharing a content_hash
        conflicts:
          type: array
          items:
            type: object
            properties:
              from_chunk: { type: integer }
              to_chunk: { type: integer }
              subject: { type: string }
              age_gap_secs: { type: integer }
              authority_delta: { type: number }
              proposed: { type: string, enum: [supersedes], description: suggested resolution }
        unresolved_contradictions:
          type: array
          description: >
            v1.6.0: `contradicts` links with no paired `supersedes` resolution.
            Each entry is [from_chunk, to_chunk]. Operator-actionable: resolve
            via POST /consolidate/apply with kind=supersedes, or `brain resolve`.
          items:
            type: array
            items: { type: integer }
            minItems: 2
            maxItems: 2
        stale_sources:
          type: array
          description: >
            v1.8.0: vault sources whose backing file no longer exists on disk.
            Operator reviews: re-ingest if moved, or DELETE /sources/{id} to retire.
          items:
            type: object
            properties:
              source_id: { type: integer }
              uri: { type: string }
              kind: { type: string }
              chunk_count: { type: integer }
        near_duplicates:
          type: array
          description: >
            v1.8.0: near-duplicate chunk pairs (cosine > 0.95, different content
            hash). Propose supersedes; operator picks the winner via brain resolve.
          items:
            type: object
            properties:
              chunk_a: { type: integer }
              chunk_b: { type: integer }
              similarity: { type: number, description: cosine similarity }
              proposed: { type: string, enum: [supersedes] }
    ApplyRequest:
      type: object
      description: v0.9.8 Evidence — operator-chosen typed links to record.
      properties:
        links:
          type: array
          items:
            type: object
            properties:
              from_chunk: { type: integer }
              to_chunk: { type: integer }
              kind: { type: string, enum: [supports, supersedes, contradicts, references, derived_from] }
      required: [links]
    ApplyResponse:
      type: object
      properties:
        recorded: { type: integer }
        rejected: { type: array, items: { type: string } }
    RefreshRequest:
      type: object
      description: v1.2 AuthN — `POST /auth/refresh` body. The refresh token is the credential.
      properties:
        refresh_token: { type: string, description: "JWS refresh token (typ: refresh)" }
      required: [refresh_token]
    TokenPair:
      type: object
      description: v1.2 AuthN — `/auth/refresh` response. Both tokens are opaque bearer strings to the client.
      properties:
        access_token: { type: string, description: JWS access token (≤15 min exp) }
        refresh_token: { type: string, description: JWS refresh token (≤24h exp, rotated on next use) }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, description: access-token lifetime in seconds, example: 900 }
      required: [access_token, refresh_token, token_type, expires_in]
    RevokeRequest:
      type: object
      description: v1.2 AuthN — `POST /auth/revoke` body (operator/admin).
      properties:
        jti: { type: string, description: Token id to revoke }
        iss: { type: string, description: Issuer (jti is unique per iss only) }
        reason: { type: string, default: operator_revoked, description: "compromise | operator_revoked | rotation | custom" }
        expires_at: { type: integer, nullable: true, description: "Unix epoch; defaults to now + 15 min" }
      required: [jti, iss]
    OidcConfig:
      type: object
      description: v1.2 AuthN — OIDC Discovery metadata (RFC 8414). Empty placeholder when JWT is unconfigured.
      properties:
        issuer: { type: string, example: "https://brain.example.com/" }
        jwks_uri: { type: string, example: "https://brain.example.com/.well-known/jwks.json" }
        token_endpoint: { type: string, example: "https://brain.example.com/auth/refresh" }
        revocation_endpoint: { type: string, example: "https://brain.example.com/auth/revoke" }
        id_token_signing_alg_values_supported:
          type: array
          items: { type: string }
          example: [RS256, RS384, RS512, ES256, ES384, EdDSA]
        scopes_supported:
          type: array
          items: { type: string }
          example: [openid, read, write, admin]
        response_types_supported:
          type: array
          items: { type: string }
          example: [token]
        subject_types_supported:
          type: array
          items: { type: string }
          example: [public]
        claims_supported:
          type: array
          items: { type: string }
          example: [iss, aud, sub, jti, iat, nbf, exp, tenant, scopes]
    JwkSet:
      type: object
      description: v1.2 AuthN — RFC 7517 JWK Set served at `/.well-known/jwks.json`.
      properties:
        keys:
          type: array
          items: { $ref: "#/components/schemas/Jwk" }
      required: [keys]
    Jwk:
      type: object
      description: v1.2 AuthN — single JSON Web Key (RSA only in v1.2; EC/Ed emission is v1.3).
      properties:
        kty: { type: string, example: RSA }
        use: { type: string, example: sig }
        alg: { type: string, example: RS256 }
        kid: { type: string, description: Key id used in JWT `kid` header }
        n: { type: string, description: RSA modulus (base64url) }
        e: { type: string, description: RSA exponent (base64url), example: AQAB }
      required: [kty, use, alg, kid, n, e]
    Principal:
      type: object
      description: >
        v1.2 AuthN — the authenticated principal, injected into request
        extensions by the JWT middleware. `None` (absent) means opaque/no-auth
        back-compat path (= superuser). Never serialized in a response.
      properties:
        sub: { type: string, description: Subject (from JWT `sub` claim) }
        jti: { type: string, description: Token id (revocation key) }
        tenant: { type: string, description: Tenant context (from signed `tenant` claim) }
        scopes:
          type: array
          items: { $ref: "#/components/schemas/Scope" }
      required: [sub, jti, tenant]
    Shift:
      type: object
      description: >
        v1.28.25 Watchbill — one site's on-call window. `overlap_minutes`
        declares the handover budget with the NEXT shift; the boundary's
        overlap window derives from the pair at read time.
      properties:
        id: { type: integer }
        domain: { type: string }
        site: { type: string }
        tz: { type: string }
        start_epoch: { type: integer, format: int64 }
        end_epoch: { type: integer, format: int64 }
        overlap_minutes: { type: integer, maximum: 120 }
        roster:
          type: array
          items: { type: string }
          description: Principal ids on this shift.
      required: [id, domain, site, tz, start_epoch, end_epoch, overlap_minutes]
    CrewMember:
      type: object
      description: >
        v1.28.26 Crew — one colleague's roster projection: TTL-decayed
        presence state, the KIND of last act (never its content), an opaque
        case reference, the Watchbill site badge, and role/skills tags.
      properties:
        principal: { type: string }
        state: { type: string, enum: [active, away, offline] }
        activity_kind: { type: string, enum: [cranking, reviewing, idle] }
        current_case_ref:
          type: string
          nullable: true
          description: Opaque run/case reference — never case content.
        site:
          type: string
          nullable: true
          description: Site whose current shift roster names this principal.
        roles: { type: array, items: { type: string } }
        skills: { type: array, items: { type: string } }
    Scope:
      type: object
      description: >
        v1.2 AuthN — authorization scope of the form `<action>:<team>/<domain>`.
        `team` and `domain` may be `*` (wildcard). Escalation: write implies
        read down, admin implies both. `read:*/*` is superuser.
      properties:
        action:
          type: string
          enum: [read, write, admin, traverse]
        team: { type: string, description: Team id or `*` }
        domain: { type: string, description: Domain id or `*` }
      required: [action, team, domain]