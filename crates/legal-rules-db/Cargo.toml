[package]
name = "legal-rules-db"
version = "1.28.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The (jurisdiction, date, amount) -> then-in-force legal-rule resolver for the Steward rulebook vertical. Rule and Rate records with applicable_rule, apply_rate and ApplyError over a seeded table; store and tests in db.rs. Populated since v1.27.36 (IMPLEMENTATION_PLAN_v1.27.36_Rulebook.md) — the prior \"empty scaffold until then\" description was stale and was corrected 2026-09-28."
publish = false

[dependencies]
# The stable engine ABI: pure cores, policy vocabulary, WorkflowHost seam.
brain-engine-sdk = { path = "../brain-engine-sdk" }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
